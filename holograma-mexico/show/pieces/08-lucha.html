<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Lucha libre: the arena goes dark, two amber follow-spots sweep through wisps of smoke and camera
// flashes pop in the stands. The mask is drawn in neon (gold outline, red flames) rising from the
// bottom of every contour like fire; the sign flickers as it powers up, the spots lock on, and the
// real metallic mask slams in onto its outline. The neon re-ignites on the hit as a lock-on flash,
// with a crisp gold shock ring. During the hold slow glints and a warm rim light travel over the
// gold while the head turns a hair; magenta uplights cross behind. Then a tricolour confetti and
// serpentina burst, which clears before the mask fades back to its neon lines and they sink to black.
// Assets: prepare.py cut-out of out/images/mascara-lucha-1.png, graded (08-lucha_grade), plus maps
// made from it: solid silhouette, eroded hole interiors, rim band and a headroom-limited glint colour.
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const DATA = (() => { const x = new XMLHttpRequest(); x.open('GET', '../assets/08-lucha.json', false); x.send(); return JSON.parse(x.responseText); })();

const N = 1024, MX = 540, MY = 538, S0 = 805;
const T_SLAM = 4.5, T_LAND = 4.84, T_CONF = 8.7;
const GOLD = [255, 186, 66], GOLDCORE = [255, 216, 142], RED = [255, 44, 56], REDCORE = [255, 140, 118];
const WARM = [255, 214, 150], AMBER = [255, 180, 90], COOL = [215, 228, 255], MAGENTA = [240, 36, 178];
const TAU = Math.PI * 2;
const bump = (t, a, b, c, d) => smooth(a, b, t) * (1 - smooth(c, d, t));
const canvas = (w, h = w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// ---------- smooth keyframe curves (Catmull-Rom on non-uniform times)
function spline(K, t) {
  if (t <= K[0][0]) return K[0][1];
  const L = K.length - 1;
  if (t >= K[L][0]) return K[L][1];
  let i = 0; while (K[i + 1][0] < t) i++;
  const [t0, v0] = K[i], [t1, v1] = K[i + 1], h = t1 - t0, s = (t - t0) / h;
  const tan = j => (j <= 0 || j >= L) ? 0 : (K[j + 1][1] - K[j - 1][1]) / (K[j + 1][0] - K[j - 1][0]);
  const m0 = tan(i) * h, m1 = tan(i + 1) * h;
  return (2 * s ** 3 - 3 * s * s + 1) * v0 + (s ** 3 - 2 * s * s + s) * m0 + (-2 * s ** 3 + 3 * s * s) * v1 + (s ** 3 - s * s) * m1;
}

// ---------- mask / line-art pose: zoom z, roll rot, horizontal squash sx (a hint of the head turning)
function maskZ(t) {
  if (t < T_LAND) { const k = clamp((t - T_SLAM) / (T_LAND - T_SLAM)); return lerp(1.34, 1.0, k * k); }   // accelerates into the hit
  const d = t - T_LAND;
  return 1 - 0.02 * Math.exp(-6.5 * d) * Math.sin(d * 18) + 0.035 * ease.inOut3((t - 5.3) / 5.4);
}
const rotAt = t => 0.011 * Math.sin((t - T_LAND) * 0.75) * smooth(T_LAND, 6.2, t);
const turnAt = t => 1 + 0.014 * Math.sin((t - 5.5) * 1.1) * bump(t, 5.3, 6.6, 8.8, 10.0);
function lineZ(t) {
  if (t < T_SLAM) return 1 - 0.022 * smooth(3.7, 4.5, t);                              // the outline braces
  if (t < T_LAND) { const k = clamp((t - T_SLAM) / (T_LAND - T_SLAM)); return lerp(0.978, 1, k * k); }
  return maskZ(t);
}
const maskPose = t => ({ z: maskZ(t), rot: rotAt(t), sx: turnAt(t) });
const linePose = t => ({ z: lineZ(t), rot: rotAt(t), sx: turnAt(t) });
function place(g, P) { g.translate(MX, MY); g.rotate(P.rot); g.scale(P.z * P.sx, P.z); }     // then draw at (-S0/2, -S0/2, S0, S0)
const drawAt = (g, img, P) => { g.save(); place(g, P); g.drawImage(img, -S0 / 2, -S0 / 2, S0, S0); g.restore(); };
function xf(u, v, P) {
  const s = S0 * P.z / N, dx = (u - 512) * s * P.sx, dy = (v - 512) * s, c = Math.cos(P.rot), n = Math.sin(P.rot);
  return [MX + dx * c - dy * n, MY + dx * n + dy * c];
}
// the mask is on screen from the slam (half on its first frame, opaque on the next) until it dissolves back into its neon outline
const maskVis = t => smooth(T_SLAM - 0.034, T_SLAM + 0.034, t) * (1 - smooth(10.25, 11.05, t));

// ---------- vector line art: each closed contour draws from its lowest point up both sides
const PATHS = DATA.paths.filter(q => q.p.length > 60).map((q, idx) => {
  const p = q.p, n = p.length / 2, cum = new Float32Array(n + 1);
  for (let i = 1; i <= n; i++) { const j = i % n; cum[i] = cum[i - 1] + Math.hypot(p[2 * j] - p[2 * i - 2], p[2 * j + 1] - p[2 * i - 1]); }
  const L = cum[n];
  const fwd = new Path2D(), rev = new Path2D();
  fwd.moveTo(p[0], p[1]); for (let i = 1; i <= n; i++) fwd.lineTo(p[2 * (i % n)], p[2 * (i % n) + 1]);
  rev.moveTo(p[0], p[1]); for (let i = n - 1; i >= 0; i--) rev.lineTo(p[2 * i], p[2 * i + 1]);
  const yb = p[1], gold = q.c === 'gold';
  const t0 = 0.95 + 1.5 * (1 - yb / 1019);
  const dur = clamp(0.4 * Math.sqrt(L / 100) + 0.4, 1.0, 2.4);
  return { idx, p, n, cum, L, fwd, rev, gold, outer: idx === 0, col: gold ? GOLD : RED, core: gold ? GOLDCORE : REDCORE,
    t0, dur, u0: 10.5 + 0.35 * (1 - yb / 1019), udur: 0.95 };
});
const drawK = (P, t) => smooth(P.t0, P.t0 + P.dur, t);            // head: drawing on
const eraseK = (P, t) => ease.inOut3((t - P.u0) / P.udur);       // tail: chasing the head up and away
function pointAt(P, s) {
  s = ((s % P.L) + P.L) % P.L;
  let lo = 0, hi = P.n;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P.cum[m] <= s) lo = m; else hi = m; }
  const f = (s - P.cum[lo]) / Math.max(1e-6, P.cum[lo + 1] - P.cum[lo]), j = (lo + 1) % P.n;
  return [lerp(P.p[2 * lo], P.p[2 * j], f), lerp(P.p[2 * lo + 1], P.p[2 * j + 1], f)];
}
// the sign powering up: two dropped frames, then a half-bright one (frame-aligned at 30 fps)
const flick = t => (t >= 4.06 && t < 4.13) ? 0.22 : (t >= 4.19 && t < 4.215) ? 0.55 : 1;
// how strongly each contour glows over the piece
function lineAlpha(P, t) {
  if (t < T_LAND - 0.001) {
    // drawn, braced and flickering, then gone by the slam frame (the mask replaces it: no double image)
    const brace = 1 + 0.3 * smooth(3.6, 4.4, t) + (P.outer ? 0.7 * bump(t, 4.24, 4.38, 4.42, 4.5) : 0);
    return brace * flick(t) * (1 - smooth(T_SLAM - 0.05, T_SLAM - 0.002, t));
  }
  // lock-on flash on the hit, settling to a faint neon rim over the mask, returning as it fades
  const dt = t - T_LAND, rest = P.outer ? 0.14 : 0.04;
  const settle = lerp(1, rest, smooth(T_LAND + 0.06, T_LAND + 0.9, t));
  const back = smooth(9.95, 10.6, t);
  return (lerp(settle, 1, back) + 0.45 * Math.exp(-dt / 0.13)) * (1 - smooth(11.5, 11.9, t));
}

// ---------- pre-rendered light sprites
// a narrow stage-light cone (apex just left of the image), no wide skirt
function makeBeam(col, sig, coreK) {
  const BW = 1700, BH = 640, c = canvas(BW, BH), g = c.getContext('2d'), im = g.createImageData(BW, BH), d = im.data;
  for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) {
    const th = Math.atan2(y - BH / 2, x + 30);
    const cone = Math.exp(-((th / sig) ** 4)) + coreK * Math.exp(-((th / (sig * 0.3)) ** 2));
    const along = Math.pow(1 - x / BW, 1.25) * (0.55 + 0.45 * smooth(0, 200, x));
    const o = (y * BW + x) * 4;
    d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255 * clamp(cone * along / (1 + coreK));
  }
  g.putImageData(im, 0, 0);
  return c;
}
function makeStar(col, size = 256) {
  const c = canvas(size), g = c.getContext('2d'), im = g.createImageData(size, size), d = im.data, h = size / 2;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = (x - h + 0.5) / h, v = (y - h + 0.5) / h, r = Math.hypot(u, v);
    const arms = Math.exp(-Math.abs(u) * 5.5) * Math.exp(-((v / 0.022) ** 2)) + Math.exp(-Math.abs(v) * 5.5) * Math.exp(-((u / 0.022) ** 2));
    const diag = 0.35 * (Math.exp(-Math.abs(u + v) * 9) * Math.exp(-(((u - v) / 0.03) ** 2)) + Math.exp(-Math.abs(u - v) * 9) * Math.exp(-(((u + v) / 0.03) ** 2)));
    const core = Math.exp(-((r / 0.07) ** 2)) + 0.3 * Math.exp(-((r / 0.22) ** 2));
    const I = clamp((arms + diag + core) * (1 - smooth(0.85, 1, r)));
    const w = clamp(core * 1.1) * 0.75;                                                 // warm, not white, centre
    const o = (y * size + x) * 4;
    d[o] = lerp(col[0], 255, w); d[o + 1] = lerp(col[1], 246, w); d[o + 2] = lerp(col[2], 226, w); d[o + 3] = 255 * I;
  }
  g.putImageData(im, 0, 0);
  return c;
}
// smoke: high-contrast fbm, mostly clear air with drifting wisps
function makeHaze(n = 360) {
  const R = HG.rng(5), c = canvas(n), g = c.getContext('2d'), im = g.createImageData(n, n), d = im.data;
  const octave = cells => { const m = cells + 1, grid = new Float32Array(m * m); for (let i = 0; i < grid.length; i++) grid[i] = R(); return grid; };
  const oct = [[4, 0.5], [9, 0.3], [21, 0.2]].map(([cells, w]) => ({ cells, w, grid: octave(cells) }));
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let v = 0;
    for (const { cells, w, grid } of oct) {
      const fx = x / n * cells, fy = y / n * cells, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty), m = cells + 1;
      v += w * lerp(lerp(grid[iy * m + ix], grid[iy * m + ix + 1], sx), lerp(grid[(iy + 1) * m + ix], grid[(iy + 1) * m + ix + 1], sx), sy);
    }
    const o = (y * n + x) * 4;
    d[o] = d[o + 1] = d[o + 2] = 255; d[o + 3] = 255 * (0.3 + 0.7 * Math.pow(clamp((v - 0.44) / 0.24), 1.5));
  }
  g.putImageData(im, 0, 0);
  return c;
}
const BEAM_A = makeBeam(AMBER, 0.046, 0.45), BEAM_M = makeBeam(MAGENTA, 0.038, 0.5);
const STAR_W = makeStar([255, 200, 110]), STAR_C = makeStar(COOL), HAZE = makeHaze();
const BL = HG.layer(), BH = HG.layer(), LN = HG.layer(), NL = HG.layer(), SP = HG.layer(), RM = HG.layer();
const CFAR = HG.layer(), CB = HG.layer(), CF = HG.layer();

// ---------- spotlights: sources sit off-circle; angles are smooth keyframed sweeps
const kA = [[0, 1.5], [1.9, 0.52], [3.3, 1.08], [4.3, 0.86], [5.0, 0.84], [6.6, 0.42], [8.2, 1.12], [9.4, 0.78], [10.8, 0.5], [12, 0.42]];
const kB = [[0, 1.45], [1.9, 1.12], [3.3, 0.48], [4.3, 0.86], [5.0, 0.84], [6.6, 1.15], [8.2, 0.46], [9.4, 0.9], [10.8, 1.12], [12, 1.2]];
const kU = [[4.6, -0.5], [6.4, -0.98], [8.0, -0.58], [9.6, -0.95], [11, -0.7], [12, -0.6]];
const kV = [[4.6, -0.92], [6.4, -0.5], [8.0, -0.95], [9.6, -0.55], [11, -0.85], [12, -0.9]];
const keyEnv = t => {
  const base = 0.85 * smooth(0.25, 1.4, t) + 0.15 * smooth(3.6, 4.4, t);
  const hit = 0.4 * Math.exp(-Math.max(0, t - T_LAND) / 0.4) * smooth(T_LAND - 0.1, T_LAND, t);
  const hero = lerp(1, 0.42, smooth(T_LAND + 0.05, 5.6, t)) + 0.22 * bump(t, T_CONF - 0.1, T_CONF + 0.1, T_CONF + 0.3, T_CONF + 1.4);
  return (base * hero + hit) * (1 - smooth(10.2, 11.2, t));
};
const upEnv = t => 0.85 * smooth(T_LAND, T_LAND + 0.9, t) * (1 - smooth(9.9, 10.8, t));
const BEAMS = [
  { x: 40, y: -30, ang: t => spline(kA, t), env: keyEnv, img: BEAM_A, col: AMBER, a: 1.05 },
  { x: 1040, y: -30, ang: t => Math.PI - spline(kB, t), env: keyEnv, img: BEAM_A, col: AMBER, a: 1.05 },
  { x: -30, y: 1110, ang: t => spline(kU, t), env: upEnv, img: BEAM_M, col: MAGENTA, a: 1 },
  { x: 1110, y: 1110, ang: t => Math.PI - spline(kV, t), env: upEnv, img: BEAM_M, col: MAGENTA, a: 1 },
];
function beamAt(b, t, x, y) {
  let d = Math.atan2(y - b.y, x - b.x) - b.ang(t);
  d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return Math.exp(-((d / 0.05) ** 2));
}
function drawBeams(t) {
  const g = BL.ctx; HG.reset(g); g.clearRect(0, 0, W, W);
  g.globalCompositeOperation = 'lighter';
  let any = false;
  for (const b of BEAMS) {
    const e = b.env(t) * b.a; if (e <= 0.003) continue;
    any = true;
    g.setTransform(1, 0, 0, 1, b.x, b.y); g.rotate(b.ang(t)); g.globalAlpha = Math.min(1, e);
    g.drawImage(b.img, 0, -b.img.height / 2);
  }
  if (!any) return;
  // the light only shows where there is smoke: drifting wisps in world space
  HG.reset(g); g.globalCompositeOperation = 'destination-in';
  g.drawImage(HAZE, -280 + 16 * t, -300 + 9 * t, 1640, 1640);
  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(BL.cv, 0, 0);
  // a small hot lamp where each beam enters the circle
  for (const b of BEAMS) {
    const e = Math.min(1, b.env(t) * b.a); if (e <= 0.003) continue;
    const th = b.ang(t), dx = Math.cos(th), dy = Math.sin(th), fx = b.x - C, fy = b.y - C;
    const bb = fx * dx + fy * dy, disc = bb * bb - (fx * fx + fy * fy - 528 * 528);
    if (disc <= 0) continue;
    const s = -bb - Math.sqrt(disc), x = b.x + dx * (s + 14), y = b.y + dy * (s + 14);
    HG.dot(ctx, b.col, x, y, 150, 0.16 * e);
    HG.dot(ctx, b.col, x, y, 44, 0.55 * e);
    HG.dot(ctx, WARM, x, y, 16, 0.6 * e);
  }
  HG.reset(ctx);
}
// dust motes that only show inside the beams
const MOTES = (() => { const R = HG.rng(41); return Array.from({ length: 170 }, () => ({ x: R() * W, y: R() * W, sp: 6 + R() * 16, ph: R() * TAU, s: 3 + R() * 5 })); })();
function drawMotes(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const m of MOTES) {
    const x = m.x + 14 * Math.sin(t * 0.45 + m.ph), y = ((m.y - m.sp * t) % W + W) % W;
    if (Math.hypot(x - C, y - C) > 520) continue;
    let I = 0; for (const b of BEAMS) { const e = b.env(t); if (e > 0.01 && b.img === BEAM_A) I += e * beamAt(b, t, x, y); }
    HG.dot(ctx, WARM, x, y, m.s, 0.8 * I * (0.6 + 0.4 * Math.sin(t * 2.1 + m.ph)));
  }
  ctx.restore();
}

// ---------- camera flashes in the dark stands (never on the mask)
const FLASHES = (() => {
  const R = HG.rng(808), out = [];
  const spot = () => { for (;;) { const a = R() * TAU, r = 200 + R() * 268, x = C + Math.cos(a) * r, y = C + Math.sin(a) * r;
    if (((x - MX) / 300) ** 2 + ((y - MY) / 445) ** 2 > 1) return [x, y]; } };
  const add = (t0, t1, n, a = 1) => { for (let i = 0; i < n; i++) { const [x, y] = spot(), t = lerp(t0, t1, R());
    const f = { t, x, y, s: 16 + R() * 16, rot: (R() - 0.5) * 0.5, a: a * (0.6 + 0.4 * R()) }; out.push(f);
    if (R() < 0.25) out.push({ ...f, t: t + 0.13, a: f.a * 0.7 }); } };
  add(0.9, 4.3, 6, 0.8); add(T_LAND + 0.03, T_LAND + 0.8, 14); add(5.8, 8.5, 7, 0.8); add(T_CONF + 0.05, T_CONF + 0.9, 10); add(9.6, 10.3, 3, 0.7);
  return out;
})();
function drawFlashes(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const f of FLASHES) {
    const dt = t - f.t; if (dt < 0 || dt > 0.8) continue;
    const e = f.a * (dt < 0.035 ? dt / 0.035 : Math.exp(-(dt - 0.035) / 0.12));
    HG.dot(ctx, COOL, f.x, f.y, f.s * 3.4, e * 0.18);
    HG.dot(ctx, COOL, f.x, f.y, f.s, e * 0.8);
    const sz = f.s * (4.2 + 1.2 * e);
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.globalAlpha = Math.min(1, e * 0.9);
    ctx.drawImage(STAR_C, -sz / 2, -sz / 2, sz, sz); ctx.restore();
  }
  ctx.restore();
}

// ---------- neon line art + the sparks shed by the drawing tips
// cut: alpha of the hole-interior cut (keeps the openings of the mask dark under the neon bloom)
function drawLines(t, A, cut) {
  const P = linePose(t), s = S0 * P.z / N;
  const g = LN.ctx; HG.reset(g); g.clearRect(0, 0, W, W);
  place(g, P); g.scale(S0 / N, S0 / N); g.translate(-512, -512);
  g.lineCap = 'round'; g.lineJoin = 'round';
  let any = false;
  const tips = [];
  for (const Q of PATHS) {
    const k = drawK(Q, t), e = eraseK(Q, t), a = lineAlpha(Q, t);
    if (k - e <= 0.0005 || a <= 0.003) continue;
    any = true;
    const d = k * Q.L / 2, d0 = e * Q.L / 2;
    g.setLineDash([d - d0, 2 * Q.L + 10]); g.lineDashOffset = -d0;
    for (const path of [Q.fwd, Q.rev]) {
      g.globalAlpha = Math.min(1, a); g.strokeStyle = rgba(Q.col); g.lineWidth = 5 / s; g.stroke(path);
      g.globalAlpha = Math.min(1, a * 0.85); g.strokeStyle = rgba(Q.core); g.lineWidth = 2 / s; g.stroke(path);
    }
    const head = Math.min(1, a) * smooth(0, 0.03, k) * (1 - smooth(0.96, 0.999, k));
    const tail = Math.min(1, a) * 0.7 * smooth(0, 0.04, e) * (1 - smooth(0.9, 0.995, e));
    if (head > 0.01) tips.push([Q, pointAt(Q, d), head], [Q, pointAt(Q, Q.L - d), head]);
    if (tail > 0.01) tips.push([Q, pointAt(Q, d0), tail], [Q, pointAt(Q, Q.L - d0), tail]);
  }
  if (!any) return;
  const n = NL.ctx; HG.reset(n); n.clearRect(0, 0, W, W); n.globalCompositeOperation = 'lighter';
  n.globalAlpha = 0.9; n.filter = 'blur(16px)'; n.drawImage(LN.cv, 0, 0);
  n.globalAlpha = 0.85; n.filter = 'blur(4px)'; n.drawImage(LN.cv, 0, 0);
  n.filter = 'none'; n.globalAlpha = 1; n.drawImage(LN.cv, 0, 0);
  if (cut > 0.003) {
    n.globalCompositeOperation = 'destination-out';
    n.globalAlpha = cut; drawAt(n, A.holes, maskPose(t));
    n.globalAlpha = 0.42 * cut; drawAt(n, A.solid, maskPose(t));
  }
  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(NL.cv, 0, 0);
  for (const [Q, [u, v], e] of tips) {
    if (e <= 0.01) continue;
    const [x, y] = xf(u, v, P);
    HG.dot(ctx, Q.col, x, y, 46, 0.55 * e);
    HG.dot(ctx, WARM, x, y, 14, 0.95 * e);
  }
  HG.reset(ctx);
}
function drawSparks(t) {
  const DT = 0.035, LIFE = 0.6;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let n = Math.floor((t - LIFE) / DT) + 1; n * DT <= t; n++) {
    const s0 = n * DT, age = t - s0; if (s0 < 0) continue;
    for (const Q of PATHS) {
      const kh = drawK(Q, s0), ke = eraseK(Q, s0);
      const erasing = ke > 0.002 && ke < 0.99, drawing = kh > 0.002 && kh < 0.995;
      if (!drawing && !erasing) continue;
      const k = erasing ? ke : kh;
      const a0 = Math.min(1, lineAlpha(Q, s0)) * (erasing ? 0.8 : 1); if (a0 < 0.05) continue;
      const P = linePose(s0);
      for (let dir = 0; dir < 2; dir++) {
        const R = HG.rng(n * 7919 + Q.idx * 131 + dir * 17 + 3);
        if (R() > 0.75) continue;
        const [u, v] = pointAt(Q, dir ? Q.L - k * Q.L / 2 : k * Q.L / 2);
        const [x0, y0] = xf(u, v, P);
        const ang = R() * TAU, sp = 20 + R() * 70, life = LIFE * (0.5 + 0.5 * R());
        if (age > life) continue;
        const q = age / life;
        const x = x0 + Math.cos(ang) * sp * age, y = y0 + Math.sin(ang) * sp * age + 60 * age * age;
        HG.dot(ctx, R() < 0.5 ? Q.col : Q.core, x, y, (3 + R() * 5) * (1 - q * 0.6), a0 * Math.pow(1 - q, 1.5) * 0.9);
      }
    }
  }
  ctx.restore();
}

// ---------- everything behind the mask (halo, zoom ghosts, impact, pop) goes through one layer that
// has the solid silhouette cut out of it, so the eye and mouth openings stay dark and see-through
const STREAKS = (() => { const R = HG.rng(97); return Array.from({ length: 44 }, () => ({ a: R() * TAU, r0: 250 + R() * 60, tr: 200 + R() * 200, len: 60 + R() * 120, d: R() * 0.07, w: 1.2 + R() * 1.6, col: R() < 0.3 ? RED : (R() < 0.6 ? GOLD : WARM) })); })();
const POP = (() => { const R = HG.rng(131), cols = [[40, 220, 120], [255, 245, 230], [255, 50, 70], GOLD];
  return Array.from({ length: 48 }, (_, i) => ({ a: R() * TAU, r0: 240 + R() * 50, tr: 180 + R() * 190, len: 70 + R() * 110, d: R() * 0.06, w: 1.6 + R() * 2, col: cols[i % 4] })); })();
function streaks(g, list, dt, dur, k0 = 1) {
  g.lineCap = 'round';
  for (const s of list) {
    const k = ease.out3((dt - s.d) / dur); if (k <= 0 || k >= 1) continue;
    const r1 = s.r0 + s.tr * k, r0 = r1 - s.len * (1 - 0.5 * k), c = Math.cos(s.a), n = Math.sin(s.a);
    const gr = g.createLinearGradient(MX + c * r0, MY + n * r0, MX + c * r1, MY + n * r1);
    gr.addColorStop(0, rgba(s.col, 0)); gr.addColorStop(1, rgba(s.col, k0 * (1 - k)));
    g.strokeStyle = gr; g.lineWidth = s.w;
    g.beginPath(); g.moveTo(MX + c * r0, MY + n * r0); g.lineTo(MX + c * r1, MY + n * r1); g.stroke();
  }
}
function drawBehind(t, A, vis) {
  if (vis <= 0.003) return;
  const P = maskPose(t), g = BH.ctx; HG.reset(g); g.clearRect(0, 0, W, W);
  g.globalCompositeOperation = 'lighter';
  const dt = t - T_LAND, dc = t - T_CONF;
  // warm backlight halo, up at the hit and during the confetti pop
  const halo = 0.2 + 0.4 * Math.exp(-Math.max(0, dt) / 0.35) * smooth(-0.05, 0, dt) + 0.14 * bump(t, T_CONF - 0.05, T_CONF + 0.1, T_CONF + 0.2, T_CONF + 1.2);
  g.globalAlpha = vis * halo; g.filter = 'blur(26px)'; drawAt(g, A.mask, P); g.filter = 'none';
  // zoom-blur ghosts while it rushes in (only their edges show around the silhouette)
  if (t < T_LAND + 0.05) {
    const sp = 1 - smooth(T_LAND - 0.02, T_LAND + 0.05, t);
    g.filter = 'blur(5px)';
    for (let j = 1; j <= 6; j++) {
      const f = 1 + 0.022 * j * (1 + (P.z - 1) * 3);
      g.globalAlpha = vis * sp * 0.2 * (1 - j / 7); drawAt(g, A.mask, { ...P, z: P.z * f });
    }
    g.filter = 'none';
  }
  // impact: a warm pulse, one crisp gold shock ring with a faint red echo, light streaks
  if (dt > -0.05 && dt < 1.3) {
    g.globalAlpha = 1;
    HG.dot(g, GOLD, MX, MY, 1000, 0.36 * Math.exp(-Math.max(0, dt) / 0.3) * smooth(-0.05, 0, dt));
    for (const [lag, col, w0, a0] of [[0, GOLD, 7, 1], [0.1, RED, 5, 0.35]]) {
      const k = ease.out3((dt - lag) / 1.05); if (k <= 0 || k >= 1) continue;
      HG.ring(g, MX, MY, lerp(300, 640, k), col, { width: w0 * (1 - 0.6 * k), blur: 7, alpha: a0 * Math.pow(1 - k, 1.3) });
    }
    g.globalAlpha = 1; streaks(g, STREAKS, dt, 0.6);
  }
  // confetti pop: a warm glow and tricolour streaks fanning out from behind the mask
  if (dc > -0.05 && dc < 1.2) {
    g.globalAlpha = 1;
    HG.dot(g, WARM, MX, MY - 40, 820, 0.24 * Math.exp(-Math.max(0, dc) / 0.3) * smooth(-0.05, 0.02, dc));
    streaks(g, POP, dc, 0.65, 0.95);
  }
  HG.reset(g); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = vis; drawAt(g, A.solid, P);
  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(BH.cv, 0, 0); HG.reset(ctx);
}

// ---------- the mask itself, with the impact lift and a warm rim light travelling over the crown
function drawMask(t, A, vis) {
  if (vis <= 0.003) return;
  const P = maskPose(t);
  ctx.save(); ctx.globalAlpha = vis; drawAt(ctx, A.mask, P);
  // the hit lights the whole mask with the headroom-limited glint colour (bright gold, never white)
  const lift = 0.8 * Math.exp(-Math.max(0, t - T_LAND) / 0.22) * (t >= T_LAND - 0.001 ? 1 : 0);
  if (lift > 0.003) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = vis * lift; drawAt(ctx, A.glint, P); }
  ctx.restore();
  const e = 0.75 * bump(t, 5.2, 6.3, 9.6, 10.3) * vis; if (e <= 0.003) return;
  const th = -2.75 + 0.5 * (t - 5.2), lx = MX + Math.cos(th) * 330, ly = MY + Math.sin(th) * 430;
  const g = RM.ctx; HG.reset(g); g.clearRect(0, 0, W, W); drawAt(g, A.rim, P);
  g.globalCompositeOperation = 'destination-in';
  const gr = g.createRadialGradient(lx, ly, 0, lx, ly, 380);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.45, 'rgba(0,0,0,0.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, W);
  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = e * 0.35; ctx.filter = 'blur(8px)'; ctx.drawImage(RM.cv, 0, 0);
  ctx.globalAlpha = e; ctx.filter = 'none'; ctx.drawImage(RM.cv, 0, 0);
  HG.reset(ctx);
}

// ---------- glints: a soft band sweeping slowly across the metal (glint map x band) + a few star flares
const GLINTS = [
  { t0: 5.3, t1: 6.55, ang: 0.62, span: 330, k: 0.95, stars: [[271, 172], [534, 269], [799, 431]] },
  { t0: 7.25, t1: 8.5, ang: Math.PI - 0.5, span: 330, k: 0.85, stars: [[789, 284], [534, 470], [222, 362]] },
  { t0: 9.2, t1: 10.2, ang: 1.25, span: 300, k: 0.7, stars: [[547, 189]] },
];
const BAND = [[0, 0], [0.22, 0.08], [0.36, 0.45], [0.5, 1], [0.64, 0.45], [0.78, 0.08], [1, 0]], BAND_W = 150;
function drawGlints(t, A, vis) {
  const P = maskPose(t), fade = (1 - smooth(10.1, 10.6, t)) * vis;
  for (const G of GLINTS) {
    const k = (t - G.t0) / (G.t1 - G.t0); if (k <= 0 || k >= 1) continue;
    const env = Math.pow(Math.sin(Math.PI * k), 0.8) * G.k * fade; if (env <= 0.003) continue;
    const dx = Math.cos(G.ang), dy = Math.sin(G.ang), pos = lerp(-G.span, G.span, 0.55 * k + 0.45 * k * k * (3 - 2 * k));
    const cx = MX + dx * pos, cy = MY + dy * pos;
    const g = SP.ctx; HG.reset(g); g.clearRect(0, 0, W, W); drawAt(g, A.glint, P);
    g.globalCompositeOperation = 'destination-in';
    const gr = g.createLinearGradient(cx - dx * BAND_W, cy - dy * BAND_W, cx + dx * BAND_W, cy + dy * BAND_W);
    for (const [o, a] of BAND) gr.addColorStop(o, `rgba(0,0,0,${a})`);
    g.fillStyle = gr; g.fillRect(0, 0, W, W);
    HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = env * 0.3; ctx.filter = 'blur(10px)'; ctx.drawImage(SP.cv, 0, 0);
    ctx.filter = 'none'; ctx.globalAlpha = env; ctx.drawImage(SP.cv, 0, 0);
    for (const [u, v] of G.stars) {
      const [x, y] = xf(u, v, P);
      const proj = (x - MX) * dx + (y - MY) * dy;
      const e = Math.exp(-(((proj - pos) / 55) ** 2)) * env;
      if (e < 0.01) continue;
      const sz = 170 * (0.55 + 0.45 * e);
      ctx.save(); ctx.translate(x, y); ctx.rotate(0.3 * t + u * 0.01); ctx.globalAlpha = Math.min(1, e * 0.7);
      ctx.drawImage(STAR_W, -sz / 2, -sz / 2, sz, sz); ctx.restore();
    }
    HG.reset(ctx);
  }
}

// ---------- confetti: tricolour + gold paper of mixed cuts (rectangles, squares, curling serpentina),
// tumbling with drag and flutter over a wide depth range; each piece flashes when it faces the light.
// Far and mid pieces burst from behind the mask; a few big, near, defocused ones fly past in front.
const PAL = [[[24, 186, 94], 3], [[250, 246, 236], 2], [[236, 32, 50], 3], [[255, 188, 60], 2]];
const pickCol = r => { let s = r * 10; for (const [c, w] of PAL) { if ((s -= w) < 0) return c; } return PAL[0][0]; };
const CONF = (() => {
  const R = HG.rng(77), out = [];
  const piece = (front, z, x0, y0, a, sp, up) => {
    const r = R(), type = r < (front ? 0.18 : 0.12) ? 'ribbon' : r < 0.5 ? 'square' : 'rect';
    const col = pickCol(R()), gold = col === PAL[3][0];
    const sq = 10 + R() * 4;
    return { front, z, type, col, gold, x0, y0, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.82 - up,
      k: type === 'ribbon' ? 3.4 + R() : 2.3 + R() * 1.2, vt: type === 'ribbon' ? 45 + R() * 35 : 80 + R() * 80,
      sw: 14 + R() * 36, swf: 1.4 + R() * 2.2, ph: R() * TAU,
      w: type === 'square' ? sq : 15 + R() * 8, h: type === 'square' ? sq : 8 + R() * 4,
      len: 70 + R() * 50, amp: 6 + R() * 5, turns: 1.0 + R() * 0.9, curl: 3 + R() * 4, rw: 4.5 + R() * 1.5,
      r0: R() * TAU, wr: (R() - 0.5) * (type === 'ribbon' ? 2.5 : 8), f0: R() * TAU, wf: (R() < 0.5 ? -1 : 1) * (4 + R() * 6), d: R() * 0.07 };
  };
  for (let i = 0; i < 96; i++) {                                     // behind the mask, far to mid depth
    const z = 0.5 + 0.8 * Math.pow(R(), 0.8), a = R() * TAU;
    const rr = 0.8 + 0.15 * R();                                     // from just inside the silhouette, clear of the eye holes
    out.push(piece(false, z, MX + Math.cos(a) * 225 * rr, MY - 30 + Math.sin(a) * 360 * rr, a, (480 + R() * 680) * (0.55 + 0.45 * z), 260));
  }
  for (let i = 0; i < 20; i++) {                                     // near: from the mask's rim outward, in front
    const a = R() * TAU, ex = Math.cos(a), ey = Math.sin(a);
    out.push(piece(true, 1.45 + 0.55 * R(), MX + ex * 250, MY - 20 + ey * 380, a, 420 + R() * 460, 200));
  }
  return out;
})();
const LIGHT = 0.4;   // flip angle at which a piece faces the key light
function shade(col, gold, f) {
  const c = Math.abs(Math.cos(f - LIGHT)), lit = gold ? 0.22 + 0.78 * Math.pow(c, 1.6) : 0.3 + 0.7 * Math.pow(c, 0.9);
  const spec = Math.pow(c, gold ? 40 : 70) * (gold ? 0.95 : 0.6), hi = gold ? [255, 240, 196] : [255, 250, 240];
  return [0, 1, 2].map(i => Math.round(lerp(col[i] * lit, hi[i], spec)));
}
function drawConfetti(t, front) {
  const fade = 1 - smooth(10.0, 10.7, t);
  if (t < T_CONF || fade <= 0.003) return;
  const layers = front ? [CF] : [CFAR, CB];
  for (const L of layers) { HG.reset(L.ctx); L.ctx.clearRect(0, 0, W, W); }
  const glints = [];
  for (const p of CONF) {
    if (p.front !== front) continue;
    const dt = t - T_CONF - p.d; if (dt <= 0) continue;
    const e = (1 - Math.exp(-p.k * dt)) / p.k, par = 0.5 + 0.5 * p.z;
    const x = p.x0 + (p.vx * e + p.sw * Math.sin(p.swf * dt + p.ph) * smooth(0.25, 1.2, dt)) * par;
    const y = p.y0 + ((p.vy - p.vt) * e + p.vt * dt) * par;
    if (Math.hypot(x - C, y - C) > 600) continue;
    const g = (front ? CF : p.z < 0.85 ? CFAR : CB).ctx, grow = ease.out3(dt / 0.14), sc = p.z * grow;
    const f = p.f0 + p.wf * dt;
    g.setTransform(1, 0, 0, 1, x, y); g.rotate(p.r0 + p.wr * dt);
    if (p.type === 'ribbon') {
      // a curling paper streamer: a helix seen from the side, shaded and specular per segment
      const M = 30, len = p.len * (0.65 + 0.35 * ease.out3(dt / 0.6)), ph = p.ph + p.curl * dt;
      g.scale(sc, sc); g.lineCap = 'round';
      let px = null, py = null;
      for (let i = 0; i <= M; i++) {
        const s = i / M - 0.5, q = TAU * p.turns * s + ph;
        const qx = s * len, qy = p.amp * Math.sin(q);
        if (px !== null) {
          const tw = q + Math.PI / 2;
          g.lineWidth = p.rw * (0.3 + 0.7 * Math.abs(Math.cos(tw)));
          const [r, gg, b] = shade(p.col, p.gold, tw + f * 0.15);
          g.strokeStyle = `rgb(${r},${gg},${b})`;
          g.beginPath(); g.moveTo(px, py); g.lineTo(qx, qy); g.stroke();
        }
        px = qx; py = qy;
      }
    } else {
      const flip = Math.cos(f);
      g.scale(sc, sc * flip);
      const [r, gg, b] = shade(p.col, p.gold, f);
      g.fillStyle = `rgb(${r},${gg},${b})`;
      g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      const sp = Math.pow(Math.abs(Math.cos(f - LIGHT)), p.gold ? 40 : 70);
      if (sp > 0.25) glints.push([x, y, p.z, sp * (p.gold ? 1 : 0.55)]);
    }
  }
  HG.reset(ctx);
  for (const L of layers) {
    const blur = L === CF ? 3.2 : L === CFAR ? 1.0 : 0, dim = L === CFAR ? 0.75 : 1;
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.32 * fade * dim; ctx.filter = 'blur(8px)'; ctx.drawImage(L.cv, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = fade * dim; ctx.filter = blur ? `blur(${blur}px)` : 'none'; ctx.drawImage(L.cv, 0, 0);
  }
  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, z, s] of glints) { HG.dot(ctx, WARM, x, y, 30 * z, 0.5 * s * fade); HG.dot(ctx, WARM, x, y, 9 * z, 0.7 * s * fade); }
  HG.reset(ctx);
}

HG.start({
  duration: 12,
  assets: { mask: '../assets/08-lucha_grade.png', glint: '../assets/08-lucha_glint.png', solid: '../assets/08-lucha_solid.png',
    holes: '../assets/08-lucha_holes.png', rim: '../assets/08-lucha_rim.png' },
  render(t, A) {
    const vis = maskVis(t);
    drawBeams(t);
    drawMotes(t);
    HG.dust(t, { n: 44, colors: [GOLD, WARM], alpha: 0.3 * bump(t, 5.3, 6.6, 9.8, 10.6), size: 5, r: 500, seed: 23 });
    drawConfetti(t, false);
    drawBehind(t, A, vis);
    const under = t >= T_SLAM - 0.1 && t < T_LAND - 0.001;   // during the rush the fading neon sits under the mask
    if (under) drawLines(t, A, 0);
    drawMask(t, A, vis);
    drawGlints(t, A, vis);
    if (!under) drawLines(t, A, vis);
    drawSparks(t);
    drawConfetti(t, true);
    drawFlashes(t);
  },
});
</script></body></html>
