<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Lucha libre: the arena is dark; two amber follow-spots swing in through wisps of smoke and collide
// at the centre in an amber flash. The metallic mask drops from above into the crossed spots and slams
// down (squash, scale overshoot, shake) while its neon outline flashes on like a sign locking on, with
// a gold shock ring and streaks. Hold, with beats: a bright glint sweeps over the gold and catches the
// forehead seam with a star; a wave of camera flashes runs around the stands and the luchador turns to
// follow it (a cylinder-warped yaw, the sheen sliding over the metal); a second glint; a tricolour
// confetti and serpentina burst. Exit: the follow-spot irises in on the face, holds, and snaps shut to a
// point of light at the centre, where the next piece's portal is born.
// Assets: prepare.py cut-out of out/images/mascara-lucha-1.png, graded (08-lucha_grade), plus maps
// made from it: solid silhouette, eroded hole interiors and inner area, rim band, glint colour.
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const DATA = (() => { const x = new XMLHttpRequest(); x.open('GET', '../assets/08-lucha.json', false); x.send(); return JSON.parse(x.responseText); })();

const N = 1024, MX = 540, MY = 538, S0 = 805;
const T_COLL = 0.72, T_DROP = 0.76, T_LAND = 1.15, T_WAVE = 3.45, T_CONF = 7.0, T_IRIS = 8.85, T_SHUT = 10.18;
const GOLD = [255, 186, 66], GOLDCORE = [255, 216, 142], RED = [255, 44, 56], REDCORE = [255, 140, 118];
const WARM = [255, 214, 150], AMBER = [255, 180, 90], COOL = [215, 228, 255], MAGENTA = [240, 36, 178];
const TAU = Math.PI * 2;
const bump = (t, a, b, c, d) => smooth(a, b, t) * (1 - smooth(c, d, t));
const canvas = (w, h = w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// ---------- smooth keyframe curves (Catmull-Rom on non-uniform times)
function spline(K, t) {
  if (t <= K[0][0]) return K[0][1];
  const L = K.length - 1;
  if (t >= K[L][0]) return K[L][1];
  let i = 0; while (K[i + 1][0] < t) i++;
  const [t0, v0] = K[i], [t1, v1] = K[i + 1], h = t1 - t0, s = (t - t0) / h;
  const tan = j => (j <= 0 || j >= L) ? 0 : (K[j + 1][1] - K[j - 1][1]) / (K[j + 1][0] - K[j - 1][0]);
  const m0 = tan(i) * h, m1 = tan(i + 1) * h;
  return (2 * s ** 3 - 3 * s * s + 1) * v0 + (s ** 3 - 2 * s * s + s) * m0 + (-2 * s ** 3 + 3 * s * s) * v1 + (s ** 3 - s * s) * m1;
}

// ---------- mask pose: drop + slam, then the hold (slow push-in, a roll, the yaw toward the crowd)
// z zoom, rot roll, sx/sy squash-stretch, yaw (cylinder warp, radians), ox/oy offset (fall + shake)
const fallK = t => clamp((t - T_DROP) / (T_LAND - T_DROP));
const FALL = 760;
function fallY(t) {
  if (t < T_LAND) { const k = fallK(t); return -FALL * (1 - (0.3 * k + 0.7 * k * k)); }        // already moving, accelerating
  const d = t - T_LAND; return 9 * Math.sin(d * 24) * Math.exp(-d / 0.08);                     // dips past its mark, springs back
}
const fallSpeed = t => t < T_DROP || t >= T_LAND ? 0 : (0.3 + 1.4 * fallK(t)) / 1.7;          // 0..1
const yawAt = t => spline([[3.2, 0], [3.65, -0.27], [4.15, 0.26], [4.7, 0.03], [5.1, 0]], t);
function pose(t) {
  const d = t - T_LAND, hit = d >= 0 ? 1 : 0;
  const z = 1 + hit * 0.075 * Math.sin(d * 14) * Math.exp(-d / 0.17) + 0.03 * ease.inOut3((t - 1.8) / 7.4);
  const sq = hit * Math.exp(-d / 0.05);                                                         // squash on contact
  const st = 0.055 * fallSpeed(t);                                                              // stretch in the fall
  const sh = hit * 6 * Math.exp(-d / 0.12);                                                     // +-6 px shake
  const rot = 0.012 * Math.sin(d * 0.8) * smooth(T_LAND, 2.4, t) + hit * 0.012 * Math.sin(d * 31) * Math.exp(-d / 0.12);
  return { z, rot, sx: 1 + 0.05 * sq - 0.025 * st, sy: 1 - 0.07 * sq + st, yaw: yawAt(t),
    ox: sh * Math.sin(d * 67 + 0.4), oy: fallY(t) + sh * Math.cos(d * 83) };
}
// fake yaw: the mask wraps a vertical cylinder (radius RC image px); u maps to RC sin(asin(u/RC) + yaw)
const RC = 372;
const warpU = (d, yaw) => yaw === 0 ? d : RC * Math.sin(Math.asin(clamp(d / RC, -1, 1)) + yaw);
function place(g, P) { g.translate(MX + P.ox, MY + P.oy); g.rotate(P.rot); g.scale(P.z * P.sx, P.z * P.sy); }   // then image px * S0/N, centred
const U0 = 186, U1 = 838, NSTRIP = 48, KS = S0 / N;
let WARP = null;
function drawAt(g, img, P) {
  if (Math.abs(P.yaw) < 0.001) { g.save(); place(g, P); g.drawImage(img, -S0 / 2, -S0 / 2, S0, S0); g.restore(); return; }
  // warped: abutting vertical strips summed additively in their own layer (edge coverages add up to
  // exactly 1, so no seams even for translucent maps), then drawn with the caller's operation and alpha
  const w = (WARP = WARP || HG.layer()).ctx; HG.reset(w); w.clearRect(0, 0, W, W); w.globalCompositeOperation = 'lighter';
  place(w, P);
  for (let i = 0; i < NSTRIP; i++) {
    const a = U0 + (U1 - U0) * i / NSTRIP, b = U0 + (U1 - U0) * (i + 1) / NSTRIP;
    const xa = warpU(a - 512, P.yaw) * KS, xb = warpU(b - 512, P.yaw) * KS;
    if (xb - xa > 0.01) w.drawImage(img, a, 0, b - a, N, xa, -S0 / 2, xb - xa, S0);
  }
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(WARP.cv, 0, 0); g.restore();
}
function xf(u, v, P) {
  const s = S0 * P.z / N, dx = warpU(u - 512, P.yaw) * s * P.sx, dy = (v - 512) * s * P.sy, c = Math.cos(P.rot), n = Math.sin(P.rot);
  return [MX + P.ox + dx * c - dy * n, MY + P.oy + dx * n + dy * c];
}
const maskOn = t => t >= T_DROP && t < T_SHUT;

// ---------- neon outline: closed contours, warped with the yaw
const PATHS = DATA.paths.filter(q => q.p.length > 60).map((q, idx) => {
  const p = q.p, n = p.length / 2, path = new Path2D(), gold = q.c === 'gold';
  path.moveTo(p[0], p[1]); for (let i = 1; i < n; i++) path.lineTo(p[2 * i], p[2 * i + 1]); path.closePath();
  return { idx, p, n, path, gold, outer: idx === 0, col: gold ? GOLD : RED, core: gold ? GOLDCORE : REDCORE };
});
function pathOf(Q, yaw) {
  if (Math.abs(yaw) < 0.001) return Q.path;
  const p = Q.p, path = new Path2D();
  for (let i = 0; i < Q.n; i++) { const x = 512 + warpU(p[2 * i] - 512, yaw); i ? path.lineTo(x, p[2 * i + 1]) : path.moveTo(x, p[2 * i + 1]); }
  path.closePath(); return path;
}
// off until the hit; a lock-on flash on contact, settling to a faint neon rim over the gold
function lineAlpha(Q, t) {
  if (t < T_LAND) return 0;
  const dt = t - T_LAND, rest = Q.outer ? 0.16 : 0.05;
  return lerp(1, rest, smooth(T_LAND + 0.05, T_LAND + 0.85, t)) + 0.3 * Math.exp(-dt / 0.1);
}

// ---------- pre-rendered light sprites
// a narrow stage-light cone (apex just left of the image), no wide skirt
function makeBeam(col, sig, coreK) {
  const BW = 1700, BH = 640, c = canvas(BW, BH), g = c.getContext('2d'), im = g.createImageData(BW, BH), d = im.data;
  for (let y = 0; y < BH; y++) for (let x = 0; x < BW; x++) {
    const th = Math.atan2(y - BH / 2, x + 30);
    const cone = Math.exp(-((th / sig) ** 4)) + coreK * Math.exp(-((th / (sig * 0.3)) ** 2));
    const along = Math.pow(1 - x / BW, 1.25) * (0.55 + 0.45 * smooth(0, 200, x));
    const o = (y * BW + x) * 4;
    d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255 * clamp(cone * along / (1 + coreK));
  }
  g.putImageData(im, 0, 0);
  return c;
}
// a four-point star; hot: centre colour (warm, never pure white)
function makeStar(col, hot = [255, 246, 226], size = 256, arm = 0.022, halo = 0.3, cr = 0.07, reach = 5.5) {
  const c = canvas(size), g = c.getContext('2d'), im = g.createImageData(size, size), d = im.data, h = size / 2;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = (x - h + 0.5) / h, v = (y - h + 0.5) / h, r = Math.hypot(u, v);
    const arms = Math.exp(-Math.abs(u) * reach) * Math.exp(-((v / arm) ** 2)) + Math.exp(-Math.abs(v) * reach) * Math.exp(-((u / arm) ** 2));
    const diag = 0.35 * (Math.exp(-Math.abs(u + v) * 9) * Math.exp(-(((u - v) / 0.03) ** 2)) + Math.exp(-Math.abs(u - v) * 9) * Math.exp(-(((u + v) / 0.03) ** 2)));
    const core = Math.exp(-((r / cr) ** 2)) + halo * Math.exp(-((r / 0.22) ** 2));
    const I = clamp((arms + diag + core) * (1 - smooth(0.85, 1, r)));
    const w = clamp(core * 1.1) * 0.75;
    const o = (y * size + x) * 4;
    d[o] = lerp(col[0], hot[0], w); d[o + 1] = lerp(col[1], hot[1], w); d[o + 2] = lerp(col[2], hot[2], w); d[o + 3] = 255 * I;
  }
  g.putImageData(im, 0, 0);
  return c;
}
// smoke: high-contrast fbm, mostly clear air with drifting wisps
function makeHaze(n = 360) {
  const R = HG.rng(5), c = canvas(n), g = c.getContext('2d'), im = g.createImageData(n, n), d = im.data;
  const octave = cells => { const m = cells + 1, grid = new Float32Array(m * m); for (let i = 0; i < grid.length; i++) grid[i] = R(); return grid; };
  const oct = [[4, 0.5], [9, 0.3], [21, 0.2]].map(([cells, w]) => ({ cells, w, grid: octave(cells) }));
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let v = 0;
    for (const { cells, w, grid } of oct) {
      const fx = x / n * cells, fy = y / n * cells, ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy;
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty), m = cells + 1;
      v += w * lerp(lerp(grid[iy * m + ix], grid[iy * m + ix + 1], sx), lerp(grid[(iy + 1) * m + ix], grid[(iy + 1) * m + ix + 1], sx), sy);
    }
    const o = (y * n + x) * 4;
    d[o] = d[o + 1] = d[o + 2] = 255; d[o + 3] = 255 * (0.3 + 0.7 * Math.pow(clamp((v - 0.44) / 0.24), 1.5));
  }
  g.putImageData(im, 0, 0);
  return c;
}
const BEAM_A = makeBeam(AMBER, 0.046, 0.45), BEAM_M = makeBeam(MAGENTA, 0.05, 0.5);
const STAR_W = makeStar([255, 200, 110]), STAR_C = makeStar(COOL), STAR_H = makeStar([255, 160, 50], [255, 200, 110], 256, 0.03, 0.1, 0.045, 3.0), HAZE = makeHaze();
const BL = HG.layer(), BH = HG.layer(), HD = HG.layer(), TMP = HG.layer(), NL = HG.layer(), SP = HG.layer(), RM = HG.layer();
const CFAR = HG.layer(), CB = HG.layer(), CF = HG.layer();

// ---------- spotlights: sources sit off-circle; angles are smooth keyframed sweeps.
// Both swing in and cross at the centre at T_COLL, hold on the landing mask, roam, then lock on for the iris.
const kA = [[0, 1.42], [T_COLL, 0.80], [T_LAND, 0.86], [2.6, 0.48], [4.0, 1.1], [5.4, 0.7], [6.6, 1.02], [7.05, 0.5], [7.9, 1.12], [8.7, 0.86], [12, 0.86]];
const kB = [[0, 1.42], [T_COLL, 0.80], [T_LAND, 0.86], [2.6, 1.14], [4.0, 0.5], [5.4, 0.95], [6.6, 0.56], [7.05, 1.15], [7.9, 0.48], [8.7, 0.86], [12, 0.86]];
const kU = [[1.2, -0.5], [3.0, -0.98], [4.6, -0.58], [6.2, -0.95], [7.6, -0.6], [9.4, -0.8]];
const kV = [[1.2, -0.92], [3.0, -0.5], [4.6, -0.95], [6.2, -0.55], [7.6, -0.9], [9.4, -0.7]];
const collFlash = t => { const d = t - T_COLL; return d < 0 ? 0 : (d < 0.04 ? d / 0.04 : Math.exp(-(d - 0.04) / 0.2)); };
const keyEnv = t => {
  const base = 0.92 * smooth(0.02, 0.55, t);
  const hit = 0.45 * collFlash(t) + 0.4 * Math.exp(-Math.max(0, t - T_LAND) / 0.4) * smooth(T_LAND - 0.1, T_LAND, t);
  const hero = lerp(1, 0.42, smooth(T_LAND + 0.05, 2.0, t)) + 0.22 * bump(t, T_CONF - 0.1, T_CONF + 0.1, T_CONF + 0.3, T_CONF + 1.4)
    + 0.12 * bump(t, T_WAVE - 0.1, T_WAVE + 0.2, T_WAVE + 1.0, T_WAVE + 1.5);
  return (base * hero + hit) * (1 - smooth(8.7, 9.45, t));
};
const upEnv = t => 0.85 * smooth(T_LAND + 0.1, T_LAND + 1.0, t) * (1 - smooth(8.5, 9.2, t));
const BEAMS = [
  { x: 40, y: -30, ang: t => spline(kA, t), env: keyEnv, img: BEAM_A, col: AMBER, a: 1.05 },
  { x: 1040, y: -30, ang: t => Math.PI - spline(kB, t), env: keyEnv, img: BEAM_A, col: AMBER, a: 1.05 },
  { x: -30, y: 1110, ang: t => spline(kU, t), env: upEnv, img: BEAM_M, col: MAGENTA, a: 1 },
  { x: 1110, y: 1110, ang: t => Math.PI - spline(kV, t), env: upEnv, img: BEAM_M, col: MAGENTA, a: 1 },
];
function beamAt(b, t, x, y) {
  let d = Math.atan2(y - b.y, x - b.x) - b.ang(t);
  d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return Math.exp(-((d / 0.05) ** 2));
}
function drawBeams(t) {
  const g = BL.ctx; HG.reset(g); g.clearRect(0, 0, W, W);
  g.globalCompositeOperation = 'lighter';
  let any = false;
  for (const b of BEAMS) {
    const e = b.env(t) * b.a; if (e <= 0.003) continue;
    any = true;
    g.setTransform(1, 0, 0, 1, b.x, b.y); g.rotate(b.ang(t)); g.globalAlpha = Math.min(1, e);
    g.drawImage(b.img, 0, -b.img.height / 2);
  }
  if (!any) return;
  // the light only shows where there is smoke: drifting wisps in world space
  HG.reset(g); g.globalCompositeOperation = 'destination-in';
  g.drawImage(HAZE, -280 + 16 * t, -300 + 9 * t, 1640, 1640);
  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(BL.cv, 0, 0);
  // a small hot lamp where each beam enters the circle
  for (const b of BEAMS) {
    const e = Math.min(1, b.env(t) * b.a); if (e <= 0.003) continue;
    const th = b.ang(t), dx = Math.cos(th), dy = Math.sin(th), fx = b.x - C, fy = b.y - C;
    const bb = fx * dx + fy * dy, disc = bb * bb - (fx * fx + fy * fy - 528 * 528);
    if (disc <= 0) continue;
    const s = -bb - Math.sqrt(disc), x = b.x + dx * (s + 14), y = b.y + dy * (s + 14);
    HG.dot(ctx, b.col, x, y, 150, 0.16 * e);
    HG.dot(ctx, b.col, x, y, 44, 0.55 * e);
    HG.dot(ctx, WARM, x, y, 16, 0.6 * e);
  }
  HG.reset(ctx);
}
// the two spots collide at the centre: an amber bloom and a warm star (not white, not full frame)
function drawCollision(t) {
  const e = collFlash(t); if (e <= 0.003) return;
  HG.reset(ctx); glow(C, C, 330, AMBER, 0.5 * e); glow(C, C, 80, WARM, 0.55 * e);
  star(STAR_H, C, C, 300 * (0.7 + 0.3 * e), 0.85 * e, 0.2 + 0.6 * (t - T_COLL));
}
// dust motes that only show inside the beams
const MOTES = (() => { const R = HG.rng(41); return Array.from({ length: 170 }, () => ({ x: R() * W, y: R() * W, sp: 6 + R() * 16, ph: R() * TAU, s: 3 + R() * 5 })); })();
function drawMotes(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const m of MOTES) {
    const x = m.x + 14 * Math.sin(t * 0.45 + m.ph), y = ((m.y - m.sp * t) % W + W) % W;
    if (Math.hypot(x - C, y - C) > 520) continue;
    let I = 0; for (const b of BEAMS) { const e = b.env(t); if (e > 0.01 && b.img === BEAM_A) I += e * beamAt(b, t, x, y); }
    HG.dot(ctx, WARM, x, y, m.s, 0.8 * I * (0.6 + 0.4 * Math.sin(t * 2.1 + m.ph)));
  }
  ctx.restore();
}

// ---------- camera flashes in the dark stands (never on the mask); a crowd wave runs once around the arena
const WAVE_A0 = Math.PI * 5 / 6, WAVE_SPAN = Math.PI * 4 / 3, WAVE_DUR = 0.95;
// the title band (lower part of the circle) stays calm while the title is up
const titleOn = t => bump(t, 1.9, 2.3, 9.7, 10.1);
const bandFade = (t, y, y0 = 760, y1 = 840) => 1 - titleOn(t) * smooth(y0, y1, y);
const outsideMask = (x, y) => ((x - MX) / 300) ** 2 + ((y - MY) / 448) ** 2 > 1;
const FLASHES = (() => {
  const R = HG.rng(808), out = [];
  const spot = () => { for (;;) { const a = R() * TAU, r = 200 + R() * 290, x = C + Math.cos(a) * r, y = C + Math.sin(a) * r;
    if (outsideMask(x, y)) return [x, y]; } };
  const add = (t0, t1, n, a = 1) => { for (let i = 0; i < n; i++) { const [x, y] = spot(), t = lerp(t0, t1, R());
    const f = { t, x, y, s: 16 + R() * 16, rot: (R() - 0.5) * 0.5, a: a * (0.6 + 0.4 * R()) }; out.push(f);
    if (R() < 0.25) out.push({ ...f, t: t + 0.13, a: f.a * 0.7 }); } };
  add(T_LAND + 0.03, T_LAND + 0.8, 14); add(2.0, 3.3, 4, 0.7); add(5.4, 6.8, 5, 0.75); add(T_CONF + 0.05, T_CONF + 0.9, 10); add(7.9, 8.6, 3, 0.7);
  // the wave: starts low on the left (8 o'clock), runs clockwise over the top and down to 4 o'clock,
  // two rows deep; it never runs along the bottom arc, where the title sits
  for (let i = 0; i < 60; i++) {
    const k = i / 60, a = WAVE_A0 + WAVE_SPAN * k + (R() - 0.5) * 0.09;
    for (let tries = 0; tries < 20; tries++) {
      const r = 395 + R() * 120, x = C + Math.cos(a) * r, y = C + Math.sin(a) * r;
      if (outsideMask(x, y) && r < 515) { out.push({ t: T_WAVE + WAVE_DUR * k + (R() - 0.5) * 0.06, x, y, s: 22 + R() * 18, rot: (R() - 0.5) * 0.5, a: 0.8 + 0.2 * R() }); break; }
    }
  }
  return out;
})();
function drawFlashes(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // the crowd wave's front: a soft cool glow running round the stands
  const wk = (t - T_WAVE) / WAVE_DUR, we = bump(wk, -0.06, 0.08, 0.86, 1.02);
  if (we > 0.003) for (let j = 0; j < 4; j++) {
    const a = WAVE_A0 + WAVE_SPAN * (wk - j * 0.035), r = 462, x = C + Math.cos(a) * r, y = C + Math.sin(a) * r;
    HG.dot(ctx, COOL, x, y, 230, 0.07 * we * (1 - j / 4) * bandFade(t, y, 600, 760));
  }
  for (const f of FLASHES) {
    const dt = t - f.t; if (dt < 0 || dt > 0.8) continue;
    const e = f.a * (dt < 0.035 ? dt / 0.035 : Math.exp(-(dt - 0.035) / 0.12)) * bandFade(t, f.y);
    if (e < 0.003) continue;
    HG.dot(ctx, COOL, f.x, f.y, f.s * 3.4, e * 0.18);
    HG.dot(ctx, COOL, f.x, f.y, f.s, e * 0.8);
    const sz = f.s * (4.2 + 1.2 * e);
    ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.globalAlpha = Math.min(1, e * 0.9);
    ctx.drawImage(STAR_C, -sz / 2, -sz / 2, sz, sz); ctx.restore();
  }
  ctx.restore();
}

// ---------- neon outline over the mask (the bloom has the hole interiors cut out so the openings stay dark)
function drawLines(t, A) {
  const P = pose(t), s = S0 * P.z / N;
  const g = HD.ctx; HG.reset(g); g.clearRect(0, 0, W, W);
  place(g, P); g.scale(KS, KS); g.translate(-512, -512);
  g.lineCap = 'round'; g.lineJoin = 'round';
  let any = false;
  for (const Q of PATHS) {
    const a = lineAlpha(Q, t); if (a <= 0.003) continue;
    any = true;
    const path = pathOf(Q, P.yaw);
    g.globalAlpha = Math.min(1, a); g.strokeStyle = rgba(Q.col); g.lineWidth = 5 / s; g.stroke(path);
    g.globalAlpha = Math.min(1, a * 0.85); g.strokeStyle = rgba(Q.core); g.lineWidth = 2 / s; g.stroke(path);
  }
  if (!any) return;
  const n = NL.ctx; HG.reset(n); n.clearRect(0, 0, W, W); n.globalCompositeOperation = 'lighter';
  n.globalAlpha = 0.9; n.filter = 'blur(16px)'; n.drawImage(HD.cv, 0, 0);
  n.globalAlpha = 0.85; n.filter = 'blur(4px)'; n.drawImage(HD.cv, 0, 0);
  n.filter = 'none'; n.globalAlpha = 1; n.drawImage(HD.cv, 0, 0);

  if (re > 0.003 && R < 600) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const arc = () => { ctx.beginPath(); ctx.arc(C, C, rr, 0, TAU); ctx.stroke(); };
    const a = re * lerp(0.75, 1, smooth(9.9, T_SHUT, t));
    ctx.strokeStyle = rgba(AMBER); ctx.globalAlpha = 0.45 * a; ctx.lineWidth = 26; ctx.filter = 'blur(12px)'; arc();
    ctx.globalAlpha = 0.75 * a; ctx.lineWidth = 10; ctx.filter = 'blur(1.5px)'; arc();
    ctx.strokeStyle = rgba(WARM); ctx.globalAlpha = 0.3 * a; ctx.lineWidth = 3.5; ctx.filter = 'none'; arc();
    ctx.restore();
  }
  // a wink: a sparkle on the corner of the right eye while the spot holds on the face
  const wk = t - 9.66, we = wk < 0 ? 0 : wk < 0.06 ? wk / 0.06 : Math.exp(-(wk - 0.06) / 0.16);
  if (we > 0.005) { const [x, y] = xf(700, 382, pose(t)); star(STAR_H, x, y, 220 * (0.7 + 0.3 * we), 0.95 * we, 0.62 + 0.8 * wk); }
  // the point it closes to: a warm star that winks out where the next portal opens
  // after the wink-out flare a small ember of it stays alive and fades slowly, bridging into the portal
  const d = t - (T_SHUT - 0.06), e = d < 0 ? 0 : d < 0.06 ? d / 0.06 : Math.exp(-(d - 0.06) / 0.11) * (1 - smooth(0.32, 0.42, d));
  const em = 0.32 * smooth(0.04, 0.12, d) * (1 - smooth(0.18, 0.6, d));
  if (e > 0.004 || em > 0.004) {
    HG.reset(ctx); glow(C, C, 150, AMBER, 0.5 * e + 0.35 * em);
    star(STAR_H, C, C, 250 * (0.6 + 0.4 * Math.max(e, em)), 0.9 * Math.max(e, em), 0.4 + 1.2 * d);
  }
  HG.reset(ctx);
}

HG.start({
  duration: 12,
  assets: { mask: '../assets/08-lucha_grade.png', glint: '../assets/08-lucha_glint2.png', lift: '../assets/08-lucha_glint.png', solid: '../assets/08-lucha_solid.png',
    holes: '../assets/08-lucha_holes.png', rim: '../assets/08-lucha_rim.png' },
  render(t, A) {
    if (t >= T_SHUT + 0.6) return;                                  // dissolved to black
    if (t < T_SHUT) {
      drawBeams(t);
      drawMotes(t);
      HG.dust(t, { n: 44, colors: [GOLD, WARM], alpha: 0.3 * bump(t, 1.8, 3.0, 8.4, 9.3), size: 5, r: 500, seed: 23 });
      drawCollision(t);
      drawConfetti(t, false);
      drawBehind(t, A);
      drawMask(t, A);
      drawGlints(t, A);
      drawLines(t, A);
      drawConfetti(t, true);
      drawFlashes(t);
    }
    drawIris(t);
  },
});
