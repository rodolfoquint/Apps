<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Ajolote: out of the deep, a small teal shape swims up toward us, its tail sweeping. The
// water's colour falls away as it comes close, and on arrival its six gill fronds flush
// coral-pink behind a wave of light. It floats in clear water under a shimmering surface:
// light pulses run up the gills, caustics play over its skin, it breathes out a trio of
// bubbles and big bubbles drift past. Then it tips head-down and dives back into the deep,
// leaving a trail of bubbles; the dive is still in view when the show's portal ring sweeps
// outward over it.
// Asset: prepare.py on out/images/ajolote-1.png -> assets/06-ajolote.png.
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const TAU = Math.PI * 2;

function hash(a, b) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const sm = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };
const sine = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
const bell = (x, w) => Math.exp(-(x / w) * (x / w));

// ---------- palette
const TEAL = [0.30, 0.95, 1.05];   // the deep-water tint, as multipliers of the skin's luminance
const LAV = [0.82, 0.62, 1.08];    // the colour passes through lavender on its way back (not through grey)
const PULSE = [255, 98, 132];      // gill pulses push the filaments toward this coral
const GLOW = [255, 62, 110];       // and bloom in this saturated pink (so the cores stay coral)
const S_PINK = [255, 128, 140], S_DEEP = [40, 185, 215], AQUA_S = [120, 228, 255];

// ---------- artwork geometry (asset pixels of the 1024 cut-out)
const PIV = [504, 568];          // centre of the creature's enclosing circle (radius ~600)
const MOUTH = [176, 481];        // left corner of the smile
const EYES = [[193, 405, 0.85], [428, 416, 1]];
const FRONDS = [                 // gill fronds: base, tip, half-width, phase
  { a: [268, 292], b: [238, 52], hw: 62, ph: 0.0 },
  { a: [200, 345], b: [38, 210], hw: 60, ph: 0.9 },
  { a: [170, 448], b: [20, 410], hw: 58, ph: 1.8 },
  { a: [585, 305], b: [742, 80], hw: 64, ph: 0.5 },
  { a: [612, 372], b: [880, 242], hw: 64, ph: 1.4 },
  { a: [602, 470], b: [864, 452], hw: 60, ph: 2.3 },
];
const ORDER = [2, 1, 0, 3, 4, 5];  // the pulse wave runs round the crown, left-low to right-low
const TAIL = { a: [785, 585], b: [935, 990], hw: 118 };
const LEGS = [
  { a: [282, 600], b: [212, 778], hw: 52, ph: 0.0 },
  { a: [585, 640], b: [572, 808], hw: 58, ph: 2.6 },
  { a: [478, 700], b: [468, 838], hw: 45, ph: 1.3 },
];

// ---------- timeline
const T_IN0 = 0.12, T_IN1 = 3.0;      // the swim up out of the deep
const T_ARR = 2.45;                   // arrival: the gills flush pink
const WAVES = [4.6, 6.35, 8.1];       // gill light pulses through the float
const T_OUT0 = 9.25, T_OUT1 = 11.9;   // the dive back into the deep
const IN_D = [70, 235], OUT_D = [-50, 290];   // where the deep lies, on screen, for the way in / out
// z: distance into the deep (0 = here); the creature's scale is 1 / (1 + z)
const zIn = t => 4.6 * Math.pow(1 - clamp((t - T_IN0) / (T_IN1 - T_IN0)), 2.2);
const vOut = t => clamp((t - T_OUT0) / (T_OUT1 - T_OUT0));
const zOut = t => 0.4 * sine((t - T_OUT0) / 1.4) + 5 * Math.pow(vOut(t), 4.5);     // slow to leave, then gone: still large when the portal ring passes
const swimAt = t => smooth(0, 0.35, t) * (1 - smooth(2.2, 3.1, t)) + smooth(8.85, 9.45, t);
const deepBody = t => 1 - smooth(1.15, 2.35, t) + sm((zOut(t) - 1.0) / 3.2);
const deepGill = t => Math.max(deepBody(t), t < 6 ? 1 - smooth(T_ARR - 0.2, T_ARR + 0.3, t) : 0);
const fadeAt = t => smooth(0.06, 0.75, t) * (1 - smooth(11.0, 11.85, t));
const ambient = t => smooth(0.3, 2.0, t) * (1 - smooth(10.9, 11.9, t));

// ---------- motion: swim in, a slow underwater float, dive out (pure functions of t)
const sFloat = t => 0.71 * (1 + 0.04 * sine((t - 3.0) / 6.2));    // a gentle push-in through the float
const offX = t => 10 * Math.sin(TAU * t / 7.4 + 0.6);
const offY = t => 14 * Math.sin(TAU * t / 5.2 - 0.9);
const rotAt = t => 0.03 + 0.03 * Math.sin(TAU * t / 5.6 - 2.0);
function xf(t) {
  const zi = zIn(t), zo = zOut(t), k = 1 / (1 + zi + zo), fi = 1 - 1 / (1 + zi), fo = sine((t - T_OUT0) / 2.0);
  const sw = swimAt(t);
  return {
    s: sFloat(t) * k,
    r: rotAt(t) + 0.22 * fi - 0.5 * fo + 0.055 * sw * Math.sin(TAU * t / 0.8 - 0.6),
    x: C + offX(t) * k + IN_D[0] * fi + OUT_D[0] * fo + 12 * sw * k * Math.sin(TAU * t / 0.8 + 0.9),
    y: C + offY(t) * k + IN_D[1] * fi + OUT_D[1] * fo,
  };
}
function toCanvas(p, t) {
  const f = xf(t), dx = (p[0] - PIV[0]) * f.s, dy = (p[1] - PIV[1]) * f.s;
  return [f.x + dx * Math.cos(f.r) - dy * Math.sin(f.r), f.y + dx * Math.sin(f.r) + dy * Math.cos(f.r)];
}
function applyXf(c, t) {
  const f = xf(t);
  c.translate(f.x, f.y); c.rotate(f.r); c.scale(f.s, f.s); c.translate(-PIV[0], -PIV[1]);
}

// ---------- work buffers, built once from the asset
const N = 800, Q = N / 1024, NN = N * N;
let WK = null;
function buildWork(A) {
  const mk = n => { const c = document.createElement('canvas'); c.width = c.height = n; return c; };
  const g0 = mk(N).getContext('2d', { willReadFrequently: true });
  g0.imageSmoothingQuality = 'high'; g0.drawImage(A.photo, 0, 0, N, N);
  const photo = g0.getImageData(0, 0, N, N).data;

  // colour grade: the pale lavender fin edge warms toward coral, and a soft highlight knee
  // (hue preserved) leaves headroom for the pulses and caustics
  const gm = new Float32Array(NN);
  for (let i = 0; i < NN; i++) {
    const o = i * 4;
    let r = photo[o], g = photo[o + 1], b = photo[o + 2];
    if (b > g) { const k = smooth(70, 150, (r + g + b) / 3); b = g + (b - g) * (1 - 0.6 * k); r = r + (255 - r) * 0.25 * k * (b - g) / 60; }
    const m = Math.max(r, g, b);
    if (m > 176) { const f = (176 + (m - 176) * 0.42) / m; r *= f; g *= f; b *= f; }
    photo[o] = r; photo[o + 1] = g; photo[o + 2] = b;
    gm[i] = sm(((r - Math.max(g, b)) / 255 - 0.3) / 0.28) * photo[o + 3] / 255;   // saturated coral = gill filaments
  }

  // output layers: P the skin, K the gill-pulse light, S the silhouette (bloom and caustic mask)
  const layer = col => { const c = mk(N), g = c.getContext('2d'), d = g.createImageData(N, N);
    if (col) for (let i = 0; i < NN; i++) { d.data[i * 4] = col[0]; d.data[i * 4 + 1] = col[1]; d.data[i * 4 + 2] = col[2]; }
    return { c, g, d }; };
  const P = layer(null), K = layer(GLOW), S = layer(S_PINK);

  // regions of influence for the displacement field: (pixel, u along the limb, signed width, weight)
  const touched = new Uint8Array(NN);
  function region(seg, beyond) {
    const ax = seg.a[0] * Q, ay = seg.a[1] * Q, bx = seg.b[0] * Q, by = seg.b[1] * Q, hw = seg.hw * Q;
    const Ln = Math.hypot(bx - ax, by - ay), tx = (bx - ax) / Ln, ty = (by - ay) / Ln, nx = -ty, ny = tx, reach = hw * 1.9;
    const pad = reach + Ln * beyond;
    const x0 = Math.max(0, Math.floor(Math.min(ax, bx) - pad)), x1 = Math.min(N - 1, Math.ceil(Math.max(ax, bx) + pad));
    const y0 = Math.max(0, Math.floor(Math.min(ay, by) - pad)), y1 = Math.min(N - 1, Math.ceil(Math.max(ay, by) + pad));
    const idx = [], us = [], ps = [], ws = [];
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const rx = x - ax, ry = y - ay, u = (rx * tx + ry * ty) / Ln, p = rx * nx + ry * ny;
      if (u < -0.2 || u > 1 + beyond) continue;
      const w = sm((u + 0.2) / 0.4) * (1 - sm((u - 1 - beyond * 0.3) / (beyond * 0.7))) * (1 - sm((Math.abs(p) - hw * 0.9) / (reach - hw * 0.9)));
      if (w < 0.003) continue;
      const i = y * N + x; idx.push(i); us.push(u); ps.push(p / hw); ws.push(w); touched[i] = 1;
    }
    return { idx: Int32Array.from(idx), u: Float32Array.from(us), p: Float32Array.from(ps), w: Float32Array.from(ws), nx, ny, ...seg };
  }
  const fr = FRONDS.map(f => region(f, 0.3)), tail = region(TAIL, 0.15), legs = LEGS.map(l => region(l, 0.15));
  const list = []; for (let i = 0; i < NN; i++) if (touched[i]) list.push(i);

  // which pixels are gill (they keep the deep tint a moment longer, then flush pink)
  const GW = new Float32Array(NN);
  for (const R of fr) for (let k = 0; k < R.idx.length; k++) {
    const i = R.idx[k], v = R.w[k] * sm((R.u[k] + 0.05) / 0.3) * clamp(0.3 + 1.2 * gm[i]);
    if (v > GW[i]) GW[i] = v;
  }
  WK = { photo, gm, GW, P, K, S, fr, tail, legs, list: Int32Array.from(list),
    cur: new Uint8ClampedArray(photo), gcur: Float32Array.from(GW), pulse: new Float32Array(NN),
    dx: new Float32Array(NN), dy: new Float32Array(NN), sh: new Float32Array(NN) };
}

// gill pulses: for frond f, the fronts (position along the frond, strength, width) alive at t
function pulseFronts(f, t) {
  const rank = ORDER.indexOf(f), out = [];
  for (const w of WAVES) {
    const age = t - (w + rank * 0.13);
    if (age > -0.02 && age < 1.3) out.push([-0.2 + 1.5 * age, smooth(0, 0.12, age) * (1 - smooth(0.85, 1.3, age)), 0.13]);
  }
  // the arrival flush: one broad, quick wave through all six fronds together
  const age = t - (T_ARR + rank * 0.04);
  if (age > -0.02 && age < 1.0) out.push([-0.25 + 1.8 * age, 1.1 * smooth(0, 0.1, age) * (1 - smooth(0.5, 1.0, age)), 0.24]);
  return out;
}

// ---------- the living creature: displacement field, then the per-pixel colour
function animate(t) {
  const { dx, dy, sh, list, pulse } = WK, sw = swimAt(t);
  for (let k = 0; k < list.length; k++) { const i = list[k]; dx[i] = 0; dy[i] = 0; sh[i] = 0; }
  // gill fronds: a slow wave runs along each frond (quicker while swimming), the filaments
  // fluff out and relax, and the light pulses travel from base to tip
  for (let f = 0; f < 6; f++) {
    const R = WK.fr[f], { idx, u, p, w, nx, ny, ph } = R, a1 = 11 * Q, a2 = 7 * Q, a3 = 9 * Q * sw, fronts = pulseFronts(f, t);
    for (let k = 0; k < idx.length; k++) {
      const uu = u[k], g = Math.pow(clamp(uu, 0, 1.25), 1.4), i = idx[k];
      let sway = a1 * g * Math.sin(TAU * t / 3.3 - 2.3 * uu + ph);
      if (a3 > 0) sway += a3 * g * Math.sin(TAU * t / 0.8 - 2.8 * uu + ph);
      const fluff = a2 * p[k] * g * (0.5 + 0.5 * Math.sin(TAU * t / 1.9 - 3.2 * uu + ph * 1.7));
      const d = (sway + fluff) * w[k];
      dx[i] += nx * d; dy[i] += ny * d;
      if (fronts.length) {
        let s = 0;
        for (const [fp, fa, fw] of fronts) { const z = (uu - fp) / fw; s += fa * Math.exp(-z * z); }
        sh[i] += w[k] * sm((uu + 0.15) / 0.3) * s;
      }
    }
  }
  { // tail: a lazy sweep with a lag toward the tip, and strong quick beats while swimming
    const { idx, u, w, nx, ny } = WK.tail, a = 13 * Q, aS = 62 * Q * sw;
    for (let k = 0; k < idx.length; k++) {
      const uu = clamp(u[k], 0, 1.15);
      let d = a * Math.pow(uu, 1.6) * Math.sin(TAU * t / 3.1 - 2.4 * uu - 0.5);
      if (aS > 0) d += aS * Math.pow(uu, 1.3) * Math.sin(TAU * t / 0.8 - 3.0 * uu - 0.5);
      d *= w[k];
      dx[idx[k]] += nx * d; dy[idx[k]] += ny * d;
    }
  }
  for (const R of WK.legs) { // little paddling legs
    const { idx, u, w, nx, ny, ph } = R, a = 5 * Q;
    for (let k = 0; k < idx.length; k++) {
      const uu = clamp(u[k], 0, 1.15), d = a * Math.pow(uu, 1.3) * Math.sin(TAU * t / 3.7 + ph - 0.8 * uu) * w[k];
      dx[idx[k]] += nx * d; dy[idx[k]] += ny * d;
    }
  }
  // resample photo, gill weight and gill mask through the field (inverse mapping, bilinear)
  const src = WK.photo, GW = WK.GW, gm = WK.gm, po = WK.cur, go = WK.gcur;
  for (let k = 0; k < list.length; k++) {
    const i = list[k], x = i % N, y = (i - x) / N;
    let sx = x - dx[i], sy = y - dy[i];
    sx = sx < 0 ? 0 : sx > N - 1.001 ? N - 1.001 : sx; sy = sy < 0 ? 0 : sy > N - 1.001 ? N - 1.001 : sy;
    const x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0, j = y0 * N + x0;
    const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy), w01 = (1 - fx) * fy, w11 = fx * fy;
    const a = j * 4, b = a + 4, c = a + N * 4, d = c + 4, o = i * 4;
    po[o] = src[a] * w00 + src[b] * w10 + src[c] * w01 + src[d] * w11;
    po[o + 1] = src[a + 1] * w00 + src[b + 1] * w10 + src[c + 1] * w01 + src[d + 1] * w11;
    po[o + 2] = src[a + 2] * w00 + src[b + 2] * w10 + src[c + 2] * w01 + src[d + 2] * w11;
    po[o + 3] = src[a + 3] * w00 + src[b + 3] * w10 + src[c + 3] * w01 + src[d + 3] * w11;
    go[i] = GW[j] * w00 + GW[j + 1] * w10 + GW[j + N] * w01 + GW[j + N + 1] * w11;
    const s = sh[i];
    pulse[i] = s > 0.002 ? s * (0.3 + 0.7 * (gm[j] * w00 + gm[j + 1] * w10 + gm[j + N] * w01 + gm[j + N + 1] * w11)) : 0;
  }

  // per-pixel colour: the deep-water tint (the gills keep it a moment longer), the depth
  // dimming, and the gill pulses pulling the filaments toward coral
  const dB = deepBody(t), dG = deepGill(t), z = zIn(t) + zOut(t), br = 1 - 0.2 * sm(z / 4);
  const cur = WK.cur, gc = WK.gcur, pul = WK.pulse;
  const PO = WK.P.d.data, KO = WK.K.d.data, SO = WK.S.d.data;
  const s0 = lerp(S_PINK[0], S_DEEP[0], dB), s1 = lerp(S_PINK[1], S_DEEP[1], dB), s2 = lerp(S_PINK[2], S_DEEP[2], dB);
  for (let i = 0, o = 0; i < NN; i++, o += 4) {
    const a = cur[o + 3];
    if (a < 1) { PO[o + 3] = 0; KO[o + 3] = 0; SO[o + 3] = 0; continue; }
    let r = cur[o], g = cur[o + 1], b = cur[o + 2];
    const d = dB + (dG - dB) * gc[i];
    if (d > 0.002) {   // skin -> lavender -> teal
      const L = 0.36 * r + 0.5 * g + 0.14 * b;
      if (d < 0.5) { const m = 2 * d; r += (L * LAV[0] - r) * m; g += (L * LAV[1] - g) * m; b += (L * LAV[2] - b) * m; }
      else { const m = 2 * d - 1; r = L * (LAV[0] + (TEAL[0] - LAV[0]) * m); g = L * (LAV[1] + (TEAL[1] - LAV[1]) * m); b = L * (LAV[2] + (TEAL[2] - LAV[2]) * m); }
    }
    const p = pul[i];
    if (p > 0.002) { const m = Math.min(0.8, 0.75 * p); r += (PULSE[0] - r) * m; g += (PULSE[1] - g) * m; b += (PULSE[2] - b) * m; }
    PO[o] = r * br; PO[o + 1] = g * br; PO[o + 2] = b * br; PO[o + 3] = a;
    KO[o + 3] = 255 * Math.min(1, p);
    SO[o] = s0; SO[o + 1] = s1; SO[o + 2] = s2; SO[o + 3] = a;
  }
  WK.P.g.putImageData(WK.P.d, 0, 0); WK.K.g.putImageData(WK.K.d, 0, 0); WK.S.g.putImageData(WK.S.d, 0, 0);
}

// ---------- caustics: the classic water-caustic iteration, evaluated on a coarse grid
const CR = 360, CAU = document.createElement('canvas'); CAU.width = CAU.height = CR;
const caux = CAU.getContext('2d'), cauD = caux.createImageData(CR, CR);
function caustics(t) {
  const time = t * 0.42 + 23, inten = 0.005, d = cauD.data, K = 2.6;
  for (let y = 0; y < CR; y++) for (let x = 0; x < CR; x++) {
    const px = (x / CR) * K * TAU - 250 + t * 0.05, py = (y / CR) * K * TAU - 250 - t * 0.03;
    let ix = px, iy = py, c = 1;
    for (let n = 0; n < 4; n++) {
      const tt = time * (1 - 3.5 / (n + 1));
      const nx = px + Math.cos(tt - ix) + Math.sin(tt + iy), ny = py + Math.sin(tt - iy) + Math.cos(tt + ix);
      ix = nx; iy = ny;
      c += 1 / Math.hypot(px / (Math.sin(ix + tt) / inten), py / (Math.cos(iy + tt) / inten));
    }
    c /= 4; c = 1.17 - Math.pow(c, 1.4);
    const v = clamp((Math.pow(Math.abs(c), 8) - 0.04) / 0.7);
    const o = (y * CR + x) * 4; d[o] = d[o + 1] = d[o + 2] = 255; d[o + 3] = v * 255;
  }
  caux.putImageData(cauD, 0, 0);
}

// ---------- soft light (no white-hot core)
function soft(c, col, x, y, r, a) {
  if (a <= 0.003 || r <= 0) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(0.3, rgba(col, a * 0.55)); g.addColorStop(0.6, rgba(col, a * 0.18)); g.addColorStop(1, rgba(col, 0));
  c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); c.restore();
}

// ---------- bubbles
function bubbleSprite() {
  const s = document.createElement('canvas'); s.width = s.height = 128; const g = s.getContext('2d');
  const h = 64, r = h * 0.78;
  const body = g.createRadialGradient(h, h, 0, h, h, r * 1.18);
  body.addColorStop(0, 'rgba(140,220,255,0.05)'); body.addColorStop(0.62, 'rgba(150,225,255,0.08)');
  body.addColorStop(0.78, 'rgba(175,235,255,0.45)'); body.addColorStop(0.84, 'rgba(225,248,255,0.88)');
  body.addColorStop(0.9, 'rgba(160,225,255,0.32)'); body.addColorStop(1, 'rgba(120,210,255,0)');
  g.fillStyle = body; g.beginPath(); g.arc(h, h, r * 1.18, 0, TAU); g.fill();
  // a warm reflection of the axolotl along the lower rim
  const warm = g.createRadialGradient(h + r * 0.25, h + r * 0.55, 0, h + r * 0.25, h + r * 0.55, r * 0.6);
  warm.addColorStop(0, 'rgba(255,140,160,0.38)'); warm.addColorStop(1, 'rgba(255,140,160,0)');
  g.globalCompositeOperation = 'lighter'; g.fillStyle = warm; g.beginPath(); g.arc(h, h, r * 0.98, 0, TAU); g.fill();
  // specular highlight
  g.save(); g.translate(h - r * 0.4, h - r * 0.42); g.rotate(-0.75); g.scale(1, 0.55);
  const sp = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.3);
  sp.addColorStop(0, 'rgba(255,255,255,0.9)'); sp.addColorStop(0.5, 'rgba(235,250,255,0.45)'); sp.addColorStop(1, 'rgba(200,240,255,0)');
  g.fillStyle = sp; g.beginPath(); g.arc(0, 0, r * 0.3, 0, TAU); g.fill(); g.restore();
  const sp2 = g.createRadialGradient(h + r * 0.42, h + r * 0.38, 0, h + r * 0.42, h + r * 0.38, r * 0.14);
  sp2.addColorStop(0, 'rgba(255,255,255,0.45)'); sp2.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sp2; g.beginPath(); g.arc(h + r * 0.42, h + r * 0.38, r * 0.14, 0, TAU); g.fill();
  return s;
}
// the big bubbles that drift past close to us: a clear aqua rim with a soft glow, a curved
// window highlight and a warm reflection (no grey haze inside)
function bigBubbleSprite() {
  const n = 256, s = document.createElement('canvas'); s.width = s.height = n; const g = s.getContext('2d');
  const h = n / 2, r = h * 0.78 * 0.84;          // rim radius, matching the small sprite's proportions
  g.globalCompositeOperation = 'lighter';
  g.filter = 'blur(5px)'; g.strokeStyle = 'rgba(70,200,255,0.55)'; g.lineWidth = 12; g.beginPath(); g.arc(h, h, r, 0, TAU); g.stroke();
  g.filter = 'none';
  const rim = g.createRadialGradient(h, h, r * 0.86, h, h, r * 1.05);
  rim.addColorStop(0, 'rgba(90,205,255,0)'); rim.addColorStop(0.55, 'rgba(110,215,255,0.55)');
  rim.addColorStop(0.8, 'rgba(150,232,255,0.95)'); rim.addColorStop(1, 'rgba(100,210,255,0)');
  g.fillStyle = rim; g.beginPath(); g.arc(h, h, r * 1.05, 0, TAU); g.fill();
  const inner = g.createRadialGradient(h, h, 0, h, h, r);
  inner.addColorStop(0, 'rgba(90,200,255,0.03)'); inner.addColorStop(0.8, 'rgba(90,200,255,0.06)'); inner.addColorStop(1, 'rgba(90,200,255,0.16)');
  g.fillStyle = inner; g.beginPath(); g.arc(h, h, r, 0, TAU); g.fill();
  // a warm reflection of the axolotl, low on the right
  g.save(); g.beginPath(); g.arc(h, h, r * 0.97, 0, TAU); g.clip();
  g.strokeStyle = 'rgba(255,130,155,0.6)'; g.lineWidth = 5; g.filter = 'blur(2px)';
  g.beginPath(); g.arc(h, h, r * 0.86, 0.25, 1.35); g.stroke(); g.restore(); g.filter = 'none';
  // window highlight: a short bright arc inside the upper-left rim, and a small dot
  g.strokeStyle = 'rgba(225,248,255,0.85)'; g.lineCap = 'round'; g.lineWidth = 7; g.filter = 'blur(1.5px)';
  g.beginPath(); g.arc(h, h, r * 0.74, Math.PI * 1.08, Math.PI * 1.42); g.stroke(); g.filter = 'none';
  const dt = g.createRadialGradient(h - r * 0.2, h - r * 0.64, 0, h - r * 0.2, h - r * 0.64, r * 0.09);
  dt.addColorStop(0, 'rgba(235,250,255,0.8)'); dt.addColorStop(1, 'rgba(200,240,255,0)');
  g.fillStyle = dt; g.beginPath(); g.arc(h - r * 0.2, h - r * 0.64, r * 0.09, 0, TAU); g.fill();
  return s;
}
const BUB = bubbleSprite(), BIG = bigBubbleSprite();
// size = outer diameter of the drawn bubble (its bright rim is ~0.84 of it)
function bubble(c, x, y, size, alpha, t, ph, img = BUB) {
  if (alpha <= 0.004 || size <= 0) return;
  const edge = 1 - smooth(400 - 0.45 * size, 470 - 0.6 * size, Math.hypot(x - C, y - C));   // the whole bubble stays inside
  if (edge <= 0) return;
  const q = 0.05 * Math.sin(t * 5.3 + ph);       // the surface tension wobble
  c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(1, alpha * edge);
  c.translate(x, y); c.rotate(0.3 * Math.sin(t * 1.3 + ph)); c.scale(size / 100 * (1 + q), size / 100 * (1 - q));
  c.drawImage(img, -64, -64, 128, 128); c.restore();
}

// ---------- the water: surface shimmer, shafts, small bubbles, motes; all inside r ~380
const WL = HG.layer(), BL = HG.layer(), RL = HG.layer(), CL = HG.layer();
const RAY_SRC = [C - 300, -700];
const RAYS = [[-0.30, 0.014, 0.0], [-0.17, 0.022, 1.7], [-0.06, 0.012, 3.1], [0.05, 0.026, 4.4], [0.16, 0.015, 5.6], [0.27, 0.02, 2.4], [0.36, 0.011, 0.9]];
const LANES = (() => {
  const R = HG.rng(606), out = [];
  for (let i = 0; i < 20; i++) out.push({ i, P: 6 + 5 * R(), off: R() * 20, size: 10 + 14 * Math.pow(R(), 1.6), ph: R() * TAU, wob: 6 + 10 * R(), wf: 0.6 + 0.6 * R() });
  return out;
})();
const MOTES = (() => { const R = HG.rng(66), o = []; for (let i = 0; i < 46; i++) o.push([R() * W, R() * 1000, 12 + 26 * R(), R() * TAU, 3 + 4 * R(), R() < 0.6]); return o; })();
function water(t, amb) {
  const c = WL.ctx; HG.reset(c); c.clearRect(0, 0, W, W);
  // the surface: caustic ripples in a band under the top of the circle
  {
    const b = BL.ctx; HG.reset(b); b.clearRect(0, 0, W, W);
    b.drawImage(CAU, -160, 130, 1400, 330);
    b.globalCompositeOperation = 'destination-in';
    const g = b.createLinearGradient(0, 130, 0, 440);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.3, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,0.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = g; b.fillRect(0, 0, W, W);
    b.globalCompositeOperation = 'source-in'; b.fillStyle = rgba(AQUA_S, 1); b.fillRect(0, 0, W, W);
    HG.reset(b);
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.62; c.drawImage(BL.cv, 0, 0);
    c.filter = 'blur(10px)'; c.globalAlpha = 0.6; c.drawImage(BL.cv, 0, 0); HG.reset(c);
  }
  // light shafts from the surface, each breathing on its own
  {
    const r = RL.ctx; HG.reset(r); r.clearRect(0, 0, W, W); r.globalCompositeOperation = 'lighter';
    const g = r.createLinearGradient(0, 120, 0, 920);
    g.addColorStop(0, rgba([140, 230, 255], 0)); g.addColorStop(0.14, rgba([140, 230, 255], 1));
    g.addColorStop(0.5, rgba([70, 195, 235], 0.4)); g.addColorStop(1, rgba([40, 160, 220], 0));
    r.fillStyle = g;
    const [sx, sy] = RAY_SRC, Lr = 1800;
    for (const [a0, hw, ph] of RAYS) {
      const a = a0 + 0.025 * Math.sin(t * 0.31 + ph), w = hw * (0.85 + 0.15 * Math.sin(t * 0.43 + ph * 1.3));
      r.globalAlpha = 0.25 + 0.75 * Math.pow(0.5 + 0.5 * Math.sin(t * 0.55 + ph * 1.9), 1.5);
      r.beginPath(); r.moveTo(sx, sy);
      r.lineTo(sx + Math.sin(a - w) * Lr, sy + Math.cos(a - w) * Lr); r.lineTo(sx + Math.sin(a + w) * Lr, sy + Math.cos(a + w) * Lr);
      r.closePath(); r.fill();
    }
    HG.reset(r);
    c.globalCompositeOperation = 'lighter'; c.filter = 'blur(9px)'; c.globalAlpha = 0.26; c.drawImage(RL.cv, 0, 0); HG.reset(c);
  }
  // small bubbles rising in lanes (every cycle re-seeds its lane) and a fine stream
  for (const Ln of LANES) {
    const z = (t + Ln.off) / Ln.P, cyc = Math.floor(z), s = z - cyc;
    const x0 = 170 + 740 * hash(Ln.i * 13 + 5, cyc), y = 990 - s * 920;
    const x = x0 + Ln.wob * Math.sin(TAU * Ln.wf * t + Ln.ph) + 18 * Math.sin(s * 3 + Ln.ph);
    bubble(c, x, y, Ln.size * (0.85 + 0.25 * s), 0.6 * smooth(0, 0.12, s) * (1 - smooth(0.8, 1, s)), t, Ln.ph);
  }
  {
    const EMIT = 0.42, now = Math.floor(t / EMIT);
    for (let j = now - 22; j <= now; j++) {
      const age = t - j * EMIT; if (age < 0) continue;
      const h = hash(j, 77), y = 785 - age * (95 + 25 * h);  // born above the title band
      if (y < 80) continue;
      const x = 760 - age * 7 + (4 + age * 3.5) * Math.sin(age * 3.1 + h * 6);
      bubble(c, x, y, 8 + 5 * h + age * 0.8, 0.5 * smooth(0, 0.5, age), t, h * 9);
    }
  }
  // drifting motes
  c.globalCompositeOperation = 'lighter';
  for (const [x0, ph, sp, tw, sz, aq] of MOTES) {
    const y = 1020 - ((ph + sp * t) % 1060), x = x0 + 16 * Math.sin(t * 0.6 + tw);
    HG.dot(c, aq ? [140, 225, 245] : [255, 150, 170], x, y, sz, 0.2 * (0.5 + 0.5 * Math.sin(t * 2.2 + tw)));
  }
  HG.reset(c);
  // vignette: everything in the water fades out between r 340 and 440, so the circle edge stays black
  c.globalCompositeOperation = 'destination-in';
  const v = c.createRadialGradient(C, C, 0, C, C, 440);
  v.addColorStop(0, 'rgba(0,0,0,1)'); v.addColorStop(340 / 440, 'rgba(0,0,0,1)'); v.addColorStop(395 / 440, 'rgba(0,0,0,0.4)'); v.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = v; c.fillRect(0, 0, W, W); HG.reset(c);
  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = amb; ctx.drawImage(WL.cv, 0, 0); HG.reset(ctx);
}
// ---------- the creature
function creature(t, amb) {
  const fa = fadeAt(t), dB = deepBody(t), ks = xf(t).s / 0.71;
  // a soft bloom around the skin (aqua in the deep, coral up close), then the skin itself
  ctx.save(); applyXf(ctx, t);
  ctx.globalCompositeOperation = 'lighter'; ctx.filter = 'blur(22px)'; ctx.globalAlpha = (0.3 + 0.3 * dB) * fa; ctx.drawImage(WK.S.c, 0, 0, 1024, 1024);
  ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = fa; ctx.drawImage(WK.P.c, 0, 0, 1024, 1024);
  ctx.restore(); HG.reset(ctx);
  // caustics playing over the skin (projected from the surface, so they slide as it floats)
  if (amb > 0) {
    const c = CL.ctx, CX = [-60, -80, 1200, 1200], a = amb * fa;
    // shade: the skin dims a little between the bright caustic lines, so the web reads
    HG.reset(c); c.clearRect(0, 0, W, W); c.fillStyle = 'rgb(226,206,212)'; c.fillRect(0, 0, W, W);
    c.filter = 'blur(4px)'; c.drawImage(CAU, ...CX); c.drawImage(CAU, ...CX); c.filter = 'none';
    c.globalCompositeOperation = 'destination-in'; c.save(); applyXf(c, t); c.drawImage(WK.S.c, 0, 0, 1024, 1024); c.restore();
    HG.reset(c);
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = a; ctx.drawImage(CL.cv, 0, 0); HG.reset(ctx);
    // light: soft aqua-white caustic lines added on the skin
    HG.reset(c); c.clearRect(0, 0, W, W);
    c.filter = 'blur(2.5px)'; c.drawImage(CAU, ...CX); c.filter = 'none';
    c.globalCompositeOperation = 'source-in'; c.fillStyle = 'rgb(150,228,255)'; c.fillRect(0, 0, W, W);
    c.globalCompositeOperation = 'destination-in'; c.save(); applyXf(c, t); c.drawImage(WK.S.c, 0, 0, 1024, 1024); c.restore();
    HG.reset(c);
    ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.32 * a; ctx.drawImage(CL.cv, 0, 0); HG.reset(ctx);
  }
  // light running up the gill fronds: soft saturated bloom only, so the cores stay coral
  ctx.save(); applyXf(ctx, t); ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(16px)'; ctx.globalAlpha = 0.95 * fa; ctx.drawImage(WK.K.c, 0, 0, 1024, 1024);
  ctx.filter = 'blur(6px)'; ctx.globalAlpha = 0.45 * fa; ctx.drawImage(WK.K.c, 0, 0, 1024, 1024);
  ctx.restore(); HG.reset(ctx);
  // a glint at each frond tip as a pulse arrives
  for (let f = 0; f < 6; f++) for (const [fp, fpa] of pulseFronts(f, t)) {
    const g = fpa * bell(fp - 1.05, 0.16) * fa;
    if (g > 0.01) { const p = toCanvas(FRONDS[f].b, t); soft(ctx, [255, 100, 140], p[0], p[1], 46 * ks, 0.42 * g); soft(ctx, [255, 170, 190], p[0], p[1], 12 * ks, 0.3 * g); }
  }
  // catch-lights in the eyes, once it is out of the deep
  const ea = sm((0.55 - dB) / 0.4) * fa;
  if (ea > 0.01) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const [ex, ey, k] of EYES) {
      const p = toCanvas([ex - 6 * k, ey - 7 * k], t), q = toCanvas([ex + 5 * k, ey + 6 * k], t), tw = (0.85 + 0.15 * Math.sin(t * 2.1 + ex)) * ea, kk = k * ks;
      HG.dot(ctx, [200, 240, 255], p[0], p[1], 14 * kk, 0.35 * tw);
      ctx.globalAlpha = 0.85 * tw; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], 3.3 * kk, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.45 * tw; ctx.beginPath(); ctx.arc(q[0], q[1], 1.6 * kk, 0, TAU); ctx.fill();
    }
    ctx.restore(); HG.reset(ctx);
  }
}

// ---------- bubbles shed by the creature: a few while it swims up, a trail as it dives away
const SHED = (() => {
  const o = [];
  for (let j = 0; j < 8; j++) o.push({ te: 0.55 + j * 0.2, j, a: 0.55 });
  for (let j = 0; j < 44; j++) o.push({ te: 9.15 + j * 0.05 + 0.025 * hash(j, 1), j: j + 50, a: 1 });
  return o;
})();
const SHED_SRC = [[300, 300], MOUTH, [560, 330], [215, 360], [300, 300], [600, 420]];   // gill bases and the smile
function shed(t) {
  const fade = 1 - smooth(11.5, 11.95, t);
  for (const { te, j, a } of SHED) {
    const age = t - te; if (age < 0) continue;
    const h1 = hash(j, 21), h2 = hash(j, 22), h3 = hash(j, 23), life = 1.5 + 0.7 * h3;
    if (age > life) continue;
    const src = SHED_SRC[j % SHED_SRC.length], ks = xf(te).s / 0.71;
    const o = toCanvas([src[0] + (h1 - 0.5) * 40, src[1] + (h2 - 0.5) * 30], te);
    const x = o[0] + (h1 - 0.5) * 40 * age + (4 + 7 * age) * Math.sin(age * 4.2 + h3 * 6);
    const y = o[1] - (140 + 80 * h2) * age - 45 * age * age;
    const size = (16 + 20 * h3 * h3) * (0.45 + 0.55 * ks) * (0.55 + 0.45 * smooth(0, 0.3, age));
    bubble(ctx, x, y, size, a * smooth(0, 0.1, age) * (1 - smooth(life - 0.5, life, age)) * fade, t, h1 * 9);
  }
}

// ---------- the float: a trio of bubbles from the smile, big bubbles passing in front
function trio(t) {
  for (const [te, sz, ph] of [[5.6, 25, 0.3], [6.0, 30, 1.9], [6.5, 34, 3.6]]) {
    const age = t - te; if (age < 0 || age > 3.0) continue;
    const m = toCanvas(MOUTH, te);
    const x = m[0] - 58 * ease.out3(age / 0.9) - 9 * age + 5 * Math.sin(age * 3.4 + ph);
    const y = m[1] - 2 - 58 * age - 18 * age * age;
    bubble(ctx, x, y, sz * (0.45 + 0.55 * ease.out3(age / 0.35)), 0.95 * smooth(0, 0.18, age) * (1 - smooth(2.1, 3.0, age)), t, ph);
  }
}
// one rises behind the axolotl (so its rim never turns white over the skin), one passes in front
function bigBubbles(t, front) {
  // [t0, dur, x0, x1, y0, size, alpha, phase, front]; the back bubble is born above the title band (y<800) and swells in
  for (const [t0, dur, x0, x1, y0, size, a, ph, fr] of [[4.6, 4.0, 706, 650, 740, 128, 0.9, 0.7, false], [5.8, 4.8, 222, 186, 990, 104, 0.9, 2.9, true]]) {
    const k = (t - t0) / dur; if (fr !== front || k <= 0 || k >= 1) continue;
    const x = lerp(x0, x1, k) + 14 * Math.sin(t * 0.9 + ph), y = lerp(y0, 130, k);
    const grow = y0 < 900 ? 0.55 + 0.45 * ease.out3(Math.min(1, k / 0.18)) : 1;
    bubble(ctx, x, y, size * grow, a * smooth(0, y0 < 900 ? 0.16 : 0.1, k), t, ph, BIG);
  }
}

HG.start({
  duration: 12,
  assets: { photo: '../assets/06-ajolote.png' },
  render(t, A) {
    if (!WK) buildWork(A);
    const amb = ambient(t);
    if (amb > 0 || fadeAt(t) > 0) caustics(t);
    if (amb > 0) water(t, amb);
    bigBubbles(t, false);
    if (fadeAt(t) > 0) { animate(t); creature(t, amb); }
    shed(t);
    trio(t);
    bigBubbles(t, true);
  },
});
</script></body></html>
