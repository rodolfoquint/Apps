<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Día de Muertos: cempasúchil petals spiral in on a warm vortex from beyond the rim. Some
// drain into a single point of candle light; the rest settle into a slowly turning wreath.
// From that light La Catrina is drawn in white and marigold line art, then candle light
// spreads over her (an amber wash leads, true colour follows) and she glows, breathing,
// lit by a soft flicker. One slow golden sheen crosses her; then the marigolds on her hat
// glow like candles and let go of a handful of petals. The wreath lets go petal by petal
// and they drift down around her. At the end the colour recedes into the drawing, the
// drawing folds into the light, the petals spiral back into it (the opening in reverse),
// and the light becomes a small candle flame that goes out.
// Assets: prepare.py on out/images/catrina-3.png and out-show/images/cempasuchil-1.png,
// then derive scripts (photo knee, warm grade, designed line art, marigold glow, petal sprites).
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const TAU = Math.PI * 2;
const AS = '../assets/11-dia-de-muertos-';
const sine = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
const inOut2 = x => { x = clamp(x); return x < 0.5 ? 2 * x * x : 1 - 2 * (1 - x) * (1 - x); };

// ---------- La Catrina: geometry and gentle motion (asset px of the 1024 cut-out)
const SIZE = 920, SC = SIZE / 1024;
const FACE = [495, 445];           // on the brow, just above the eyes: where the light lives
const PIVOT = [512, 1000];         // she sways from the base of the collar
const flick = t => 0.5 * Math.sin(TAU * 1.13 * t + 0.4) + 0.3 * Math.sin(TAU * 2.31 * t + 1.9) + 0.2 * Math.sin(TAU * 3.7 * t + 2.7);
function pose(t) {
  const life = smooth(3.5, 6.5, t);
  const s = SC * (0.985 + 0.015 * ease.inOut3((t - 3) / 7) + 0.006 * Math.sin(TAU * t / 4.2 - 1.2) * life);
  const r = 0.012 * Math.sin(TAU * t / 6.4 - 0.7) * life;
  return { s, r, x: C, y: C + 14 - 4 * Math.sin(TAU * t / 4.2 - 1.2) * life };
}
// canvas position of an asset point
function at(p, t) {
  const f = pose(t);
  const dx = (p[0] - PIVOT[0]) * f.s, dy = (p[1] - PIVOT[1]) * f.s;
  const px = f.x + (PIVOT[0] - 512) * f.s, py = f.y + (PIVOT[1] - 512) * f.s;
  return [px + dx * Math.cos(f.r) - dy * Math.sin(f.r), py + dx * Math.sin(f.r) + dy * Math.cos(f.r)];
}
function applyPose(c, t) {
  const f = pose(t);
  c.translate(f.x + (PIVOT[0] - 512) * f.s, f.y + (PIVOT[1] - 512) * f.s);
  c.rotate(f.r); c.scale(f.s, f.s); c.translate(-PIVOT[0], -PIVOT[1]);
}
const centreAt = t => at([512, 512], t);
// the marigolds on her hat and at her ears (asset px), where the petal burst comes from
const FLOWERS = [[262, 276], [362, 220], [437, 231], [492, 167], [557, 250], [667, 247], [668, 301], [782, 337], [342, 450], [678, 462]];

// ---------- timeline
const T_CORE = 1.9;                                          // the drained petals become one light
const RMAX = 830;                                            // a wash this wide covers all of her (she reaches ~525 px from FACE; feather 300)
const lineK = t => t < 8 ? ease.out3((t - 1.95) / 2.7) : 1 - inOut2((t - 9.6) / 1.0);
const lineA = t => 1 - 0.8 * smooth(4.4, 5.8, t) + 0.65 * smooth(8.9, 9.6, t) - 0.5 * smooth(9.75, 10.3, t);
// the amber wash recedes so that its light falls off evenly in time instead of dropping all at once
// through her bright middle: wash radius (px) at which 0, 5, .. 100 % of the amber's light is still shown
// (computed from the warm asset with the 260 px feather)
const RB = [0, 162, 235, 280, 309, 334, 357, 377, 396, 415, 432, 450, 468, 485, 504, 524, 545, 569, 598, 637, RMAX];
const rhoOfB = b => { const x = clamp(b) * 20, i = Math.min(19, Math.floor(x)); return lerp(RB[i], RB[i + 1], x - i); };
const rhoW = t => t < 8 ? lerp(40, RMAX, inOut2((t - 3.35) / 2.1)) : rhoOfB(1 - smooth(8.95, 10.5, t));
const rhoP = t => t < 8 ? lerp(0, RMAX, inOut2((t - 3.85) / 2.1)) : lerp(RMAX, 0, sine((t - 8.8) / 1.25));
const coreA = t => smooth(0.7, T_CORE + 0.1, t) * (1 - smooth(2.3, 4.0, t));
const glowLife = t => smooth(4.2, 6.2, t) * (1 - smooth(8.9, 10.3, t));   // candle wash and aura
const petalOut = t => 1 - smooth(11.0, 11.75, t);
const OMEGA = 0.2;                                             // the wreath turns clockwise, rad/s
const SWEEP0 = 6.0, SWEEP_D = 1.7;                             // golden sheen
const T_BURST = 7.95;                                          // the hat marigolds glow and let go of petals
const bloomEnv = t => smooth(7.6, 8.05, t) * (1 - smooth(8.2, 9.0, t));

// ---------- petals (all parameters fixed up front; positions are pure functions of t)
const SW = 96, SH = 128, NSPR = 6;
const R = HG.rng(1102);
const HALO = [], DRAIN = [], RAIN = [], NEAR = [], BURST = [];
for (let i = 0; i < 200; i++) {
  const flor = i < 8, inner = R() < 0.16, z = R();
  // a designed wreath: most petals in a narrow band at r 430..468, a sparse few inside it
  const rt = inner ? 340 + R() * 70 : 449 + 19 * (R() + R() - 1);
  HALO.push({
    a0: R() * TAU, r0: 640 + R() * 320, rt, d: 0.05 + R() * 1.75, dur: 2.2 + R() * 0.9,
    spin: 1.7 + R() * 1.6, z, s: flor ? 40 + R() * 14 : lerp(13, 34, z), img: Math.floor(R() * NSPR), flor,
    rot0: R() * TAU, rs: (R() - 0.5) * 2.6, fs: 1.0 + R() * 2.2, fph: R() * TAU, front: flor ? R() < 0.5 : z > 0.5,
    tr: 5.4 + R() * 3.8, vt: 60 + R() * 70, fa: 16 + R() * 30, ff: 0.3 + R() * 0.4, fp: R() * TAU, bph: R() * TAU,
  });
}
for (let i = 0; i < 90; i++) {
  DRAIN.push({
    a0: R() * TAU, r0: 600 + R() * 300, d: 0.1 + R() * 0.95, dur: 1.2 + R() * 0.7, s: 18 + R() * 16, img: Math.floor(R() * NSPR),
    rot0: R() * TAU, rs: (R() - 0.5) * 4, fs: 2 + R() * 3, fph: R() * TAU, sw: 1.4 + R() * 1.4,
  });
}
for (let i = 0; i < 60; i++) {
  const z = R();
  RAIN.push({
    x0: 110 + R() * 860, ts: 3.6 + R() * 6.2, vt: lerp(55, 115, z), z, s: lerp(14, 36, z), img: Math.floor(R() * NSPR),
    rot0: R() * TAU, rs: (R() - 0.5) * 2.2, fs: 1 + R() * 2, fph: R() * TAU, fa: 20 + R() * 35, ff: 0.25 + R() * 0.35, fp: R() * TAU,
    front: z > 0.5, flor: R() < 0.05,
  });
}
// a few large petals drifting past close to the lens, only in the side margins, quickly
for (let i = 0; i < 3; i++) {
  const side = i % 2 ? -1 : 1;
  NEAR.push({
    x0: C + side * (428 + R() * 14), ts: 4.9 + i * 1.45 + R() * 0.3, vt: 250 + R() * 40, s: 56 + R() * 16, img: Math.floor(R() * NSPR),
    rot0: R() * TAU, rs: (R() - 0.5) * 1.6, fs: 1.2 + R() * 0.9, fph: R() * TAU, fa: 10 + R() * 8, ff: 0.3 + R() * 0.2, fp: R() * TAU,
  });
}
// the burst: petals let go by the hat marigolds, thrown up and out, then joining the fall
for (let i = 0; i < 26; i++) {
  const f = FLOWERS[i % FLOWERS.length], out = f[0] < 512 ? -1 : 1;
  const a = -Math.PI / 2 + out * (0.25 + R() * 0.75) + (R() - 0.5) * 0.5, v = 110 + R() * 150;
  BURST.push({
    f, t0: T_BURST + R() * 0.3, vx: Math.cos(a) * v, vy: Math.sin(a) * v, T0: 0.55 + R() * 0.3, vt: 55 + R() * 45,
    s: 18 + R() * 14, img: Math.floor(R() * NSPR), rot0: R() * TAU, rs: (R() - 0.5) * 3, fs: 1.5 + R() * 2.5, fph: R() * TAU,
    fa: 12 + R() * 22, ff: 0.3 + R() * 0.35, fp: R() * TAU, front: true, z: 0.8,
  });
}

// the finale: every petal still in view is drawn back into the light on a clockwise spiral
const RG = HG.rng(2207);
for (const p of HALO.concat(RAIN, BURST)) { p.g0 = 9.85 + RG() * 0.5; p.gd = 1.0 + RG() * 0.25; p.gs = 1.5 + RG() * 1.1; }
function gathered(p, base, t) {
  const st = base(p, t);
  if (!st || t < p.g0) return st;
  const s0 = base(p, p.g0);
  if (!s0 || Math.hypot(s0.x - C, s0.y - C) > 600) return null;   // already gone below the rim
  const w = ease.inOut3((t - p.g0) / p.gd);
  const [gx, gy] = at(FACE, t);
  const dx = st.x - gx, dy = st.y - gy, rr = Math.hypot(dx, dy) * (1 - w), th = Math.atan2(dy, dx) + p.gs * w;
  return { x: gx + Math.cos(th) * rr, y: gy + Math.sin(th) * rr, a: st.a, f: st.f, al: st.al * (1 - smooth(0.68, 1, w)), sc: (st.sc ?? 1) * (1 - 0.6 * w) };
}
const haloG = (p, t) => gathered(p, haloAt, t), rainG = (p, t) => gathered(p, fallAt, t), burstG = (p, t) => gathered(p, burstAt, t);

// wreath petal state at time t: x, y, angle, flip, alpha
function haloAt(p, t) {
  const k = (t - p.d) / p.dur;
  if (k <= 0) return null;
  const polar = tt => {
    const ke = ease.out3((tt - p.d) / p.dur);
    const r = lerp(p.r0, p.rt, ke) + 7 * Math.sin(0.8 * tt + p.bph) * ke;
    const th = p.a0 + OMEGA * tt + p.spin * ke;
    return [C + Math.cos(th) * r, C + Math.sin(th) * r, th, r];
  };
  let x, y;
  if (t < p.tr) { [x, y] = polar(t); }
  else {
    // let go: keep the orbital velocity, drag settles it into a slow fall with flutter
    const [x0, y0, th, r] = polar(p.tr), tau = t - p.tr, T0 = 1.2;
    const e = T0 * (1 - Math.exp(-tau / T0)), v = OMEGA * r;
    const ramp = Math.pow(1 - Math.exp(-tau / 0.9), 2);
    x = x0 - Math.sin(th) * v * e + p.fa * ramp * Math.sin(TAU * p.ff * tau + p.fp) - p.fa * ramp * Math.sin(p.fp);
    y = y0 + Math.cos(th) * v * e + p.vt * (tau - e);
  }
  return { x, y, a: p.rot0 + p.rs * t, f: Math.cos(p.fs * t + p.fph), al: clamp(k * 2.5) };
}
function drainAt(p, t) {
  const k = (t - p.d) / p.dur;
  if (k <= 0 || k >= 1) return null;
  const [fx, fy] = at(FACE, T_CORE);
  const r = p.r0 * Math.pow(1 - k, 1.45);
  const th = p.a0 + OMEGA * t + p.sw * (k + 1.8 * k * k * k);
  return { x: fx + Math.cos(th) * r, y: fy + Math.sin(th) * r, a: p.rot0 + p.rs * t, f: Math.cos(p.fs * t + p.fph),
    al: clamp(k * 3) * (1 - smooth(0.72, 1, k)), sc: 0.35 + 0.65 * Math.sqrt(1 - k) };
}
function fallAt(p, t) {
  const tau = t - p.ts;
  if (tau < 0) return null;
  const y = -70 + p.vt * tau;
  if (y > W + 80) return null;
  return { x: p.x0 + p.fa * Math.sin(TAU * p.ff * tau + p.fp), y, a: p.rot0 + p.rs * t, f: Math.cos(p.fs * t + p.fph), al: 1 };
}
function burstAt(p, t) {
  const tau = t - p.t0;
  if (tau <= 0) return null;
  const [ox, oy] = at(p.f, p.t0);
  const e = p.T0 * (1 - Math.exp(-tau / p.T0));
  const ramp = smooth(0.3, 1.6, tau);
  const y = oy + p.vy * e + p.vt * (tau - e);
  if (y > W + 80) return null;
  return { x: ox + p.vx * e + p.fa * ramp * Math.sin(TAU * p.ff * tau + p.fp), y, a: p.rot0 + p.rs * t, f: Math.cos(p.fs * t + p.fph),
    al: smooth(0, 0.22, tau), sc: 0.35 + 0.65 * smooth(0, 0.45, tau) };
}

// draw one petal (or a whole small blossom) onto c
function petal(c, A, s, p, size, a) {
  if (!s || a <= 0.01) return;
  if (p.flor) {
    const ca = Math.cos(s.a * 0.3), sa = Math.sin(s.a * 0.3), sq = 0.82 + 0.18 * Math.abs(s.f);
    c.setTransform(ca, sa, -sa * sq, ca * sq, s.x, s.y);
    c.globalAlpha = a;
    c.drawImage(A.flor, -size / 2, -size / 2, size, size);
  } else {
    const ca = Math.cos(s.a), sa = Math.sin(s.a), f = s.f;
    c.setTransform(ca, sa, -sa * f, ca * f, s.x, s.y);
    c.globalAlpha = a * (f < 0 ? 0.78 : 1);
    c.drawImage(A.petals, p.img * SW, 0, SW, SH, -size * 0.375, -size * 0.5, size * 0.75, size);
  }
  c.setTransform(1, 0, 0, 1, 0, 0);
}
// depth: far petals are smaller and dimmer (and go on the softened back layer)
const depthA = p => p.z === undefined ? 1 : lerp(0.5, 1, p.z);

// a tapered ribbon of light along the path a petal just travelled, filled as ONE polygon
// (no per-segment caps, so no bright beads at the joints); bright only while it moves fast
function trail(c, fn, p, t, a, col, width, J = 12) {
  const h = 0.028;
  const pts = [];
  for (let j = 0; j <= J; j++) { const s = fn(p, t - j * h); if (!s) break; pts.push(s); }
  const n = pts.length;
  if (n < 3) return;
  const v = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) / h;
  const k = smooth(110, 520, v) * a;
  if (k < 0.01) return;
  const L = [], Rr = [];
  for (let j = 0; j < n; j++) {
    const a_ = pts[Math.max(0, j - 1)], b_ = pts[Math.min(n - 1, j + 1)];
    let tx = a_.x - b_.x, ty = a_.y - b_.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const hw = 0.5 * width * (1 - 0.85 * j / J);
    L.push([pts[j].x - ty * hw, pts[j].y + tx * hw]); Rr.push([pts[j].x + ty * hw, pts[j].y - tx * hw]);
  }
  const head = pts[0], tail = pts[n - 1];
  const g = c.createLinearGradient(head.x, head.y, tail.x, tail.y);
  const span = (n - 1) / J;                       // a trail cut short keeps the same fade per length
  g.addColorStop(0, rgba(col, k));
  g.addColorStop(Math.min(1, 0.3 / span), rgba(col, k * 0.55));
  g.addColorStop(Math.min(1, 0.65 / span), rgba(col, k * 0.16));
  g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.globalAlpha = 1;
  c.beginPath(); c.moveTo(L[0][0], L[0][1]);
  for (let j = 1; j < n; j++) c.lineTo(L[j][0], L[j][1]);
  for (let j = n - 1; j >= 0; j--) c.lineTo(Rr[j][0], Rr[j][1]);
  c.closePath(); c.fill();
}

// ---------- light helpers
function glow(c, x, y, r, col, a, core = 0.0) {
  if (a <= 0.003 || r <= 0) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(0.2 + core, rgba(col, a * 0.55)); g.addColorStop(0.5, rgba(col, a * 0.16)); g.addColorStop(1, rgba(col, 0));
  c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r); c.restore();
}
function radialMask(c, x, y, rho, feather) {
  if (rho >= RMAX - 1) return;
  c.globalCompositeOperation = 'destination-in';
  const g = c.createRadialGradient(x, y, 0, x, y, Math.max(1, rho));
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(clamp(1 - feather / Math.max(1, rho)), 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, W);
  c.globalCompositeOperation = 'source-over';
}
// a layer composited with a soft additive bloom under it
function composite(L, { alpha = 1, bloom = 0.4, blur = 10, op = 'source-over', soft = 0 } = {}) {
  HG.reset(ctx);
  if (bloom > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = bloom; ctx.filter = `blur(${blur}px)`; ctx.drawImage(L.cv, 0, 0); ctx.filter = 'none'; }
  ctx.globalCompositeOperation = op; ctx.globalAlpha = alpha; if (soft > 0) ctx.filter = `blur(${soft}px)`;
  ctx.drawImage(L.cv, 0, 0);
  HG.reset(ctx);
}
// a small candle flame, base of the bulb at (x, y), height h
function flame(c, x, y, h, a, t) {
  if (a <= 0.003 || h <= 0.5) return;
  const sway = 0.07 * flick(1.6 * t + 3), H = h * (1 + 0.05 * Math.sin(TAU * 2.7 * t) + 0.03 * Math.sin(TAU * 4.3 * t + 1));
  glow(c, x, y - 0.32 * h, 5.5 * h, [255, 120, 30], 0.32 * a);
  glow(c, x, y - 0.32 * h, 1.9 * h, [255, 176, 90], 0.42 * a);
  c.save(); c.globalCompositeOperation = 'lighter'; c.translate(x, y); c.transform(1, 0, -sway, 1, 0, 0);
  c.filter = 'blur(1.2px)';
  const g = c.createRadialGradient(0, -0.27 * h, 0, 0, -0.32 * h, 0.85 * H);
  g.addColorStop(0, `rgba(255,244,222,${a})`); g.addColorStop(0.22, `rgba(255,214,140,${a})`);
  g.addColorStop(0.55, `rgba(255,140,40,${0.85 * a})`); g.addColorStop(1, 'rgba(255,90,20,0)');
  c.fillStyle = g;
  c.beginPath(); c.moveTo(0, -H);
  c.bezierCurveTo(0.2 * h, -0.62 * H, 0.36 * h, -0.2 * h, 0.28 * h, -0.12 * h);
  c.bezierCurveTo(0.2 * h, 0.04 * h, -0.2 * h, 0.04 * h, -0.28 * h, -0.12 * h);
  c.bezierCurveTo(-0.36 * h, -0.2 * h, -0.2 * h, -0.62 * H, 0, -H);
  c.fill(); c.restore();
}

const LB = HG.layer(), LF = HG.layer(), LN = HG.layer(), LW = HG.layer(), LP = HG.layer(), LT = HG.layer();

HG.start({
  duration: 12,
  assets: { photo: AS + 'catrina_photo.png', warm: AS + 'catrina_warm.png', lines: AS + 'catrina_lines3.png', mglow: AS + 'catrina_mglow.png',
    petals: AS + 'petals.png', flor: AS + 'flor_s.png' },
  render(t, A) {
    const fl = flick(t), pout = petalOut(t);
    const [fx, fy] = at(FACE, t), [cx, cy] = centreAt(t), f = pose(t);
    const closing = t > 9.6;                     // the return spiral draws half as many trails

    // ---- aura of candle light behind her
    const gl = glowLife(t);
    glow(ctx, cx, cy - 40, 560, [255, 105, 20], gl * (0.16 + 0.025 * fl));
    glow(ctx, fx, fy, 300, [255, 150, 60], gl * (0.10 + 0.02 * fl));

    // ---- petals: far ones on the back layer (behind her, softened), near ones in front
    const lb = LB.ctx, lf = LF.ctx; HG.reset(lb); lb.clearRect(0, 0, W, W); HG.reset(lf); lf.clearRect(0, 0, W, W);
    for (const p of HALO) {
      const st = haloG(p, t); if (!st) continue;
      petal(p.front ? lf : lb, A, st, p, p.s * (st.sc ?? 1), st.al * pout * depthA(p));
    }
    for (const p of RAIN) {
      const st = rainG(p, t); if (!st) continue;
      petal(p.front ? lf : lb, A, st, p, p.s * (st.sc ?? 1), st.al * pout * depthA(p));
    }
    composite(LB, { bloom: 0.4, blur: 9, alpha: 0.85, soft: 1.4 });

    // ---- the vortex: light trails of the petals winding in (and, at the end, back out of view into the light)
    if (t < 5.2 || closing) {
      const lt = LT.ctx; HG.reset(lt); lt.clearRect(0, 0, W, W); lt.globalCompositeOperation = 'lighter';
      const tc = [[255, 150, 40], [255, 196, 110]];
      const fin = closing ? 0.7 : 1, J = closing ? 10 : 12;
      HALO.forEach((p, i) => { if (!closing || i % 2 === 0) trail(lt, haloG, p, t, fin * (p.front ? 0.5 : 0.32), tc[i & 1], 3.2, J); });
      RAIN.forEach((p, i) => { if (!closing || i % 2 === 0) trail(lt, rainG, p, t, fin * (p.front ? 0.5 : 0.32), tc[i & 1], 3.2, J); });
      if (closing) BURST.forEach((p, i) => { if (i % 2 === 0) trail(lt, burstG, p, t, fin * 0.45, tc[i & 1], 3.0, J); });
      if (t < 5.2) DRAIN.forEach((p, i) => trail(lt, drainAt, p, t, 0.55, tc[(i + 1) & 1], 2.6));
      HG.reset(lt);
      composite(LT, { bloom: 0.9, blur: 6, op: 'lighter' });
    }

    // ---- La Catrina: amber candle wash leads, true colour follows
    const showP = rhoW(t) > 2 && t > 3.2;
    if (showP) {
      const lw = LW.ctx, lp = LP.ctx;
      HG.reset(lw); lw.clearRect(0, 0, W, W); applyPose(lw, t); lw.drawImage(A.warm, 0, 0, 1024, 1024); HG.reset(lw);
      radialMask(lw, fx, fy, rhoW(t), 260);
      const rp = rhoP(t);
      if (rp > 2) {
        HG.reset(lp); lp.clearRect(0, 0, W, W); applyPose(lp, t); lp.drawImage(A.photo, 0, 0, 1024, 1024); HG.reset(lp);
        radialMask(lp, fx, fy, rp, 300);
        lw.drawImage(LP.cv, 0, 0);
      }
      composite(LW, { bloom: 0.2 + 0.04 * fl, blur: 16 });

      // flickering candle light over her: screen, so it warms the darks and never clips the lace
      const wash = gl * (0.16 + 0.07 * fl);
      if (wash > 0.004) {
        HG.reset(lw); lw.clearRect(0, 0, W, W); applyPose(lw, t); lw.drawImage(A.warm, 0, 0, 1024, 1024); HG.reset(lw);
        lw.globalCompositeOperation = 'destination-in';
        const g = lw.createRadialGradient(fx, fy + 120, 40, fx, fy + 120, 620);
        g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0.25)');
        lw.fillStyle = g; lw.fillRect(0, 0, W, W); HG.reset(lw);
        HG.reset(ctx); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = wash; ctx.drawImage(LW.cv, 0, 0); HG.reset(ctx);
      }

      // one slow golden sheen across her, once she is fully lit (screen: a clear beat, no clipping)
      const sw = (t - SWEEP0) / SWEEP_D;
      if (sw > 0 && sw < 1) {
        const pos = lerp(20, 1440, sine(sw)), ux = 0.88, uy = 0.47, hw = 120;
        HG.reset(lp); lp.clearRect(0, 0, W, W);
        const g = lp.createLinearGradient((pos - hw) * ux, (pos - hw) * uy, (pos + hw) * ux, (pos + hw) * uy);
        g.addColorStop(0, 'rgba(255,206,140,0)'); g.addColorStop(0.5, 'rgba(255,222,170,1)'); g.addColorStop(1, 'rgba(255,206,140,0)');
        lp.fillStyle = g; lp.fillRect(0, 0, W, W);
        lp.globalCompositeOperation = 'destination-in'; applyPose(lp, t); lp.drawImage(A.photo, 0, 0, 1024, 1024); HG.reset(lp);
        HG.reset(ctx); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.42 * Math.sin(Math.PI * sw); ctx.drawImage(LP.cv, 0, 0);
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.07 * Math.sin(Math.PI * sw); ctx.filter = 'blur(10px)'; ctx.drawImage(LP.cv, 0, 0); HG.reset(ctx);
      }

      // the hat marigolds glow like candles, just before they let go of their petals
      const be = bloomEnv(t) * (0.85 + 0.15 * fl);
      if (be > 0.004) {
        HG.reset(lp); lp.clearRect(0, 0, W, W); applyPose(lp, t); lp.drawImage(A.mglow, 0, 0, 1024, 1024); HG.reset(lp);
        HG.reset(ctx);
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.42 * be; ctx.filter = 'blur(16px)'; ctx.drawImage(LP.cv, 0, 0); ctx.filter = 'none';
        ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.16 * be; ctx.drawImage(LP.cv, 0, 0);
        HG.reset(ctx);
        for (let i = 0; i < 8; i++) {      // a soft glint on each hat flower as it lets go
          const [gx, gy] = at(FLOWERS[i], t), k = smooth(T_BURST - 0.15, T_BURST + 0.05, t) * (1 - smooth(T_BURST + 0.1, T_BURST + 0.7, t));
          glow(ctx, gx, gy, 70, [255, 190, 110], 0.28 * k);
        }
      }
    }

    // ---- line art, drawn from the light outward (and folded back at the end)
    const k = lineK(t);
    if (k > 0) HG.lineReveal(A.lines, cx, cy, SIZE * f.s / SC, k, { rotation: f.r, color: [255, 176, 90], cx: fx, cy: fy, feather: 130,
      alpha: lineA(t) * (0.92 + 0.08 * fl * gl) });

    // ---- the single light the petals drain into
    const ca = coreA(t);
    if (ca > 0) {
      const breathe = 1 + 0.08 * Math.sin(TAU * t * 1.4);
      glow(ctx, fx, fy, 260 * breathe, [255, 120, 30], ca * 0.55);
      glow(ctx, fx, fy, 90 * breathe, [255, 190, 110], ca * 0.75);
      glow(ctx, fx, fy, 28, [255, 236, 200], ca * 0.8);
    }

    // ---- petals in front: wreath front half, rain, the burst, and the drain into the light
    for (const p of BURST) { const st = burstG(p, t); if (st) petal(lf, A, st, p, p.s * st.sc, st.al * pout); }
    for (const p of DRAIN) { const st = drainAt(p, t); if (st) petal(lf, A, st, p, p.s * st.sc, st.al); }
    composite(LF, { bloom: 0.5, blur: 9 });

    // ---- embers rising from the candles below
    const eA = smooth(4.5, 6.5, t) * (1 - smooth(9.6, 10.6, t));
    if (eA > 0) {
      const Re = HG.rng(77);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 46; i++) {
        // every random value is drawn before any skip, so each ember keeps its own path
        const x0 = C + (Re() - 0.5) * 760, sp = 26 + Re() * 34, ph = Re() * 50, s = 5 + Re() * 6, tw = Re() * TAU, col = Re() < 0.5 ? [255, 170, 60] : [255, 120, 30];
        const y = W - ((ph * 20 + sp * t) % 760) - 40, x = x0 + 22 * Math.sin(t * 0.8 + tw);
        const life = Math.sin(Math.PI * clamp((W - 40 - y) / 760));
        if (Math.hypot(x - C, y - C) > 500) continue;
        HG.dot(ctx, col, x, y, s, eA * life * (0.45 + 0.25 * Math.sin(t * 2.2 + tw)));
      }
      ctx.restore();
    }

    // ---- the finale: the gathered light becomes a small candle flame, then goes out
    // as the last of her amber shrinks into the brow it hands over to a soft light the petals spiral into
    const hand = smooth(9.95, 10.4, t) * (1 - smooth(10.75, 11.1, t));
    if (hand > 0) { glow(ctx, fx, fy, 230, [255, 120, 30], 0.32 * hand); glow(ctx, fx, fy, 70, [255, 190, 120], 0.38 * hand); }
    const fa = smooth(10.55, 11.0, t) * (1 - smooth(11.45, 11.85, t));
    if (fa > 0) {
      const settle = smooth(10.85, 11.25, t);                 // a round light that draws up into a flame
      const out = smooth(11.45, 11.85, t);
      glow(ctx, fx, fy, lerp(200, 120, settle) * (1 + 0.06 * fl), [255, 120, 30], fa * lerp(0.5, 0.18, settle));
      glow(ctx, fx, fy, 60, [255, 200, 130], fa * 0.6 * (1 - settle));
      flame(ctx, fx, fy + 18, 52 * settle * (1 - 0.55 * out), fa * settle, t);
    }

    // ---- a few large petals drifting past close to the lens (defocused), in the side margins
    const ln = LN.ctx; HG.reset(ln); ln.clearRect(0, 0, W, W); let anyN = false;
    for (const p of NEAR) { const st = fallAt(p, t); if (st) { anyN = true; petal(ln, A, st, p, p.s, 0.85 * (1 - smooth(9.4, 10.2, t))); } }
    if (anyN) { HG.reset(ctx); ctx.filter = 'blur(4px)'; ctx.globalAlpha = 1; ctx.drawImage(LN.cv, 0, 0); ctx.filter = 'none'; ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.3; ctx.filter = 'blur(12px)'; ctx.drawImage(LN.cv, 0, 0); HG.reset(ctx); }
  },
});
