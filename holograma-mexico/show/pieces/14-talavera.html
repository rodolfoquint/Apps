<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Talavera de Puebla: a bare tile of warm tin glaze rises out of the dark and four brushes sweep the cobalt
// painting onto it; a glint crosses the glaze, then the glaze melts away and the painting becomes a turning
// kaleidoscope, a mirrored band fans open from under it like petals and small tiles slide out into a ring.
// Layers turn against each other, the glaze glows back in the heart, sheen and sparkles cross it; then
// everything folds back under the single tile, its glaze dissolves and the painting floats alone and fades.
const { C, ctx, clamp, lerp, smooth, ease, rgba, COLORS } = HG;
const TAU = Math.PI * 2;
const COBALT = [70, 120, 255], BLADE = [120, 165, 255], GLAZE = [200, 220, 255], GOLD = [255, 196, 90];

const M = HG.layer(), S = HG.layer(), T = HG.layer(), B = HG.layer(), K = HG.layer();
const wedge = document.createElement('canvas'); wedge.width = wedge.height = 8;
const wg = wedge.getContext('2d');

// ---------- helpers (local to this piece)

// N-fold mirrored kaleidoscope of img, drawn into g centred at C, restricted to the soft annulus r0..r1.
// The source is the tile rotated by sRot, scaled by sScale (screen px per tile px) and offset by (sx, sy).
// open < 1 folds the wedges together like a hand fan opening from `groups` points; sideFeather
// (radians) softens the side edges of every blade so a half-open fan reads as blades, not cuts.
const orderCache = new Map();
function kaleido(g, img, { n, r0 = 0, r1, rot = 0, sRot = 0, sScale = 1, sx = 0, sy = 0, open = 1, groups = 1, feather = 14, featherIn = feather, zoom = 1, sideFeather = 0 }) {
  if (open <= 0.001) return;
  const a = TAU / n, eps = 1.2 / r1 + 0.003;
  const R = Math.ceil(r1) + 2, oy = Math.ceil(R * Math.sin(eps)) + 2;
  const ww = R + 2, wh = oy + Math.ceil(R * Math.sin(a + eps)) + 2;
  if (wedge.width < ww || wedge.height < wh) { wedge.width = Math.max(wedge.width, ww); wedge.height = Math.max(wedge.height, wh); }
  HG.reset(wg); wg.clearRect(0, 0, wedge.width, wedge.height);
  wg.save(); wg.translate(1, oy);
  wg.beginPath(); wg.moveTo(0, 0); wg.arc(0, 0, r1, -eps, a + eps); wg.closePath(); wg.clip();
  wg.imageSmoothingQuality = 'high';
  wg.rotate(sRot); wg.scale(sScale, sScale); wg.translate(-img.width / 2 - sx, -img.height / 2 - sy);
  wg.drawImage(img, 0, 0);
  wg.restore();
  // soft annulus
  wg.globalCompositeOperation = 'destination-in';
  const m = wg.createRadialGradient(1, oy, 0, 1, oy, r1);
  const f0 = clamp((r0 - featherIn) / r1), f1 = clamp(r0 / r1), f2 = clamp((r1 - feather) / r1);
  m.addColorStop(0, r0 > 0 ? 'rgba(0,0,0,0)' : '#000');
  if (r0 > 0) { m.addColorStop(f0, 'rgba(0,0,0,0)'); m.addColorStop(f1, '#000'); }
  m.addColorStop(Math.max(f1, f2), '#000'); m.addColorStop(1, 'rgba(0,0,0,0)');
  wg.fillStyle = m; wg.fillRect(0, 0, wedge.width, wedge.height);
  // feathered blade sides (the ramp starts at the overlap margin, so a closed fan has no seams)
  if (sideFeather > 0.002) {
    const span = a + 2 * eps, f = Math.min(sideFeather, span / 2 - 0.002);
    const cg = wg.createConicGradient(-eps, 1, oy);
    cg.addColorStop(0, 'rgba(0,0,0,0)'); cg.addColorStop(f / TAU, '#000');
    cg.addColorStop((span - f) / TAU, '#000'); cg.addColorStop(span / TAU, 'rgba(0,0,0,0)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
    wg.fillStyle = cg; wg.fillRect(0, 0, wedge.width, wedge.height);
  }
  wg.globalCompositeOperation = 'source-over';

  // copies: alternate wedges mirrored; while folding, outer blades sit under the inner ones
  const key = n + '/' + groups;
  if (!orderCache.has(key)) {
    const gw = TAU / groups, list = [];
    for (let k = 0; k < n; k++) {
      const c = (k + 0.5) * a, gc = Math.round(c / gw) * gw;
      list.push({ k, gc, d: c - gc });
    }
    list.sort((p, q) => Math.abs(q.d) - Math.abs(p.d));
    orderCache.set(key, list);
  }
  g.save(); g.imageSmoothingQuality = 'high'; g.globalAlpha = 1;
  for (const { k, gc, d } of orderCache.get(key)) {
    const c = gc + d * open;
    g.setTransform(zoom, 0, 0, zoom, C, C);
    if (k % 2 === 0) g.rotate(rot + c - a / 2); else { g.rotate(rot + c + a / 2); g.scale(1, -1); }
    g.drawImage(wedge, 0, 0, ww, wh, -1, -oy, ww, wh);
  }
  g.restore();
}

// kaleidoscope at partial opacity: built at full alpha in K first, so the overlapping wedge seams
// don't show as brighter spokes, then laid down as one sheet
function kaleidoA(g, img, opts, alpha) {
  if (alpha <= 0.003) return;
  if (alpha >= 0.999) return kaleido(g, img, opts);
  const k = K.ctx; HG.reset(k); k.clearRect(0, 0, HG.W, HG.W);
  kaleido(k, img, opts);
  g.save(); HG.reset(g); g.globalAlpha = alpha; g.drawImage(K.cv, 0, 0); g.restore();
}

// erase everything inside radius r (soft edge of width w) from layer g
function hole(g, r, w = 10) {
  if (r <= 0) return;
  g.save(); HG.reset(g); g.globalCompositeOperation = 'destination-out';
  const r0 = Math.max(0, r - w / 2), r1 = r + w / 2;
  const hg = g.createRadialGradient(C, C, 0, C, C, r1);
  hg.addColorStop(0, '#000'); hg.addColorStop(r0 / r1, '#000'); hg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = hg; g.fillRect(C - r1, C - r1, 2 * r1, 2 * r1);
  g.restore();
}

// the tile itself, its square corners rounding off into a circle as `round` goes 0..1
function tile(g, img, size, rot, { round = 0, alpha = 1, x = C, y = C } = {}) {
  if (alpha <= 0.003) return;
  g.save(); g.translate(x, y); g.rotate(rot);
  if (round > 0.001) { g.beginPath(); g.roundRect(-size / 2, -size / 2, size, size, round * size / 2); g.clip(); }
  g.globalAlpha = alpha; g.imageSmoothingQuality = 'high';
  g.drawImage(img, -size / 2, -size / 2, size, size);
  g.restore();
}

// glowing arcs around C (one path, so where arcs meet nothing doubles up); arcs = [[a0, a1], ...]
function arcsGlow(g, r, arcs, col, { width = 4, blur = 8, alpha = 1 } = {}) {
  if (alpha <= 0.003 || r <= 0) return;
  const path = () => { g.beginPath(); for (const [a0, a1] of arcs) if (a1 - a0 > 0.001) { g.moveTo(C + Math.cos(a0) * r, C + Math.sin(a0) * r); g.arc(C, C, r, a0, a1); } };
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = rgba(col, 1); g.lineCap = 'round';
  g.globalAlpha = alpha * 0.7; g.lineWidth = width * 2.2; g.filter = `blur(${blur}px)`; path(); g.stroke();
  g.filter = 'none'; g.globalAlpha = alpha; g.lineWidth = Math.max(1.2, width / 2.5); path(); g.stroke();
  g.restore();
}
const arcGlow = (g, r, a0, sweep, col, o) => sweep > 0.001 && arcsGlow(g, r, [[a0, a0 + sweep]], col, o);

// four-point glint star
function star(g, x, y, s, a, rot = 0, col = GLAZE, arm = 0.09) {
  if (a <= 0.003 || s <= 0) return;
  const sp = HG.sprite(col);
  g.save(); g.globalCompositeOperation = 'lighter'; g.translate(x, y); g.rotate(rot);
  g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, -s / 2, -s * arm / 2, s, s * arm);
  g.drawImage(sp, -s * arm / 2, -s / 2, s * arm, s);
  g.globalAlpha = Math.min(1, a * 0.8);
  g.drawImage(sp, -s * 0.16, -s * 0.16, s * 0.32, s * 0.32);
  g.restore();
}

// add a moving sheen to whatever is in M, shaped by a gradient (only the glaze/paint lights up)
function sheen(grad, alpha) {
  if (alpha <= 0.003) return;
  const s = S.ctx; HG.reset(s); s.clearRect(0, 0, HG.W, HG.W);
  s.drawImage(M.cv, 0, 0);
  s.globalCompositeOperation = 'destination-in'; s.fillStyle = grad(s); s.fillRect(0, 0, HG.W, HG.W);
  HG.reset(s);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha; ctx.drawImage(S.cv, 0, 0); ctx.restore();
}

// small tiles get a pale-blue glaze so the ring doesn't outshine the mandala (built once from the asset)
let smallTint = null;
function tinted(img) {
  if (smallTint) return smallTint;
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'multiply'; g.fillStyle = 'rgb(205,222,255)'; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(img, 0, 0);
  return (smallTint = c);
}

// warm milky tin glaze: the bare glaze and the glaze between the painted strokes get the same ivory tint
// (a touch dimmer than the photo), the paint keeps its colour. Built once from the assets (deterministic).
const IVORY = 'rgb(252,242,208)';
let warm = null;
function warmAssets(A) {
  if (warm) return warm;
  const mk = img => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; return c; };
  const bare = mk(A.bare), bg = bare.getContext('2d');
  bg.drawImage(A.bare, 0, 0);
  bg.globalCompositeOperation = 'multiply'; bg.fillStyle = IVORY; bg.fillRect(0, 0, bare.width, bare.height);
  bg.globalCompositeOperation = 'destination-in'; bg.drawImage(A.bare, 0, 0);
  const x = mk(A.tile), xg = x.getContext('2d');                    // ivory everywhere the ink isn't
  xg.fillStyle = IVORY; xg.fillRect(0, 0, x.width, x.height);
  xg.globalCompositeOperation = 'destination-out'; xg.drawImage(A.ink, 0, 0, x.width, x.height);
  const tl = mk(A.tile), tg = tl.getContext('2d');
  tg.drawImage(A.tile, 0, 0);
  tg.globalCompositeOperation = 'multiply'; tg.drawImage(x, 0, 0);
  tg.globalCompositeOperation = 'destination-in'; tg.drawImage(A.tile, 0, 0);
  return (warm = { bare, tile: tl });
}

// the painted region of the opening: 4 brushes sweep round the centre from the 4 corners, each a quarter
// turn (sw 0..1), with a soft edge that curls back a little towards the rim like a dragged brush.
// a0..a1 (fractions of the quarter) picks a slice of each sector (used for the wet-ink band at the brush).
function brushSectors(g, sw0, sw1, rot, R, blur) {
  HG.reset(g); g.clearRect(0, 0, HG.W, HG.W);
  if (sw1 - sw0 <= 0.0005) return;
  const Q = Math.PI / 2, CURL = 0.55, N = 28;
  g.beginPath();
  for (let k = 0; k < 4; k++) {
    const a0 = rot + k * Q + sw0 * Q, a1 = rot + k * Q + sw1 * Q;
    g.moveTo(C, C);
    for (let j = 1; j <= N; j++) { const u = j / N, r = R * u, a = a0 - CURL * u * u; g.lineTo(C + Math.cos(a) * r, C + Math.sin(a) * r); }
    g.arc(C, C, R, a0 - CURL, a1 - CURL);           // outer boundary on the circle, so the tile corners get painted too
    for (let j = N - 1; j >= 1; j--) { const u = j / N, r = R * u, a = a1 - CURL * u * u; g.lineTo(C + Math.cos(a) * r, C + Math.sin(a) * r); }
    g.closePath();
  }
  g.fillStyle = '#000'; g.filter = `blur(${blur}px)`; g.fill(); g.filter = 'none';
}

// keep only what lies inside radius r of layer g (soft edge of width w)
function keepInside(g, r, w) {
  g.save(); HG.reset(g); g.globalCompositeOperation = 'destination-in';
  const r1 = Math.max(1, r + w / 2), r0 = Math.max(0, r - w / 2);
  const kg = g.createRadialGradient(C, C, 0, C, C, r1);
  kg.addColorStop(0, '#000'); kg.addColorStop(r0 / r1, '#000'); kg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = kg; g.fillRect(0, 0, HG.W, HG.W);
  g.restore();
}

// the warm glaze under the cobalt in the core: lit from within, ivory in the heart, warming to amber as it
// thins out towards the rim (so it never passes through a dull grey on black)
function coreGlaze(g, img, opts, alpha) {
  if (alpha <= 0.003) return;
  const k = K.ctx; HG.reset(k); k.clearRect(0, 0, HG.W, HG.W);
  kaleido(k, img, opts);
  const R = opts.r1;
  k.globalCompositeOperation = 'multiply';
  const cg = k.createRadialGradient(C, C, 0, C, C, R);
  cg.addColorStop(0, 'rgb(255,255,255)'); cg.addColorStop(0.4, 'rgb(255,240,210)'); cg.addColorStop(0.75, 'rgb(255,205,140)'); cg.addColorStop(1, 'rgb(255,180,100)');
  k.fillStyle = cg; k.fillRect(C - R, C - R, 2 * R, 2 * R);
  k.globalCompositeOperation = 'destination-in';
  const rg = k.createRadialGradient(C, C, 0, C, C, R);
  rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(0.3, 'rgba(0,0,0,0.9)'); rg.addColorStop(0.55, 'rgba(0,0,0,0.45)'); rg.addColorStop(0.8, 'rgba(0,0,0,0.1)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  k.fillStyle = rg; k.fillRect(0, 0, HG.W, HG.W); HG.reset(k);
  g.save(); HG.reset(g); g.globalAlpha = alpha; g.drawImage(K.cv, 0, 0); g.restore();
}

// ---------- choreography (all radii at camera scale 1; Z pushes the camera in for the single-tile acts)
const SIZE = 440;                       // seed tile side; its inscribed circle becomes the kaleidoscope core
const RC = SIZE / 2;                    // core radius
const B0 = 238, B1 = 338;               // mirrored band
const NT = 20, RT = 404, TS = 82;       // ring of small tiles
const BA = TAU / 16;                    // band blade angle
const WAVE = [0, 2, 4, 1, 3];           // tile ring builds in 5 waves of 4 tiles, 90 deg apart (the mandala's 4/8-fold)
const bump = (t, a, b, c, d) => smooth(a, b, t) * (1 - smooth(c, d, t));
const P = HG.layer(), U = HG.layer();   // brush mask, bare-glaze sheet

HG.start({
  duration: 12,
  assets: {
    tile: '../assets/14-talavera_glaze.png', ink: '../assets/14-talavera_ink.png',
    bare: '../assets/14-talavera_bare.png', small: '../assets/14-talavera_small.png',
  },
  render(t, A) {
    const W8 = warmAssets(A);
    // camera: close on the single tile, pulls back as the mandala opens, pushes in again as it folds
    const zIntro = 1.24 - 0.06 * (1 - ease.out3(t / 3.0));                  // slow push-in on the bare tile
    const Z = lerp(1, zIntro, 1 - ease.inOut3((t - 3.05) / 1.9)) + 0.24 * ease.inOut3((t - 8.25) / 1.5);
    const breath = Math.sin((t - 4) * 1.6) * bump(t, 3.95, 5.3, 7.4, 8.4);
    const rc = Math.PI / 4 + (Math.PI / 2) * ease.inOut3((t - 1.0) / 9.6);    // core turns a quarter (tile looks the same)
    const brot = -0.16 * t - 0.45 * ease.inOut3((t - 2.8) / 6.6);            // the band turns against the core
    const end = smooth(10.0, 11.3, t);                                       // final dissolve (the painting alone by then)
    const endScale = 1 - 0.05 * ease.in3((t - 9.9) / 1.1);
    const S1 = SIZE * Z * endScale;                                          // seed tile on screen

    // background haze: a faint cobalt breath held close behind the mandala
    const haze = smooth(0.6, 3.2, t) * (1 - smooth(8.9, 10.4, t));
    if (haze > 0) {
      const hg = ctx.createRadialGradient(C, C, 40, C, C, 440 * Z);
      hg.addColorStop(0, rgba([20, 40, 120], 0.15 * haze)); hg.addColorStop(0.7, rgba([10, 20, 70], 0.07 * haze)); hg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hg; ctx.fillRect(0, 0, HG.W, HG.W);
    }

    // ---------- band: fans open from under the core like soft petals, later folds shut and tucks back under it
    const open = ease.inOut3((t - 3.05) / 1.4) * (1 - ease.inOut3((t - 7.95) / 0.85));
    const zb = lerp(0.62, 1, ease.out3((t - 3.05) / 1.3)) * lerp(1, 0.62, ease.inOut3((t - 8.25) / 0.85));
    const bandA = 0.95 * smooth(0, 0.12, open + 0.12 * smooth(7.9, 8.0, t)) * (1 - smooth(8.95, 9.15, t));
    const bg = B.ctx; HG.reset(bg); bg.clearRect(0, 0, HG.W, HG.W);
    if (bandA > 0.003) {
      kaleido(bg, A.ink, {
        n: 16, r0: B0 * Z, r1: B1 * Z, rot: brot, sRot: -0.18 * t, sScale: 0.78 * Z * (1 + 0.03 * breath),
        open: Math.max(open, 0.002), groups: 8, zoom: zb, feather: 12 * Z, sideFeather: 0.8 * BA * (1 - open),
      });
      // cobalt rim of the band: only once the fan is (nearly) open, so the half-open blades never read as cog teeth
      const rimA = 0.5 * smooth(0.8, 1, open);
      if (rimA > 0.003) {
        const half = (BA / 2) * (1 + open), arcs = [];
        for (let j = 0; j < 8; j++) { const gc = brot + j * TAU / 8; arcs.push([gc - half, gc + half]); }
        arcsGlow(bg, (B1 + 10) * Z * zb, arcs, COBALT, { width: 4, blur: 8, alpha: rimA });
      }
      hole(bg, RC * Z - 2, 8);                 // the core sits on top: whatever is under it is gone
    }

    // ---------- small tiles slide out from under the band edge into a ring, and back under at the end.
    // The swirl is shared by all tiles (no per-tile delay), so neighbours keep their 18 deg spacing and never
    // collide; the waves differ only in radius and scale.
    const tg = T.ctx; HG.reset(tg); tg.clearRect(0, 0, HG.W, HG.W);
    const rr = 0.16 * t, small = tinted(A.small);
    const pA = ease.out3((t - 3.65) / 1.6) * (1 - ease.inOut3((t - 7.5) / 1.2));
    const swirl = 1.1 * (1 - pA) * (t < 7.5 ? -1 : 1);
    let anyTile = false;
    for (let i = 0; i < NT; i++) {
      const dl = 0.08 * WAVE[i % 5];
      const pOut = ease.out3((t - 3.65 - dl) / 1.3);
      const pIn = ease.inOut3((t - 7.5 - dl) / 0.9);
      const p = pOut * (1 - pIn);
      if (p <= 0.002) continue;
      anyTile = true;
      const th = i * TAU / NT + rr + swirl;
      const r = lerp(250, RT + 3 * breath, p) * Z;
      tile(tg, small, TS * Z * lerp(0.35, 1, p), th + Math.PI / 4 + 2.2 * (1 - p), { x: C + Math.cos(th) * r, y: C + Math.sin(th) * r });
    }
    if (anyTile) hole(tg, (B1 * zb + 4) * Z, 10);   // tiles exist only outside the band's rim

    // ---------- build the mandala into M (back to front)
    const g = M.ctx; HG.reset(g); g.clearRect(0, 0, HG.W, HG.W);
    if (anyTile) { g.globalAlpha = 0.85; g.drawImage(T.cv, 0, 0); g.globalAlpha = 1; }
    if (bandA > 0.003) { g.globalAlpha = bandA; g.drawImage(B.cv, 0, 0); g.globalAlpha = 1; }

    // gold ring: grows out of the four tile corners as they round off, retracts into them at the end
    const ringHW = (Math.PI / 4) * ease.inOut3((t - 2.95) / 1.1) * (1 - ease.inOut3((t - 8.55) / 0.85));
    if (ringHW > 0.001) {
      const arcs = [];
      for (let j = 0; j < 4; j++) { const ca = rc + Math.PI / 4 + j * Math.PI / 2; arcs.push([ca - ringHW, ca + ringHW]); }
      arcsGlow(g, (RC + 9) * Z, arcs, GOLD, { width: 4, blur: 7, alpha: 0.55 * (1 - smooth(9.2, 9.5, t)) });
    }

    // seed tile: bare tin glaze rises out of the dark, the cobalt painting is brushed onto it, then it rounds off;
    // at the end it returns, its glaze dissolves and the painting floats alone before fading
    const round = smooth(2.65, 3.3, t) * (1 - smooth(9.2, 9.65, t));
    const k8 = smooth(2.3, 2.7, t) * (1 - smooth(9.22, 9.42, t));
    // the glaze melts away from the centre outward (and closes back in at the end)
    const melt = ease.inOut3((t - 3.3) / 0.95) * (1 - ease.inOut3((t - 8.5) / 0.72));
    const MF = 46 * Z, RCZ = RC * Z, meltR = melt * (RCZ + MF);
    const seedOn = round < 0.999 && melt <= 0.001;
    const gIn = ease.out3((t - 0.15) / 1.0);                                // the bare glaze pools out from the centre
    const sw = ease.inOut3((t - 0.75) / 1.4);                              // the brushes
    const gOut = smooth(9.62, 10.25, t);                                     // the glaze dissolves, the painting stays
    if (seedOn && gIn > 0 && end < 0.999) {
      const s = S.ctx; HG.reset(s); s.clearRect(0, 0, HG.W, HG.W);
      if (sw < 0.999) {
        const Sg = S1 * lerp(0.94, 1, gIn), R = S1 * 0.84;
        // painted part
        brushSectors(P.ctx, 0, sw, rc + Math.PI / 4, R, 16);
        if (sw > 0.0005) {
          tile(s, W8.tile, Sg, rc, { round });
          s.globalCompositeOperation = 'destination-in'; s.drawImage(P.cv, 0, 0); s.globalCompositeOperation = 'source-over';
        }
        // bare part (exact complement of the painted part, so the glaze itself never changes as the brush passes)
        const u = U.ctx; HG.reset(u); u.clearRect(0, 0, HG.W, HG.W);
        tile(u, W8.bare, Sg, rc, { round });
        if (sw > 0.0005) { u.globalCompositeOperation = 'destination-out'; u.drawImage(P.cv, 0, 0); u.globalCompositeOperation = 'source-over'; }
        s.globalCompositeOperation = 'lighter'; s.drawImage(U.cv, 0, 0); s.globalCompositeOperation = 'source-over';
        if (gIn < 0.999) keepInside(s, gIn * (Sg * 0.74 + 0.35 * Sg), 0.35 * Sg * 2);
        // wet ink: the strokes just behind each brush glow brighter for a moment
        const wet = Math.sin(Math.PI * clamp(sw / 0.999));
        if (wet > 0.01) {
          brushSectors(P.ctx, Math.max(0, sw - 0.22), sw, rc + Math.PI / 4, R, 14);
          const pc = P.ctx; pc.globalCompositeOperation = 'source-in';
          pc.save(); pc.translate(C, C); pc.rotate(rc); pc.drawImage(A.ink, -Sg / 2, -Sg / 2, Sg, Sg); pc.restore();
          HG.reset(pc);
          s.globalCompositeOperation = 'lighter'; s.globalAlpha = 0.55 * wet; s.drawImage(P.cv, 0, 0); HG.reset(s);
        }
        // hand over to the plain tile over the last frames of the sweep, so the branch switch is seamless
        const fin = smooth(0.95, 0.999, sw);
        if (fin > 0.001) {
          s.save(); s.globalCompositeOperation = 'destination-out'; s.globalAlpha = fin; s.fillStyle = '#000'; s.fillRect(0, 0, HG.W, HG.W); s.restore();
          s.globalCompositeOperation = 'lighter'; tile(s, W8.tile, Sg, rc, { round, alpha: fin }); HG.reset(s);
        }
      } else if (gOut < 0.001) {
        tile(s, W8.tile, S1, rc, { round });
      } else {
        // the glaze dissolves from the centre outwards and the painting stays (never a uniform grey tile)
        const DW = S1 * 0.22, rd = gOut * (S1 * 0.72 + DW / 2 + 6);
        tile(s, W8.tile, S1, rc, { round });
        hole(s, rd, DW);
        s.globalCompositeOperation = 'destination-over';
        tile(s, A.ink, S1, rc, { round });
        HG.reset(s);
        const ringA = 0.35 * Math.sin(Math.PI * gOut) * (1 - smooth(0.3 * S1, 0.48 * S1, rd));
        arcGlow(s, Math.max(1, rd - DW * 0.25), 0, TAU, GLAZE, { width: 4, blur: 9, alpha: ringA });
      }
      // the bare glaze is lit warm from within (ivory heart, amber edge) so it reads as glossy tin glaze, not a card
      const wv = 1 - smooth(1.0, 2.3, t);
      if (wv > 0.003) {
        const R2 = S1 * 0.72, wgr = s.createRadialGradient(C - 0.12 * S1, C - 0.16 * S1, 0, C, C, R2);
        wgr.addColorStop(0, 'rgba(255,248,222,0.30)'); wgr.addColorStop(0.45, 'rgba(255,232,180,0.16)'); wgr.addColorStop(1, 'rgba(245,190,110,0.22)');
        s.save(); s.globalCompositeOperation = 'source-atop'; s.globalAlpha = wv; s.fillStyle = wgr; s.fillRect(0, 0, HG.W, HG.W); s.restore();
      }
      // the blank glaze is held a little below full so the bare tile is never the brightest thing in the piece
      const lit = lerp(0.86, 1, smooth(0.5, 2.0, t));
      g.save(); g.globalAlpha = (1 - end) * lit; g.drawImage(S.cv, 0, 0); g.restore();
    }

    // core kaleidoscope: identical to the tile at rest, then it turns, zooms and wanders
    const evo = ease.inOut3((t - 3.05) / 6.1);
    const bloom = bump(t, 3.35, 5.9, 6.9, 9.0);
    const coreScale = SIZE / 1024 * (1 + 0.55 * bloom + 0.04 * breath);
    const wander = 70 * bloom;
    const core = {
      n: 8, r1: RCZ * (1 + 0.025 * breath), rot: rc, sRot: (Math.PI / 2) * evo, sScale: coreScale * Z,
      sx: wander * Math.cos(t * 0.9), sy: wander * Math.sin(t * 0.9), feather: 6,
    };
    if (k8 > 0.003) {
      // the warm tin glaze glows back under the cobalt at the peak, brightest in the middle, so it reads as Talavera
      const tone = bump(t, 4.4, 5.7, 7.3, 8.45) * (melt > 0.001 ? 1 : 0);
      if (melt > 0.001) {
        coreGlaze(g, W8.bare, core, tone);
        kaleido(g, A.ink, core);
      }
      if (meltR < RCZ + MF - 1) {
        if (k8 < 0.999) {
          // crossfade with the seed tile underneath: build the core sheet in S, then lay it down once
          const s = S.ctx; HG.reset(s); s.clearRect(0, 0, HG.W, HG.W);
          kaleido(s, W8.tile, { ...core, r0: meltR, featherIn: MF });
          g.save(); g.globalAlpha = k8; g.drawImage(S.cv, 0, 0); g.restore();
        } else kaleido(g, W8.tile, { ...core, r0: meltR, featherIn: MF });
      }
    }

    // ---------- composite with bloom
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.38; ctx.filter = 'blur(18px)'; ctx.drawImage(M.cv, 0, 0);
    ctx.filter = 'none'; ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(M.cv, 0, 0); ctx.restore();

    // a ring of light rides the melting edge of the glaze
    if (melt > 0.001 && melt < 0.999) arcGlow(ctx, Math.max(0, meltR - MF * 0.55), 0, TAU, GLAZE, { width: 5, blur: 10, alpha: 0.45 * Math.sin(Math.PI * melt) });

    // glint sweeping across the glaze from a fixed light (start and end), with a star on the corner it leaves
    const GL = Math.PI / 3, vx = Math.cos(GL), vy = Math.sin(GL);
    const glint = (t0, dur) => {
      const u = (t - t0) / dur; if (u <= 0 || u >= 1) return;
      const e = ease.inOut3(u), d = S1 * 0.8;
      const ox = C + vx * d * lerp(-1, 1, e), oy = C + vy * d * lerp(-1, 1, e);
      sheen(s => {
        const lg = s.createLinearGradient(ox - vx * 75, oy - vy * 75, ox + vx * 75, oy + vy * 75);
        lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(0.5, 'rgba(0,0,0,1)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
        return lg;
      }, 0.42 * Math.sin(Math.PI * u));
      // the tile corner nearest the light's exit catches a star
      let best = 0, bd = 9;
      for (let k = 0; k < 4; k++) { const ca = rc + Math.PI / 4 + k * Math.PI / 2, dd = Math.abs(Math.atan2(Math.sin(ca - GL), Math.cos(ca - GL))); if (dd < bd) { bd = dd; best = ca; } }
      const su = (u - 0.55) / 0.45, cr = S1 / Math.SQRT2 * 0.96;
      if (su > 0) star(ctx, C + Math.cos(best) * cr, C + Math.sin(best) * cr, 120 * Math.sin(Math.PI * su), 0.9 * Math.sin(Math.PI * su), su * 0.5);
    };
    glint(1.95, 1.0);
    glint(9.25, 0.9);
    // a broad soft reflection drifts across the bare glaze as it rises, so it reads as glossy, not a flat card
    const gl0 = (t - 0.2) / 1.6;
    if (gl0 > 0 && gl0 < 1) {
      const e = ease.inOut3(gl0), d = S1 * 0.75, ox = C + vx * d * lerp(-1, 1, e), oy = C + vy * d * lerp(-1, 1, e);
      sheen(s => {
        const lg = s.createLinearGradient(ox - vx * 230, oy - vy * 230, ox + vx * 230, oy + vy * 230);
        lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(0.5, 'rgba(0,0,0,1)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
        return lg;
      }, 0.2 * Math.sin(Math.PI * gl0));
    }

    // rotating sheen over the mandala while it turns
    const sh = bump(t, 4.5, 5.5, 7.5, 8.3);
    if (sh > 0) sheen(s => {
      const cg = s.createConicGradient(rc + 0.9 * t, C, C);
      for (let i = 0; i < 4; i++) {
        cg.addColorStop((i + 0.38) / 4, 'rgba(0,0,0,0)'); cg.addColorStop((i + 0.5) / 4, 'rgba(0,0,0,1)'); cg.addColorStop((i + 0.62) / 4, 'rgba(0,0,0,0)');
      }
      return cg;
    }, 0.28 * sh);

    // kaleidoscopic sparkles: bursts of glints mirrored around the circle [t0, r, count, offset, size, which layer]
    const bursts = [[4.85, 120, 8, 0.0, 90, 'core'], [5.75, 290, 16, 0.5, 155, 'band'], [6.45, 170, 8, 0.2, 95, 'core'], [6.75, 405, 20, 0.5, 105, 'ring']];
    for (const [t0, r, n, off, size, wh] of bursts) {
      const u = (t - t0) / 0.9; if (u <= 0 || u >= 1) continue;
      const a = Math.sin(Math.PI * u), s = size * Math.sin(Math.PI * Math.pow(u, 0.7));
      for (let i = 0; i < n; i++) {
        const th = (i + off) * TAU / n + (wh === 'ring' ? rr : wh === 'band' ? brot : rc);
        const sx = C + Math.cos(th) * r * Z, sy = C + Math.sin(th) * r * Z;
        const keep = 1 - smooth(745, 795, sy);                       // nothing bright behind the title band
        star(ctx, sx, sy, s * 0.8, a * 0.9 * keep, u * 0.6, GLAZE, 0.125);
      }
    }
  },
});
