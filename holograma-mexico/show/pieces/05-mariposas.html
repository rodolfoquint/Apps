<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Mariposas monarca: the migration arrives. Monarchs glide in from the dark rim along
// curving paths, leaving faint orange sparks, and gather into a slowly turning spiral
// around a warm heart of light; a wave of wingbeats runs round the swarm, then the
// spiral unwinds and they scatter outward past the rim, leaving sparks that fade to black.
// Asset: prepare.py on out-show/images/monarca-1.png -> assets/05-mariposas-monarca.png.
const { W, C, ctx, clamp, lerp, smooth, ease, COLORS, rgba } = HG;
const TAU = Math.PI * 2;

// ---------- deterministic hash for per-spark randomness (no Math.random)
function hash(a, b) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
// integral of smooth(a, b, x) dx from -inf to t (used to speed up phases without jumps)
function intSmooth(a, b, t) {
  if (t <= a) return 0;
  const d = b - a;
  if (t >= b) return d * 0.5 + (t - b);
  const x = (t - a) / d;
  return d * (x * x * x - 0.5 * x * x * x * x);
}

// ---------- sprites built once at load (pure: no state that depends on t)
const SP = 256, AXIS = 517 / 1024 * SP, BODY_Y = 500 / 1024 * SP, PAD = 48;
let spr = null, glow = null;
function buildSprites(img) {
  const half = document.createElement('canvas'); half.width = half.height = 512;
  const hg = half.getContext('2d'); hg.imageSmoothingQuality = 'high'; hg.drawImage(img, 0, 0, 512, 512);
  spr = document.createElement('canvas'); spr.width = spr.height = SP;
  const sg = spr.getContext('2d'); sg.imageSmoothingQuality = 'high'; sg.drawImage(half, 0, 0, SP, SP);
  glow = document.createElement('canvas'); glow.width = glow.height = SP + PAD * 2;
  const gg = glow.getContext('2d');
  gg.filter = 'blur(14px)'; gg.drawImage(spr, PAD, PAD);
  gg.filter = 'blur(5px)'; gg.globalCompositeOperation = 'lighter'; gg.globalAlpha = 0.6; gg.drawImage(spr, PAD, PAD);
}

// ---------- the swarm: every butterfly's flight is an analytic function of t
const ARMS = 3, FAR = 36, NEAR = 14, R0 = 112, TWIST = 1.45;
// the swarm turns a little faster while it is gathered (integrated, so angles never jump)
const spin = t => 0.2 * (intSmooth(3.6, 5.6, t) - intSmooth(8.0, 9.8, t));
// a soft wave of warm light released from the heart sends the butterflies away as it passes
const WAVE0 = 7.35, WAVED = 2.3;
const waveR = t => 60 + 520 * ease.inOut3((t - WAVE0) / WAVED);
function waveTime(r) { let a = WAVE0, b = WAVE0 + WAVED; for (let k = 0; k < 30; k++) { const m = (a + b) / 2; if (waveR(m) < r) a = m; else b = m; } return a; }
const BF = (() => {
  const R = HG.rng(5), out = [];
  const make = (i, u, rO, thAt, z, span, bright, d) => {
    const om = 0.2 * (1 + 0.5 * (1 - u));
    const e = waveTime(rO) + 0.05 + R() * 0.25;
    return {
      i, u, z, rO, om, th0: thAt - om * 6.2, span, bright, d,
      D: 2.9 + R() * 0.8, rs: 640 + R() * 90, dth: 1.3 + R() * 1.2,
      e, Dout: Math.min(2.5, 11.25 - e) - R() * 0.2, re: 730 + R() * 80, dthOut: 0.8 + R() * 0.8,
      f: 1.75 + R() * 0.7, p: R() * TAU, gq: R() * TAU, gf: 0.17 + R() * 0.12,
      wf: 0.22 + R() * 0.3, wp: R() * TAU, wa: 10 + R() * 12,
    };
  };
  // far layer: small, softer butterflies that draw the spiral arms
  const per = FAR / ARMS;
  for (let i = 0; i < FAR; i++) {
    const arm = i % ARMS, slot = Math.floor(i / ARMS), u = clamp((slot + 0.5 + (R() - 0.5) * 0.4) / per);
    const side = (slot % 2 ? 1 : -1) * (0.3 + 0.7 * R());
    const rO = R0 + 296 * Math.pow(u, 0.9) + side * 14;
    const th = arm * TAU / ARMS - TWIST * Math.log(rO / R0) + side * 22 / rO;
    const z = R() * 0.35;
    // inner slots arrive first, so the spiral builds from its heart outward
    out.push(make(i, u, rO, th, z, 38 + 24 * R(), 0.7 + 0.2 * R(), 0.3 + 2.5 * Math.pow(u, 0.85) + (R() - 0.5) * 0.45));
  }
  // near layer: larger, brighter butterflies spread evenly through the vortex
  for (let k = 0; k < NEAR; k++) {
    const u = (((k * 5) % NEAR) + 0.5) / NEAR;
    const rO = 165 + 232 * u, th = k * 2.39996 + 0.4;
    out.push(make(FAR + k, u, rO, th, 0.5 + 0.5 * R(), 72 + 34 * R(), 0.88 + 0.12 * R(), 0.7 + 2.6 * (k / NEAR) + (R() - 0.5) * 0.4));
  }
  out.sort((a, b) => a.span - b.span);   // far (small) first, near (large) on top
  return out;
})();

// base flight path (no wingbeat bob): position at time t
function path(b, t) {
  const th = b.th0 + b.om * t + spin(t);
  let r = b.rO, a = th;
  const x = (t - b.d) / b.D;
  if (x < 1) { const e = 1 - Math.pow(1 - clamp(x), 2.2); r = lerp(b.rs, b.rO, e); a = th - b.dth * (1 - e); }
  const y = (t - b.e) / b.Dout;
  if (y > 0) { const f = Math.pow(clamp(y), 2); r = lerp(b.rO, b.re, f); a = th + b.dthOut * f; }
  // gentle organic wander, stronger while travelling
  const wv = 0.6 + 0.4 * (1 - smooth(0.6, 1, x)) + 0.4 * smooth(0, 0.4, y);
  r += b.wa * wv * Math.sin(b.wf * TAU * t + b.wp);
  a += (b.wa * 0.9 * wv * Math.sin(b.wf * 0.8 * TAU * t + b.wp * 1.7)) / Math.max(r, 80);
  return { x: C + Math.cos(a) * r, y: C + Math.sin(a) * r, r };
}

// wing angle (0 = flat open, ~1.35 = nearly closed upward)
function wingAngle(b, t) {
  const takeoff = intSmooth(b.e - 0.2, b.e + 0.6, t) * 0.9;            // faster beats when leaving
  const ph = TAU * (b.f * t + takeoff) + b.p;
  const glide = smooth(-0.2, 0.7, Math.sin(TAU * b.gf * t + b.gq));    // alternate flapping and gliding
  const amp = lerp(1, 0.22, glide * (1 - smooth(b.e - 0.3, b.e + 0.3, t)));
  const ind = 0.55 + 0.8 * amp * Math.sin(ph + 0.35 * Math.sin(ph));
  // a wave of synchronised wingbeats running round the spiral at the climax
  const ang = Math.atan2(path(b, t).y - C, path(b, t).x - C);
  const sph = TAU * 1.9 * t - 2 * ang - b.u * 2.2;
  const syn = 0.55 + 0.8 * Math.sin(sph + 0.35 * Math.sin(sph));
  const s = HG.window(t, 5.3, 7.7, 0.9, 0.9) * 0.85;
  return { al: lerp(ind, syn, s), ph };
}

function drawButterfly(b, t, alpha) {
  const p = path(b, t), dt = 0.05;
  const p0 = path(b, t - dt), p1 = path(b, t + dt), p2 = path(b, t + 2 * dt);
  const hd = Math.atan2(p1.y - p0.y, p1.x - p0.x);
  const hd2 = Math.atan2(p2.y - p.y, p2.x - p.x);
  let turn = hd2 - hd; turn = Math.atan2(Math.sin(turn), Math.cos(turn));
  const bank = clamp(turn * 2.2, -0.3, 0.3);
  const { al, ph } = wingAngle(b, t);
  const wl = Math.max(0.12, Math.cos(al + bank)), wr = Math.max(0.12, Math.cos(al - bank));
  const k = b.span / SP * (1 + 0.035 * Math.sin(ph - 0.6));
  const light = (0.78 + 0.22 * (wl + wr) / 2) * b.bright * alpha;
  if (light <= 0.01) return;
  ctx.save();
  ctx.translate(p.x, p.y); ctx.rotate(hd + Math.PI / 2 + 0.05 * Math.sin(ph + 1)); ctx.scale(k, k);
  // bloom (additive, pre-blurred)
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.7 * light;
  const ga = AXIS + PAD, gy = -(BODY_Y + PAD);
  ctx.drawImage(glow, 0, 0, ga, glow.height, -ga * wl, gy, ga * wl, glow.height);
  ctx.drawImage(glow, ga, 0, glow.width - ga, glow.height, 0, gy, (glow.width - ga) * wr, glow.height);
  // the wings themselves, each scaled about the body axis
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = Math.min(1, light * 1.1);
  ctx.drawImage(spr, 0, 0, AXIS + 1, SP, -(AXIS + 1) * wl, -BODY_Y, (AXIS + 1) * wl, SP);
  ctx.drawImage(spr, AXIS - 1, 0, SP - AXIS + 1, SP, -1 * wr, -BODY_Y, (SP - AXIS + 1) * wr, SP);
  // a gentle additive sheen so the orange reads as light (kept low: no white blow-out)
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.28 * light;
  ctx.drawImage(spr, 0, 0, AXIS + 1, SP, -(AXIS + 1) * wl, -BODY_Y, (AXIS + 1) * wl, SP);
  ctx.drawImage(spr, AXIS - 1, 0, SP - AXIS + 1, SP, -1 * wr, -BODY_Y, (SP - AXIS + 1) * wr, SP);
  ctx.restore();
}

// ---------- luminous wakes: each butterfly paints a thin ribbon of light behind it
const TL = HG.layer(), TRAIL_DT = 1 / 30;
// wakes lengthen while the swarm circles, so the rotation reads as swirling arcs of light
const trailLen = t => 1.1 + 0.9 * HG.window(t, 3.4, 8.6, 1.6, 1.4);
const HEAD = [255, 214, 140], TAIL = [255, 120, 10];
function trails(t, master) {
  if (master <= 0) return;
  const c = TL.ctx; HG.reset(c); c.clearRect(0, 0, W, W);
  c.globalCompositeOperation = 'lighter'; c.lineCap = 'butt';
  for (const b of BF) {
    const sc = b.span / 80;
    let prev = path(b, t);
    const L = trailLen(t), M = Math.ceil(L / TRAIL_DT);
    for (let j = 1; j <= M; j++) {
      const te = t - j * TRAIL_DT, q = path(b, te), k = Math.min(1, j * TRAIL_DT / L);
      const a = Math.pow(1 - k, 1.4) * 0.62 * b.bright * master * smooth(b.d, b.d + 0.8, te);
      if (a > 0.004 && (q.r < 575 || prev.r < 575)) {
        c.strokeStyle = rgba([0, 1, 2].map(m => Math.round(lerp(HEAD[m], TAIL[m], Math.min(1, k * 1.4)))), Math.min(1, a));
        c.lineWidth = lerp(2.8, 0.5, k) * sc;
        c.beginPath(); c.moveTo(prev.x, prev.y); c.lineTo(q.x, q.y); c.stroke();
      }
      prev = q;
    }
  }
  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(7px)'; ctx.globalAlpha = 0.9; ctx.drawImage(TL.cv, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = 0.85; ctx.drawImage(TL.cv, 0, 0);
  HG.reset(ctx);
}

// ---------- faint spark trails: sparks are emitted at fixed frame times and stay where they
// were dropped, drifting and fading, so the trail is a true wake rather than a sliding copy
const SPARK_FPS = 30, LIFE = 0.95, SPARK_COLS = [COLORS.marigold, COLORS.orange, COLORS.gold, COLORS.warm];
function sparks(t, master) {
  const now = Math.floor(t * SPARK_FPS + 1e-6), K = Math.ceil(LIFE * SPARK_FPS);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BF) {
    const sc = b.span / 80;
    for (let j = 0; j < K; j++) {
      const id = now - j, te = id / SPARK_FPS, age = t - te;
      if (age < 0 || age > LIFE || te < b.d) continue;
      const h1 = hash(b.i * 977 + 13, id), h2 = hash(id, b.i * 31 + 7), h3 = hash(b.i + 501, id * 3 + 1);
      if (h3 < 0.35) continue;                                   // sparse, not a solid line
      const q = path(b, te);
      if (q.r > 600) continue;
      const env = smooth(b.d + 0.3, b.d + 1.2, te) * (0.6 + 0.4 * smooth(3.5, 5.5, te));
      const ang = h1 * TAU, v = 8 + 22 * h2;
      const x = q.x + Math.cos(ang) * (4 + v * age) * sc, y = q.y + Math.sin(ang) * (4 + v * age) * sc + 14 * age * age;
      const life = 1 - age / LIFE, tw = 0.6 + 0.4 * Math.sin(17 * age + h2 * 40);
      const col = SPARK_COLS[Math.floor(h3 * 97) % SPARK_COLS.length];
      HG.dot(ctx, col, x, y, (5 + 5 * h1) * Math.sqrt(sc) * (0.6 + 0.4 * life), 0.5 * life * life * tw * env * master * b.bright);
    }
  }
  ctx.restore();
}

// ---------- the heart: a small galaxy of gold sparks turning at the centre. It gathers,
// draws in a breath, then releases outward as a ring of sparkles that sends the swarm away.
const CORE = (() => {
  const R = HG.rng(77), out = [];
  for (let k = 0; k < 190; k++) {
    const rk = 14 + 82 * Math.pow(R(), 0.75);
    out.push({ rk, a0: R() * TAU, w: 0.5 + 1.1 * Math.pow(40 / rk, 0.6), d: 2.6 + R() * 2.2, sz: 5 + 8 * R() * R(),
      col: R() < 0.3 ? COLORS.warm : (R() < 0.5 ? COLORS.gold : COLORS.marigold), tw: R() * TAU, sp: 0.8 + R() * 0.45 });
  }
  return out;
})();
function heartCore(t, master) {
  const inhale = smooth(6.2, 7.35, t) * (1 - smooth(7.35, 7.9, t));
  const gather = smooth(2.6, 5.6, t);
  const wk = clamp((t - WAVE0) / WAVED), push = waveR(t) - 60;
  // soft compact glow, kept small so it reads as light rather than haze
  const ga = gather * (1 - smooth(7.4, 8.6, t)) * (0.85 + 0.15 * Math.sin(t * 1.9)) * (1 + 0.6 * inhale) * master;
  if (ga > 0) {
    const g = ctx.createRadialGradient(C, C, 0, C, C, 120);
    g.addColorStop(0, rgba([255, 236, 190], 0.5 * ga)); g.addColorStop(0.1, rgba([255, 205, 120], 0.3 * ga));
    g.addColorStop(0.35, rgba([255, 165, 60], 0.07 * ga)); g.addColorStop(1, rgba([255, 140, 40], 0));
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(C - 120, C - 120, 240, 240); ctx.restore();
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const s of CORE) {
    const vis = smooth(s.d, s.d + 1.2, t);
    if (vis <= 0) continue;
    let r = s.rk * (1 - 0.35 * inhale) + push * s.sp;
    const a = s.a0 + s.w * t + 0.25 * intSmooth(7.35, 8.4, t) * (40 / s.rk);
    const fade = t < WAVE0 ? 1 : Math.pow(1 - wk, 0.9) * (1 - smooth(480, 540, r));
    const tw = 0.6 + 0.4 * Math.sin(t * 4.3 + s.tw);
    HG.dot(ctx, s.col, C + Math.cos(a) * r, C + Math.sin(a) * r, s.sz * (1 + 0.3 * inhale + 0.35 * Math.sin(Math.PI * wk)), 0.75 * vis * fade * tw * master);
  }
  ctx.restore();
  // a fine ring of light marks the front of the wave
  if (wk > 0 && wk < 1) HG.ring(ctx, C, C, waveR(t), [255, 200, 120], { width: 5, blur: 12, alpha: 0.5 * Math.sin(Math.PI * Math.min(1, wk * 3)) * Math.pow(1 - wk, 1.1) * master });
}

HG.start({
  duration: 12,
  assets: { mon: '../assets/05-mariposas-monarca.png' },
  render(t, A) {
    if (!spr) buildSprites(A.mon);
    const out = 1 - smooth(10.9, 11.9, t);

    heartCore(t, out);
    HG.dust(t, { n: 70, colors: [COLORS.gold, COLORS.warm], alpha: 0.22 * smooth(1.5, 4, t) * out, size: 5, r: 500 });

    trails(t, out);
    sparks(t, out);
    for (const b of BF) {
      const p = path(b, t);
      if (p.r > 620) continue;
      drawButterfly(b, t, out);
    }
  },
});
</script></body></html>
