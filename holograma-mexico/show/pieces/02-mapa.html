<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Mapa: the whole of Mexico glows faintly out of the dark; two heads of light race from
// the tip of Yucatán along both coasts, lighting it, and meet at Cabo San Lucas; a pulse
// rings once round the finished outline and a gold front sweeps the land full of points.
// Then a traveller of light visits six places: at each a pin rises and a large round
// window blooms in the open sea or sky, holds, and settles to a small parked window at
// the rim. A last run along the route sends a gold wave through the land and makes every
// window flare gold; the windows fold back into their pins and the map lifts off as
// light, NW to SE.
const { W, C, ctx, clamp, lerp, smooth, ease, COLORS, rgba } = HG;

const DATA = (() => { const x = new XMLHttpRequest(); x.open('GET', '../assets/02-mapa.json', false); x.send(); return JSON.parse(x.responseText); })();

const TURQ = COLORS.turquoise, ICE = [170, 245, 250], GOLD = COLORS.gold, WARM = COLORS.warm, WHITE = COLORS.white;
const sine = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
const add = c => { c.globalCompositeOperation = 'lighter'; };
const mix = (a, b, k) => { k = clamp(k); return a.map((v, i) => Math.round(v + (b[i] - v) * k)); };
const gauss = (x, w) => Math.exp(-((x / w) ** 2));

// ---------- coastline geometry (arc-length parametrised)
const pts = r => { const p = []; for (let i = 0; i < r.length; i += 2) p.push([r[i], r[i + 1]]); return p; };
const P = pts(DATA.rings[0]), n = P.length, cum = [0];
for (let i = 1; i <= n; i++) cum.push(cum[i - 1] + Math.hypot(P[i % n][0] - P[i - 1][0], P[i % n][1] - P[i - 1][1]));
const L = cum[n];
const seg = s => { let lo = 0, hi = n; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; } return lo; };
function at(s) {
  s = ((s % L) + L) % L; const i = seg(s), a = P[i], b = P[(i + 1) % n], k = (s - cum[i]) / ((cum[i + 1] - cum[i]) || 1);
  return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
}
function rangePath(c, sA, sB) {           // polyline along the coast from arc sA to sB (sA < sB, unwrapped)
  const p0 = at(sA); c.moveTo(p0[0], p0[1]);
  let w = Math.floor(sA / L), i = seg(sA - w * L) + 1;
  if (i >= n) { i = 0; w++; }
  while (cum[i] + w * L < sB) { c.lineTo(P[i][0], P[i][1]); if (++i >= n) { i = 0; w++; } }
  const p1 = at(sB); c.lineTo(p1[0], p1[1]);
}
const polyPath = (p, path = new Path2D()) => { path.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) path.lineTo(p[i][0], p[i][1]); path.closePath(); return path; };
const COAST = polyPath(P);
const ISLANDS = DATA.rings.slice(1).map(r => pts(r));
const LAND = new Path2D(); polyPath(P, LAND); ISLANDS.forEach(p => polyPath(p, LAND));
const SEA = new Path2D(); SEA.rect(-400, -400, W + 800, W + 800); SEA.addPath(LAND);   // evenodd: everything but land

const LM = DATA.landmarks;
const iCabo = P.reduce((b, p, i) => Math.hypot(p[0] - LM.cabos[0], p[1] - LM.cabos[1]) < Math.hypot(P[b][0] - LM.cabos[0], P[b][1] - LM.cabos[1]) ? i : b, 0);
const S_MEET = cum[iCabo], S0 = S_MEET - L / 2;           // start opposite Cabo: the tip of Yucatán
const MEET = at(S_MEET), START = at(S0);
const ISL = ISLANDS.map(p => {
  const cx = p.reduce((a, q) => a + q[0], 0) / p.length, cy = p.reduce((a, q) => a + q[1], 0) / p.length;
  const iv = P.reduce((b, q, i) => Math.hypot(q[0] - cx, q[1] - cy) < Math.hypot(P[b][0] - cx, P[b][1] - cy) ? i : b, 0);
  const df = (((cum[iv] - S0) % L) + L) % L;
  return { path: polyPath(p), reach: Math.min(df, L - df), d: Math.hypot(cx - MEET[0], cy - MEET[1]) };
});

// ---------- timeline
const END = 12.8;
const GH0 = 0, GH1 = 0.4, GHOST = 0.24;                    // the whole outline glows in faintly from black
const TR0 = 0.05, TR1 = 1.85;                              // coastline trace: the heads meet just as the portal completes
const PU0 = TR1 + 0.04, PU1 = PU0 + 0.56;                  // a pulse rings once round the closed outline
const FILL0 = 1.95, FILLV = 800, FILLMAX = 660;            // gold front sweeps the land from Cabo
const FIN0 = 10.15, FIN1 = 10.9;                           // a last run along the whole route
const SWELL = 11.02;                                       // gold swell when the run ends
const WIPE0 = 11.5, WIPE1 = 12.3, Q0 = 230, Q1 = 1360, FEATHER = 170;   // closing wipe along the NW-SE axis
const OUT0 = 12.25;
const traceD = t => (L / 2) * sine((t - TR0) / (TR1 - TR0));
const qOf = (x, y) => 0.85 * x + 0.5 * y;
const tWipe = (x, y) => WIPE0 + (WIPE1 - WIPE0) * (qOf(x, y) - Q0) / (Q1 - Q0);

// ---------- places: pin, hero window in open sea/sky, parked window at the rim
const ORDER = ['cabos', 'cobre', 'monarca', 'cdmx', 'palenque', 'chichen'];
const TPIN = [2.4, 3.8, 5.05, 6.3, 7.55, 8.8];            // a longer first beat, then 1.25 s per place
// heroes alternate between three open spots (Pacific west of Cabo, the sky above the north,
// the Gulf) so the lower band, where the title sits, stays calm; every window stays above y≈780
const HERO = { cabos: [215, 655], cobre: [585, 252], monarca: [795, 405], cdmx: [585, 252], palenque: [795, 405], chichen: [640, 255] };
const PARK = { cabos: [178, 566], cobre: [392, 180], monarca: [430, 735], cdmx: [738, 598], palenque: [850, 560], chichen: [905, 452] };
const LIFT = 40;                                           // the whole map sits a little high, clear of the title
const RH = 116, RP = 54, SETTLE = 0.55;
const NP = ORDER.length;
const PL = ORDER.map((k, i) => {
  const pin = LM[k], H = HERO[k], K = PARK[k];
  const S = i < NP - 1 ? TPIN[i + 1] + 0.3 : TPIN[i] + 1.5;           // settle starts while the next window opens
  // settle path bows away from the centre of the map
  const mx = (H[0] + K[0]) / 2, my = (H[1] + K[1]) / 2, dx = K[0] - H[0], dy = K[1] - H[1], dl = Math.hypot(dx, dy) || 1;
  let nx = -dy / dl, ny = dx / dl; if (nx * (mx - C) + ny * (my - C) < 0) { nx = -nx; ny = -ny; }
  const ctrl = [mx + nx * 0.18 * dl, my + ny * 0.18 * dl];
  const tp = FIN0 + (FIN1 - FIN0) * Math.acos(1 - 2 * i / (NP - 1)) / Math.PI;   // when the last run passes
  const qmin = Math.min(qOf(K[0], K[1]) - RP * 1.1, qOf(pin[0], pin[1]) - 12);
  const tc = Math.max(FIN1 + 0.3, WIPE0 + (WIPE1 - WIPE0) * (qmin - Q0) / (Q1 - Q0) - 0.52);   // fold back before the wipe arrives
  return { key: k, i, pin, H, K, T: TPIN[i], S, ctrl, tp, tc };
});
// flight arcs between consecutive pins: a gentle upward bow, near-flat for short hops
PL.forEach((p, i) => {
  if (!i) return;
  const a = PL[i - 1].pin, b = p.pin, dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
  let nx = dy / len, ny = -dx / len; if (ny > 0) { nx = -nx; ny = -ny; }
  const off = len < 80 ? 0.1 * len : 0.22 * len;
  p.ctrl2 = [(a[0] + b[0]) / 2 + nx * off, (a[1] + b[1]) / 2 + ny * off];
  p.fly = clamp(0.28 + len / 900, 0.3, 0.62);
});
const bez = (i, u) => { const a = PL[i - 1].pin, b = PL[i].pin, c = PL[i].ctrl2, v = 1 - u; return [v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]; };
const q2 = (a, c, b, u) => { const v = 1 - u; return [v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]; };

// ---------- the field of points that fills the land (16 px hex pitch)
const dotSprite = (core, col) => {
  const s = document.createElement('canvas'); s.width = s.height = 16; const g = s.getContext('2d');
  const grd = g.createRadialGradient(8, 8, 0, 8, 8, 8);
  grd.addColorStop(0, rgba(core, 1)); grd.addColorStop(0.4, rgba(col, 0.9)); grd.addColorStop(1, rgba(col, 0));
  g.fillStyle = grd; g.fillRect(0, 0, 16, 16); return s;
};
const DOT = dotSprite([225, 255, 255], TURQ);
const GDOT = dotSprite([255, 228, 150], GOLD);            // the same point of light, tinted gold (no white core)
const DOTS = (() => {
  const g = document.createElement('canvas').getContext('2d'); g.canvas.width = g.canvas.height = W; g.lineWidth = 14;
  const R = HG.rng(42), sp = 16, rh = sp * Math.sqrt(3) / 2, out = [];
  for (let row = 0, y = 110; y < 970; y += rh, row++)
    for (let x = 50 + (row % 2) * sp / 2; x < 1030; x += sp)
      if (g.isPointInPath(LAND, x, y) && !g.isPointInStroke(COAST, x, y))
        out.push({ x, y, ta: FILL0 + Math.hypot(x - MEET[0], y - MEET[1]) / FILLV, ph: R() * 6.283, q: qOf(x, y) });
  return out;
})();

// motes that rise off the map where the closing wipe passes (coast and land)
const EVAP = (() => {
  const R = HG.rng(77), out = [];
  const push = (x, y, k) => out.push({ x, y, tb: tWipe(x, y) - 0.03, vx: (R() - 0.5) * 30, vy: 45 + R() * 70, s: (k ? 8 : 6) + R() * (k ? 8 : 5),
    life: 0.32 + R() * 0.38, gold: R() < 0.32, a: k ? 1 : 0.7, ph: R() * 6.28 });
  const N = 620; for (let j = 0; j < N; j++) { const p = at((j + R()) * L / N); push(p[0], p[1], 1); }
  for (let j = 0; j < DOTS.length; j += 3) push(DOTS[j].x, DOTS[j].y, 0);
  return out;
})();

// ---------- drawing helpers
function glowStroke(build, color, core, { width = 7, blur = 7, coreW = 2.2, alpha = 1, glowA = 0.6 } = {}) {
  if (alpha <= 0.003) return;
  ctx.save(); add(ctx); ctx.lineJoin = ctx.lineCap = 'round';
  ctx.filter = `blur(${blur}px)`; ctx.globalAlpha = Math.min(1, alpha * glowA); ctx.strokeStyle = rgba(color, 1); ctx.lineWidth = width;
  const draw = () => { if (build instanceof Path2D) ctx.stroke(build); else { ctx.beginPath(); build(ctx); ctx.stroke(); } };
  draw();
  ctx.filter = 'none'; ctx.globalAlpha = Math.min(1, alpha); ctx.strokeStyle = rgba(core, 1); ctx.lineWidth = coreW;
  draw();
  ctx.restore();
}
const spark = (x, y, color, size, alpha) => HG.dot(ctx, color, x, y, size, alpha);

// comet head running along the coast; dir = +1 forward / -1 backward
function head(s, dir, color, speed, alpha) {
  const tail = clamp(speed * 0.12, 18, 190), N = 22;
  ctx.save(); add(ctx);
  for (let j = N; j >= 1; j--) {
    const f = j / N, p = at(s - dir * tail * f);
    spark(p[0], p[1], mix(color, ICE, f), lerp(22, 5, f), alpha * (1 - f) * 0.8);
  }
  const p = at(s);
  spark(p[0], p[1], color, 70, alpha * 0.75);
  spark(p[0], p[1], WHITE, 16, alpha);
  ctx.restore();
}

function ripple(x, y, k, color, { r0 = 4, r1 = 40, squash = 0.5, alpha = 0.8, width = 2 } = {}) {
  if (k <= 0 || k >= 1 || alpha <= 0.003) return;
  const r = lerp(r0, r1, ease.out3(k)), a = alpha * (1 - k) * (1 - k);
  ctx.save(); add(ctx); ctx.globalAlpha = a; ctx.strokeStyle = rgba(color, 1); ctx.lineWidth = width;
  ctx.filter = 'blur(1.5px)'; ctx.beginPath(); ctx.ellipse(x, y, r, r * squash, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}

// a solid line of light: warm at the pin, gold toward the window
function leader(x0, y0, x1, y1, alpha) {
  if (alpha <= 0.003 || Math.hypot(x1 - x0, y1 - y0) < 2) return;
  ctx.save(); add(ctx); ctx.lineCap = 'round';
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, rgba(WARM, 1)); g.addColorStop(1, rgba(GOLD, 0.75));
  ctx.strokeStyle = g;
  ctx.filter = 'blur(3px)'; ctx.globalAlpha = 0.45 * alpha; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.filter = 'none'; ctx.globalAlpha = 0.85 * alpha; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.restore();
}

// a round window: dark lens that hides what is behind, the image with its vignette,
// a faint inner gold glow and a rim of light
function drawWindow(img, x, y, R, { alpha = 1, zoom = 1, rim = 0.75, rimW = 2.4, inner = 0.3, reveal = 1, lift = 0, gold = 0 } = {}) {
  if (R < 1.5 || alpha <= 0.003) return;
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  const lens = ctx.createRadialGradient(x, y, R * 0.94, x, y, R * 1.14);
  lens.addColorStop(0, `rgba(0,0,0,${0.9 * alpha})`); lens.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lens; ctx.beginPath(); ctx.arc(x, y, R * 1.14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = `rgba(0,0,0,${0.9 * alpha})`; ctx.fill();
  const s = 2 * R * zoom;
  ctx.globalAlpha = alpha * reveal; ctx.imageSmoothingQuality = 'high';
  // small parked windows get a saturation / brightness lift so the places still read on the LEDs
  if (lift > 0.01) ctx.filter = `saturate(${(1 + 0.45 * lift).toFixed(3)}) brightness(${(1 + 0.22 * lift).toFixed(3)}) contrast(${(1 + 0.08 * lift).toFixed(3)})`;
  ctx.drawImage(img, x - s / 2, y - s / 2, s, s);
  ctx.filter = 'none';
  if (inner > 0) {
    add(ctx); ctx.globalAlpha = alpha * reveal;
    const g = ctx.createRadialGradient(x, y, R * 0.62, x, y, R);
    g.addColorStop(0, rgba(GOLD, 0)); g.addColorStop(0.8, rgba(GOLD, 0.35 * inner)); g.addColorStop(1, rgba(GOLD, 0.8 * inner));
    ctx.fillStyle = g; ctx.fillRect(x - R, y - R, 2 * R, 2 * R);
  }
  ctx.restore();
  // the gold pop as the last run passes: a wide pure-gold halo round the rim, under it
  if (gold > 0.02) glowStroke(c => c.arc(x, y, R + 2, 0, Math.PI * 2), GOLD, GOLD, { width: 22, blur: 11, coreW: 4, alpha: 0.95 * gold * alpha, glowA: 0.75 });
  glowStroke(c => c.arc(x, y, R, 0, Math.PI * 2), GOLD, mix(GOLD, WHITE, 0.4 * (1 - gold)), { width: rimW * 3, blur: 6, coreW: rimW, alpha: alpha * rim, glowA: 0.8 });
}

// the state of a place's window at time t: centre, radius and how it is drawn
function windowState(p, t) {
  const { T, S, H, K, pin, tc } = p;
  if (t < T + 0.2) return null;
  const open = ease.out3((t - T - 0.2) / 0.4);              // bloom
  const set = ease.inOut3((t - S) / SETTLE);                // settle to the rim
  const fold = ease.in3((t - tc) / 0.5);                    // fold back into the pin
  if (fold >= 1) return null;
  let [x, y] = set > 0 ? q2(H, p.ctrl, K, set) : H;
  let R = lerp(RH, RP, set) * lerp(0.22, 1, open);
  const pop = gauss(t - p.tp, 0.12);                        // the last run passes
  R *= 1 + 0.06 * pop;
  if (fold > 0) { x = lerp(x, pin[0], fold); y = lerp(y, pin[1], fold); R *= 1 - fold; }
  const focus = 1 - set;
  return { x, y, R, open, set, fold, focus, pop };
}

HG.start({
  duration: 12.8,                                     // = END
  assets: Object.fromEntries(ORDER.map(k => [k, `../assets/02-mapa-${k}.png`])),
  render(t, A) {
    const z = 1 + 0.03 * sine(t / END);                 // slow push-in
    ctx.setTransform(z, 0, 0, z, C - C * z, C - C * z - 10 * sine(t / END) - LIFT);
    add(ctx);                                            // everything is light: additive by default
    const swell = gauss(t - SWELL, 0.32);               // gold swell after the last run
    const fillR = FILLV * (t - FILL0);
    const ghostIn = smooth(GH0, GH1, t);                 // the faint whole outline, from black
    const d = traceD(t), closed = t >= TR1;
    const gOn = smooth(FIN0 - 0.1, FIN0 + 0.25, t) * (1 - smooth(SWELL + 0.05, SWELL + 0.4, t));   // the gold wave is running
    const landTurq = 1 - 0.3 * gOn - 0.5 * swell;       // the turquoise land layers step back while the gold passes

    // ---- the Tropic of Cancer: one confident line over the sea, opening out from Cabo,
    // with a slow highlight gliding along it
    if (t > FILL0) {
      const reach = FILLV * 1.1 * (t - FILL0), y = DATA.tropic_y;
      ctx.save(); add(ctx); ctx.clip(SEA, 'evenodd'); ctx.lineCap = 'round';
      const g = ctx.createLinearGradient(70, 0, 1010, 0);
      g.addColorStop(0, rgba(ICE, 0)); g.addColorStop(0.16, rgba(ICE, 1)); g.addColorStop(0.84, rgba(ICE, 1)); g.addColorStop(1, rgba(ICE, 0));
      ctx.strokeStyle = g;
      const x0 = Math.max(70, MEET[0] - reach), x1 = Math.min(1010, MEET[0] + reach);
      const line = () => { ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); };
      for (const [w, b, a] of [[8, 5, 0.16], [2, 0, 0.4]]) {
        ctx.filter = b ? `blur(${b}px)` : 'none'; ctx.globalAlpha = a; ctx.lineWidth = w; line();
      }
      // the highlight: a soft bright stretch drifting west to east
      const hp = (t - FILL0 - 0.6) / 4.2, hx = lerp(40, 1040, hp - Math.floor(hp)), hg = ctx.createLinearGradient(hx - 130, 0, hx + 130, 0);
      hg.addColorStop(0, rgba(ICE, 0)); hg.addColorStop(0.5, rgba(ICE, 1)); hg.addColorStop(1, rgba(ICE, 0));
      ctx.strokeStyle = hg; ctx.globalAlpha = 0.5 * smooth(FILL0 + 0.6, FILL0 + 1.2, t);
      for (const [w, b] of [[9, 5], [2.4, 0]]) { ctx.filter = b ? `blur(${b}px)` : 'none'; ctx.lineWidth = w; line(); }
      ctx.restore();
    }

    // ---- the ghost: from the very first frames the whole land glows faintly, with a soft
    // turquoise breath at its heart, so the portal opens onto Mexico
    if (ghostIn > 0) {
      const breath = HG.window(t, 0.05, 2.5, 0.45, 0.7);
      ctx.save(); add(ctx); ctx.clip(LAND);
      ctx.globalAlpha = 0.05 * ghostIn * landTurq; ctx.fillStyle = rgba(TURQ, 1); ctx.fillRect(0, 0, W, W);
      if (breath > 0) {
        const bg = ctx.createRadialGradient(540, 560, 0, 540, 560, 330);
        bg.addColorStop(0, rgba(TURQ, 0.16)); bg.addColorStop(0.55, rgba(TURQ, 0.07)); bg.addColorStop(1, rgba(TURQ, 0));
        ctx.globalAlpha = breath; ctx.fillStyle = bg; ctx.fillRect(0, 0, W, W);
      }
      ctx.restore();
    }

    // ---- land: soft fill, and a lit inner edge that follows the trace and stays
    const fillOn = smooth(FILL0 + 0.2, FILL0 + 1.1, t), edgeOn = smooth(TR0, TR0 + 0.3, t);
    if (edgeOn > 0 && d > 0.5) {
      ctx.save(); add(ctx);
      if (fillOn > 0) { ctx.globalAlpha = 0.055 * fillOn * landTurq; ctx.fillStyle = rgba(TURQ, 1); ctx.fill(LAND); }   // on top of the ghost's 0.05
      ctx.clip(LAND); ctx.globalAlpha = 0.3 * edgeOn * landTurq; ctx.strokeStyle = rgba(TURQ, 1); ctx.lineWidth = 30; ctx.filter = 'blur(13px)';
      if (closed) ctx.stroke(COAST); else { ctx.beginPath(); rangePath(ctx, S0 - d, S0 + d); ctx.stroke(); }
      ctx.restore();
    }

    // ---- field of points: lit by the gold front, then a slow NW-SE shimmer; at the end a
    // gold wave runs through it NW -> SE with the last run and the land breathes gold
    if (t > FILL0 - 0.05) {
      const lit = PL.map(p => ({ x: p.pin[0], y: p.pin[1], w: HG.window(t, p.T - 0.05, p.S + 0.4, 0.3, 0.7) })).filter(q => q.w > 0.01);
      const wv = (t - 2.9) / 3.4, qw = lerp(-100, 1500, wv - Math.floor(wv)), wvOn = smooth(2.9, 3.8, t) * (1 - smooth(FIN0 - 0.6, FIN0, t));
      const gq = lerp(150, 1330, clamp((t - FIN0 + 0.05) / (SWELL + 0.2 - FIN0)));          // the gold wave's position along q
      ctx.save(); add(ctx);
      for (const d of DOTS) {
        const on = smooth(d.ta - 0.02, d.ta + 0.16, t);
        if (on <= 0) continue;
        let a = on * (0.57 + 0.08 * Math.sin(d.x * 0.011 + d.y * 0.017 - t * 1.5 + d.ph * 0.3));
        a += 0.18 * wvOn * gauss(d.q - qw, 120);
        for (const q of lit) { const dd = (d.x - q.x) ** 2 + (d.y - q.y) ** 2; if (dd < 16000) a += 0.32 * q.w * Math.exp(-dd / 4500); }
        const gk = Math.min(1, gOn * gauss(d.q - gq, 170) + 0.75 * swell);                  // how gold this point is
        a = Math.min(1, a * (1 + 0.6 * gk));
        if (gk < 0.99) { ctx.globalAlpha = a * (1 - gk); ctx.drawImage(DOT, d.x - 5.5, d.y - 5.5, 11, 11); }
        if (gk > 0.01) { const s = 11 + 4 * gk; ctx.globalAlpha = a * gk; ctx.drawImage(GDOT, d.x - s / 2, d.y - s / 2, s, s); }
        const fl = gauss(t - d.ta, 0.045);
        if (fl > 0.03) spark(d.x, d.y, GOLD, 12, fl * 0.5);
      }
      ctx.restore();
    }
    // the gold fill front: an arc of light round Cabo, clipped to the land
    if (fillR > 0 && fillR < FILLMAX + 40) {
      const fa = smooth(0, 40, fillR) * (1 - smooth(FILLMAX - 120, FILLMAX + 30, fillR));
      ctx.save(); ctx.clip(LAND);
      glowStroke(c => c.arc(MEET[0], MEET[1], fillR, 0, Math.PI * 2), GOLD, WARM, { width: 16, blur: 10, coreW: 2.4, alpha: 0.95 * fa, glowA: 0.55 });
      ctx.restore();
    }

    // ---- coastline drawn in light
    const coastA = t < TR1 ? 1 : lerp(1, 0.9, smooth(TR1 + 0.6, TR1 + 1.6, t)) + 0.12 * swell;
    const coastC = TURQ, coreC = ICE;                   // the coast stays turquoise / ice: the warmth lives in the land
    // the ghost outline (and islands): only the part the heads have not lit yet, so they
    // turn ghost into light without doubling up
    const ghA = GHOST * ghostIn;
    if (ghA > 0.003 && !closed) {
      glowStroke(d > 0.5 ? c => rangePath(c, S0 + d, S0 + L - d) : COAST, TURQ, ICE, { width: 9, blur: 8, coreW: 2.2, alpha: ghA, glowA: 0.9 });
      for (const isl of ISL) { const a = ghA * 0.8 * (1 - clamp((d - isl.reach) / 60)); if (a > 0.003) glowStroke(isl.path, TURQ, ICE, { width: 6, blur: 5, coreW: 1.8, alpha: a, glowA: 0.8 }); }
    }
    // the gold pulse that rings the closed outline (both ways from Cabo) takes the place of the
    // ice line where it runs, so it reads gold rather than white
    const pu = s => (L / 2) * (1 - Math.pow(1 - clamp((s - PU0) / (PU1 - PU0)), 1.6));
    const pa = 1 - smooth(PU1 - 0.1, PU1 + 0.3, t), puOn = t > PU0 && t < PU1 + 0.35;
    if (d > 0.5) {
      const style = { width: 8, blur: 8, coreW: 2.4, glowA: 0.62 };
      if (!closed) glowStroke(c => rangePath(c, S0 - d, S0 + d), coastC, coreC, { ...style, alpha: coastA });
      else if (!puOn) glowStroke(COAST, coastC, coreC, { ...style, alpha: coastA });
      else {
        const ga = pu(t - 0.3), gb = pu(t);
        glowStroke(c => { if (ga > 0.5) rangePath(c, S_MEET - ga, S_MEET + ga); if (L - 2 * gb > 0.5) rangePath(c, S_MEET + gb, S_MEET + L - gb); }, coastC, coreC, { ...style, alpha: coastA });
        if (gb - ga > 0.5) glowStroke(c => { rangePath(c, S_MEET + ga, S_MEET + gb); rangePath(c, S_MEET - gb, S_MEET - ga); }, coastC, coreC, { ...style, alpha: coastA * (1 - pa) });
      }
      for (const isl of ISL) {
        const a = clamp((d - isl.reach) / 60) * coastA;
        if (a > 0) glowStroke(isl.path, coastC, coreC, { width: 6, blur: 5, coreW: 1.8, alpha: a * 0.9, glowA: 0.5 });
      }
    }
    // the freshly drawn coast is hotter, cooling over ~0.4 s
    if (t > TR0 && t < TR1 + 0.45) {
      for (const [a, b, k] of [[0.42, 0.2, 0.22], [0.2, 0, 0.45]]) {
        const da = traceD(t - a), db = traceD(t - b);
        if (db - da < 0.5) continue;
        glowStroke(c => { rangePath(c, S0 + da, S0 + db); rangePath(c, S0 - db, S0 - da); }, ICE, mix(ICE, WHITE, 0.5), { width: 10, blur: 9, coreW: 2.6, alpha: k, glowA: 0.7 });
      }
    }
    // the ring: one pulse runs round the finished outline in both directions from Cabo
    if (puOn) {
      for (const [a, b, k, col, core] of [[0.3, 0.07, 0.75, GOLD, GOLD], [0.07, 0, 0.95, GOLD, mix(GOLD, WARM, 0.5)]]) {
        const da = pu(t - a), db2 = pu(t - b);
        if (db2 - da < 0.5) continue;
        glowStroke(c => { rangePath(c, S_MEET + da, S_MEET + db2); rangePath(c, S_MEET - db2, S_MEET - da); }, col, core, { width: 12, blur: 9, coreW: 2.8, alpha: k * pa, glowA: 0.75 });
      }
      if (t < PU1) {
        const s1 = pu(t), f = clamp((t - PU0) / (PU1 - PU0));
        ctx.save(); add(ctx);
        for (const dir of [1, -1]) { const p = at(S_MEET + dir * s1); spark(p[0], p[1], GOLD, 50, 0.6 * pa * (1 - 0.3 * f)); spark(p[0], p[1], WARM, 12, 0.8 * pa); }
        ctx.restore();
      }
      for (const isl of ISL) {            // islands catch the ring as it passes them
        const k = gauss(t - (PU0 + (PU1 - PU0) * (1 - Math.pow(isl.reach / (L / 2), 1 / 1.6))), 0.12);
        if (k > 0.05) glowStroke(isl.path, GOLD, WHITE, { width: 7, blur: 5, coreW: 1.8, alpha: 0.6 * k, glowA: 0.6 });
      }
    }
    // glitter shed by the heads (emitted on a fixed 60 Hz grid, so every frame is independent)
    if (t > TR0 && t < TR1 + 0.7) {
      const k0 = Math.floor(t * 60);
      ctx.save(); add(ctx);
      for (let k = k0; k > k0 - 42; k--) {
        const tau = k / 60, age = t - tau; if (tau < TR0 || tau > TR1) continue;
        const sp = (traceD(tau + 1 / 60) - traceD(tau - 1 / 60)) * 30, dd = traceD(tau);
        for (const dir of [1, -1]) {
          const R = HG.rng(k * 13 + (dir > 0 ? 3 : 7));
          for (let m = 0; m < 2; m++) {
            const a = R() * 6.283, v = 10 + R() * 34, life = 0.35 + R() * 0.35;
            if (age > life) { R(); continue; }
            const p = at(S0 + dir * dd), f = age / life;
            const x = p[0] + Math.cos(a) * v * age, y = p[1] + Math.sin(a) * v * age + 14 * age * age;
            spark(x, y, R() < 0.5 ? (dir > 0 ? GOLD : TURQ) : ICE, 7 - 3 * f, 0.7 * (1 - f) * (1 - f) * clamp(sp / 500));
          }
        }
      }
      ctx.restore();
    }
    // the two heads, and their meeting at Cabo San Lucas
    if (t > TR0 - 0.05 && t < TR1 + 0.3) {
      const sp = (traceD(t + 1 / 60) - traceD(t - 1 / 60)) * 30;
      const ha = smooth(TR0 - 0.05, TR0 + 0.35, t) * (1 - smooth(TR1 - 0.05, TR1 + 0.3, t));
      head(S0 + d, +1, GOLD, sp, ha);
      head(S0 - d, -1, TURQ, sp, ha);
    }
    ctx.save(); add(ctx);
    // the start: a big warm bloom at the tip of Yucatán that lasts until the portal's ring sweeps past it
    if (t < 1.25) { const k = HG.window(t, 0, 1.25, 0.3, 0.4); spark(START[0], START[1], WARM, 125, 0.42 * k); spark(START[0], START[1], GOLD, 46, 0.5 * k); }
    if (t > TR1 - 0.2 && t < TR1 + 0.8) {
      spark(MEET[0], MEET[1], WARM, 130, 0.42 * HG.window(t, TR1 - 0.2, TR1 + 0.8, 0.25, 0.5));
    }
    ctx.restore();
    if (t > TR1 - 0.05 && t < TR1 + 1.4) {
      ripple(MEET[0], MEET[1], (t - TR1) / 1.1, GOLD, { r1: 90, squash: 1, alpha: 0.7, width: 2.5 });
      ripple(MEET[0], MEET[1], (t - TR1 - 0.18) / 1.2, WARM, { r1: 140, squash: 1, alpha: 0.4, width: 1.8 });
    }

    // ---- route: flight arcs between consecutive places, and the traveller
    const fin = (t - FIN0) / (FIN1 - FIN0), g = (NP - 1) * sine(fin);
    for (let i = 1; i < NP; i++) {
      const p = PL[i], t1 = p.T, t0 = t1 - p.fly, u = ease.inOut3((t - t0) / (t1 - t0));
      if (u <= 0) continue;
      const build = c => { const N = 40; for (let j = 0; j <= N; j++) { const q = bez(i, u * j / N); j ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); } };
      const runLit = fin > 0 && fin < 1.3 ? 0.35 * gauss(g - (i - 0.5), 0.9) * (1 - smooth(1, 1.3, fin)) : 0;
      glowStroke(build, GOLD, mix(GOLD, WHITE, 0.3), { width: 5, blur: 5, coreW: 1.6, alpha: (u < 1 ? 0.9 : 0.5) + runLit, glowA: 0.7 });
      if (u < 1) {
        ctx.save(); add(ctx);
        for (let j = 10; j >= 1; j--) { const q = bez(i, Math.max(0, u - j * 0.024)); spark(q[0], q[1], GOLD, lerp(18, 5, j / 10), 0.6 * (1 - j / 10)); }
        const q = bez(i, u); spark(q[0], q[1], GOLD, 56, 0.8); spark(q[0], q[1], WHITE, 13, 1);
        ctx.restore();
      }
    }
    if (fin > 0 && fin < 1) {                             // the last run: a warm comet over the whole route
      const pos = gg => { const ii = Math.min(NP - 1, Math.max(1, Math.ceil(gg))); return bez(ii, clamp(gg - (ii - 1))); };
      const env = Math.sin(Math.PI * clamp(fin * 1.15)) ** 0.4;
      ctx.save(); add(ctx);
      for (let j = 16; j >= 1; j--) { const gg = g - j * 0.035; if (gg <= 0) continue; const p = pos(gg); spark(p[0], p[1], WARM, lerp(26, 6, j / 16), 0.6 * (1 - j / 16) * env); }
      const q = pos(g); spark(q[0], q[1], GOLD, 80, 0.7 * env); spark(q[0], q[1], WHITE, 14, 0.85 * env);
      ctx.restore();
    }

    // ---- places: leaders, pins, windows
    const W8 = PL.map(p => windowState(p, t));
    // leaders under everything else
    PL.forEach((p, i) => {
      const w = W8[i]; if (!w) return;
      const [px, py] = p.pin, dx = w.x - px, dy = w.y - py, dl = Math.hypot(dx, dy);
      if (dl <= w.R + 2) return;
      const grow = ease.out3((t - p.T - 0.05) / 0.35);
      const ex = w.x - dx / dl * w.R, ey = w.y - dy / dl * w.R;
      const lx = lerp(px, ex, grow), ly = lerp(py, ey, grow);
      leader(px, py, lx, ly, (0.75 + 0.25 * w.focus) * (1 - smooth(0.6, 0.95, w.fold)));
      if (grow < 1) { ctx.save(); add(ctx); spark(lx, ly, WARM, 22, 0.9); ctx.restore(); }
    });
    // pins: a bright point with a halo; a pillar of light rises briefly when the traveller lands
    PL.forEach((p, i) => {
      const T = p.T; if (t < T - 0.05) return;
      const [px, py] = p.pin;
      const fold = smooth(p.tc + 0.35, p.tc + 0.7, t);
      const pop = ease.outBack((t - T) / 0.35), pinA = smooth(T - 0.05, T + 0.12, t);
      if (pinA <= 0) return;
      const runP = gauss(t - p.tp, 0.12);
      const pil = HG.window(t, T, T + 0.75, 0.12, 0.5);
      if (pil > 0) {
        const bh = 46 * ease.out3((t - T) / 0.5);
        ctx.save(); add(ctx);
        const gr = ctx.createLinearGradient(px, py, px, py - bh - 1);
        gr.addColorStop(0, rgba(WARM, 0.9)); gr.addColorStop(1, rgba(GOLD, 0));
        ctx.globalAlpha = pil * pinA; ctx.fillStyle = gr; ctx.fillRect(px - 1.3, py - bh, 2.6, bh);
        ctx.restore();
      }
      ripple(px, py, (t - T) / 0.9, GOLD, { r1: 36, alpha: 0.85 * pinA });
      if (runP > 0.03) ripple(px, py, (t - p.tp + 0.05) / 0.6, GOLD, { r1: 30, alpha: 0.8 * pinA });
      ctx.save(); add(ctx);
      ctx.globalAlpha = 0.32 * pinA * (1 + runP); ctx.strokeStyle = rgba(GOLD, 1); ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(px, py, 8 * Math.max(0, pop), 0, Math.PI * 2); ctx.stroke();
      spark(px, py, GOLD, 24 * Math.max(0, pop) * (1 + 0.4 * runP), pinA * 0.85);
      spark(px, py, WHITE, 7 * Math.max(0, pop), pinA * 0.9);
      if (fold > 0 && fold < 1) spark(px, py, WARM, 70 * (1 - fold) + 10, 0.55 * Math.sin(Math.PI * fold));   // landing spark of the folded window
      ctx.restore();
    });
    // windows: parked ones first, the featured ones on top
    const heroOn = W8.reduce((m, w) => Math.max(m, w && !w.fold ? w.focus * w.open : 0), 0);
    const drawOrder = PL.map((p, i) => i).sort((a, b) => (W8[a] ? W8[a].focus : 0) - (W8[b] ? W8[b].focus : 0));
    for (const i of drawOrder) {
      const p = PL[i], w = W8[i]; if (!w) continue;
      const dim = 1 - 0.1 * heroOn * (1 - w.focus);         // parked windows step back a little while a place is featured
      const flareOpen = gauss(t - p.T - 0.45, 0.22);
      const zoom = lerp(1.14, 1.0, w.open) + 0.035 * w.focus * smooth(p.T + 0.6, p.S, t);
      drawWindow(A[p.key], w.x, w.y, w.R, {
        alpha: dim, zoom, reveal: smooth(0, 0.35, w.open),  // an iris that already holds the picture: rim and image open together
        rim: Math.min(1.3, 0.8 + 0.15 * w.focus + 0.6 * flareOpen + 0.5 * w.pop + 0.15 * swell) * smooth(0, 0.35, w.open),
        rimW: 2.2 + 0.6 * w.focus + 1.0 * w.pop, inner: 0.28 + 0.12 * w.focus + 0.45 * w.pop,
        lift: w.set * (1 - w.fold), gold: w.pop * (1 - w.fold),
      });
      // a thin turquoise arc orbits the featured window
      if (w.focus > 0.02 && w.open > 0.3 && !w.fold) {
        const th = t * 0.9 + i * 1.7, R2 = w.R + 10;
        glowStroke(c => c.arc(w.x, w.y, R2, th, th + 2.1 * w.open), TURQ, ICE, { width: 4, blur: 4, coreW: 1.3, alpha: 0.5 * w.focus * w.open, glowA: 0.6 });
      }
      if (w.open > 0 && w.open < 1) ripple(w.x, w.y, (t - p.T - 0.5) / 0.7, GOLD, { r0: w.R, r1: w.R + 22, squash: 1, alpha: 0.55, width: 2 });
      if (w.pop > 0.02) ripple(w.x, w.y, (t - p.tp + 0.06) / 0.65, GOLD, { r0: w.R + 2, r1: w.R + 26, squash: 1, alpha: 0.85, width: 3 });
    }

    // ---- gold swell over the land when the last run ends (soft, no flash): a gold breath
    // that rises from the coast inward, inside the land only (the coast itself stays ice)
    if (swell > 0.01) {
      ctx.save(); add(ctx); ctx.clip(LAND);
      ctx.globalAlpha = 0.07 * swell; ctx.fillStyle = rgba(GOLD, 1); ctx.fillRect(0, 0, W, W);
      ctx.globalAlpha = 0.24 * swell; ctx.strokeStyle = rgba(GOLD, 1); ctx.lineWidth = 50; ctx.filter = 'blur(20px)'; ctx.stroke(COAST);
      ctx.restore();
    }

    // a little ambient dust once the map is complete
    HG.dust(t, { n: 40, colors: [TURQ, GOLD], seed: 5, alpha: 0.14 * smooth(2.6, 4.2, t) * (1 - smooth(SWELL + 0.2, SWELL + 0.9, t)), size: 5, r: 460 });

    // ---- closing: a soft black wipe runs NW -> SE; the map lifts off as light right at its front
    if (t > WIPE0 - 0.1) {
      const front = lerp(Q0, Q1, clamp((t - WIPE0) / (WIPE1 - WIPE0)));
      ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      const nx = 0.85, ny = 0.5, n2 = nx * nx + ny * ny;           // gradient along the q axis
      const gr = ctx.createLinearGradient(nx * (front - FEATHER) / n2, ny * (front - FEATHER) / n2, nx * front / n2, ny * front / n2);
      gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gr; ctx.fillRect(-300, -300, W + 600, W + 600);
      ctx.restore();
      ctx.save(); add(ctx);
      for (const e of EVAP) {
        const age = t - e.tb; if (age <= 0 || age > e.life) continue;
        const f = age / e.life;
        const x = e.x + e.vx * age + 5 * Math.sin(age * 8 + e.ph), y = e.y - e.vy * age - 30 * age * age;
        const a = e.a * smooth(0, 0.06, age) * (1 - f) ** 1.5;
        spark(x, y, e.gold ? GOLD : mix(TURQ, ICE, 0.55), e.s * (1 - 0.35 * f), a);
        if (f < 0.4) spark(x, y, WHITE, e.s * 0.3, a * 0.6);
      }
      ctx.restore();
    }
    const outAll = 1 - smooth(OUT0, END - 0.05, t);
    if (outAll < 1) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1 - outAll; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, W); }
  },
});
</script></body></html>
