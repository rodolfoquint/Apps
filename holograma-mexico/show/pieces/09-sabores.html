<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Sabores: Mexico's gifts to the world. A golden sunburst (straight and flame rays, like a
// resplandor) ignites at the centre. One by one corn, cacao, chile, avocado and vanilla are
// born from the sun with a sparkle pop, are presented for a beat against its rays, then
// glide out along a spiral into a slow carousel orbit. With all five in place the orbit
// flares once; they circle together trailing stardust, then spiral outward and dissolve
// into sparkles while the sun folds back into a last glint.
// Assets: prepare.py on out-show/images/{maiz,cacao,chile,aguacate,vainilla}-1.png
//         -> assets/09-sabores-NAME.png and _lines.png.
const { W, C, ctx, clamp, lerp, smooth, ease, COLORS, rgba } = HG;
const TAU = Math.PI * 2;

const FOODS = [
  { name: 'maiz', fit: 1.0, tint: [255, 196, 60] },
  { name: 'cacao', fit: 0.94, tint: [255, 128, 40] },
  { name: 'chile', fit: 1.02, tint: [255, 70, 40] },
  { name: 'aguacate', fit: 0.9, tint: [170, 225, 70] },
  { name: 'vainilla', fit: 1.0, tint: [240, 228, 140], lift: 0.8 },
];
const GOLD = [255, 192, 84], AMBER = [255, 150, 40], CREAM = [255, 226, 168];

// ---------- timeline
const T0 = 1.05, GAP = 1.2, HOLD = 0.6, GLIDE = 1.2;
const tE = i => T0 + GAP * i;                          // item i is born from the sun
const tArrive = i => tE(i) + HOLD + 0.5 * GLIDE;        // ...and settles into its orbit
const T_FULL = tArrive(4) + 0.1;                       // the ring is complete
const R_ORB = 332, HERO_W = 372, ORB_W = 266, SWEEP = 1.15;
const theta = t => -2.3 + 0.1 * t + 0.6 * ease.in3((t - 9.8) / 2.2);   // carousel angle
const slotAng = (i, t) => theta(t) + i * TAU / 5;
const OUT_A = 9.7, OUT_B = 11.3;                       // drift outward
const DS = i => 9.85 + 0.12 * i, DD = 0.85;            // each item dissolves from its outer side inward
const outK = t => ease.inOut3((t - OUT_A) / (OUT_B - OUT_A));

const outBackSoft = (x, s = 1.1) => { x = clamp(x); return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const glideE = x => ease.out3(x) * smooth(0, 0.3, x);  // eases out of the hold, long settle into the slot
const bump = (t, a, d) => { const x = clamp((t - a) / d); return Math.pow(Math.sin(Math.PI * x), 2); };
const frac = x => x - Math.floor(x);

function itemState(i, t) {
  const dt = t - tE(i);
  if (dt < 0) return null;
  const F = FOODS[i];
  const pop = clamp(dt / 0.6);
  const sPop = lerp(0.5, 1, outBackSoft(pop));
  const g = glideE((dt - HOLD) / GLIDE);
  const end = outK(t);
  const ang = slotAng(i, t) - SWEEP * (1 - g);
  const bob = 7 * Math.sin(TAU * t / 3.1 + i * 1.9);
  const r = (R_ORB + bob) * g * (1 + 0.16 * end);
  const push = 1 + 0.04 * smooth(0, HOLD + 0.4, dt);
  const w = lerp(HERO_W * push, ORB_W, g) * sPop * F.fit * (1 - 0.1 * end);
  const rot = -0.2 * (1 - ease.out3(pop)) + 0.05 * Math.sin(TAU * t / 4.3 + i * 2.3) * g;
  const dis = clamp((t - DS(i)) / DD);
  const alpha = smooth(0, 0.3, dt) * (1 - smooth(DS(i) + DD - 0.05, DS(i) + DD + 0.1, t));
  const flash = smooth(0, 0.1, dt) * (1 - smooth(0.1, 0.65, dt));
  return { x: C + Math.cos(ang) * r, y: C + Math.sin(ang) * r, w, rot, alpha, g, end, dis,
    bloom: 0.26 + 0.16 * flash, rim: 0.16 + 0.3 * flash, halo: 0.42 + 0.22 * flash };
}

// ---------- baked assets (built once from the images: a pure function of the assets)
const N = 640, PAD = 128, NB = N + 2 * PAD;
let PRE = null, STAR = null, STAR_W = null, SUN = null, DL = null, DLc = null, NOISE = null;
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
function canvas(n) { const c = document.createElement('canvas'); c.width = c.height = n; return c; }
function bake(A) {
  PRE = FOODS.map(F => {
    const pc = canvas(N), px = pc.getContext('2d', { willReadFrequently: true });
    px.imageSmoothingQuality = 'high'; px.drawImage(A[F.name], 0, 0, N, N);
    const id = px.getImageData(0, 0, N, N), d = id.data;
    let sx = 0, sy = 0, sw = 0;
    for (let p = 0, k = 0; k < N * N; k++, p += 4) {
      if (F.lift) { for (let c = 0; c < 3; c++) d[p + c] = 255 * Math.pow(d[p + c] / 255, F.lift); d[p] *= 1.06; d[p + 2] *= 0.88; }
      d[p + 3] = Math.min(255, d[p + 3] * 1.6);   // solid inside the silhouette
      const m = Math.max(d[p], d[p + 1], d[p + 2]);
      if (m > 200) { const f = (200 + (m - 200) * 0.45) / m; d[p] *= f; d[p + 1] *= f; d[p + 2] *= f; }
      const a = d[p + 3] / 255; sx += (k % N) * a; sy += Math.floor(k / N) * a; sw += a;
    }
    px.putImageData(id, 0, 0);
    const photo = canvas(NB), ph = photo.getContext('2d'); ph.drawImage(pc, PAD, PAD);
    const bloom = canvas(NB), bl = bloom.getContext('2d'); bl.filter = 'blur(16px)'; bl.drawImage(pc, PAD, PAD);
    // tinted silhouette halo
    const sil = canvas(NB), sl = sil.getContext('2d');
    sl.drawImage(pc, PAD, PAD); sl.globalCompositeOperation = 'source-in'; sl.fillStyle = rgba(F.tint, 1); sl.fillRect(0, 0, NB, NB);
    const shade = canvas(NB), sh = shade.getContext('2d'); sh.filter = 'blur(12px)'; sh.drawImage(sil, 0, 0);
    sh.filter = 'none'; sh.globalCompositeOperation = 'source-in'; sh.fillStyle = '#000'; sh.fillRect(0, 0, NB, NB);
    const halo = canvas(NB), hl = halo.getContext('2d'); hl.filter = 'blur(34px)'; hl.drawImage(sil, 0, 0);
    hl.filter = 'blur(10px)'; hl.globalAlpha = 0.6; hl.drawImage(sil, 0, 0);
    const lines = canvas(NB), ll = lines.getContext('2d');
    ll.filter = 'blur(3px)'; ll.globalAlpha = 0.9; ll.drawImage(A[F.name + '_lines'], PAD, PAD, N, N);
    ll.filter = 'none'; ll.globalAlpha = 1; ll.globalCompositeOperation = 'lighter'; ll.drawImage(A[F.name + '_lines'], PAD, PAD, N, N);
    const ox = sx / sw - N / 2, oy = sy / sw - N / 2, R = HG.rng(41 + FOODS.indexOf(F) * 13), pts = [];
    for (let tries = 0; pts.length < 700 && tries < 200000; tries++) {
      const x = Math.floor(R() * N), y = Math.floor(R() * N), q = (y * N + x) * 4;
      if (d[q + 3] < 160) continue;
      const m = Math.max(d[q], d[q + 1], d[q + 2], 1), qn = v => Math.min(255, Math.round((0.7 * v * 255 / m + 0.3 * 235) / 24) * 24);
      pts.push({ x: x - N / 2 - ox, y: y - N / 2 - oy, col: [qn(d[q]), qn(d[q + 1]), qn(d[q + 2])] });
    }
    const sa = new Uint8Array(N * N); for (let k = 0; k < N * N; k++) sa[k] = d[k * 4 + 3];
    return { photo, bloom, halo, shade, lines, ox, oy, pts, sa };
  });
  STAR = makeStar(CREAM); STAR_W = makeStar(GOLD);
  SUN = HG.layer();
  DLc = canvas(W); DL = DLc.getContext('2d', { willReadFrequently: true });
  // two-octave value noise over item space: gives the dissolving front an organic edge
  const R = HG.rng(77), grid = n => { const g = new Float32Array((n + 1) * (n + 1)); for (let k = 0; k < g.length; k++) g[k] = R(); return g; };
  const g1 = grid(7), g2 = grid(19);
  const vn = (g, n, x, y) => { const X = x * n, Y = y * n, i = Math.min(n - 1, Math.floor(X)), j = Math.min(n - 1, Math.floor(Y));
    const fx = sm(X - i), fy = sm(Y - j), a = g[j * (n + 1) + i], b = g[j * (n + 1) + i + 1], c = g[(j + 1) * (n + 1) + i], d = g[(j + 1) * (n + 1) + i + 1];
    return lerp(lerp(a, b, fx), lerp(c, d, fx), fy); };
  NOISE = new Float32Array(NZ * NZ);
  for (let y = 0; y < NZ; y++) for (let x = 0; x < NZ; x++) NOISE[y * NZ + x] = 0.62 * vn(g1, 7, x / NZ, y / NZ) + 0.38 * vn(g2, 19, x / NZ, y / NZ);
}
const NZ = 200;
// noise at item-space coordinates (pixels of the 640 bake, relative to the item's centroid)
function noiseAt(u, v) {
  const x = clamp((u / NB + 0.5) * (NZ - 1), 0, NZ - 1.001), y = clamp((v / NB + 0.5) * (NZ - 1), 0, NZ - 1.001);
  const i = x | 0, j = y | 0, fx = x - i, fy = y - j, q = j * NZ + i;
  return lerp(lerp(NOISE[q], NOISE[q + 1], fx), lerp(NOISE[q + NZ], NOISE[q + NZ + 1], fx), fy);
}

// a four-point glint: soft core plus thin cross flares
function makeStar(col, S = 160) {
  const c = canvas(S), g = c.getContext('2d'), h = S / 2;
  g.globalCompositeOperation = 'lighter';
  const core = g.createRadialGradient(h, h, 0, h, h, h * 0.42);
  core.addColorStop(0, 'rgba(255,248,230,1)'); core.addColorStop(0.18, rgba(col, 0.85));
  core.addColorStop(0.5, rgba(col, 0.22)); core.addColorStop(1, rgba(col, 0));
  g.fillStyle = core; g.fillRect(0, 0, S, S);
  for (const rot of [0, Math.PI / 2]) {
    g.save(); g.translate(h, h); g.rotate(rot); g.scale(1, 0.045);
    const s = g.createRadialGradient(0, 0, 0, 0, 0, h);
    s.addColorStop(0, 'rgba(255,246,225,0.95)'); s.addColorStop(0.25, rgba(col, 0.55)); s.addColorStop(1, rgba(col, 0));
    g.fillStyle = s; g.beginPath(); g.arc(0, 0, h, 0, TAU); g.fill(); g.restore();
  }
  return c;
}
function star(x, y, size, alpha, img = STAR) {
  if (alpha <= 0.004 || size <= 0.5) return;
  ctx.globalAlpha = Math.min(1, alpha); ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
}

// ---------- the sunburst
function drawSun(t) {
  const g = SUN.ctx; HG.reset(g); g.clearRect(0, 0, W, W);
  const retract = ease.inOut3((t - 10.0) / 1.3);
  let pulse = 0; for (let i = 0; i < 5; i++) pulse += bump(t, tE(i) - 0.05, 0.9);
  pulse += 1.3 * bump(t, T_FULL - 0.1, 1.3);
  const heroDim = FOODS.reduce((m, _, i) => Math.max(m, HG.window(t, tE(i), tE(i) + HOLD + 0.55, 0.25, 0.45)), 0);
  const breath = 1 + 0.04 * Math.sin(TAU * t / 3.6);
  const glowA = smooth(0.3, 1.3, t) * (1 - smooth(10.3, 11.5, t));
  if (glowA <= 0) return 0;
  g.translate(C, C); g.globalCompositeOperation = 'lighter';
  const rot0 = 0.075 * 0.8;
  const ext = (1 + 0.1 * pulse) * breath * (1 - retract);
  const rayK = (i, n, d0) => ease.out3((t - d0 - 0.55 * frac(i / n + 0.25 + rot0 / TAU)) / 0.95);   // sweeps clockwise from the top

  // hairline halo: fine engraved rays, slowly counter-rotating
  { const R = HG.rng(91), rot = -0.045 * t, n = 120;
    const grd = g.createRadialGradient(0, 0, 78, 0, 0, 228);
    grd.addColorStop(0, rgba(CREAM, 0.42)); grd.addColorStop(0.5, rgba(GOLD, 0.18)); grd.addColorStop(1, rgba(AMBER, 0));
    g.strokeStyle = grd; g.lineWidth = 1.1; g.beginPath();
    for (let i = 0; i < n; i++) {
      const len = (34 + 112 * Math.pow(R(), 1.6)) * rayK(i, n, 0.75) * ext, a = rot + i / n * TAU;
      if (len < 1) continue;
      const ca = Math.cos(a), sa = Math.sin(a);
      g.moveTo(ca * 82, sa * 82); g.lineTo(ca * (82 + len), sa * (82 + len));
    }
    g.stroke(); }

  // twelve straight pointed rays alternating with twelve flame rays
  const rot = 0.075 * t, r0 = 70;
  for (let i = 0; i < 24; i++) {
    const a = rot + i / 24 * TAU, k = rayK(i, 24, 0.5);
    if (k <= 0.002) continue;
    const straight = i % 2 === 0, long = i % 4 === 0;
    const L = (straight ? (long ? 132 : 100) : 84) * k * ext;
    if (L < 1) continue;
    g.save(); g.rotate(a);
    const lg = g.createLinearGradient(r0, 0, r0 + L, 0);
    lg.addColorStop(0, rgba(CREAM, 0.8)); lg.addColorStop(0.4, rgba(GOLD, 0.6)); lg.addColorStop(1, rgba(AMBER, 0));
    g.fillStyle = lg; g.beginPath();
    if (straight) {
      const hw = long ? 7 : 5.5;
      g.moveTo(r0, -hw); g.lineTo(r0 + L, 0); g.lineTo(r0, hw);
    } else {
      const steps = 22, ph = t * 2.1 + i, left = [], right = [];
      for (let s = 0; s <= steps; s++) {
        const u = s / steps, x = r0 + u * L, off = 6.5 * Math.sin(u * 3.2 * Math.PI - ph) * Math.pow(u, 0.8);
        const hw = 4.8 * (1 - u) + 0.3;
        left.push([x, off - hw]); right.push([x, off + hw]);
      }
      g.moveTo(left[0][0], left[0][1]);
      for (const p of left) g.lineTo(p[0], p[1]);
      for (let s = right.length - 1; s >= 0; s--) g.lineTo(right[s][0], right[s][1]);
    }
    g.closePath(); g.fill(); g.restore();
  }

  // inner rings, engraved ticks and a ring of kernels
  const ringK = smooth(0.5, 1.4, t) * (1 - smooth(9.95, 10.8, t));
  if (ringK > 0) {
    const sc = (0.6 + 0.4 * smooth(0.5, 1.4, t)) * (1 - 0.55 * retract);
    g.lineWidth = 1.4; g.strokeStyle = rgba(CREAM, 0.7 * ringK);
    g.beginPath(); g.arc(0, 0, 40 * sc, 0, TAU); g.stroke();
    g.lineWidth = 1; g.strokeStyle = rgba(GOLD, 0.5 * ringK);
    g.beginPath(); g.arc(0, 0, 64 * sc, 0, TAU); g.stroke();
    const tr = 0.05 * t; g.lineWidth = 1.2; g.strokeStyle = rgba(GOLD, 0.55 * ringK); g.beginPath();
    for (let i = 0; i < 48; i++) {
      const a = tr + i / 48 * TAU, r1 = 44 * sc, r2 = (i % 4 ? 49 : 53) * sc;
      g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    }
    g.stroke();
    const kr = -0.12 * t;
    for (let i = 0; i < 24; i++) {
      const a = kr + i / 24 * TAU, kk = smooth(0.8 + i / 24 * 0.5, 1.2 + i / 24 * 0.5, t) * (1 - retract);
      HG.dot(g, GOLD, Math.cos(a) * 58 * sc, Math.sin(a) * 58 * sc, 7, 0.8 * kk);  // kernels
    }
  }

  // the core glow: a small hot centre with a long soft falloff, never a flat disc
  const coreR = (190 + 30 * pulse) * (1 - 0.55 * retract) * breath;
  const cg = g.createRadialGradient(0, 0, 0, 0, 0, coreR);
  const hot = (0.8 + 0.2 * Math.min(1, pulse)) * (1 - 0.6 * heroDim) * (1 + 0.6 * bump(t, 10.2, 1.2));
  cg.addColorStop(0, rgba([255, 238, 200], 0.95 * hot)); cg.addColorStop(0.05, rgba(CREAM, 0.75 * hot));
  cg.addColorStop(0.13, rgba(GOLD, 0.36 * hot)); cg.addColorStop(0.3, rgba(AMBER, 0.13 * hot));
  cg.addColorStop(0.6, rgba(AMBER, 0.04 * hot)); cg.addColorStop(1, rgba(AMBER, 0));
  g.fillStyle = cg; g.beginPath(); g.arc(0, 0, coreR, 0, TAU); g.fill();

  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.55 * glowA; ctx.filter = 'blur(26px)'; ctx.drawImage(SUN.cv, 0, 0);
  ctx.globalAlpha = 0.7 * glowA; ctx.filter = 'blur(6px)'; ctx.drawImage(SUN.cv, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = glowA; ctx.drawImage(SUN.cv, 0, 0);
  HG.reset(ctx);
  return glowA;
}

// ---------- the orbit: a fine ring drawn on by a travelling glint
function drawOrbit(t) {
  const k = ease.inOut3((t - 0.7) / 1.7), fade = 1 - smooth(9.9, 10.9, t);
  if (k <= 0 || fade <= 0) return;
  const a0 = -Math.PI / 2, a1 = a0 + TAU * k;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  ctx.strokeStyle = rgba(GOLD, 1);
  ctx.globalAlpha = 0.28 * fade; ctx.lineWidth = 6; ctx.filter = 'blur(7px)';
  ctx.beginPath(); ctx.arc(C, C, R_ORB, a0, a1); ctx.stroke();
  ctx.filter = 'none'; ctx.globalAlpha = 0.34 * fade; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(C, C, R_ORB, a0, a1); ctx.stroke();
  // fine beads riding the carousel
  for (let j = 0; j < 60; j++) {
    const a = theta(t) + j / 60 * TAU + 0.05;
    if (((a - a0) % TAU + TAU) % TAU > TAU * k) continue;
    HG.dot(ctx, GOLD, C + Math.cos(a) * R_ORB, C + Math.sin(a) * R_ORB, 6, 0.4 * fade);
  }
  // the drawing head
  if (k < 1) star(C + Math.cos(a1) * R_ORB, C + Math.sin(a1) * R_ORB, 90, 0.85 * Math.sin(Math.PI * k) * fade);
  // with the ring complete, a sweep of light circles it once
  const sw = clamp((t - T_FULL) / 1.6);
  if (sw > 0 && sw < 1) {
    const ah = -Math.PI / 2 + TAU * ease.inOut3(sw), env = Math.sin(Math.PI * sw);
    for (let j = 0; j < 16; j++) {
      const a = ah - j * 0.035;
      HG.dot(ctx, CREAM, C + Math.cos(a) * R_ORB, C + Math.sin(a) * R_ORB, 22 - j, 0.6 * env * (1 - j / 16));
    }
    star(C + Math.cos(ah) * R_ORB, C + Math.sin(ah) * R_ORB, 110, 0.7 * env);
  }
  ctx.restore();
}

// ---------- sparkles (all stateless)
function popBurst(t, t0, seed, x, y, { n = 46, v = 340, life = 1.25, scale = 1, img = STAR } = {}) {
  const dt = t - t0; if (dt < 0 || dt > life + 0.2) return;
  const R = HG.rng(seed);
  for (let j = 0; j < n; j++) {
    const a = R() * TAU, sp = v * (0.3 + 0.7 * R()), l = life * (0.55 + 0.45 * R()), sz = (12 + 22 * R()) * scale, tw = R() * TAU, dl = R() * 0.08;
    const d = dt - dl; if (d < 0 || d > l) continue;
    const dist = 26 * scale + sp * (1 - Math.exp(-3.4 * d)) / 3.4;
    const al = smooth(0, 0.05, d) * (1 - smooth(0.25 * l, l, d)) * (0.6 + 0.4 * Math.sin(t * 13 + tw));
    star(x + Math.cos(a) * dist, y + Math.sin(a) * dist + 22 * d * d, sz * (1 - 0.45 * d / l), al, j % 3 ? STAR : STAR_W);
  }
}

// the birth glint sits behind the newborn, so the sun flares around it rather than over it
function birthGlints(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const f = bump(t, tE(i) - 0.04, 0.6);
    if (f > 0) star(C, C, 120 + 230 * f, 0.5 * f, STAR_W);
  }
  ctx.restore();
}

function sparkles(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const t0 = tE(i), dt = t - t0;
    // the birth: a soft glint, a ring of light and a spray of sparks
    if (dt > 0 && dt < 1.0) {
      const k = dt / 1.0;
      HG.ring(ctx, C, C, 80 + 250 * ease.out3(k), FOODS[i].tint, { width: 4, blur: 9, alpha: 0.42 * Math.pow(1 - k, 2) });
    }
    popBurst(t, t0, 300 + i * 17, C, C);
    // arriving in its slot: a small settling twinkle around the item
    const ta = tArrive(i);
    if (t > ta - 0.1 && t < ta + 1.2) {
      const s = itemState(i, t);
      popBurst(t, ta, 500 + i * 13, s.x, s.y, { n: 16, v: 150, life: 0.9, scale: 0.7, img: STAR_W });
    }
  }
  ctx.restore();
}

// stardust shed behind each orbiting item
function trails(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const s = itemState(i, t); if (!s) continue;
    const on = smooth(tArrive(i) - 0.2, tArrive(i) + 0.8, t) * s.alpha * (1 - smooth(0, 0.5, s.dis));
    if (on <= 0) continue;
    const R = HG.rng(700 + i * 31), rr = R_ORB * (1 + 0.16 * s.end), base = slotAng(i, t);
    for (let j = 0; j < 26; j++) {
      const ph = R(), side = (R() - 0.5) * 2, sz = 7 + 12 * R(), tw = R() * TAU;
      const u = frac(t * 0.55 + ph);
      const a = base - (0.26 + 0.62 * u) / (1 + 0.16 * s.end);
      const r = rr + side * (8 + 46 * u);
      const al = on * smooth(0, 0.12, u) * Math.pow(1 - u, 1.6) * (0.55 + 0.45 * Math.sin(t * 9 + tw));
      HG.dot(ctx, j % 4 ? GOLD : FOODS[i].tint, C + Math.cos(a) * r, C + Math.sin(a) * r, sz, 0.75 * al);
      if (j % 6 === 0) star(C + Math.cos(a) * r, C + Math.sin(a) * r, sz * 3.2, 0.5 * al);
    }
  }
  ctx.restore();
}

// the end: a glowing front sweeps across each item from its outer side, and the food
// comes apart into sparks of its own colours that drift outward
const DIR = [];
function dirOf(i) {
  if (!DIR[i]) { const s = itemState(i, DS(i)), d = Math.hypot(s.x - C, s.y - C); DIR[i] = [(s.x - C) / d, (s.y - C) / d]; }
  return DIR[i];
}
const HW = s => 0.62 * s.w;                              // half extent used by the front
const AMP = 0.55, front = dis => (1.2 + AMP / 2) - (2.4 + AMP) * dis;   // in units of HW, outer side (+) first
const EDGE = [255, 222, 150], BAND = 0.22;

function dissolve(t) {
  if (t < DS(0)) return;
  const fadeAll = 1 - smooth(11.55, 11.97, t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const P = PRE[i].pts, [dx, dy] = dirOf(i), R = HG.rng(900 + i * 7), mid = itemState(i, DS(i) + DD / 2);
    for (let j = 0; j < 210; j++) {
      const p = P[Math.floor(R() * P.length)], life = 0.5 + 0.45 * R(), sp = 60 + 150 * R(), sw = (R() - 0.3) * 70, sz = 5 + 10 * R(), tw = R() * TAU;
      // when the front reaches this point
      const k = mid.w / N, c = Math.cos(mid.rot), sn = Math.sin(mid.rot);
      const pn = ((p.x * c - p.y * sn) * k * dx + (p.x * sn + p.y * c) * k * dy) / HW(mid) + AMP * (noiseAt(p.x, p.y) - 0.5);
      const s0 = DS(i) + DD * clamp((1.2 + AMP / 2 - pn) / (2.4 + AMP)), age = t - s0;
      if (age < 0 || age > life) continue;
      const st = itemState(i, s0), k0 = st.w / N, c0 = Math.cos(st.rot), s0n = Math.sin(st.rot);
      const x0 = st.x + (p.x * c0 - p.y * s0n) * k0, y0 = st.y + (p.x * s0n + p.y * c0) * k0;
      const m = (1 - Math.exp(-1.7 * age)) / 1.7;
      const x = x0 + (dx * sp - dy * sw) * m, y = y0 + (dy * sp + dx * sw) * m - 18 * age;
      const al = smooth(0, 0.05, age) * (1 - smooth(0.2 * life, life, age)) * (0.65 + 0.35 * Math.sin(t * 11 + tw)) * fadeAll;
      if (j % 9 === 0) star(x, y, sz * 3.4, 0.55 * al);
      else HG.dot(ctx, p.col, x, y, sz, 0.95 * al);
    }
  }
  // the sun folds into a last glint
  const f = bump(t, 10.75, 1.0);
  if (f > 0) star(C, C, 40 + 170 * f, 0.55 * f);
  ctx.restore();
}

function paintFood(c, i, s) {
  const P = PRE[i], k = s.w / N, D = NB * k;
  c.save(); c.translate(s.x, s.y); c.rotate(s.rot); c.translate(-P.ox * k, -P.oy * k);
  c.globalAlpha = 0.8 * s.alpha; c.drawImage(P.shade, -D / 2, -D / 2, D, D);   // a soft matte that parts the rays
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = s.alpha * s.halo; c.drawImage(P.halo, -D / 2, -D / 2, D, D);
  c.globalAlpha = s.alpha * s.bloom; c.drawImage(P.bloom, -D / 2, -D / 2, D, D);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = s.alpha; c.drawImage(P.photo, -D / 2, -D / 2, D, D);
  c.globalCompositeOperation = 'lighter'; c.globalAlpha = s.alpha * s.rim; c.drawImage(P.lines, -D / 2, -D / 2, D, D);
  c.restore();
}

function drawFood(i, s) {
  if (!s || s.alpha <= 0.003) return;
  if (s.dis <= 0) { paintFood(ctx, i, s); return; }
  // paint into a scratch layer, then burn away every pixel the noisy front has passed,
  // leaving a glowing ember edge along it
  const P = PRE[i], k = s.w / N, half = 0.75 * NB * k;
  const x0 = Math.max(0, Math.floor(s.x - half)), y0 = Math.max(0, Math.floor(s.y - half));
  const x1 = Math.min(W, Math.ceil(s.x + half)), y1 = Math.min(W, Math.ceil(s.y + half)), bw = x1 - x0, bh = y1 - y0;
  if (bw <= 0 || bh <= 0) return;
  HG.reset(DL); DL.clearRect(x0, y0, bw, bh);
  paintFood(DL, i, s);
  const img = DL.getImageData(x0, y0, bw, bh), d = img.data;
  const [dx, dy] = dirOf(i), h = HW(s), f = front(s.dis), c = Math.cos(s.rot), sn = Math.sin(s.rot);
  for (let y = 0; y < bh; y++) {
    const ry = y0 + y - s.y;
    for (let x = 0; x < bw; x++) {
      const q = (y * bw + x) * 4; if (d[q + 3] === 0) continue;
      const rx = x0 + x - s.x;
      const u = (rx * c + ry * sn) / k, v = (-rx * sn + ry * c) / k;
      const left = f - ((rx * dx + ry * dy) / h + AMP * (noiseAt(u, v) - 0.5));
      if (left <= 0) { d[q + 3] = 0; continue; }
      if (left < BAND) {
        const sx = Math.round(u + N / 2 + P.ox), sy = Math.round(v + N / 2 + P.oy);
        const inside = sx >= 0 && sy >= 0 && sx < N && sy < N ? P.sa[sy * N + sx] / 255 : 0;   // embers only on the food itself
        const e = 1 - left / BAND, ee = Math.pow(e, 1.4) * inside;
        d[q] = lerp(d[q], EDGE[0], ee); d[q + 1] = lerp(d[q + 1], EDGE[1], ee); d[q + 2] = lerp(d[q + 2], EDGE[2], ee);
        d[q + 3] = Math.max(d[q + 3], 200 * ee) * smooth(0, 0.03, left);
      }
    }
  }
  DL.putImageData(img, x0, y0);
  HG.reset(ctx); ctx.drawImage(DLc, x0, y0, bw, bh, x0, y0, bw, bh);
}

const assets = {};
for (const F of FOODS) { assets[F.name] = `../assets/09-sabores-${F.name}.png`; assets[F.name + '_lines'] = `../assets/09-sabores-${F.name}_lines.png`; }

HG.start({
  duration: 12,
  assets,
  render(t, A) {
    if (!PRE) bake(A);
    HG.dust(t, { n: 70, colors: [GOLD, CREAM], alpha: 0.22 * smooth(1.5, 3.5, t) * (1 - smooth(10.2, 11.4, t)), size: 5, r: 500, seed: 19 });
    drawOrbit(t);
    drawSun(t);
    trails(t);
    birthGlints(t);
    // settled items first, then the one gliding out, the newborn on top
    const states = FOODS.map((_, i) => itemState(i, t));
    const order = [0, 1, 2, 3, 4].filter(i => states[i]).sort((a, b) => states[a].g - states[b].g).reverse();
    for (const i of order) drawFood(i, states[i]);
    sparkles(t);
    dissolve(t);
  },
});
</script></body></html>
