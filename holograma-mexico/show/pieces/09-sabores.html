<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Sabores: Mexico's gifts to the world. A golden sun (a resplandor with a small Piedra del
// Sol medallion) ignites and holds alone for a beat. One by one corn, cacao, chile, avocado
// and vanilla are born from it with a sparkle pop, presented against its rays, then glide
// out and settle along the orbit like jewels on a chain, all lit gold by the sun on the
// side that faces it. With the five in place a light runs round the chain and fills it with
// their colours, the sun's kernel ring answers in the same colours, then the carousel
// speeds up and each gift burns away into embers (counter-clockwise from the top) while the
// sun folds its rays back the same way into a final glint.
// Assets: prepare.py on out-show/images/{maiz,cacao,chile,aguacate,vainilla}-1.png
//         -> assets/09-sabores-NAME.png and _lines.png.
const { W, C, ctx, clamp, lerp, smooth, ease } = HG;
const rgba = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${Math.max(0, Math.min(1, a)).toFixed(4)})`;
const TAU = Math.PI * 2;

// len: on-screen length of each food along its long axis while in orbit
const FOODS = [
  { name: 'maiz', len: 300, tint: [255, 204, 72] },
  { name: 'cacao', len: 262, tint: [255, 136, 52] },
  { name: 'chile', len: 300, tint: [255, 74, 46] },
  { name: 'aguacate', len: 262, tint: [184, 228, 84] },
  { name: 'vainilla', len: 300, tint: [255, 228, 156], lift: true },
];
const GOLD = [255, 192, 84], AMBER = [255, 150, 40], CREAM = [255, 226, 168], RIMC = [255, 188, 92], WARM = [255, 204, 124];

// ---------- timeline
const T0 = 1.65, GAP = 1.1, HOLD = 0.5, GLIDE = 1.15;
const tE = i => T0 + GAP * i;                    // item i is born from the sun
const tArr = i => tE(i) + HOLD + GLIDE;          // ...and has settled on the orbit
const T_FULL = tArr(4);                          // the chain is complete (7.7 s)
const R_ORB = 340, HERO = 1.24, SW = 0.3;
const theta = t => -2.443 + 0.17 * t + 0.55 * ease.in3((t - 9.2) / 2.3);   // carousel angle
const slotAng = (i, t) => theta(t) + i * TAU / 5;
const DS = i => 9.5 + 0.15 * (4 - i), DD = 0.95;   // burn: last born burns first (counter-clockwise from the top)
const endK = t => ease.inOut3((t - 9.2) / 1.8);
const SWEEP_T = T_FULL + 0.05, SWEEP_D = 1.3;      // the light that runs round the finished chain

const outBackSoft = (x, s = 1.0) => { x = clamp(x); return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const glideE = x => ease.out3(x) * smooth(0, 0.35, x);   // leaves the hold gently, long settle into the slot
const bump = (t, a, d) => { const x = clamp((t - a) / d); return Math.pow(Math.sin(Math.PI * x), 2); };
const frac = x => x - Math.floor(x);
const wrapPi = a => a - TAU * Math.round(a / TAU);
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const qc = c => c.map(v => Math.min(255, Math.round(v / 12) * 12));   // quantised colours keep the sprite cache small
const cwTop = a => frac((a + Math.PI / 2) / TAU);                     // 0 at the top, growing clockwise

function itemState(i, t) {
  const dt = t - tE(i);
  if (dt < 0) return null;
  const G = GEO[i];
  const pop = clamp(dt / 0.55);
  const sPop = lerp(0.55, 1, outBackSoft(pop));
  const gx = clamp((dt - HOLD) / GLIDE), g = glideE(gx), rg = ease.inOut3(clamp(gx * 1.12));
  const end = endK(t), slot = slotAng(i, t);
  const ang = slot + SW * (1 - g);                 // swings out from the empty (clockwise) side
  const bob = 3 * Math.sin(TAU * t / 3.1 + i * 1.9);
  const r = (R_ORB + bob) * g + 10 * end;
  const scale = lerp(HERO, 1, g) * sPop * (1 - 0.08 * end);
  // presented near its natural pose, then turns to lie along the orbit and rides with it
  const rot = lerp(G.rHero - 0.16 * (1 - ease.out3(pop)), G.rho + slot - G.phi, rg) + 0.025 * Math.sin(TAU * t / 4.3 + i * 2.3) * g;
  const flash = smooth(0, 0.08, dt) * (1 - smooth(0.08, 0.6, dt));
  return { x: C + Math.cos(ang) * r, y: C + Math.sin(ang) * r, ang, r, k: G.k * scale, rot, g, end, flash,
    alpha: smooth(0, 0.22, dt), dis: clamp((t - DS(i)) / DD) };
}

// ---------- baked assets (built once from the images: a pure function of the assets)
const N = 512, PAD = 96, NB = N + 2 * PAD;
let GEO = null, STAR = null, STAR_W = null, SUN = null, RIM = null, WASH = null, DISF = null, DISE = null;
function mk(n) { const c = document.createElement('canvas'); c.width = c.height = n; return { cv: c, ctx: c.getContext('2d') }; }

// one warm grade for all five photos: greens lean to gold, shadows stay amber, no white blowouts
function grade(F, d) {
  for (let p = 0; p < d.length; p += 4) {
    let r = d[p], g = d[p + 1], b = d[p + 2], a = d[p + 3] / 255;
    if (a === 0) continue;
    if (F.lift) {             // vanilla: the brown pods would vanish on the fan, so lift and warm them
      const L = 0.3 * r + 0.59 * g + 0.11 * b, L2 = 255 * Math.pow(L / 255, 0.6);
      const s = lerp(L2 / Math.max(L, 1), 1, smooth(110, 210, L));
      r *= s * 1.14; g *= s * 1.0; b *= s * 0.74;
      a = Math.min(1, a * 2.3);
    } else a = Math.min(1, a * 1.6);
    const gg = Math.max(0, g - r);
    r += 0.38 * gg; g -= 0.05 * gg; b *= 0.88;
    const L = 0.3 * r + 0.59 * g + 0.11 * b, sh = Math.pow(1 - clamp(L / 110), 2);
    r += 24 * sh; g += 10 * sh; b += 2 * sh; r *= 1.03;
    const m = Math.max(r, g, b);
    if (m > 205) { const f = (205 + (m - 205) * 0.4) / m; r *= f; g *= f; b *= f; }
    d[p] = r; d[p + 1] = g; d[p + 2] = b; d[p + 3] = a * 255;
  }
}

function valueNoise(R, cells) {
  const w = cells + 1, g = new Float32Array(w * w);
  for (let k = 0; k < g.length; k++) g[k] = R();
  return (x, y) => {
    const X = x * cells, Y = y * cells, i = Math.min(cells - 1, X | 0), j = Math.min(cells - 1, Y | 0), fx = sm(X - i), fy = sm(Y - j);
    return lerp(lerp(g[j * w + i], g[j * w + i + 1], fx), lerp(g[(j + 1) * w + i], g[(j + 1) * w + i + 1], fx), fy);
  };
}

// chamfer distance from each inside pixel to the silhouette edge
function edgeDistance(inside) {
  const D = new Float32Array(N * N), INF = 1e6, s2 = 1.4142;
  for (let k = 0; k < N * N; k++) D[k] = inside[k] ? INF : 0;
  const at = (x, y) => (x < 0 || y < 0 || x >= N || y >= N) ? 0 : D[y * N + x];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const k = y * N + x; if (!D[k]) continue;
    D[k] = Math.min(D[k], at(x - 1, y) + 1, at(x, y - 1) + 1, at(x - 1, y - 1) + s2, at(x + 1, y - 1) + s2);
  }
  for (let y = N - 1; y >= 0; y--) for (let x = N - 1; x >= 0; x--) {
    const k = y * N + x; if (!D[k]) continue;
    D[k] = Math.min(D[k], at(x + 1, y) + 1, at(x, y + 1) + 1, at(x + 1, y + 1) + s2, at(x - 1, y + 1) + s2);
  }
  return D;
}

function bakeFood(F, i, A) {
  const pc = document.createElement('canvas'); pc.width = pc.height = N;
  const px = pc.getContext('2d', { willReadFrequently: true });
  px.imageSmoothingQuality = 'high'; px.drawImage(A[F.name], 0, 0, N, N);
  const img = px.getImageData(0, 0, N, N), d = img.data;
  grade(F, d);

  // centroid and principal axis of the silhouette
  let sw = 0, sx = 0, sy = 0;
  for (let k = 0; k < N * N; k++) { const a = d[k * 4 + 3] / 255; if (a < 0.4) continue; sw += a; sx += a * (k % N); sy += a * ((k / N) | 0); }
  const cx = sx / sw, cy = sy / sw;
  let sxx = 0, syy = 0, sxy = 0;
  for (let k = 0; k < N * N; k++) {
    const a = d[k * 4 + 3] / 255; if (a < 0.4) continue;
    const x = k % N - cx, y = ((k / N) | 0) - cy; sxx += a * x * x; syy += a * y * y; sxy += a * x * y;
  }
  const al = 0.5 * Math.atan2(2 * sxy, sxx - syy);
  // lie along the orbit at the arrival slot, turning as little as possible from the natural pose
  const phi = slotAng(i, tArr(i));
  const rho = (a => a - Math.PI * Math.round(a / Math.PI))(phi + Math.PI / 2 - al);
  const mu = phi + Math.PI / 2 - rho, mx = Math.cos(mu), my = Math.sin(mu);   // item-space direction of travel

  const inside = new Uint8Array(N * N), list = [];
  let umin = 1e9, umax = -1e9, fmin = 1e9, fmax = -1e9, rmax = 0;
  const ext = new Float32Array(64);                // silhouette extent in 64 directions (for the light wash)
  for (let k = 0; k < N * N; k++) {
    const a = d[k * 4 + 3]; if (a <= 8) continue;
    list.push(k);
    if (a < 100) continue;
    inside[k] = 1;
    const x = k % N - cx, y = ((k / N) | 0) - cy, u = x * Math.cos(al) + y * Math.sin(al), f = x * mx + y * my;
    umin = Math.min(umin, u); umax = Math.max(umax, u); fmin = Math.min(fmin, f); fmax = Math.max(fmax, f);
    rmax = Math.max(rmax, Math.hypot(x, y));
    if ((k & 3) === 0) for (let q = 0; q < 64; q++) { const pr = x * Math.cos(q / 64 * TAU) + y * Math.sin(q / 64 * TAU); if (pr > ext[q]) ext[q] = pr; }
  }
  const k = F.len / (umax - umin);

  // burn order: from the trailing end forward, edges and far protrusions slightly ahead of the
  // body, broken up by four octaves of noise, then rank-normalised so area burns at an even rate
  const D = edgeDistance(inside);
  let dmax = 0; for (let q = 0; q < N * N; q++) if (D[q] > dmax) dmax = D[q];
  const R = HG.rng(77 + i * 19), n1 = valueNoise(R, 6), n2 = valueNoise(R, 15), n3 = valueNoise(R, 46), n4 = valueNoise(R, 112);
  const L = list.length, raw = new Float32Array(L);
  for (let j = 0; j < L; j++) {
    const q = list[j], x = q % N, y = (q / N) | 0, ux = x / N, uy = y / N;
    const s = ((x - cx) * mx + (y - cy) * my - fmin) / (fmax - fmin);
    const e = Math.min(1, D[q] / (0.55 * dmax)), c = Math.min(1, Math.hypot(x - cx, y - cy) / rmax);
    const nz = 0.4 * n1(ux, uy) + 0.27 * n2(ux, uy) + 0.21 * n3(ux, uy) + 0.12 * n4(ux, uy);
    raw[j] = 0.7 * s + 0.13 * e - 0.07 * c + 0.36 * (nz - 0.5);
  }
  const ord = Array.from({ length: L }, (_, j) => j).sort((a, b) => raw[a] - raw[b]);
  const tau = new Float32Array(L);
  for (let r = 0; r < L; r++) tau[ord[r]] = r / (L - 1);

  // ember sparks sampled over the body, each released when the front reaches it
  const RS = HG.rng(500 + i * 23), sparks = [];
  for (let tries = 0; sparks.length < 700 && tries < 100000; tries++) {
    const j = Math.floor(RS() * L), q = list[j] * 4;
    if (d[q + 3] < 140) continue;
    const m = Math.max(d[q], d[q + 1], d[q + 2], 1), lift = v => 0.65 * v * 250 / m + 0.35 * 235;
    const hot = RS() < 0.55;
    sparks.push({ x: list[j] % N - cx, y: ((list[j] / N) | 0) - cy, tau: tau[j], hot,
      col: hot ? (RS() < 0.5 ? [255, 214, 130] : [255, 150, 54]) : qc([lift(d[q]), lift(d[q + 1]), lift(d[q + 2])]),
      life: 0.45 + 0.5 * RS(), vo: 40 + 80 * RS(), vb: 20 + 70 * RS(), sw: (RS() - 0.5) * 50, sz: 4 + 9 * RS(), tw: RS() * TAU, glint: RS() < 0.1 });
  }

  const photo = mk(NB); photo.ctx.putImageData(img, PAD, PAD);
  const sil = mk(NB); sil.ctx.drawImage(photo.cv, 0, 0); sil.ctx.globalCompositeOperation = 'source-in';
  sil.ctx.fillStyle = rgba(mix(F.tint, GOLD, 0.45).map(Math.round), 1); sil.ctx.fillRect(0, 0, NB, NB);
  const halo = mk(NB); halo.ctx.filter = 'blur(30px)'; halo.ctx.drawImage(sil.cv, 0, 0);
  halo.ctx.filter = 'blur(9px)'; halo.ctx.globalAlpha = 0.6; halo.ctx.drawImage(sil.cv, 0, 0);
  const shade = mk(NB); shade.ctx.filter = 'blur(12px)'; shade.ctx.drawImage(sil.cv, 0, 0);
  shade.ctx.filter = 'none'; shade.ctx.globalCompositeOperation = 'source-in'; shade.ctx.fillStyle = '#000'; shade.ctx.fillRect(0, 0, NB, NB);
  const bloom = mk(NB); bloom.ctx.filter = 'blur(14px)'; bloom.ctx.drawImage(photo.cv, 0, 0);
  const lines = mk(NB), ll = lines.ctx;
  ll.filter = 'blur(3px)'; ll.globalAlpha = 0.9; ll.drawImage(A[F.name + '_lines'], PAD, PAD, N, N);
  ll.filter = 'none'; ll.globalAlpha = 1; ll.globalCompositeOperation = 'lighter'; ll.drawImage(A[F.name + '_lines'], PAD, PAD, N, N);

  return { k, rho, rHero: 0.35 * rho, phi, ox: cx - N / 2, oy: cy - N / 2, ext, emax: Math.max(...ext),
    halfBack: (-fmin * k + 8) / R_ORB, halfFront: (fmax * k + 8) / R_ORB,
    photo: photo.cv, halo: halo.cv, shade: shade.cv, bloom: bloom.cv, lines: lines.cv,
    pix: d, list: Int32Array.from(list), tau, outF: new ImageData(N, N), outE: new ImageData(N, N), sparks };
}

function bake(A) {
  GEO = [];
  FOODS.forEach((F, i) => { GEO[i] = bakeFood(F, i, A); });
  STAR = makeStar(CREAM); STAR_W = makeStar(GOLD);
  SUN = HG.layer(); RIM = mk(NB); WASH = mk(NB); DISF = mk(NB); DISE = mk(NB);
}

// a four-point glint: soft core plus thin cross flares
function makeStar(col, S = 160) {
  const { cv: c, ctx: g } = mk(S), h = S / 2;
  g.globalCompositeOperation = 'lighter';
  const core = g.createRadialGradient(h, h, 0, h, h, h * 0.42);
  core.addColorStop(0, 'rgba(255,246,226,1)'); core.addColorStop(0.18, rgba(col, 0.85));
  core.addColorStop(0.5, rgba(col, 0.22)); core.addColorStop(1, rgba(col, 0));
  g.fillStyle = core; g.fillRect(0, 0, S, S);
  for (const rot of [0, Math.PI / 2]) {
    g.save(); g.translate(h, h); g.rotate(rot); g.scale(1, 0.045);
    const s = g.createRadialGradient(0, 0, 0, 0, 0, h);
    s.addColorStop(0, 'rgba(255,244,222,0.95)'); s.addColorStop(0.25, rgba(col, 0.55)); s.addColorStop(1, rgba(col, 0));
    g.fillStyle = s; g.beginPath(); g.arc(0, 0, h, 0, TAU); g.fill(); g.restore();
  }
  return c;
}
function star(x, y, size, alpha, img = STAR) {
  if (alpha <= 0.004 || size <= 0.5) return;
  ctx.globalAlpha = Math.min(1, alpha); ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
}

// the colour of the gift lying in direction a (blended between neighbours)
function chainColor(a, t) {
  const q = (((a - theta(t)) / (TAU / 5)) % 5 + 5) % 5, i0 = Math.floor(q), f = sm(q - i0);
  return mix(GOLD, mix(FOODS[i0].tint, FOODS[(i0 + 1) % 5].tint, f), 0.8);
}

// ---------- the sun
function drawSun(t) {
  const g = SUN.ctx; HG.reset(g); g.clearRect(0, 0, W, W);
  const glowA = smooth(0.15, 0.9, t) * (1 - smooth(10.6, 11.15, t));
  if (glowA <= 0) return;
  let pulse = 0; for (let i = 0; i < 5; i++) pulse += bump(t, tE(i) - 0.05, 0.85);
  pulse += 0.55 * bump(t, 1.12, 0.6) + 1.2 * bump(t, T_FULL - 0.05, 1.3) + 0.5 * bump(t, 8.75, 0.9);
  const heroDim = FOODS.reduce((m, _, i) => Math.max(m, HG.window(t, tE(i), tE(i) + HOLD + 0.5, 0.2, 0.45)), 0);
  const breath = 1 + 0.035 * Math.sin(TAU * t / 3.6);
  g.translate(C, C); g.globalCompositeOperation = 'lighter';
  const ext = (1 + 0.08 * pulse) * breath;
  // rays open clockwise from the top and fold back counter-clockwise from the top
  const open = (a, d0, dur) => ease.out3((t - d0 - 0.45 * cwTop(a)) / dur);
  const fold = a => ease.inOut3((t - 9.75 - 0.6 * frac(1 - cwTop(a))) / 0.5);

  // hairline halo: fine engraved rays, slowly counter-rotating
  { const R = HG.rng(91), rot = -0.045 * t, n = 120;
    const grd = g.createRadialGradient(0, 0, 80, 0, 0, 232);
    grd.addColorStop(0, rgba(CREAM, 0.42)); grd.addColorStop(0.5, rgba(GOLD, 0.18)); grd.addColorStop(1, rgba(AMBER, 0));
    g.strokeStyle = grd; g.lineWidth = 1.1; g.beginPath();
    for (let i = 0; i < n; i++) {
      const a0 = i / n * TAU, a = rot + a0;
      const len = (32 + 112 * Math.pow(R(), 1.6)) * open(a0 - 0.036, 0.5, 0.5) * (1 - fold(a0 - 0.46)) * ext;
      if (len < 1) continue;
      const ca = Math.cos(a), sa = Math.sin(a);
      g.moveTo(ca * 84, sa * 84); g.lineTo(ca * (84 + len), sa * (84 + len));
    }
    g.stroke(); }

  // eight great pointed rays (like the stone's), eight lesser ones, sixteen flames between
  const rot = 0.075 * t, r0 = 70;
  for (let i = 0; i < 32; i++) {
    const a0 = i / 32 * TAU, a = rot + a0;
    const kk = open(a0 + 0.06, 0.45, 0.45) * (1 - fold(a0 + 0.76));
    if (kk <= 0.002) continue;
    const kind = i % 4 === 0 ? 0 : i % 4 === 2 ? 1 : 2;
    const L = [138, 100, 86][kind] * kk * ext;
    if (L < 1) continue;
    g.save(); g.rotate(a);
    const lg = g.createLinearGradient(r0, 0, r0 + L, 0);
    lg.addColorStop(0, rgba(CREAM, 0.8)); lg.addColorStop(0.4, rgba(GOLD, 0.6)); lg.addColorStop(1, rgba(AMBER, 0));
    g.fillStyle = lg; g.beginPath();
    if (kind < 2) {
      const hw = kind === 0 ? 8 : 5.2;
      g.moveTo(r0, -hw); g.lineTo(r0 + L, 0); g.lineTo(r0, hw);
    } else {
      const steps = 20, ph = t * 2.1 + i, left = [], right = [];
      for (let s = 0; s <= steps; s++) {
        const u = s / steps, x = r0 + u * L, off = 6 * Math.sin(u * 3.2 * Math.PI - ph) * Math.pow(u, 0.8), hw = 4.4 * (1 - u) + 0.3;
        left.push([x, off - hw]); right.push([x, off + hw]);
      }
      g.moveTo(left[0][0], left[0][1]);
      for (const p of left) g.lineTo(p[0], p[1]);
      for (let s = right.length - 1; s >= 0; s--) g.lineTo(right[s][0], right[s][1]);
    }
    g.closePath(); g.fill(); g.restore();
  }

  // the medallion: rings drawn on from the top, a ring of twenty day-sign cells, the four
  // Ollin cartouches with cardinal points, and a ring of twenty kernels
  const mk_ = smooth(0.45, 0.9, t) * (1 - smooth(10.25, 10.85, t));
  if (mk_ > 0) {
    const sc = (0.8 + 0.2 * ease.out3((t - 0.45) / 0.8)) * (1 - 0.55 * ease.inOut3((t - 10.2) / 0.65));
    const draw = ease.inOut3((t - 0.5) / 0.7), a0 = -Math.PI / 2;
    const arc = (r, w, col, al) => { g.lineWidth = w; g.strokeStyle = rgba(col, al * mk_); g.beginPath(); g.arc(0, 0, r * sc, a0, a0 + TAU * draw); g.stroke(); };
    arc(66, 1.1, GOLD, 0.5); arc(54, 1.1, GOLD, 0.55); arc(43, 1.3, CREAM, 0.65); arc(38, 0.9, GOLD, 0.45);
    const tr = 0.05 * t;
    g.lineWidth = 1.1;
    for (let j = 0; j < 20; j++) {                   // day-sign cells
      const a = tr + j / 20 * TAU, on = smooth(0.62 + 0.4 * j / 20, 0.8 + 0.4 * j / 20, t);
      if (on <= 0) continue;
      g.save(); g.rotate(a); g.translate(48.5 * sc, 0);
      g.strokeStyle = rgba(GOLD, 0.6 * on * mk_); g.strokeRect(-3.4 * sc, -3.4 * sc, 6.8 * sc, 6.8 * sc);
      g.fillStyle = rgba(CREAM, 0.55 * on * mk_); g.fillRect(-1 * sc, -1 * sc, 2 * sc, 2 * sc);
      g.restore();
    }
    const ro = -0.03 * t, on4 = smooth(0.75, 1.15, t);
    for (let j = 0; j < 4; j++) {                    // Ollin: four cartouches and four cardinal points
      g.save(); g.rotate(ro + j * Math.PI / 2);
      g.save(); g.rotate(Math.PI / 4); g.translate(23 * sc, 0); g.rotate(Math.PI / 4);
      g.strokeStyle = rgba(CREAM, 0.7 * on4 * mk_); g.lineWidth = 1.3; g.strokeRect(-5 * sc, -5 * sc, 10 * sc, 10 * sc);
      g.fillStyle = rgba(GOLD, 0.6 * on4 * mk_); g.beginPath(); g.arc(0, 0, 1.6 * sc, 0, TAU); g.fill();
      g.restore();
      g.fillStyle = rgba(GOLD, 0.62 * on4 * mk_); g.beginPath();
      g.moveTo(26 * sc, -3.6 * sc); g.lineTo(35.5 * sc, 0); g.lineTo(26 * sc, 3.6 * sc); g.closePath(); g.fill();
      g.restore();
    }
    g.strokeStyle = rgba(CREAM, 0.6 * on4 * mk_); g.lineWidth = 1.2; g.beginPath(); g.arc(0, 0, 9 * sc, 0, TAU); g.stroke();
    // kernels: lit one by one at the start; later they answer the chain in the gifts' colours
    const kr = -0.12 * t, chase = clamp((t - 8.75) / 0.8), back = 1 - smooth(9.6, 10.2, t);
    for (let j = 0; j < 20; j++) {
      const a = kr + j / 20 * TAU, kk = smooth(0.7 + j / 20 * 0.45, 0.95 + j / 20 * 0.45, t);
      const lit = sm((chase - cwTop(a)) * 12) * back;
      const col = qc(mix(GOLD, chainColor(a, t), lit)), x = Math.cos(a) * 60 * sc, y = Math.sin(a) * 60 * sc;
      if (lit > 0.01) HG.dot(g, qc(chainColor(a, t)), x, y, 26, 0.5 * lit * mk_);   // a coloured glow round each lit kernel
      HG.dot(g, col, x, y, 7 + 6 * lit, (0.8 + 0.2 * lit) * kk * mk_);
    }
  }

  // the core glow: a small hot centre with a long soft falloff, never a flat disc
  g.globalAlpha = 1;                                 // HG.dot leaves globalAlpha at the last bead's value
  const collapse = ease.inOut3((t - 10.1) / 0.8);
  const coreR = (185 + 26 * pulse) * breath * (0.3 + 0.7 * ease.out3((t - 0.1) / 0.9)) * (1 - 0.8 * collapse);
  const hot = (0.66 + 0.16 * Math.min(1, pulse)) * (1 - 0.5 * heroDim) * smooth(0.1, 0.75, t);
  const cg = g.createRadialGradient(0, 0, 0, 0, 0, coreR);
  cg.addColorStop(0, rgba([255, 232, 188], 0.72 * hot)); cg.addColorStop(0.05, rgba(CREAM, 0.56 * hot));
  cg.addColorStop(0.14, rgba(GOLD, 0.32 * hot)); cg.addColorStop(0.32, rgba(AMBER, 0.11 * hot));
  cg.addColorStop(0.62, rgba(AMBER, 0.035 * hot)); cg.addColorStop(1, rgba(AMBER, 0));
  g.fillStyle = cg; g.beginPath(); g.arc(0, 0, coreR, 0, TAU); g.fill();

  HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.55 * glowA; ctx.filter = 'blur(26px)'; ctx.drawImage(SUN.cv, 0, 0);
  ctx.globalAlpha = 0.7 * glowA; ctx.filter = 'blur(6px)'; ctx.drawImage(SUN.cv, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = glowA; ctx.drawImage(SUN.cv, 0, 0);
  HG.reset(ctx);
}

// ---------- the orbit: a fine chain drawn on by a travelling glint, parted under each gift
function drawOrbit(t, S) {
  const k = ease.inOut3((t - 0.55) / 0.9), fade = 1 - smooth(9.7, 10.6, t);
  if (k <= 0 || fade <= 0) return;
  const a0 = -Math.PI / 2;
  const sw = clamp((t - SWEEP_T) / SWEEP_D), head = ease.inOut3(sw);
  const shimmer = smooth(T_FULL + 0.6, T_FULL + 1.6, t);
  const gaps = S.map((s, i) => s ? { a: s.ang, w: smooth(0.7, 1, s.g) * s.alpha * (1 - s.dis), b: GEO[i].halfBack, f: GEO[i].halfFront } : null).filter(Boolean);
  const info = a => {
    const cw = frac((a - a0) / TAU);
    let al = k >= 1 ? 1 : sm((k - cw) * 30);
    for (const G of gaps) {
      const d = wrapPi(a - G.a), hw = (d < 0 ? G.b : G.f) + 0.06;
      al *= 1 - 0.92 * G.w * (1 - sm((Math.abs(d) - hw * 0.8) / (hw * 0.45)));
    }
    const filled = t >= SWEEP_T + SWEEP_D ? 1 : sw > 0 ? sm((head - cw) * 25) : 0;
    return [al, mix(GOLD, chainColor(a, t), filled)];
  };
  const grad = ctx.createConicGradient(a0, C, C);
  for (let s = 0; s <= 120; s++) { const [al, col] = info(a0 + s / 120 * TAU); grad.addColorStop(s / 120, rgba(col.map(Math.round), al)); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = grad;
  ctx.globalAlpha = 0.3 * fade; ctx.lineWidth = 6; ctx.filter = 'blur(7px)';
  ctx.beginPath(); ctx.arc(C, C, R_ORB, 0, TAU); ctx.stroke();
  ctx.filter = 'none'; ctx.globalAlpha = (0.42 + 0.2 * shimmer) * fade; ctx.lineWidth = 1.4 + 0.4 * shimmer;
  ctx.beginPath(); ctx.arc(C, C, R_ORB, 0, TAU); ctx.stroke();
  // beads riding the carousel
  for (let j = 0; j < 60; j++) {
    const a = theta(t) + j / 60 * TAU + 0.05, [al, col] = info(a);
    const tw = 0.42 + 0.45 * shimmer * (0.5 + 0.5 * Math.sin(t * 6.5 + j * 2.1));
    HG.dot(ctx, qc(col), C + Math.cos(a) * R_ORB, C + Math.sin(a) * R_ORB, 6 + 2.5 * shimmer, tw * al * fade);
  }
  // the drawing head
  if (k < 1) star(C + Math.cos(a0 + TAU * k) * R_ORB, C + Math.sin(a0 + TAU * k) * R_ORB, 90, 0.85 * Math.sin(Math.PI * k));
  // the light that runs round the finished chain
  if (sw > 0 && sw < 1) {
    const ah = a0 + TAU * head, env = Math.sin(Math.PI * sw);
    for (let j = 0; j < 16; j++) {
      const a = ah - j * 0.035;
      HG.dot(ctx, GOLD, C + Math.cos(a) * R_ORB, C + Math.sin(a) * R_ORB, 22 - j, 0.38 * env * (1 - j / 16));
    }
    star(C + Math.cos(ah) * R_ORB, C + Math.sin(ah) * R_ORB, 120, 0.6 * env, STAR_W);
  }
  ctx.restore();
}
function flare(i, t) {
  const sw = clamp((t - SWEEP_T) / SWEEP_D); if (sw <= 0 || sw >= 1) return 0;
  const d = wrapPi(-Math.PI / 2 + TAU * ease.inOut3(sw) - slotAng(i, t));
  return Math.exp(-Math.pow(d / 0.32, 2)) * Math.min(1, 1.6 * Math.sin(Math.PI * sw));
}

// ---------- sparkles (all stateless)
function popBurst(t, t0, seed, x, y, { n = 46, v = 340, life = 1.25, scale = 1, img = STAR } = {}) {
  const dt = t - t0; if (dt < 0 || dt > life + 0.2) return;
  const R = HG.rng(seed);
  for (let j = 0; j < n; j++) {
    const a = R() * TAU, sp = v * (0.3 + 0.7 * R()), l = life * (0.55 + 0.45 * R()), sz = (12 + 22 * R()) * scale, tw = R() * TAU, dl = R() * 0.08;
    const d = dt - dl; if (d < 0 || d > l) continue;
    const dist = 26 * scale + sp * (1 - Math.exp(-3.4 * d)) / 3.4;
    const al = smooth(0, 0.05, d) * (1 - smooth(0.25 * l, l, d)) * (0.6 + 0.4 * Math.sin(t * 13 + tw));
    star(x + Math.cos(a) * dist, y + Math.sin(a) * dist + 22 * d * d, sz * (1 - 0.45 * d / l), al, j % 3 ? STAR : STAR_W);
  }
}

// the birth glint sits behind the newborn, so the sun flares around it rather than over it
function birthGlints(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) { const f = bump(t, tE(i) - 0.04, 0.6); if (f > 0) star(C, C, 110 + 210 * f, 0.5 * f, STAR_W); }
  ctx.restore();
}

function sparkles(t, S) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const dt = t - tE(i);
    if (dt > 0 && dt < 0.9) {                       // a tinted ring of light that stays inside the orbit
      const k = dt / 0.9;
      HG.ring(ctx, C, C, 70 + 200 * ease.out3(k), FOODS[i].tint, { width: 4, blur: 9, alpha: 0.42 * Math.pow(1 - k, 2) });
    }
    popBurst(t, tE(i), 300 + i * 17, C, C);
    const ta = tArr(i) - 0.45;                      // settling into the slot: a small twinkle
    if (t > ta && t < ta + 1.1 && S[i]) popBurst(t, ta, 500 + i * 13, S[i].x, S[i].y, { n: 16, v: 150, life: 0.9, scale: 0.7, img: STAR_W });
  }
  ctx.restore();
}

// stardust shed from each gift's trailing end, half of it in the gift's own colour
function trails(t, S) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const s = S[i]; if (!s) continue;
    const on = smooth(tArr(i) - 0.7, tArr(i) + 0.4, t) * s.alpha * (1 - smooth(0, 0.35, s.dis));
    if (on <= 0) continue;
    const R = HG.rng(700 + i * 31), back = GEO[i].halfBack * 0.85;
    for (let j = 0; j < 36; j++) {
      const ph = R(), side = (R() - 0.5) * 2, sz = 8 + 15 * R(), tw = R() * TAU;
      const u = frac(t * 0.5 + ph);
      const a = s.ang - back - 0.86 * u, r = s.r + side * (5 + 30 * u) + 8 * u;
      const al = on * smooth(0, 0.1, u) * Math.pow(1 - u, 1.3) * (0.6 + 0.4 * Math.sin(t * 8 + tw));
      HG.dot(ctx, j % 2 ? FOODS[i].tint : j % 3 ? GOLD : CREAM, C + Math.cos(a) * r, C + Math.sin(a) * r, sz * (1 - 0.4 * u), al);
      if (j % 5 === 0) star(C + Math.cos(a) * r, C + Math.sin(a) * r, sz * 3.4, 0.5 * al);
    }
  }
  ctx.restore();
}

// ---------- the burn: char ahead of the front, a hot gold edge, an orange afterglow
const CHAR = [44, 14, 5];
function burn(P, pp) {
  const F = P.outF.data, E = P.outE.data, pix = P.pix, list = P.list, tau = P.tau;
  for (let j = 0; j < list.length; j++) {
    const q = list[j] * 4, d = tau[j] - pp, a = pix[q + 3];
    if (d > 0.1) { F[q] = pix[q]; F[q + 1] = pix[q + 1]; F[q + 2] = pix[q + 2]; F[q + 3] = a; E[q + 3] = 0; continue; }
    if (d < -0.09) { F[q + 3] = 0; E[q + 3] = 0; continue; }
    const ch = 0.92 * (1 - sm(d / 0.1));
    F[q] = lerp(pix[q], CHAR[0], ch); F[q + 1] = lerp(pix[q + 1], CHAR[1], ch); F[q + 2] = lerp(pix[q + 2], CHAR[2], ch);
    F[q + 3] = a * sm((d + 0.004) / 0.009);
    const hot = Math.exp(-Math.pow((d - 0.006) / 0.014, 2)), ag = d < 0 ? 0.6 * Math.exp(d / 0.028) : 0, tot = hot + ag;
    if (tot < 0.01) { E[q + 3] = 0; continue; }
    E[q] = 255; E[q + 1] = (hot * 218 + ag * 104) / tot; E[q + 2] = (hot * 128 + ag * 22) / tot;
    E[q + 3] = Math.min(1, tot) * a;
  }
  HG.reset(DISF.ctx); DISF.ctx.clearRect(0, 0, NB, NB); DISF.ctx.putImageData(P.outF, PAD, PAD);
  HG.reset(DISE.ctx); DISE.ctx.clearRect(0, 0, NB, NB); DISE.ctx.putImageData(P.outE, PAD, PAD);
}

// sparks released by the moving front, carried outward and back along the orbit
function embers(t) {
  if (t < DS(4)) return;
  const fadeAll = 1 - smooth(11.25, 11.6, t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    if (t < DS(i)) continue;
    for (const p of GEO[i].sparks) {
      const s0 = DS(i) + DD * (p.tau + 0.05) / 1.12, age = t - s0;
      if (age < 0 || age > p.life) continue;
      const st = itemState(i, s0), c = Math.cos(st.rot), sn = Math.sin(st.rot);
      const x0 = st.x + (p.x * c - p.y * sn) * st.k, y0 = st.y + (p.x * sn + p.y * c) * st.k;
      const r0 = Math.max(1, Math.hypot(x0 - C, y0 - C)), ox = (x0 - C) / r0, oy = (y0 - C) / r0;
      const m = (1 - Math.exp(-2 * age)) / 2;
      const x = x0 + (ox * p.vo + oy * p.vb + -oy * p.sw) * m, y = y0 + (oy * p.vo - ox * p.vb + ox * p.sw) * m - 16 * age;
      const rf = 1 - smooth(440, 486, Math.hypot(x - C, y - C));
      const al = smooth(0, 0.04, age) * (1 - smooth(0.25 * p.life, p.life, age)) * (0.6 + 0.4 * Math.sin(t * 12 + p.tw)) * fadeAll * rf;
      if (p.glint) star(x, y, p.sz * 3.6, 0.6 * al, STAR_W);
      else HG.dot(ctx, p.col, x, y, p.sz * (1 - 0.35 * age / p.life), 0.95 * al);
    }
  }
  ctx.restore();
}

// ---------- a gift: shade, halo, photo, sun wash + engraved lines, sun-facing rim, embers
function drawFood(i, s, t) {
  if (!s || s.alpha <= 0.003 || s.dis >= 1) return;
  const P = GEO[i], F = FOODS[i];
  let src = P.photo, rem = 1, burning = false;
  if (s.dis > 0) { const pp = lerp(-0.05, 1.07, s.dis); burn(P, pp); src = DISF.cv; rem = 1 - clamp(pp); burning = true; }
  const k = s.k, D = NB * k;
  // light from the sun, in item space
  const dx = C - s.x, dy = C - s.y, lit = smooth(30, 150, Math.hypot(dx, dy));
  const la = Math.atan2(dy, dx) - s.rot, ux = Math.cos(la), uy = Math.sin(la);
  const fl = flare(i, t), boost = F.lift ? 1.45 : 1;
  const rimA = Math.min(0.85, 0.42 * boost + 0.3 * s.flash + 0.45 * fl) * lit;
  const washA = (0.22 + 0.2 * fl) * lit * (F.lift ? 1.3 : 1), lineA = 0.1 + 0.22 * s.flash + 0.14 * fl;

  const w = WASH.ctx; HG.reset(w); w.clearRect(0, 0, NB, NB);
  const cx = NB / 2 + P.ox, cy = NB / 2 + P.oy;
  if (washA > 0.003) {
    const q = Math.round(frac(la / TAU) * 64) % 64, e = P.ext[q];
    const gr = w.createLinearGradient(cx + ux * e, cy + uy * e, cx - ux * e * 0.3, cy - uy * e * 0.3);
    gr.addColorStop(0, rgba(WARM, Math.min(1, washA))); gr.addColorStop(1, rgba(WARM, 0));
    w.fillStyle = gr; w.fillRect(0, 0, NB, NB);
  }
  if (lit < 0.99) {          // still on the sun: backlit, so the light wraps every edge
    const e = P.emax, gr = w.createRadialGradient(cx, cy, 0.4 * e, cx, cy, e);
    gr.addColorStop(0, rgba(WARM, 0)); gr.addColorStop(1, rgba(WARM, 0.42 * (1 - lit) * (F.lift ? 1.3 : 1)));
    w.globalCompositeOperation = 'lighter'; w.fillStyle = gr; w.fillRect(0, 0, NB, NB);
  }
  w.globalCompositeOperation = 'lighter'; w.globalAlpha = lineA; w.drawImage(P.lines, 0, 0);
  w.globalCompositeOperation = 'destination-in'; w.globalAlpha = 1; w.drawImage(src, 0, 0);
  if (rimA > 0.004) {
    const r = RIM.ctx; HG.reset(r); r.clearRect(0, 0, NB, NB);
    r.drawImage(src, 0, 0);
    r.globalCompositeOperation = 'source-in'; r.fillStyle = rgba(RIMC, 1); r.fillRect(0, 0, NB, NB);
    const dl = 6 / k;
    r.globalCompositeOperation = 'destination-out'; r.filter = 'blur(2px)'; r.drawImage(src, -ux * dl, -uy * dl); r.filter = 'none';
  }

  const A = s.alpha;
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.translate(-P.ox * k, -P.oy * k);
  ctx.globalAlpha = 0.72 * A * rem * rem; ctx.drawImage(P.shade, -D / 2, -D / 2, D, D);   // a soft matte that parts the rays
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = A * (0.34 + 0.24 * s.flash + 0.2 * fl) * boost * rem * rem; ctx.drawImage(P.halo, -D / 2, -D / 2, D, D);
  const bl = A * (0.2 + 0.14 * s.flash);
  if (burning) { ctx.filter = 'blur(8px)'; ctx.globalAlpha = bl; ctx.drawImage(src, -D / 2, -D / 2, D, D); ctx.filter = 'none'; }
  else { ctx.globalAlpha = bl; ctx.drawImage(P.bloom, -D / 2, -D / 2, D, D); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = A; ctx.drawImage(src, -D / 2, -D / 2, D, D);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = A; ctx.drawImage(WASH.cv, -D / 2, -D / 2, D, D);
  if (rimA > 0.004) {
    ctx.filter = 'blur(4px)'; ctx.globalAlpha = Math.min(1, A * rimA * 0.9); ctx.drawImage(RIM.cv, -D / 2, -D / 2, D, D);
    ctx.filter = 'none'; ctx.globalAlpha = Math.min(1, A * rimA); ctx.drawImage(RIM.cv, -D / 2, -D / 2, D, D);
  }
  if (burning) {
    ctx.filter = 'blur(7px)'; ctx.globalAlpha = 0.85 * A; ctx.drawImage(DISE.cv, -D / 2, -D / 2, D, D);
    ctx.filter = 'blur(1.5px)'; ctx.globalAlpha = 0.9 * A; ctx.drawImage(DISE.cv, -D / 2, -D / 2, D, D);
    ctx.filter = 'none'; ctx.globalAlpha = 0.55 * A; ctx.drawImage(DISE.cv, -D / 2, -D / 2, D, D);
  }
  ctx.restore();
}

// ---------- the end: the folded sun pings once and is gone
function finale(t) {
  const x = clamp((t - 10.85) / 0.75); if (x <= 0 || x >= 1) return;
  const env = smooth(0, 0.2, x) * (1 - smooth(0.2, 1, x));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  star(C, C, 70 + 330 * ease.out3(x), 0.8 * env, STAR);
  star(C, C, 40 + 120 * ease.out3(x), 0.5 * env, STAR_W);
  HG.ring(ctx, C, C, 24 + 200 * ease.out3(x), GOLD, { width: 3, blur: 6, alpha: 0.5 * Math.pow(1 - x, 1.6) });
  const R = HG.rng(4242);
  for (let j = 0; j < 28; j++) {
    const a = R() * TAU, v = 110 + 190 * R(), sz = 6 + 8 * R(), dd = 18 + v * (1 - Math.exp(-2.4 * x)) / 2.4;
    HG.dot(ctx, j % 3 ? GOLD : CREAM, C + Math.cos(a) * dd, C + Math.sin(a) * dd, sz, 0.8 * Math.pow(1 - x, 1.5) * smooth(0, 0.08, x));
  }
  ctx.restore();
}

const assets = {};
for (const F of FOODS) { assets[F.name] = `../assets/09-sabores-${F.name}.png`; assets[F.name + '_lines'] = `../assets/09-sabores-${F.name}_lines.png`; }

HG.start({
  duration: 12,
  assets,
  render(t, A) {
    if (!GEO) bake(A);
    const S = FOODS.map((_, i) => itemState(i, t));
    HG.dust(t, { n: 70, colors: [GOLD, CREAM], alpha: 0.22 * smooth(1.5, 3.5, t) * (1 - smooth(10.2, 11.2, t)), size: 5, r: 470, seed: 19 });
    drawOrbit(t, S);
    drawSun(t);
    trails(t, S);
    birthGlints(t);
    // settled gifts first, then the one gliding out, the newborn on top
    const order = [0, 1, 2, 3, 4].filter(i => S[i]).sort((a, b) => S[b].g - S[a].g);
    for (const i of order) drawFood(i, S[i], t);
    sparkles(t, S);
    embers(t);
    finale(t);
  },
});
window.__S = { itemState: (i, t) => itemState(i, t), geo: () => GEO, N, PAD, NB, tE, tArr, DS, DD };
</script></body></html>
