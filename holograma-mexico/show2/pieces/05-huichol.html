// ARTE HUICHOL (Wixarika yarn painting, nierika). Video "Artesanias y Tesoros", after the Sarape de
// Saltillo and before the Alebrijes, joined by the gold portal.
// Coloured threads of yarn fly in on spirals while the portal opens and land: magenta threads run
// along the outlines of Kauyumari the deer and of each of his antlers, others coil into the sun Tau,
// the peyote flower, the little nierika circles and an ear of maize (deer, maize and peyote: the
// Wixarika trinity). Then, as an artist presses yarn into beeswax, row after row is laid inside every
// outline, each led by a glowing needle-point, concentric and inward; the maize fills with kernels and
// a border of zigzag serpents and coils is stitched on the left and right rim. Finished, the painting
// glows in and a sheen crosses it; it comes alive: the outline shimmers, waves of light run through
// the deer's rows, flowers open on his antlers, the peyote opens once, the deer bows his head and
// blinks, the maize sways, the sun pulses and turns. Then the yarn lifts off the board from the
// outside in: each row rises whole, swells and rounds into a ring of thread that flies out past the
// rim (nothing left on the board is ever bent); the deer's innermost rows are the last to leave.
// Rows are the level sets of each shape's distance-to-edge (tools/gen2.py in the work folder), so they
// follow the outline inward like real yarn rows; the deer silhouette is traced from
// out-show2/images/huichol-venado-1.png. Everything else is drawn procedurally. No text.

  if (row.fig !== 'deer') return 0;
  let w = 0;
  for (const t0 of [6.3, 8.1]) { const pos = (t - t0) * 7 - 1; w += Math.exp(-Math.pow(row.lev - pos, 2) / 0.9); }
  return Math.min(1, w);
}

// a slow push-in on the painting while it is made and comes alive, anchored low so the hooves stay put
const camZ = t => 1 + 0.03 * ease.inOut3((t - 2.5 - B) / 6.5);
const CAMY = 740;
function cam(g, t) { const z = camZ(t); g.translate(C, CAMY); g.scale(z, z); g.translate(-C, -CAMY); }

HG.start({
  duration: 12,
  render(t) {
    figureTransforms(t);
    const end = 1 - smooth(10.9, 11.5, t);
    const y = Y.ctx; HG.reset(y); y.clearRect(0, 0, W, W);
    y.lineCap = 'round'; y.lineJoin = 'round';

    // midday warmth behind the sun
    const halo = smooth(1.4 + B, 3.6 + B, t) * (1 - smooth(8.8, 9.6, t)) * (0.8 + 0.2 * Math.sin(TAU * (t - 5.2) / 1.5));
    if (halo > 0.003) {
      ctx.save(); cam(ctx, t);
      const hg = ctx.createRadialGradient(SUN.x, SUN.y, 30, SUN.x, SUN.y, 260);
      hg.addColorStop(0, rgba([255, 190, 80], 0.2 * halo)); hg.addColorStop(0.45, rgba([255, 140, 40], 0.07 * halo)); hg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hg; ctx.fillRect(SUN.x - 270, SUN.y - 270, 540, 540);
      ctx.restore(); HG.reset(ctx);
    }

    y.save(); cam(y, t);
    // colour under the rows once the painting is complete
    fillShapes(y, t, smooth(4.7 + B, 5.9 + B, t));

    const needles = [];
    for (const row of ROWS) {
      const kr = clamp((t - row.tr) / row.rdur);          // the unravel: pulled back along its own path
      const back = 1 - kr * kr;
      const wv = wave(row, t);
      const col = wv > 0.01 ? mix(row.col, WHITE, 0.45 * wv) : row.col;
      let parts = [];
      if (row.mode === 'seeds') {
        // threads land on the outline and run both ways until they meet; at the end they pull it back
        // in to where they landed and fly out with it
        const sd = row.seeds, m = sd.length, L = row.L;
        for (let j = 0; j < m; j++) {
          const p = sd[j], gl = (p.s - sd[(j + m - 1) % m].s + L) % L || L, gr = (sd[(j + 1) % m].s - p.s + L) % L || L;
          const E = pointAt(row, p.s);
          if (kr <= 0) {
            const h = thread(y, E, p.ta, p.dir, row.col, t);
            if (h) needles.push({ x: h[0], y: h[1], col: row.col });
          } else {
            const h = threadOut(y, E, p.dir, row.col, kr, (t - row.tr - row.rdur) / OUT);
            if (h) needles.push({ x: h[0], y: h[1], col: row.col });
          }
          const k = clamp((t - p.ta - FLY) / row.dur); if (k <= 0) continue;
          const e = (1 - (1 - k) * (1 - k)) * back; if (e <= 0.002) continue;
          const a = p.s - e * gl / 2, b = p.s + e * gr / 2;
          pushRange(parts, a, b, L);
          if (k < 1 || (kr > 0 && kr < 1)) for (const s of [a, b]) { const q = pointAt(row, (s % L + L) % L); needles.push({ x: q[0], y: q[1], col: row.col }); }
        }
      } else {
        if (row.thread) {
          const h = kr <= 0 ? thread(y, pointAt(row, 0), row.thread.ta, row.thread.dir, row.col, t)
            : threadOut(y, pointAt(row, 0), row.thread.dir, row.col, null, (t - row.tr - row.rdur) / OUT);
          if (h) needles.push({ x: h[0], y: h[1], col: row.col });
        }
        const k = clamp((t - row.t0) / row.dur);
        if (k <= 0 || kr >= 1) continue;
        const e = (row.mode === 'fwd' ? k : 1 - (1 - k) * (1 - k)) * back;
        if (row.mode === 'fwd') parts = [[0, e * row.L]];
        else parts = e >= 1 ? [[0, row.L]] : [[0, e * row.L / 2], [row.L - e * row.L / 2, row.L]];
        if (k < 1 || kr > 0) {
          const ends = row.mode === 'fwd' ? [e * row.L] : [e * row.L / 2, row.L - e * row.L / 2];
          for (const s of ends) { const q = pointAt(row, clamp(s, 0, row.L - 1e-3)); needles.push({ x: q[0], y: q[1], col: row.col, small: row.kern }); }
        }
      }
      if (parts.length) strokeRow(y, row, parts, col, 1);
    }
    drawBlooms(y, t);
    drawEye(y, t);
    y.restore();
    drawRim(y, t);
    HG.reset(y);

    // composite the yarn with a soft glow
    glowLayer(ctx, Y, 12, 0.5 * end);
    glowLayer(ctx, Y, 3.5, 0.35 * end);
    HG.drawLayer(ctx, Y, { alpha: end });

    // needle-points
    ctx.save(); cam(ctx, t); ctx.globalCompositeOperation = 'lighter';
    for (const nd of needles) HG.dot(ctx, mix(nd.col, WHITE, 0.4), nd.x, nd.y, nd.small ? 13 : 20, 0.85 * end);
    ctx.restore(); HG.reset(ctx);

    // the sun pulses: a ring of warm light leaves it on the beat
    ctx.save(); cam(ctx, t);
    for (let k = 0; k < 2; k++) {
      const tp = 5.95 + k * 1.5, u = (t - tp) / 1.1;
      if (u <= 0 || u >= 1) continue;
      const rr = lerp(70, 185, ease.out3(u)), a = 0.3 * Math.sin(Math.PI * Math.min(1, u * 1.6 + 0.1)) * (1 - u) * end;
      const rg = ctx.createRadialGradient(SUN.x, SUN.y, Math.max(0, rr - 26), SUN.x, SUN.y, rr + 26);
      rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(0.5, rgba([255, 196, 90], a)); rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = rg; ctx.fillRect(SUN.x - rr - 30, SUN.y - rr - 30, 2 * rr + 60, 2 * rr + 60);
    }
    ctx.restore(); HG.reset(ctx);

    // sheen across the finished painting
    const su = (t - 5.25 - B) / 1.3;
    if (su > 0 && su < 1) {
      const s = SH.ctx; HG.reset(s); s.clearRect(0, 0, W, W);
      HG.drawLayer(s, Y);
      const e = ease.inOut3(su), d = lerp(-560, 560, e), vx = Math.cos(0.9), vy = Math.sin(0.9);
      const ox = C + vx * d, oy = C + vy * d;
      const lg = s.createLinearGradient(ox - vx * 90, oy - vy * 90, ox + vx * 90, oy + vy * 90);
      lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(0.5, 'rgba(0,0,0,1)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
      s.globalCompositeOperation = 'destination-in'; s.fillStyle = lg; s.fillRect(0, 0, W, W);
      HG.reset(s);
      HG.drawLayer(ctx, SH, { alpha: 0.7 * Math.sin(Math.PI * su), op: 'lighter' });
    }

    ctx.save(); cam(ctx, t);
    glints(t, bump(t, 5.6 + B, 6.2 + B, 8.7, 9.15) * end);
    ctx.restore(); HG.reset(ctx);

    // the outline shimmers: light runs along the outer rows of the deer and his antlers
    const shim = bump(t, 6.0, 6.8, 8.7, 9.2) * end;
    if (shim > 0.003) {
      ctx.save(); cam(ctx, t); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const row of ROWS) {
        if (row.fig !== 'deer' || row.lev > 1 || row.L < 300) continue;
        for (let pass = 0; pass < 2; pass++) {
          ctx.beginPath(); rest(row, row.pts[0], row.pts[1]); ctx.moveTo(P[0], P[1]);
          for (let i = 1; i < row.n; i++) { rest(row, row.pts[2 * i], row.pts[2 * i + 1]); ctx.lineTo(P[0], P[1]); }
          ctx.closePath();
          ctx.setLineDash([90, 360]); ctx.lineDashOffset = -(t * 300 + row.lev * 40);
          ctx.strokeStyle = rgba(pass ? WHITE : mix(row.col, WHITE, 0.3), 1);
          ctx.globalAlpha = shim * (pass ? 0.55 : 0.45); ctx.lineWidth = pass ? 3 : 10;
          ctx.filter = pass ? 'none' : HG.blur(5); ctx.stroke();
        }
      }
      ctx.setLineDash([]); ctx.restore(); HG.reset(ctx);
    }
  },
});
</script></body></html>
