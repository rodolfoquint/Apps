// Arte Huichol (Wixarika yarn painting, nierika), at midday. Coloured threads of yarn fly in from the
// rim on spirals and land: four magenta threads run along the outline of Kauyumari the deer, others
// coil into the sun Tau, the peyote flower and the little nierika circles. Then, as a Wixarika artist
// presses yarn into beeswax, row after row is laid inside every outline, each led by a glowing
// needle-point, concentric and inward, in several colours at once; a border of zigzags and spirals is
// stitched around the rim. Finished, the painting glows in and a sheen crosses it; it comes alive: the
// deer's outline shimmers, waves of light run through his rows and he blinks, the sun pulses and turns,
// the peyote slowly rotates and the border dances. Then the yarn unravels: row after row lifts off and
// swirls out past the rim as coloured threads.
// Rows are the level sets of each shape's distance-to-edge (tools/gen.py in the work folder), so they
// follow the outline inward exactly like real yarn rows; the deer silhouette is traced from
// out-show2/images/huichol-venado-1.png. Everything else is drawn procedurally.

function makeRow(flat, closed, extra) {
  const n = flat.length / 2, pts = new Float32Array(flat), cum = new Float32Array(n + 1);
  for (let i = 1; i <= n; i++) {

    cum[i] = cum[i - 1] + (i < n || closed ? Math.hypot(pts[2 * j] - pts[2 * i - 2], pts[2 * j + 1] - pts[2 * i - 1]) : 0);
  }
  return Object.assign({ pts, cum, n, closed, L: closed ? cum[n] : cum[n - 1], spin: 1 }, extra);
}

function resample(flat, d) {
  const out = [], n = flat.length / 2;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, x0 = flat[2 * i], y0 = flat[2 * i + 1], x1 = flat[2 * j], y1 = flat[2 * j + 1];

{

// ---------- motion of each figure: local -> screen
let FX = {};
function figureTransforms(t) {

  const coreRot = -0.55 * t;
  const peyRot = -0.18 * t - 0.25 * ease.inOut3((t - 5) / 4.5);
  FX = {
    deer: null,
    ray: [Math.cos(rayRot) * sunS, Math.sin(rayRot) * sunS, SUN.x, SUN.y],
    core: [Math.cos(coreRot) * (1 + 0.02 * pulse * alive), Math.sin(coreRot) * (1 + 0.02 * pulse * alive), SUN.x, SUN.y],
    pey: [Math.cos(peyRot), Math.sin(peyRot), PEY.x, PEY.y],
    pcore: [Math.cos(peyRot * 3), Math.sin(peyRot * 3), PEY.x, PEY.y],
    flank: [Math.cos(-0.7 * t), Math.sin(-0.7 * t), FLANK.x, FLANK.y],

}

// the unravel (u 0..1): a row slips off the board, rounds into a ring of thread around the centre

function swirlPt(x, y, u, spin, rm, out) {

  const dx = x - C, dy = y - C, r = Math.hypot(dx, dy), th = Math.atan2(dy, dx);

const P = [0, 0];
// path builder that lifts the pen across long jumps (a row passing the centre while it rounds out)

// ---------- layers
const Y = HG.layer(), SH = HG.layer();
const TWIST = [3.0, 4.4, 2.2, 3.6, 3.6, 4.8, 2.6, 3.9];   // irregular, so the fibres never form a grid

// stroke a whole row or parts of it into g
function strokeRow(g, row, parts, u, col, width, alpha) {
  if (alpha <= 0.003) return;
  g.beginPath();
  for (const [s0, s1] of parts) {
    if (s1 - s0 < 0.3) continue;
    if (row.closed && s0 <= 0 && s1 >= row.L) {      // full closed loop
      if (u <= 0) {
        toScreen(row, 0, u); g.moveTo(P[0], P[1]);
        for (let i = 1; i < row.n; i++) { toScreen(row, i, u); g.lineTo(P[0], P[1]); }
        g.closePath();

function thread(g, E, ta, dir, col, t) {

const RIM_R = 494;
const RIM = [];
// placed around the upper rim only: the lower band stays calm for the title, and the antler tips get room
[163, 184, 205, 268, 290, 312, 334, 356, 378].forEach((deg, i) => RIM.push({ th: deg * Math.PI / 180, kind: i % 2 ? 'zig' : 'spi', i, cols: [[YEL, MAG], [TURQ, ORA], [GRN, PINK]][i % 3] }));

    const u = clamp((t - (8.85 + 0.035 * m.i)) / 1.4);

  g.globalAlpha = Math.min(1, a);

// glints: every 0.3 s one appears on a random spot of the yarn (deterministic from the slot number)
const GLINT_ROWS = () => ROWS.filter(r => r.fig === 'deer' || r.fig === 'ray' || r.fig === 'pey');
let GR = null;
function glints(t, a) {

  GR = GR || GLINT_ROWS();

    const u = (t - k * slot) / life; if (u <= 0 || u >= 1 || k < 0) continue;
    const r = HG.rng(k * 7919 + 13), row = GR[Math.floor(r() * GR.length)], q = pointAt(row, r() * row.L, 0);

// Kauyumari's antlers blossom: little flowers open on the tips of the tines (alive phase)
const TIPS = [[240, 236], [283, 156], [372, 142], [420, 158], [519, 127], [579, 137], [617, 199]];

    const kb = clamp((t - 6.5 - 0.13 * [3, 1, 5, 0, 4, 2, 6][i]) / 0.6); if (kb <= 0) return;
    const k = ease.outBack(kb);

    const dx = x - ROOT[0], dy = y - ROOT[1], dl = Math.hypot(dx, dy), cx = x + dx / dl * 13, cy = y + dy / dl * 13;
    const rot = 0.5 * t * (i % 2 ? 1 : -1) + i, sz = 1.2 * k * (1 + 0.07 * Math.sin(TAU * 1.05 * t + i) * dance);
    const [pc, cc] = BLOOM_COLS[i], rm = Math.hypot(cx - C, cy - C), al = 1 - smooth(0.5, 1, u);
    g.beginPath();
    for (let q = 0; q < 5; q++) {
      const a = rot + q * TAU / 5, px = cx + Math.cos(a) * 9.5 * sz, py = cy + Math.sin(a) * 9.5 * sz;
      for (let j = 0; j <= 20; j++) {

        swirlPt(px + ex * Math.cos(a) - ey * Math.sin(a), py + ex * Math.sin(a) + ey * Math.cos(a), u, 1, rm, P);

// waves of light running through the deer's rows, outline inward (alive phase)
function wave(row, t) {

// a slow push-in on the painting while it is made and comes alive
const camZ = t => 1 + 0.04 * ease.inOut3((t - 2.5) / 6.5);
function cam(g, t) { const z = camZ(t); g.translate(C, C); g.scale(z, z); g.translate(-C, -C); }

HG.start({
  duration: 12,
  render(t) {

    const y = Y.ctx; HG.reset(y); y.clearRect(0, 0, W, W);
    y.lineCap = 'round'; y.lineJoin = 'round';

    // midday warmth behind the sun

      hg.addColorStop(0, rgba([255, 190, 80], 0.2 * halo)); hg.addColorStop(0.45, rgba([255, 140, 40], 0.07 * halo)); hg.addColorStop(1, 'rgba(0,0,0,0)');

      const wv = wave(row, t);
      const col = wv > 0.01 ? mix(row.col, WHITE, 0.45 * wv) : row.col;
      strokeRow(y, row, parts, u, col, YW * (1 - 0.5 * ur), 1 - smooth(0.5, 1, ur));
    }
    drawBlooms(y, t);
    drawEye(y, t, smooth(2.4, 3.0, t) * (1 - smooth(9.4, 9.8, t)));
    y.restore();
    drawRim(y, t);
    HG.reset(y);

    // composite the yarn with a soft glow
    HG.reset(ctx);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.5 * end; ctx.filter = HG.blur(12); ctx.drawImage(Y.cv, 0, 0, W, W);
    ctx.globalAlpha = 0.35 * end; ctx.filter = HG.blur(3.5); ctx.drawImage(Y.cv, 0, 0, W, W);
    HG.reset(ctx);
    HG.drawLayer(ctx, Y, { alpha: end });

    // needle-points
    ctx.save(); cam(ctx, t); ctx.globalCompositeOperation = 'lighter';
    for (const nd of needles) HG.dot(ctx, mix(nd.col, WHITE, 0.4), nd.x, nd.y, 20, 0.85 * end);
    ctx.restore();

    // the sun pulses: a ring of warm light leaves it on every beat
    ctx.save(); cam(ctx, t);
    for (let k = 0; k < 3; k++) {
      const tp = 5.95 + k * 1.5, u = (t - tp) / 1.1;
      if (u <= 0 || u >= 1) continue;
      const rr = lerp(70, 185, ease.out3(u)), a = 0.3 * Math.sin(Math.PI * Math.min(1, u * 1.6 + 0.1)) * (1 - u) * end;
      const rg = ctx.createRadialGradient(SUN.x, SUN.y, Math.max(0, rr - 26), SUN.x, SUN.y, rr + 26);
      rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(0.5, rgba([255, 196, 90], a)); rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = rg; ctx.fillRect(SUN.x - rr - 30, SUN.y - rr - 30, 2 * rr + 60, 2 * rr + 60);
    }
    ctx.restore(); HG.reset(ctx);

    // sheen across the finished painting
    const su = (t - 5.25) / 1.3;
    if (su > 0 && su < 1) {
      const s = SH.ctx; HG.reset(s); s.clearRect(0, 0, W, W);
      HG.drawLayer(s, Y);
      const e = ease.inOut3(su), d = lerp(-560, 560, e), vx = Math.cos(0.9), vy = Math.sin(0.9);
      const ox = C + vx * d, oy = C + vy * d;
      const lg = s.createLinearGradient(ox - vx * 90, oy - vy * 90, ox + vx * 90, oy + vy * 90);
      lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(0.5, 'rgba(0,0,0,1)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
      s.globalCompositeOperation = 'destination-in'; s.fillStyle = lg; s.fillRect(0, 0, W, W);
      HG.reset(s);
      HG.drawLayer(ctx, SH, { alpha: 0.7 * Math.sin(Math.PI * su), op: 'lighter' });
    }

    ctx.save(); cam(ctx, t);
    glints(t, bump(t, 5.6, 6.2, 8.9, 9.3) * end);
    ctx.restore(); HG.reset(ctx);

    // the deer's outline shimmers: light runs along its outer rows
    const shim = bump(t, 6.0, 6.8, 8.9, 9.4) * end;
    if (shim > 0.003) {
      ctx.save(); cam(ctx, t); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const row of ROWS) {
        if (row.fig !== 'deer' || row.lev > 1 || row.L < 300) continue;
        for (let pass = 0; pass < 2; pass++) {
          ctx.beginPath(); toScreen(row, 0, 0); ctx.moveTo(P[0], P[1]);
          for (let i = 1; i < row.n; i++) { toScreen(row, i, 0); ctx.lineTo(P[0], P[1]); }
          ctx.closePath();
          ctx.setLineDash([90, 360]); ctx.lineDashOffset = -(t * 300 + row.lev * 40);
          ctx.strokeStyle = rgba(pass ? WHITE : mix(row.col, WHITE, 0.3), 1);
          ctx.globalAlpha = shim * (pass ? 0.55 : 0.45); ctx.lineWidth = pass ? 3 : 10;
          ctx.filter = pass ? 'none' : HG.blur(5); ctx.stroke();
        }
      }
      ctx.restore(); HG.reset(ctx);
    }
  },
});
