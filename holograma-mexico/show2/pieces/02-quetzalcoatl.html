<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Quetzalcóatl, the Feathered Serpent (dawn).
// The dawn feathers of the pyramid drift up from below and a serpent of light rises among them:
// a body of overlapping quetzal feathers with golden belly plates (as the feathered serpents are
// carved and painted in Mesoamerica), long plumes trailing. It glides in a wide S, sweeps clockwise
// around the circle and curls its neck into the centre. There its head of light swells and turns
// to stone: the carved head of the Temple of the Feathered Serpent at Teotihuacan, its crest of
// light opening into the round feather collar while the coil's plumes flare out like a sun of
// feathers. The obsidian eyes glint, wind ripples along the feathers. Then the light leaves the
// stone, the serpent dives down out of the circle and its coil unwinds into falling turquoise
// drops, toward the water of the cenote.
// The body follows its own path (every point of the body travels the curve the head drew), so the
// motion is a real serpent's glide. Everything is a pure function of t.
// Asset: prepare.py on out-show2/images/serpiente-emplumada-2.png -> 02-quetzalcoatl-head;
// derived dawn-gold grade 02-quetzalcoatl-head_gold and silhouette 02-quetzalcoatl-head_sil.
const { W, C, ctx, clamp, lerp, smooth, ease, rgba, COLORS } = HG;
const TAU = Math.PI * 2;
const DEBUG = new URLSearchParams(location.search).has('debug');   // ?debug draws the serpent's path

// ---------- palette (dawn: quetzal green and turquoise lit by rose, peach and gold)
const JADE_D = [8, 58, 48], EMER = [14, 120, 80], QUETZ = [40, 215, 120], TURQ = [40, 215, 225],
  AQUA = [130, 255, 235], GOLD = [255, 196, 90], WARM = [255, 228, 170], PEACH = [255, 170, 120],
  ROSE = [255, 105, 140], TONGUE = [255, 70, 100];

// ---------- timeline
const T_ARR = 5.9, T_DECEL = 1.7;        // the head glides in and comes to rest in the centre
const T_STONE = 5.55;                    // light head swells and turns to stone
const T_GO = 8.75, V_EXIT = 1150, T_ACC = 0.95;   // the dive
const T_DIS = 8.95, V_DIS = 2000;        // the coil dissolves into drops, tail first

// ---------- the stone head (mirrored so it faces the way the serpent arrives)
const SW = 556, SK = SW / 1024;
const stonePt = (u, v) => [C - (u - 512) * SK, C + (v - 512) * SK];
const EYE = stonePt(528, 355), EYE2 = stonePt(309, 331);

// ---------- the path the serpent travels (centripetal Catmull-Rom, resampled every 2 px)
const R_RING = 362, TH_J = -2.25, TURN = 0.8, TH_E = TH_J + TURN * TAU;
const ringPt = th => [C + R_RING * Math.cos(th), C + R_RING * Math.sin(th)];
const HS = 1.4;                                   // light head scale
const HEAD_EYE = [46, -17];                        // eye in head-local units
const REST = [EYE[0] - HEAD_EYE[0] * HS, EYE[1] - HEAD_EYE[1] * HS];
const ENTRY = [[712, 1400], [700, 1180], [668, 1000], [598, 858], [478, 760], [362, 652], [302, 512], [296, 380]];
const RING = []; for (let k = 0; k <= 16; k++) RING.push(ringPt(TH_J + (k / 16) * (TH_E - TH_J)));
const NECK = [[214, 592], [262, 528], [338, 490], [414, 474], REST];
const EXIT = [[566, 490], [616, 566], [626, 690], [608, 830], [588, 970], [576, 1120], [570, 1400]];
const CTRL = [...ENTRY, ...RING, ...NECK, ...EXIT];
const STEP = 2;
const PATH = (() => {
  const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const n = CTRL.length;
  const Q = [[2 * CTRL[0][0] - CTRL[1][0], 2 * CTRL[0][1] - CTRL[1][1]], ...CTRL,
    [2 * CTRL[n - 1][0] - CTRL[n - 2][0], 2 * CTRL[n - 1][1] - CTRL[n - 2][1]]];
  const dense = [];
  const mix = (p, q, a, b) => [p[0] * a + q[0] * b, p[1] * a + q[1] * b];
  for (let i = 1; i < Q.length - 2; i++) {
    const p0 = Q[i - 1], p1 = Q[i], p2 = Q[i + 1], p3 = Q[i + 2];
    const t0 = 0, t1 = t0 + Math.sqrt(d(p0, p1)), t2 = t1 + Math.sqrt(d(p1, p2)), t3 = t2 + Math.sqrt(d(p2, p3));
    const M = 40;
    for (let k = 0; k < M; k++) {
      const t = t1 + (t2 - t1) * k / M;
      const A1 = mix(p0, p1, (t1 - t) / (t1 - t0), (t - t0) / (t1 - t0));
      const A2 = mix(p1, p2, (t2 - t) / (t2 - t1), (t - t1) / (t2 - t1));
      const A3 = mix(p2, p3, (t3 - t) / (t3 - t2), (t - t2) / (t3 - t2));
      const B1 = mix(A1, A2, (t2 - t) / (t2 - t0), (t - t0) / (t2 - t0));
      const B2 = mix(A2, A3, (t3 - t) / (t3 - t1), (t - t1) / (t3 - t1));
      dense.push(mix(B1, B2, (t2 - t) / (t2 - t1), (t - t1) / (t2 - t1)));
    }
  }
  dense.push(CTRL[n - 1]);
  // resample by arc length
  const X = [dense[0][0]], Y = [dense[0][1]];
  let acc = 0, next = STEP;
  for (let i = 1; i < dense.length; i++) {
    const a = dense[i - 1], b = dense[i], seg = d(a, b);
    while (acc + seg >= next) {
      const k = (next - acc) / seg;
      X.push(a[0] + (b[0] - a[0]) * k); Y.push(a[1] + (b[1] - a[1]) * k);
      next += STEP;
    }
    acc += seg;
  }
  const N = X.length, TX = new Float64Array(N), TY = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const a = Math.max(0, i - 2), b = Math.min(N - 1, i + 2);
    const dx = X[b] - X[a], dy = Y[b] - Y[a], l = Math.hypot(dx, dy) || 1;
    TX[i] = dx / l; TY[i] = dy / l;
  }
  const nearest = p => { let bi = 0, bd = 1e9; for (let i = 0; i < N; i++) { const q = Math.hypot(X[i] - p[0], Y[i] - p[1]); if (q < bd) { bd = q; bi = i; } } return bi * STEP; };
  return { X, Y, TX, TY, N, LEN: (N - 1) * STEP, nearest };
})();
// the coil turns slowly like a sun disc while the stone is lit (the whole path turns about the centre)
const rho = t => 0.22 * ease.inOut3((t - 5.5) / 3.6);
function at(s, t = 0) {
  const p = atRaw(s), r = rho(t);
  if (r === 0) return p;
  const c = Math.cos(r), sn = Math.sin(r), x = p[0] - C, y = p[1] - C;
  return [C + x * c - y * sn, C + x * sn + y * c, p[2] * c - p[3] * sn, p[2] * sn + p[3] * c];
}
// position and unit direction of travel at arc length s (straight extrapolation past the ends)
function atRaw(s) {
  const { X, Y, TX, TY, N, LEN } = PATH;
  if (s <= 0) return [X[0] + TX[0] * s, Y[0] + TY[0] * s, TX[0], TY[0]];
  if (s >= LEN) return [X[N - 1] + TX[N - 1] * (s - LEN), Y[N - 1] + TY[N - 1] * (s - LEN), TX[N - 1], TY[N - 1]];
  const f = s / STEP, i = Math.floor(f), k = f - i;
  const tx = TX[i] + (TX[i + 1] - TX[i]) * k, ty = TY[i] + (TY[i + 1] - TY[i]) * k, l = Math.hypot(tx, ty) || 1;
  return [X[i] + (X[i + 1] - X[i]) * k, Y[i] + (Y[i + 1] - Y[i]) * k, tx / l, ty / l];
}
const S_REST = PATH.nearest(REST), S_JOIN = PATH.nearest(RING[0]);
const BODY_L = S_REST - S_JOIN - 30;          // fully on the ring when the head rests

// head arc length over time: steady glide, smooth stop, rest, then an accelerating dive
const V_IN = S_REST / ((T_ARR - T_DECEL) + T_DECEL / 2);
function headS(t) {
  if (t < T_ARR - T_DECEL) return V_IN * t;
  if (t < T_ARR) { const x = (t - (T_ARR - T_DECEL)) / T_DECEL; return V_IN * (T_ARR - T_DECEL) + V_IN * T_DECEL * (x - (x * x * x - x * x * x * x / 2)); }
  if (t < T_GO) return S_REST;
  const dt = t - T_GO;
  if (dt < T_ACC) { const x = dt / T_ACC; return S_REST + V_EXIT * T_ACC * (x * x * x - x * x * x * x / 2); }
  return S_REST + V_EXIT * (T_ACC * 0.5 + dt - T_ACC);
}
function headV(t) { return (headS(t + 0.01) - headS(t - 0.01)) / 0.02; }

// ---------- feather sprites (drawn once, high resolution)
function featherSprite({ len = 320, wid = 104, base, mid, tip, rim, rachis, rimA = 0.95, shine = false }) {
  const cv = document.createElement('canvas'); cv.width = len; cv.height = wid;
  const g = cv.getContext('2d');
  const hw = wid / 2 - 5, cy = wid / 2;
  const shape = () => {
    g.beginPath(); g.moveTo(6, cy);
    g.bezierCurveTo(len * 0.16, cy - hw * 0.55, len * 0.4, cy - hw * 1.0, len * 0.68, cy - hw * 0.94);
    g.bezierCurveTo(len * 0.88, cy - hw * 0.86, len - 5, cy - hw * 0.42, len - 5, cy);
    g.bezierCurveTo(len - 5, cy + hw * 0.42, len * 0.88, cy + hw * 0.86, len * 0.68, cy + hw * 0.94);
    g.bezierCurveTo(len * 0.4, cy + hw * 1.0, len * 0.16, cy + hw * 0.55, 6, cy);
    g.closePath();
  };
  shape();
  const lg = g.createLinearGradient(0, 0, len, 0);
  if (shine) {
    lg.addColorStop(0, rgba(mid, 0)); lg.addColorStop(0.45, rgba(mid, 0.7)); lg.addColorStop(0.85, rgba(tip, 1)); lg.addColorStop(1, rgba(tip, 1));
    g.fillStyle = lg; g.fill();
    return cv;
  }
  lg.addColorStop(0, rgba(base, 1)); lg.addColorStop(0.55, rgba(mid, 1)); lg.addColorStop(0.9, rgba(tip, 1)); lg.addColorStop(1, rgba(tip, 1));
  g.fillStyle = lg; g.fill();
  g.save(); shape(); g.clip();
  // roundness of the vane: darker toward the edges
  const vg = g.createLinearGradient(0, cy - hw, 0, cy + hw);
  vg.addColorStop(0, 'rgba(0,0,0,0.6)'); vg.addColorStop(0.42, 'rgba(0,0,0,0)'); vg.addColorStop(0.58, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, len, wid);
  // a few soft barbs
  g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 5; g.lineCap = 'round';
  for (let i = 1; i <= 5; i++) {
    const x = len * (0.18 + i * 0.12);
    for (const sg of [-1, 1]) { g.beginPath(); g.moveTo(x, cy + sg * 5); g.lineTo(x + len * 0.09, cy + sg * hw); g.stroke(); }
  }
  g.restore();
  shape(); g.strokeStyle = rgba(rim, rimA); g.lineWidth = 7; g.stroke();
  g.beginPath(); g.moveTo(8, cy); g.quadraticCurveTo(len * 0.5, cy - 3, len * 0.84, cy);
  g.strokeStyle = rgba(rachis, 0.95); g.lineWidth = 9; g.lineCap = 'round'; g.stroke();
  return cv;
}
const SPR = {
  body: featherSprite({ base: [6, 70, 56], mid: [26, 175, 110], tip: [60, 225, 200], rim: [170, 255, 200], rachis: [255, 225, 150] }),
  under: featherSprite({ base: [6, 50, 60], mid: [18, 120, 135], tip: [40, 185, 215], rim: [110, 230, 250], rimA: 0.6, rachis: [190, 250, 235] }),
  gold: featherSprite({ base: [120, 50, 20], mid: [240, 160, 70], tip: [255, 225, 160], rim: [255, 240, 200], rachis: [255, 250, 230] }),
  shine: featherSprite({ mid: TURQ, tip: [255, 225, 150], shine: true }),
  plume: featherSprite({ len: 400, wid: 92, base: [8, 80, 60], mid: [34, 200, 120], tip: [255, 205, 110], rim: [190, 255, 210], rachis: [255, 230, 160] }),
};
function feather(c, spr, x, y, ux, uy, len, wid, alpha = 1) {
  if (alpha <= 0.01) return;
  c.save(); c.translate(x, y); c.rotate(Math.atan2(uy, ux)); c.globalAlpha = Math.min(1, alpha);
  c.drawImage(spr, 0, -wid / 2, len, wid); c.restore();
}

// ---------- body geometry
const ROW = 12;
const halfW = u => 31 * (0.7 + 0.3 * smooth(0, 380, u)) * (1 - 0.78 * Math.pow(smooth(0.6 * BODY_L, BODY_L, u), 1.1));
const swim = t => lerp(9, 4, smooth(4.5, 6.5, t)) * (1 - 0.5 * smooth(8.8, 9.6, t));
// body frame at distance u behind the head: position (with a travelling sideways undulation),
// direction of travel d and the back-side normal n (the feathered side; outward on the ring)
function frame(t, u, sh) {
  const p = at(sh - u, t);
  const nx = p[3], ny = -p[2];
  const off = swim(t) * Math.sin(TAU * u / 560 - 5.2 * t) * smooth(0, 240, u);
  return { x: p[0] + nx * off, y: p[1] + ny * off, dx: p[2], dy: p[3], nx, ny };
}
// wind: a wave of lifted, iridescent feathers running from head to tail
const lift = (u, t) => 0.5 + 0.5 * Math.sin(TAU * u / 400 - 5.6 * t);
// a pulse of iridescent light running from the head to the tail while the coil holds
function pulse(u, t) {
  let p = 0;
  for (const t0 of [6.3, 7.55]) { const c = (t - t0) * 1500; p += Math.exp(-Math.pow((u - c) / 150, 2)); }
  return p * smooth(5.8, 6.4, t) * (1 - smooth(8.7, 9.1, t));
}
// the coil's plumes flare out into a sun of feathers while the stone is lit
const flareAt = t => ease.inOut3((t - 5.9) / 1.4) * (1 - smooth(8.7, 9.3, t));
const rowFade = (u, t) => 1 - smooth(0, 0.28, t - (T_DIS + (BODY_L - u) / V_DIS));

const LB = HG.layer(), LH = HG.layer(), LS = HG.layer();

// bloom a layer onto c: same pixel-aligned compositing as HG.drawLayer, with a resolution-scaled blur
function bloom(c, L, px, alpha) {
  if (alpha <= 0) return;
  HG.reset(c); c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(1, alpha); c.filter = HG.blur(px);
  c.drawImage(L.cv, 0, 0, W, W); HG.reset(c);
}

// a long curved plume (quetzal tail covert), drawn as a tapered filled path
function plume(c, x, y, ux, uy, len, wid, bend, t, ph, alpha, cols = [EMER, QUETZ, TURQ]) {
  if (alpha <= 0.01 || len < 4) return;
  const px = -uy, py = ux, M = 12, L = [], R = [];
  let cx = x, cy = y;
  const pts = [];
  for (let i = 0; i <= M; i++) {
    const v = i / M;
    const fl = Math.sin(t * 6.5 + ph - v * 3.2) * 0.18 * v * v;
    const b = (bend * v * v + fl) * len;
    pts.push([x + ux * len * v + px * b, y + uy * len * v + py * b]);
  }
  for (let i = 0; i <= M; i++) {
    const v = i / M, a = pts[Math.max(0, i - 1)], b = pts[Math.min(M, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const w = wid * (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, v * 1.15 + 0.08))) * (v > 0.75 ? 1 - (v - 0.75) * 2.6 : 1);
    L.push([pts[i][0] - ty * w / 2, pts[i][1] + tx * w / 2]); R.push([pts[i][0] + ty * w / 2, pts[i][1] - tx * w / 2]);
  }
  const g = c.createLinearGradient(x, y, pts[M][0], pts[M][1]);
  g.addColorStop(0, rgba(cols[0], 1)); g.addColorStop(0.5, rgba(cols[1], 1)); g.addColorStop(1, rgba(cols[2], 1));
  c.save(); c.globalAlpha = Math.min(1, alpha);
  c.beginPath(); c.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i <= M; i++) c.lineTo(L[i][0], L[i][1]);
  for (let i = M; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
  c.closePath(); c.fillStyle = g; c.fill();
  c.strokeStyle = rgba([180, 255, 220], 0.8); c.lineWidth = 1.6; c.stroke();
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < M; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.strokeStyle = rgba(WARM, 0.85); c.lineWidth = 2; c.stroke();
  c.restore();
}

// ---------- the serpent's body: from the tail to the head, so feathers overlap like shingles
function drawBody(c, t) {
  const sh = headS(t);
  const fl = flareAt(t);
  c.lineJoin = 'round';
  // tail streamers (they follow the path behind the tail)
  const tailU = BODY_L;
  const tf = frame(t, tailU, sh), tailA = rowFade(tailU, t);
  if (tailA > 0.01) {
    const tb = frame(t, tailU - 50, sh);
    const a1 = Math.atan2(-tf.dy, -tf.dx), a2 = Math.atan2(-tb.dy, -tb.dx);
    let dA = a1 - a2; dA -= TAU * Math.round(dA / TAU);
    const kap = clamp(dA / 50, -0.0045, 0.0045);
    for (const [k, len, sp] of [[0, 210, -0.32], [1, 270, 0], [2, 190, 0.3]]) {
      const pts = [[tf.x, tf.y]], M = 14, st = len / M;
      let x = tf.x, y = tf.y, ang = a1 + sp * 0.35;
      for (let j = 1; j <= M; j++) {
        const v = j / M;
        ang += kap * st + sp * 0.05 + 0.07 * Math.sin(t * 4.6 + k * 1.9 - v * 4.5) * v;
        x += Math.cos(ang) * st; y += Math.sin(ang) * st; pts.push([x, y]);
      }
      c.save(); c.globalAlpha = tailA; c.lineCap = 'round';
      for (let j = 0; j < M; j++) {
        const v = j / M, col = j < 9 ? QUETZ : TURQ;
        c.strokeStyle = rgba(col.map((q, i) => Math.round(lerp(EMER[i], q, Math.min(1, v * 1.6)))), 1);
        c.lineWidth = lerp(9, 3.5, v) * (k === 1 ? 1.15 : 1);
        c.beginPath(); c.moveTo(pts[j][0], pts[j][1]); c.lineTo(pts[j + 1][0], pts[j + 1][1]); c.stroke();
      }
      const e = pts[M], q = pts[M - 2], l = Math.hypot(e[0] - q[0], e[1] - q[1]) || 1;
      feather(c, SPR.plume, q[0], q[1], (e[0] - q[0]) / l, (e[1] - q[1]) / l, 58, 20, tailA);
      c.restore();
    }
  }
  const rows = [];
  for (let u = 6; u < BODY_L - 2; u += ROW) rows.push(u);
  for (let r = rows.length - 1; r >= 0; r--) {
    const u = rows[r], a = rowFade(u, t);
    if (a <= 0.01) continue;
    const F = frame(t, u, sh), G = frame(t, u + ROW + 1.5, sh);
    if (Math.hypot(F.x - C, F.y - C) > 640) continue;
    const h = halfW(u), h2 = halfW(u + ROW), pu = pulse(u, t), lf = Math.min(1, lift(u, t) * (1 - 0.6 * smooth(5.8, 6.6, t)) + pu);
    c.globalAlpha = a;
    // core band
    c.fillStyle = rgba(JADE_D, 1);
    c.beginPath();
    c.moveTo(F.x - F.nx * h * 0.95, F.y - F.ny * h * 0.95); c.lineTo(F.x + F.nx * h * 0.6, F.y + F.ny * h * 0.6);
    c.lineTo(G.x + G.nx * h2 * 0.6, G.y + G.ny * h2 * 0.6); c.lineTo(G.x - G.nx * h2 * 0.95, G.y - G.ny * h2 * 0.95);
    c.closePath(); c.fill();
    // golden belly band, softly segmented like the ventral plates of the carved serpents
    const gb = 0.8 + 0.2 * Math.sin(TAU * u / 300 - 3.1 * t);
    c.fillStyle = rgba([255, Math.round(178 + 34 * gb), Math.round(90 + 40 * gb)], 0.95);
    c.beginPath();
    c.moveTo(F.x - F.nx * h * 0.9, F.y - F.ny * h * 0.9); c.lineTo(F.x - F.nx * h * 0.34, F.y - F.ny * h * 0.34);
    c.lineTo(G.x - G.nx * h2 * 0.34, G.y - G.ny * h2 * 0.34); c.lineTo(G.x - G.nx * h2 * 0.9, G.y - G.ny * h2 * 0.9);
    c.closePath(); c.fill();
    if (r % 2 === 0) {
      c.strokeStyle = 'rgba(70,30,10,0.4)'; c.lineWidth = 2.2;
      c.beginPath(); c.moveTo(F.x - F.nx * h * 0.88, F.y - F.ny * h * 0.88); c.lineTo(F.x - F.nx * h * 0.38, F.y - F.ny * h * 0.38); c.stroke();
    }
    // feathers: an outer (turquoise) layer, then the quetzal-green layer on top
    const bx = -F.dx, by = -F.dy;              // toward the tail
    const hv = Math.sin(u * 12.9898) * 43758.5453, hr = hv - Math.floor(hv), hr2 = (hv * 7.31) - Math.floor(hv * 7.31);
    const ao = 0.95 + 0.28 * lf + 0.35 * fl + (hr2 - 0.5) * 0.22, ai = 0.5 + 0.24 * lf + 0.12 * fl;
    const uo = [bx * Math.cos(ao) + F.nx * Math.sin(ao), by * Math.cos(ao) + F.ny * Math.sin(ao)];
    const ui = [bx * Math.cos(ai) + F.nx * Math.sin(ai), by * Math.cos(ai) + F.ny * Math.sin(ai)];
    feather(c, SPR.under, F.x + F.nx * h * 0.45, F.y + F.ny * h * 0.45, uo[0], uo[1], h * (1.6 + 0.5 * hr + 0.35 * fl), h * 0.8, a);
    feather(c, SPR.body, F.x + F.nx * h * 0.05, F.y + F.ny * h * 0.05, ui[0], ui[1], h * (2.05 + 0.25 * lf), h * 0.9, a);
    // iridescent sheen as the wind lifts the feather
    c.globalCompositeOperation = 'lighter';
    feather(c, SPR.shine, F.x + F.nx * h * 0.05, F.y + F.ny * h * 0.05, ui[0], ui[1], h * (2.05 + 0.25 * lf), h * 0.9, a * 0.55 * Math.pow(lf, 2.2));
    c.globalCompositeOperation = 'source-over';
    // long fringe feathers every few rows; they flare outward into a sun of feathers while the stone is lit
    if (r % 4 === 1) {
      const ap = 0.55 + 0.98 * fl + (0.1 + 0.12 * fl) * Math.sin(t * 3.1 - u * 0.012) + (hr - 0.5) * 0.12 - 0.25 * pu * fl;
      const up = [bx * Math.cos(ap) + F.nx * Math.sin(ap), by * Math.cos(ap) + F.ny * Math.sin(ap)];
      const pl = h * (2.5 + 0.4 * hr2 + 1.15 * fl) * (0.92 + 0.08 * Math.sin(t * 2.2 + u * 0.02));
      feather(c, SPR.plume, F.x + F.nx * h * 0.35, F.y + F.ny * h * 0.35, up[0], up[1], pl, h * (0.62 + 0.3 * fl), a);
      c.globalCompositeOperation = 'lighter';
      feather(c, SPR.shine, F.x + F.nx * h * 0.35, F.y + F.ny * h * 0.35, up[0], up[1], pl, h * (0.62 + 0.3 * fl), a * 0.35 * Math.pow(lf, 2));
      c.globalCompositeOperation = 'source-over';
    }
  }
  c.globalAlpha = 1;
}

// ---------- the head of light, in profile (x forward, y toward the belly), drawn like the codex
// and Teotihuacan serpents: upturned curled snout, great ringed eye under a heavy brow, open jaws
// with a curved fang, forked tongue, plumes sweeping back from the crown and a ruff at the neck
function drawHead(c, x, y, dx, dy, k, alpha, t) {
  if (alpha <= 0.01) return;
  c.save();
  // scale about the eye so the eye stays put while the head swells
  const ex = x + (dx * HEAD_EYE[0] - dy * HEAD_EYE[1]) * HS, ey = y + (dy * HEAD_EYE[0] + dx * HEAD_EYE[1]) * HS;
  c.translate(ex, ey); c.rotate(Math.atan2(dy, dx)); c.scale(HS * k, HS * k); c.translate(-HEAD_EYE[0], -HEAD_EYE[1]);
  c.globalAlpha = Math.min(1, alpha); c.lineJoin = 'round'; c.lineCap = 'round';
  const A = Math.min(1, alpha);
  // crown plumes sweeping back
  for (const [ax, ay, ang, len, ph] of [[18, -38, -2.72, 118, 0], [10, -34, -2.92, 140, 1.7], [4, -28, -3.1, 104, 3.1]]) {
    plume(c, ax, ay, Math.cos(ang + 0.05 * Math.sin(t * 2.6 + ph)), Math.sin(ang + 0.05 * Math.sin(t * 2.6 + ph)), len * Math.pow(k, -0.8), 15, -0.25, t, ph, A,
      [[200, 140, 60], [60, 210, 130], [70, 230, 215]]);
  }
  // ruff of feathers at the neck
  for (let i = 6; i >= 0; i--) {
    const v = i / 6, ang = lerp(-2.45, -3.75, v) + 0.06 * Math.sin(t * 4 + i);
    feather(c, i % 2 ? SPR.body : SPR.gold, 2, -4 + v * 12, Math.cos(ang), Math.sin(ang), 58 - 10 * Math.abs(v - 0.5), 22, A);
  }
  const jaw = 0.2 + 0.07 * Math.sin(t * 2.3);
  const rj = (px, py) => [22 + (px - 22) * Math.cos(jaw) - (py - 8) * Math.sin(jaw), 8 + (px - 22) * Math.sin(jaw) + (py - 8) * Math.cos(jaw)];
  // mouth interior
  const j1 = rj(98, 15), j0 = rj(20, 8);
  c.fillStyle = rgba([120, 16, 44], 1); c.beginPath(); c.moveTo(24, 4); c.lineTo(106, 1); c.lineTo(j1[0], j1[1]); c.lineTo(j0[0], j0[1]); c.closePath(); c.fill();
  // forked tongue, flicking
  const fp = (t * 0.8 + 0.3) % 1, flick = fp < 0.4 ? Math.sin(Math.PI * fp / 0.4) : 0;
  const tl = 30 + 52 * flick, tw = Math.sin(t * 24) * 4 * flick, ty = 9;
  c.strokeStyle = rgba(TONGUE, 1); c.lineWidth = 3;
  c.beginPath(); c.moveTo(60, ty); c.quadraticCurveTo(60 + tl * 0.5, ty + 9 + tw, 60 + tl, ty + 2 - tw); c.stroke();
  c.beginPath(); c.moveTo(60 + tl, ty + 2 - tw); c.lineTo(60 + tl + 11, ty - 4 - tw); c.moveTo(60 + tl, ty + 2 - tw); c.lineTo(60 + tl + 11, ty + 8 - tw); c.stroke();
  // lower jaw
  c.save(); c.translate(22, 8); c.rotate(jaw); c.translate(-22, -8);
  c.beginPath(); c.moveTo(18, 6); c.bezierCurveTo(40, 10, 70, 14, 96, 14);
  c.bezierCurveTo(105, 14, 107, 23, 99, 26); c.bezierCurveTo(70, 31, 40, 31, 14, 24); c.closePath();
  const lj = c.createLinearGradient(0, 8, 0, 30); lj.addColorStop(0, rgba([36, 165, 120], 1)); lj.addColorStop(1, rgba([10, 70, 55], 1));
  c.fillStyle = lj; c.fill(); c.strokeStyle = rgba(GOLD, 1); c.lineWidth = 3; c.stroke();
  c.fillStyle = rgba(WARM, 1);
  c.beginPath(); c.moveTo(86, 14); c.quadraticCurveTo(88, 6, 93, 1); c.quadraticCurveTo(94, 8, 95, 14); c.closePath(); c.fill();
  c.restore();
  // upper head
  c.beginPath(); c.moveTo(-8, -16);
  c.bezierCurveTo(4, -36, 30, -47, 52, -41);
  c.bezierCurveTo(70, -36, 84, -28, 100, -24);
  c.bezierCurveTo(112, -22, 119, -14, 115, -4);
  c.bezierCurveTo(113, 1, 107, 2, 101, 1);
  c.lineTo(30, 4);
  c.bezierCurveTo(16, 6, 0, 10, -8, 8);
  c.closePath();
  const sg = c.createLinearGradient(0, -46, 0, 8);
  sg.addColorStop(0, rgba([60, 215, 150], 1)); sg.addColorStop(0.55, rgba([18, 120, 88], 1)); sg.addColorStop(1, rgba([10, 66, 52], 1));
  c.fillStyle = sg; c.fill(); c.strokeStyle = rgba(GOLD, 1); c.lineWidth = 3.2; c.stroke();
  // carved lip line
  c.strokeStyle = rgba([255, 215, 130], 0.8); c.lineWidth = 2.2;
  c.beginPath(); c.moveTo(36, -3); c.bezierCurveTo(60, -5, 90, -6, 108, -8); c.stroke();
  // upper fang and teeth
  c.fillStyle = rgba(WARM, 1);
  c.beginPath(); c.moveTo(92, 1); c.quadraticCurveTo(95, 15, 87, 24); c.quadraticCurveTo(86, 12, 82, 2); c.closePath(); c.fill();
  for (const xx of [62, 70]) { c.beginPath(); c.moveTo(xx, 3); c.lineTo(xx + 3, 10); c.lineTo(xx + 6, 3); c.closePath(); c.fill(); }
  // upturned curled snout
  c.strokeStyle = rgba(GOLD, 1); c.lineWidth = 4.6;
  c.beginPath(); c.moveTo(98, -25); c.bezierCurveTo(100, -44, 126, -48, 128, -32); c.bezierCurveTo(129, -22, 115, -20, 115, -30); c.stroke();
  c.fillStyle = rgba([8, 40, 30], 1); c.beginPath(); c.ellipse(108, -14, 3.2, 2.2, -0.3, 0, TAU); c.fill();
  // cheek scroll
  c.strokeStyle = rgba(GOLD, 0.95); c.lineWidth = 2.6;
  c.beginPath(); c.arc(14, -10, 8, 0.3, TAU * 0.9); c.stroke();
  c.beginPath(); c.arc(14, -10, 3, 0, TAU); c.stroke();
  // snout scale bands
  c.strokeStyle = rgba([255, 215, 130], 0.85); c.lineWidth = 2.4;
  for (const xx of [76, 87]) { c.beginPath(); c.moveTo(xx - 2, -30 + (xx - 76) * 0.4); c.quadraticCurveTo(xx + 3, -18, xx, -6); c.stroke(); }
  // eye under a heavy brow plate
  const EX = HEAD_EYE[0], EY = HEAD_EYE[1] - 4;
  c.fillStyle = rgba([6, 24, 22], 1); c.beginPath(); c.arc(EX, EY, 9.5, 0, TAU); c.fill();
  c.strokeStyle = rgba(WARM, 1); c.lineWidth = 3; c.stroke();
  c.fillStyle = rgba(AQUA, 1); c.beginPath(); c.arc(EX + 1, EY, 4, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,1)'; c.beginPath(); c.arc(EX + 3, EY - 2.5, 1.8, 0, TAU); c.fill();
  c.fillStyle = rgba(GOLD, 1);
  c.beginPath(); c.moveTo(27, -27); c.bezierCurveTo(33, -47, 62, -50, 72, -31); c.bezierCurveTo(62, -40, 38, -41, 27, -27); c.closePath(); c.fill();
  c.restore();
}

// ---------- particles
// falling turquoise drops; spawn (x, y, vx, vy) at time t0; a bright head with a short streak
function drop(t, t0, x, y, vx, vy, size, life, col) {
  const a = t - t0; if (a < 0 || a > life) return;
  const g = 860, k = 1 - a / life;
  const env = smooth(0, 0.1, a) * Math.pow(k, 1.3) * (0.85 + 0.15 * Math.sin(t * 17 + x)) * (1 - smooth(10.45, 11.2, t));
  const px = x + vx * a, py = y + vy * a + 0.5 * g * a * a;
  const ux = vx, uy = vy + g * a, sp = Math.hypot(ux, uy) || 1;
  const sl = Math.min(70, 8 + sp * 0.06);
  const tx = px - ux / sp * sl, ty = py - uy / sp * sl;
  const gr = ctx.createLinearGradient(tx, ty, px, py);
  gr.addColorStop(0, rgba(col, 0)); gr.addColorStop(1, rgba(col, 0.75 * env));
  ctx.strokeStyle = gr; ctx.lineWidth = size * 0.32; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(px, py); ctx.stroke();
  HG.dot(ctx, col, px, py, size * 1.6, env * 0.55);
  HG.dot(ctx, AQUA, px, py, size, env);
}

function render(t, A) {
  const sh = headS(t);
  const H = at(sh, t);
  const stoneA = smooth(T_STONE + 0.15, T_STONE + 1.1, t) * (1 - smooth(T_GO - 0.1, T_GO + 0.85, t));
  const lightK = 1 + 0.6 * ease.inOut3((t - T_STONE) / 0.75) * (1 - ease.inOut3((t - (T_GO - 0.45)) / 0.55));
  const headA = (1 - smooth(T_STONE + 0.35, T_STONE + 0.9, t)) + smooth(T_GO - 0.5, T_GO - 0.1, t);
  const flare = flareAt(t);

  // dawn halo between the stone and the coil (rose, peach and gold)
  const haloA = smooth(5.2, 6.8, t) * (1 - smooth(8.8, 9.8, t));
  if (haloA > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const sc = 0.9 + 0.1 * ease.out3((t - T_STONE) / 1.6), r0 = 262 * sc;
    const g = ctx.createRadialGradient(C, C, r0, C, C, r0 + 90);
    g.addColorStop(0, rgba(WARM, 0)); g.addColorStop(0.24, rgba(PEACH, 0.6 * haloA)); g.addColorStop(0.42, rgba(ROSE, 0.26 * haloA));
    g.addColorStop(0.7, rgba([150, 70, 220], 0.06 * haloA)); g.addColorStop(1, rgba([150, 70, 220], 0));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, W); ctx.restore();
  }

  // the serpent's body (and its head while it travels in)
  const bc = LB.ctx; HG.reset(bc); bc.clearRect(0, 0, W, W);
  drawBody(bc, t);
  if (t < T_GO - 1) drawHead(bc, H[0], H[1], H[2], H[3], lightK, headA, t);
  HG.reset(bc);
  bloom(ctx, LB, 9, 0.75);
  HG.drawLayer(ctx, LB);

  // the carved stone head (mirrored to face the serpent's way)
  if (stoneA > 0) {
    const sc = 0.9 + 0.1 * ease.out3((t - T_STONE) / 1.6);
    const sc2 = sc * (1 - 0.05 * smooth(T_GO - 0.1, T_GO + 0.9, t));
    const sl = LS.ctx; HG.reset(sl); sl.clearRect(0, 0, W, W);
    sl.translate(C, C); sl.scale(-sc2, sc2); sl.drawImage(A.gold, -SW / 2, -SW / 2, SW, SW); HG.reset(sl);
    bloom(ctx, LS, 12, stoneA * 0.2);
    HG.drawLayer(ctx, LS, { alpha: stoneA });
    // warm key light of the sunrise from the upper left, keeping the carved texture
    HG.reset(sl); sl.globalCompositeOperation = 'destination-in';
    const kl = sl.createRadialGradient(C - 170, C - 190, 40, C - 170, C - 190, 520);
    kl.addColorStop(0, 'rgba(0,0,0,1)'); kl.addColorStop(0.55, 'rgba(0,0,0,0.35)'); kl.addColorStop(1, 'rgba(0,0,0,0)');
    sl.fillStyle = kl; sl.fillRect(0, 0, W, W); HG.reset(sl);
    HG.drawLayer(ctx, LS, { alpha: stoneA * 0.45, op: 'lighter' });
    // molten gold as the light turns to stone
    const molten = Math.sin(Math.PI * clamp((t - T_STONE) / 1.5)) * (t < T_GO ? 1 : 0);
    if (molten > 0.01) {
      HG.reset(sl); sl.clearRect(0, 0, W, W);
      sl.translate(C, C); sl.scale(-sc2, sc2); sl.drawImage(A.gold, -SW / 2, -SW / 2, SW, SW); HG.reset(sl);
      sl.globalCompositeOperation = 'source-in'; sl.fillStyle = rgba(GOLD, 1); sl.fillRect(0, 0, W, W); HG.reset(sl);
      bloom(ctx, LS, 30, molten * 0.22);
      HG.drawLayer(ctx, LS, { alpha: molten * 0.12, op: 'lighter' });
    }
    // a band of dawn light sweeps across the carving
    const sw = (t - 6.55) / 1.3;
    if (sw > 0 && sw < 1) {
      HG.reset(sl); sl.clearRect(0, 0, W, W);
      sl.translate(C, C); sl.scale(-sc2, sc2); sl.drawImage(A.gold, -SW / 2, -SW / 2, SW, SW); HG.reset(sl);
      sl.globalCompositeOperation = 'source-in';
      const bx = lerp(C - 420, C + 420, ease.inOut3(sw));
      const g = sl.createLinearGradient(bx - 140, C - 140, bx + 140, C + 140);
      g.addColorStop(0, rgba(WARM, 0)); g.addColorStop(0.5, rgba(WARM, 0.85)); g.addColorStop(1, rgba(WARM, 0));
      sl.fillStyle = g; sl.fillRect(0, 0, W, W); HG.reset(sl);
      HG.drawLayer(ctx, LS, { alpha: stoneA * 0.42 * Math.sin(Math.PI * sw), op: 'lighter' });
    }
  }

  // the crest of light opens into the round feather collar, then settles into the stone
  const cb = ease.out3((t - (T_STONE + 0.05)) / 1.1), cbA = smooth(T_STONE, T_STONE + 0.3, t) * (1 - smooth(T_STONE + 0.9, T_STONE + 1.7, t));
  if (cbA > 0.01) {
    const hc = LH.ctx; HG.reset(hc); hc.clearRect(0, 0, W, W);
    const NC = 30, base = -2.3;   // from the back of the head's crest (upper left) all around
    for (let i = 0; i < NC; i++) {
      const v = i / NC, ang = base + (v - 0.5) * TAU * lerp(0.18, 1, cb) + 0.05 * Math.sin(t * 3 + i);
      const r0 = lerp(70, 150, cb), len = lerp(60, 140, cb) * (i % 2 ? 0.9 : 1);
      feather(hc, i % 2 ? SPR.body : SPR.gold, C + Math.cos(ang) * r0, C + Math.sin(ang) * r0, Math.cos(ang), Math.sin(ang), len, 40, 1);
    }
    HG.reset(hc);
    bloom(ctx, LH, 10, cbA * 0.45);
    HG.drawLayer(ctx, LH, { alpha: cbA * 0.7 });
  }

  // obsidian eyes glint
  for (const [tg, amp] of [[7.0, 1], [8.25, 0.75]]) {
    const g = Math.exp(-Math.pow((t - tg) / 0.16, 2)) * amp * stoneA;
    if (g < 0.01) continue;
    for (const [e, s] of [[EYE, 1], [EYE2, 0.6]]) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(e[0], e[1]); ctx.rotate(0.3 + (t - tg) * 0.6);
      for (const [rx, ry] of [[70 * s, 4.5 * s], [4.5 * s, 70 * s]]) {
        const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        gg.addColorStop(0, rgba(WARM, g)); gg.addColorStop(1, rgba(GOLD, 0));
        ctx.save(); ctx.scale(rx, ry); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill(); ctx.restore();
      }
      ctx.restore();
      HG.dot(ctx, WARM, e[0], e[1], 34 * s, g * 0.9);
    }
  }

  // the head leaves the stone and dives (drawn above the stone)
  if (t >= T_GO - 1) {
    const hc = LH.ctx; HG.reset(hc); hc.clearRect(0, 0, W, W);
    drawHead(hc, H[0], H[1], H[2], H[3], lightK, headA, t);
    HG.reset(hc);
    bloom(ctx, LH, 9, 0.75);
    HG.drawLayer(ctx, LH);
  }

  // turquoise drops: shed by the diving head, then by the dissolving coil
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const R = HG.rng(91);
  for (let j = 0; j < 46; j++) {
    const t0 = T_GO + 0.2 + j * 0.03 + R() * 0.02, s0 = headS(t0), p = at(s0 - 20 - R() * 60, t0), v = headV(t0);
    const vx = p[2] * v * 0.18 + (R() - 0.5) * 160, vy = p[3] * v * 0.18 + 20 - R() * 110;
    drop(t, t0, p[0] + (R() - 0.5) * 40, p[1] + (R() - 0.5) * 40, vx, vy, 13 + R() * 9, 0.9 + R() * 0.7, R() < 0.55 ? TURQ : [70, 190, 255]);
  }
  const R2 = HG.rng(57);
  for (let u = 6; u < BODY_L - 2; u += ROW) {
    const td = T_DIS + (BODY_L - u) / V_DIS;
    // a soft sparkle where the feathers turn to water
    const fa = t - td;
    if (fa > -0.05 && fa < 0.2) {
      const F = frame(td, u, headS(td));
      HG.dot(ctx, AQUA, F.x, F.y, 46, 0.2 * Math.sin(Math.PI * (fa + 0.05) / 0.25));
    }
    for (let m = 0; m < 2; m++) {
      const t0 = td + R2() * 0.3, sx = R2(), sy = R2(), sz = R2(), lf = R2(), cc = R2(), vv = R2(), skip = R2();
      if (t < t0 || skip < 0.2) continue;
      const F = frame(t0, u, headS(t0)), h = halfW(u), v = headV(t0);
      const off = (sy - 0.4) * h * 2.6;
      drop(t, t0, F.x + F.nx * off, F.y + F.ny * off, F.dx * v * 0.2 + (sx - 0.5) * 200, F.dy * v * 0.2 + 30 - vv * 120,
        11 + sz * 11, 1.0 + lf * 0.7, cc < 0.6 ? TURQ : cc < 0.85 ? [70, 190, 255] : QUETZ);
    }
  }
  ctx.restore();

  // dawn feathers drifting up from the pyramid (continuing the previous piece)
  const RF = HG.rng(23);
  for (let i = 0; i < 16; i++) {
    const t0 = -0.4 + RF() * 1.3, life = 1.9 + RF() * 0.8, x0 = 330 + RF() * 470, sp = 330 + RF() * 200,
      ph = RF() * TAU, rot = (RF() - 0.5) * 3, sz = 46 + RF() * 34, gold = RF() < 0.4;
    const a = t - t0; if (a < 0 || a > life) continue;
    const env = smooth(0, 0.35, a) * (1 - smooth(life * 0.55, life, a)) * smooth(0.1, 0.5, t);
    const x = x0 + Math.sin(a * 2.2 + ph) * 46, y = 1120 - sp * a;
    const ang = ph + rot * a + 0.5 * Math.sin(a * 3 + ph);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.filter = HG.blur(5);
    feather(ctx, gold ? SPR.gold : SPR.body, x, y, Math.cos(ang), Math.sin(ang), sz, sz * 0.36, env * 0.6);
    ctx.filter = 'none';
    feather(ctx, gold ? SPR.gold : SPR.body, x, y, Math.cos(ang), Math.sin(ang), sz, sz * 0.36, env * 0.9);
    ctx.restore();
  }

  // motes of dawn light
  const dA = smooth(5.6, 7.2, t) * (1 - smooth(8.8, 9.8, t));
  if (dA > 0) HG.dust(t, { n: 60, colors: [GOLD, PEACH, ROSE], alpha: 0.4 * dA, size: 7, r: 490, seed: 5 });

  if (DEBUG) {
    HG.reset(ctx); ctx.strokeStyle = 'rgba(255,0,0,0.8)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < PATH.N; i += 4) i ? ctx.lineTo(PATH.X[i], PATH.Y[i]) : ctx.moveTo(PATH.X[i], PATH.Y[i]); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(C, C, 540, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(C, C, 470, 0, TAU); ctx.stroke();
  }
}

HG.start({
  duration: 12,
  assets: { gold: '../assets/02-quetzalcoatl-head_gold.png' },
  render,
});
