<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Quetzalcóatl, the Feathered Serpent (dawn) — Artesanías y Tesoros, between Cabeza Olmeca and
// Piedra del Sol.
// A serpent of light (quetzal-green feathers, golden ventral plates, a gold rattle with quetzal
// plumes at the tail: Quetzalcóatl is a feathered RATTLESNAKE) glides in from the left, sweeps
// clockwise over the top and down the right of the circle and spirals its neck into the centre.
// There its head swells and turns to gold: the carved head of the Temple of the Feathered Serpent
// at Teotihuacan (open jaws, ringed eyes, carved scroll at the back of the head) and its round
// collar — a single ring of broad carved feather petals — fans open behind it like a sunrise.
// Molten gold cools into carved stone from the eye outward, a narrow rim of dawn light rings the
// medallion, the coil's plumes flare into a sun of feathers, the obsidian eye glints. Then the
// spirit of light rises from behind the carved collar and up out of the sky; the stone glows gold,
// burns away from the centre behind a gold edge (about 0.3 s), and the coil dissolves into a turning ring of gold sparks (the calendar wheel that the
// next piece, the Piedra del Sol, gathers into).
// Composition keeps the lower band (y > ~780) calm from ~2 s to ~9.7 s for the shared title.
// The body follows its own path (every point of the body travels the curve the head drew), so the
// motion is a real serpent's glide. Everything is a pure function of t.
// Asset: show2/assets/02-quetzalcoatl-stone_{gold,sil,edge}.png, cut from
// out-show2/images/serpiente-emplumada-1.png (head only, 1:1 source pixels at --size 2160),
// see work/02-quetzalcoatl/scripts/make_stone.py. The petal collar is drawn here.
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const TAU = Math.PI * 2;
const DEBUG = new URLSearchParams(location.search).has('debug');   // ?debug draws the serpent's path

// ---------- palette (dawn: quetzal green and turquoise lit by rose, peach and gold)
const JADE_D = [8, 58, 48], EMER = [14, 120, 80], QUETZ = [40, 215, 120], TURQ = [40, 215, 225],
  AQUA = [130, 255, 235], GOLD = [255, 196, 90], WARM = [255, 228, 170], PEACH = [255, 190, 150],
  ROSE = [255, 110, 140], TONGUE = [255, 70, 100];

// ---------- composition
const CX = 540, CY = 495;                 // centre of the coil and the medallion (lifted above the title band)
const R_RING = 315;
const Y_CALM = 770;                       // nothing bright below this while the title shows
const calmY = t => lerp(1600, Y_CALM, smooth(1.5, 2.3, t) * (1 - smooth(9.6, 10.1, t)));

// ---------- timeline
const T_ARR = 5.2, T_DEC = 2.0;           // the head glides in and comes to rest in the centre
const T_GOLD = 5.42;                      // the head turns to molten gold, the collar fans open
const T_GO = 8.45, V_EXIT = 1100, T_ACC = 0.6;   // the spirit lifts off and rises
const T_OUT = 9.0, D_OUT = 0.3;           // the stone flares to molten gold and is gone
const exitHeat = t => smooth(T_OUT - 0.2, T_OUT + 0.02, t);
// then it burns away from the centre outward behind a gold edge (no frame shows it as a dim image)
const R_BURN = 330, BURN_FEA = 60;
const burnR = t => R_BURN * ease.inOut3((t - T_OUT) / D_OUT);
const burnT = r => { let lo = 0, hi = 1; for (let k = 0; k < 24; k++) { const m = (lo + hi) / 2; if (R_BURN * ease.inOut3(m) < r) lo = m; else hi = m; } return T_OUT + D_OUT * lo; };
function burn(c, t) {
  const rb = burnR(t); if (rb <= 0.5) return;
  HG.reset(c); c.globalCompositeOperation = 'destination-out';
  const g = c.createRadialGradient(CX, CY, 0, CX, CY, rb);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(Math.max(0, 1 - BURN_FEA / rb), 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, W); HG.reset(c);
}
const T_DIS = 8.9, V_DIS = 1800;          // the coil dissolves into gold sparks, tail first

// ---------- the stone head (crop 980 px, centred on the old medallion centre, mirrored to face right)
const SW = 490, SK = SW / 980;
const stonePt = (u, v) => [CX - (u - 490) * SK, CY + (v - 490) * SK];
const EYE = stonePt(435, 337), FANG = stonePt(225, 555);
const K_STONE = 1.62;                     // light head scale that matches the carved head

// ---------- the path the serpent travels (centripetal Catmull-Rom, resampled every 2 px)
const pol = (th, r) => [CX + r * Math.cos(th), CY + r * Math.sin(th)];
const DEG = Math.PI / 180, TH_A = 150 * DEG, TH_B = 395 * DEG;
const HS = 1.55;                                  // light head scale while it travels
const HEAD_EYE = [46, -17];                       // eye in head-local units
const REST = [EYE[0] - HEAD_EYE[0] * HS, EYE[1] - HEAD_EYE[1] * HS];
// in from the left rim, a hook up into the tail end of the ring (the tail curls there at rest)
const ENTRY = [[-190, 680], [-60, 684], [70, 696], [176, 722], [262, 736], [316, 714], [324, 686]];
const RING = []; for (let k = 0; k <= 14; k++) RING.push(pol(TH_A + (k / 14) * (TH_B - TH_A), R_RING));
// the neck spirals inward along the bottom (above the title band) and up behind the medallion
const SPIRAL = [[738, 674], [676, 642], [612, 620], [540, 618], [470, 604], [428, 560], [414, 500], [440, 450]];
// the exit: up through the sky with a serpent's S-sway
const EXIT = [[552, 436], [598, 404], [624, 350], [630, 285], [610, 218], [578, 150], [572, 80], [600, 0], [636, -80], [612, -180], [588, -300], [600, -520]];
const CTRL = [...ENTRY, ...RING, ...SPIRAL, REST, ...EXIT];
const STEP = 2;
const PATH = (() => {
  const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const n = CTRL.length;
  const Q = [[2 * CTRL[0][0] - CTRL[1][0], 2 * CTRL[0][1] - CTRL[1][1]], ...CTRL,
    [2 * CTRL[n - 1][0] - CTRL[n - 2][0], 2 * CTRL[n - 1][1] - CTRL[n - 2][1]]];
  const dense = [];
  const mix = (p, q, a, b) => [p[0] * a + q[0] * b, p[1] * a + q[1] * b];
  for (let i = 1; i < Q.length - 2; i++) {
    const p0 = Q[i - 1], p1 = Q[i], p2 = Q[i + 1], p3 = Q[i + 2];
    const t0 = 0, t1 = t0 + Math.sqrt(d(p0, p1)), t2 = t1 + Math.sqrt(d(p1, p2)), t3 = t2 + Math.sqrt(d(p2, p3));
    const M = 40;
    for (let k = 0; k < M; k++) {
      const t = t1 + (t2 - t1) * k / M;
      const A1 = mix(p0, p1, (t1 - t) / (t1 - t0), (t - t0) / (t1 - t0));
      const A2 = mix(p1, p2, (t2 - t) / (t2 - t1), (t - t1) / (t2 - t1));
      const A3 = mix(p2, p3, (t3 - t) / (t3 - t2), (t - t2) / (t3 - t2));
      const B1 = mix(A1, A2, (t2 - t) / (t2 - t0), (t - t0) / (t2 - t0));
      const B2 = mix(A2, A3, (t3 - t) / (t3 - t1), (t - t1) / (t3 - t1));
      dense.push(mix(B1, B2, (t2 - t) / (t2 - t1), (t - t1) / (t2 - t1)));
    }
  }
  dense.push(CTRL[n - 1]);
  // resample by arc length
  const X = [dense[0][0]], Y = [dense[0][1]];
  let acc = 0, next = STEP;
  for (let i = 1; i < dense.length; i++) {
    const a = dense[i - 1], b = dense[i], seg = d(a, b);
    while (acc + seg >= next) {
      const k = (next - acc) / seg;
      X.push(a[0] + (b[0] - a[0]) * k); Y.push(a[1] + (b[1] - a[1]) * k);
      next += STEP;
    }
    acc += seg;
  }
  const N = X.length, TX = new Float64Array(N), TY = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const a = Math.max(0, i - 2), b = Math.min(N - 1, i + 2);
    const dx = X[b] - X[a], dy = Y[b] - Y[a], l = Math.hypot(dx, dy) || 1;
    TX[i] = dx / l; TY[i] = dy / l;
  }
  const nearest = (p, from = 0) => { let bi = from, bd = 1e9; for (let i = from; i < N; i++) { const q = Math.hypot(X[i] - p[0], Y[i] - p[1]); if (q < bd) { bd = q; bi = i; } } return bi * STEP; };
  return { X, Y, TX, TY, N, LEN: (N - 1) * STEP, nearest };
})();
// position and unit direction of travel at arc length s (straight extrapolation past the ends)
function at(s) {
  const { X, Y, TX, TY, N, LEN } = PATH;
  if (s <= 0) return [X[0] + TX[0] * s, Y[0] + TY[0] * s, TX[0], TY[0]];
  if (s >= LEN) return [X[N - 1] + TX[N - 1] * (s - LEN), Y[N - 1] + TY[N - 1] * (s - LEN), TX[N - 1], TY[N - 1]];
  const f = s / STEP, i = Math.floor(f), k = f - i;
  const tx = TX[i] + (TX[i + 1] - TX[i]) * k, ty = TY[i] + (TY[i + 1] - TY[i]) * k, l = Math.hypot(tx, ty) || 1;
  return [X[i] + (X[i + 1] - X[i]) * k, Y[i] + (Y[i + 1] - Y[i]) * k, tx / l, ty / l];
}
const S_JOIN = PATH.nearest(RING[0]);
const S_REST = PATH.nearest(REST, S_JOIN / STEP);
const BODY_L = S_REST - S_JOIN - 26;          // tail just past the ring's start when the head rests

// head arc length over time: steady glide, smooth stop, rest, then an accelerating rise
const V_IN = S_REST / ((T_ARR - T_DEC) + T_DEC / 2);
function headS(t) {
  if (t < T_ARR - T_DEC) return V_IN * t;
  if (t < T_ARR) { const x = (t - (T_ARR - T_DEC)) / T_DEC; return V_IN * (T_ARR - T_DEC) + V_IN * T_DEC * (x - (x * x * x - x * x * x * x / 2)); }
  if (t < T_GO) return S_REST;
  const dt = t - T_GO;
  if (dt < T_ACC) { const x = dt / T_ACC; return S_REST + V_EXIT * T_ACC * (x * x * x - x * x * x * x / 2); }
  return S_REST + V_EXIT * (T_ACC * 0.5 + dt - T_ACC);
}
function headV(t) { return (headS(t + 0.01) - headS(t - 0.01)) / 0.02; }
// the head is rigid and about 200 px long: aim it along the chord to the path ahead, so it stays on
// the curve instead of sticking out tangentially (near rest and at lift-off it follows the tangent,
// so it lines up with the carved head)
function headPose(sh) {
  const p = at(sh), q = at(sh + 150);
  let cx = q[0] - p[0], cy = q[1] - p[1]; const l = Math.hypot(cx, cy) || 1; cx /= l; cy /= l;
  const w = sh <= S_REST ? smooth(S_REST - 420, S_REST - 60, sh) : 1 - smooth(S_REST + 60, S_REST + 260, sh);
  let dx = lerp(cx, p[2], w), dy = lerp(cy, p[3], w); const m = Math.hypot(dx, dy) || 1;
  return [p[0], p[1], dx / m, dy / m];
}

// ---------- feather sprites (drawn once, high resolution)
function featherSprite({ len = 320, wid = 104, base, mid, tip, rim, rachis, rimA = 0.95, shine = false }) {
  const cv = document.createElement('canvas'); cv.width = len; cv.height = wid;
  const g = cv.getContext('2d');
  const hw = wid / 2 - 5, cy = wid / 2;
  const shape = () => {
    g.beginPath(); g.moveTo(6, cy);
    g.bezierCurveTo(len * 0.16, cy - hw * 0.55, len * 0.4, cy - hw * 1.0, len * 0.68, cy - hw * 0.94);
    g.bezierCurveTo(len * 0.88, cy - hw * 0.86, len - 5, cy - hw * 0.42, len - 5, cy);
    g.bezierCurveTo(len - 5, cy + hw * 0.42, len * 0.88, cy + hw * 0.86, len * 0.68, cy + hw * 0.94);
    g.bezierCurveTo(len * 0.4, cy + hw * 1.0, len * 0.16, cy + hw * 0.55, 6, cy);
    g.closePath();
  };
  shape();
  const lg = g.createLinearGradient(0, 0, len, 0);
  if (shine) {
    lg.addColorStop(0, rgba(mid, 0)); lg.addColorStop(0.45, rgba(mid, 0.7)); lg.addColorStop(0.85, rgba(tip, 1)); lg.addColorStop(1, rgba(tip, 1));
    g.fillStyle = lg; g.fill();
    return cv;
  }
  lg.addColorStop(0, rgba(base, 1)); lg.addColorStop(0.55, rgba(mid, 1)); lg.addColorStop(0.9, rgba(tip, 1)); lg.addColorStop(1, rgba(tip, 1));
  g.fillStyle = lg; g.fill();
  g.save(); shape(); g.clip();
  // roundness of the vane: darker toward the edges
  const vg = g.createLinearGradient(0, cy - hw, 0, cy + hw);
  vg.addColorStop(0, 'rgba(0,0,0,0.6)'); vg.addColorStop(0.42, 'rgba(0,0,0,0)'); vg.addColorStop(0.58, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, len, wid);
  // a few soft barbs
  g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = 5; g.lineCap = 'round';
  for (let i = 1; i <= 5; i++) {
    const x = len * (0.18 + i * 0.12);
    for (const sg of [-1, 1]) { g.beginPath(); g.moveTo(x, cy + sg * 5); g.lineTo(x + len * 0.09, cy + sg * hw); g.stroke(); }
  }
  g.restore();
  shape(); g.strokeStyle = rgba(rim, rimA); g.lineWidth = 7; g.stroke();
  g.beginPath(); g.moveTo(8, cy); g.quadraticCurveTo(len * 0.5, cy - 3, len * 0.84, cy);
  g.strokeStyle = rgba(rachis, 0.95); g.lineWidth = 9; g.lineCap = 'round'; g.stroke();
  return cv;
}
const SPR = {
  body: featherSprite({ base: [6, 70, 56], mid: [26, 175, 110], tip: [60, 225, 200], rim: [170, 255, 200], rachis: [255, 225, 150] }),
  under: featherSprite({ base: [6, 50, 60], mid: [18, 120, 135], tip: [40, 185, 215], rim: [110, 230, 250], rimA: 0.6, rachis: [190, 250, 235] }),
  gold: featherSprite({ base: [120, 50, 20], mid: [240, 160, 70], tip: [255, 225, 160], rim: [255, 240, 200], rachis: [255, 250, 230] }),
  shine: featherSprite({ mid: TURQ, tip: [255, 225, 150], shine: true }),
  shineGold: featherSprite({ mid: GOLD, tip: WARM, shine: true }),
  plume: featherSprite({ len: 400, wid: 92, base: [8, 80, 60], mid: [34, 200, 120], tip: [255, 205, 110], rim: [190, 255, 210], rachis: [255, 230, 160] }),
};
function feather(c, spr, x, y, ux, uy, len, wid, alpha = 1) {
  if (alpha <= 0.01 || len < 2) return;
  c.save(); c.translate(x, y); c.rotate(Math.atan2(uy, ux)); c.globalAlpha = Math.min(1, alpha);
  c.drawImage(spr, 0, -wid / 2, len, wid); c.restore();
}
// keep a feather's tip above the calm line (the title band): shorten it softly if it points down into it
function calmLen(y, uy, len, ylim) {
  if (uy <= 0.02) return len;
  const room = (ylim - y) / uy;
  if (room >= len) return len;
  return Math.max(len * 0.25, room - 6 * (1 - room / len));
}

// ---------- body geometry
const ROW = 12;
const halfW = u => 31 * (0.7 + 0.3 * smooth(0, 380, u)) * (1 - 0.74 * Math.pow(smooth(0.72 * BODY_L, BODY_L, u), 1.1));
const swim = t => lerp(9, 3.5, smooth(4.2, 6.2, t)) * (1 - 0.5 * smooth(8.8, 9.6, t));
// body frame at distance u behind the head: position (with a travelling sideways undulation),
// direction of travel d and the back-side normal n (the feathered side; outward on the ring)
function frame(t, u, sh) {
  const p = at(sh - u);
  const nx = p[3], ny = -p[2];
  const off = swim(t) * Math.sin(TAU * u / 560 - 5.2 * t) * smooth(0, 240, u) * (1 - smooth(BODY_L - 120, BODY_L, u) * 0.6);
  return { x: p[0] + nx * off, y: p[1] + ny * off, dx: p[2], dy: p[3], nx, ny };
}
// wind: a wave of lifted, iridescent feathers running from head to tail
const lift = (u, t) => 0.5 + 0.5 * Math.sin(TAU * u / 400 - 5.6 * t);
// a pulse of iridescent light running from the head to the tail while the coil holds
function pulse(u, t) {
  let p = 0;
  for (const t0 of [6.15, 7.4]) { const c = (t - t0) * 1500; p += Math.exp(-Math.pow((u - c) / 150, 2)); }
  return p * smooth(5.7, 6.2, t) * (1 - smooth(8.6, 9.0, t));
}
// the coil's plumes flare out into a sun of feathers while the stone is lit
const flareAt = t => ease.inOut3((t - 5.75) / 1.4) * (1 - smooth(8.45, 9.05, t));
const dissolveT = u => T_DIS + (BODY_L - u) / V_DIS;
const rowFade = (u, t) => 1 - smooth(0, 0.22, t - dissolveT(u));

const LB = HG.layer(), LH = HG.layer(), LS = HG.layer(), LP = HG.layer(), LG = HG.layer();

// bloom a layer onto c. HG.drawLayer cannot carry a blur (it sets filter 'none'), so this draws the
// layer canvas under the engine transform set by HG.reset (scale S): its SIZE x SIZE pixels land
// on the W x W (1080) box, i.e. exactly 1:1 onto the canvas pixels at any ?size, with a blur
// expressed through HG.blur so the glow scales with the render size.
function bloom(c, L, px, alpha) {
  if (alpha <= 0) return;
  HG.reset(c); c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(1, alpha); c.filter = HG.blur(px);
  c.drawImage(L.cv, 0, 0, W, W); HG.reset(c);
}

// a long curved plume (quetzal tail covert), drawn as a tapered filled path
function plume(c, x, y, ux, uy, len, wid, bend, t, ph, alpha, cols = [EMER, QUETZ, TURQ]) {
  if (alpha <= 0.01 || len < 4) return;
  const px = -uy, py = ux, M = 12, L = [], R = [];
  const pts = [];
  for (let i = 0; i <= M; i++) {
    const v = i / M;
    const fl = Math.sin(t * 6.5 + ph - v * 3.2) * 0.18 * v * v;
    const b = (bend * v * v + fl) * len;
    pts.push([x + ux * len * v + px * b, y + uy * len * v + py * b]);
  }
  for (let i = 0; i <= M; i++) {
    const v = i / M, a = pts[Math.max(0, i - 1)], b = pts[Math.min(M, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    const w = wid * (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, v * 1.15 + 0.08))) * (v > 0.75 ? 1 - (v - 0.75) * 2.6 : 1);
    L.push([pts[i][0] - ty * w / 2, pts[i][1] + tx * w / 2]); R.push([pts[i][0] + ty * w / 2, pts[i][1] - tx * w / 2]);
  }
  const g = c.createLinearGradient(x, y, pts[M][0], pts[M][1]);
  g.addColorStop(0, rgba(cols[0], 1)); g.addColorStop(0.5, rgba(cols[1], 1)); g.addColorStop(1, rgba(cols[2], 1));
  c.save(); c.globalAlpha = Math.min(1, alpha);
  c.beginPath(); c.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i <= M; i++) c.lineTo(L[i][0], L[i][1]);
  for (let i = M; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
  c.closePath(); c.fillStyle = g; c.fill();
  c.strokeStyle = rgba([180, 255, 220], 0.8); c.lineWidth = 2; c.stroke();
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < M; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.strokeStyle = rgba(WARM, 0.85); c.lineWidth = 2.4; c.stroke();
  c.restore();
}

// a broad rounded ventral plate between body distances u0 (head side) and u1 (tail side)
function ventralPlate(c, t, sh, u0, u1, a) {
  const K = 4, inner = [], outer = [];
  for (let k = 0; k <= K; k++) {
    const u = lerp(u0, u1, k / K), F = frame(t, u, sh), h = halfW(u);
    inner.push([F.x - F.nx * h * 0.32, F.y - F.ny * h * 0.32]); outer.push([F.x - F.nx * h * 0.93, F.y - F.ny * h * 0.93]);
  }
  const Ft = frame(t, u1, sh), Fh = frame(t, u0, sh), ht = halfW(u1);
  // trailing (tail-side) edge bulges toward the tail: the overlapping free edge of the scute
  const bx = -Ft.dx * ht * 0.42, by = -Ft.dy * ht * 0.42;
  c.beginPath(); c.moveTo(inner[0][0], inner[0][1]);
  for (let k = 1; k <= K; k++) c.lineTo(inner[k][0], inner[k][1]);
  const mx = (inner[K][0] + outer[K][0]) / 2 + bx, my = (inner[K][1] + outer[K][1]) / 2 + by;
  c.quadraticCurveTo(inner[K][0] + bx * 1.1, inner[K][1] + by * 1.1, mx, my);
  c.quadraticCurveTo(outer[K][0] + bx * 1.1, outer[K][1] + by * 1.1, outer[K][0], outer[K][1]);
  for (let k = K - 1; k >= 0; k--) c.lineTo(outer[k][0], outer[k][1]);
  c.closePath();
  // soft shading: shadowed where it tucks under the plate ahead, bright toward its free edge
  const gb = 0.85 + 0.15 * Math.sin(TAU * u0 / 300 - 3.1 * t);
  const g = c.createLinearGradient(Fh.x, Fh.y, Ft.x + bx, Ft.y + by);
  g.addColorStop(0, rgba([168, 100, 34], 1)); g.addColorStop(0.32, rgba([246, Math.round(184 * gb), 76], 1));
  g.addColorStop(0.76, rgba([255, Math.round(222 * gb), Math.round(150 * gb)], 1)); g.addColorStop(1, rgba([255, 240, 204], 1));
  c.globalAlpha = a; c.fillStyle = g; c.fill();
}

// the rattle (3 gold segments plus the button) and the quetzal plumes springing from it
function drawTail(c, t, sh, a, ylim) {
  if (a <= 0.01) return;
  const u = BODY_L, F = frame(t, u, sh), B = frame(t, u - 40, sh);
  // continue the body's curvature backward, curling a little more inward so it stays off the title band

// ---------- the serpent's body: from the tail to the head, so feathers overlap like shingles

// ---------- the collar: one ring of broad carved feather petals around the head
const NP = 16, P_R0 = 70, P_R1 = 200, P_W = 74;

const LIGHT = [-0.56, -0.83];              // dawn key light from the upper left

  c.beginPath(); c.moveTo(0, -w * 0.16);
  c.bezierCurveTo(L * 0.3, -w * 0.5, L * 0.6, -w * 0.56, L * 0.84, -w * 0.4);
  c.bezierCurveTo(L * 0.97, -w * 0.28, L * 1.01, -w * 0.1, L, 0);

}

// carved petals (shaded gold stone) into layer L

// ---------- the rim of dawn light around the medallion: narrow, luminous, ignites from the crown
function dawnRim(t) {

  if (a <= 0.003) return;

  g.addColorStop(0.52, rgba([255, 168, 150], 0.82 * a)); g.addColorStop(0.7, rgba(ROSE, 0.3 * a)); g.addColorStop(1, rgba(ROSE, 0));

}

// ---------- gold sparks: the coil, the collar and the rising head turn into a turning ring of light
const ringC = t => { const k = ease.inOut3((t - 9.5) / 1.5); return [CX, lerp(CY, 540, k), lerp(R_RING, 352, k)]; };
const endFade = t => 1 - smooth(10.45, 11.15, t);
function spark(t, tb, x0, y0, om, jit, size, col, tw, settle = 0.75) {
  const a = t - tb; if (a < 0) return;
  const env = smooth(0, 0.08, a) * endFade(t);
  if (env <= 0.003) return;
  const [cx, cy, rr] = ringC(t);
  const r0 = Math.hypot(x0 - CX, y0 - CY), th0 = Math.atan2(y0 - CY, x0 - CX);
  const k = ease.out3(a / settle);
  const th = th0 + om * a;
  const r = lerp(r0, rr + jit, k);
  const ox = lerp(CX, cx, k), oy = lerp(CY, cy, k);
  const x = ox + Math.cos(th) * r, y = oy + Math.sin(th) * r;
  const twk = 0.6 + 0.4 * Math.sin(t * 9 + tw);
  HG.dot(ctx, col, x, y, size * 1.8, env * 0.35 * twk);
  HG.dot(ctx, col, x, y, size, env * twk);
}

function render(t, A) {
  const sh = headS(t);
  const H = headPose(sh);
  const ylim = calmY(t);
  const stoneOut = 1 - smooth(T_OUT + D_OUT - 0.04, T_OUT + D_OUT, t);
  const stoneOn = t > T_GOLD - 0.2 && stoneOut > 0.001;
  stoneSc = 1 + 0.06 * ease.out3((t - T_OUT) / D_OUT);

  // the light head: swells to the size of the carved head as it comes to rest, then gives way to gold
  const lightK = t < T_GO
    ? 1 + (K_STONE - 1) * ease.inOut3((t - (T_ARR - 0.3)) / 0.62)
    : lerp(K_STONE, 1, ease.inOut3((t - T_GO) / 0.7));
  const headA = t < T_GO - 0.5 ? 1 - smooth(T_GOLD - 0.02, T_GOLD + 0.1, t) : 1;

  // narrow rim of dawn light (beneath the coil and the medallion)
  dawnRim(t);

  // the serpent's body
  const bc = LB.ctx; HG.reset(bc); bc.clearRect(0, 0, W, W);
  drawBody(bc, t);
  HG.reset(bc);
  bloom(ctx, LB, 9, 0.7);
  HG.drawLayer(ctx, LB);

  // the spirit of light leaves the stone: it is drawn BEHIND the medallion, so it rises out from
  // behind the carved collar like the sun from behind a hill (no double exposure over the carving)
  if (t > T_GO - 0.05) {
    const hc = LH.ctx; HG.reset(hc); hc.clearRect(0, 0, W, W);
    // its crown plumes grow back as it leaves (they would stick out past the collar at rest)
    drawHead(hc, H[0], H[1], H[2], H[3], lightK, 1, t, smooth(S_REST + 40, S_REST + 240, sh));
    HG.reset(hc);
    const sa = smooth(T_GO - 0.05, T_GO + 0.25, t);
    bloom(ctx, LH, 14, 0.75 * sa);
    HG.drawLayer(ctx, LH, { alpha: sa });
  }

  if (stoneOn) {
    // carved petals (stone), then the carved head resolving from the eye outward
    const pc = LP.ctx; HG.reset(pc); pc.clearRect(0, 0, W, W);
    pc.translate(CX, CY); pc.scale(stoneSc, stoneSc); pc.translate(-CX, -CY);
    drawPetalsCarved(pc, t); HG.reset(pc); burn(pc, t);
    HG.drawLayer(ctx, LP, { alpha: stoneOut });
    const front = 430 * ease.out3((t - (T_GOLD + 0.06)) / 0.42), FEA = 80;
    const sl = LS.ctx;
    if (front > 1) {
      HG.reset(sl); sl.clearRect(0, 0, W, W);
      stoneImage(sl, A.gold);
      if (front < 430) {
        sl.globalCompositeOperation = 'destination-in';
        const g = sl.createRadialGradient(EYE[0], EYE[1], 0, EYE[0], EYE[1], front);
        g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(Math.max(0, 1 - FEA / front), 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        sl.fillStyle = g; sl.fillRect(0, 0, W, W);
      }
      HG.reset(sl); burn(sl, t);
      const texA = stoneOut * (1 - 0.3 * exitHeat(t));
      bloom(ctx, LS, 12, 0.18 * texA);
      HG.drawLayer(ctx, LS, { alpha: texA });
      // just after it resolves the carving is still molten-hot, then it cools (and heats again to leave)
      const hot = Math.max(0.5 * (1 - smooth(T_GOLD + 0.12, T_GOLD + 0.8, t)), 0.22 * exitHeat(t));
      if (hot > 0.01) { HG.drawLayer(ctx, LS, { alpha: hot * stoneOut, op: 'lighter' }); bloom(ctx, LS, 20, 0.6 * hot * stoneOut); }
      // warm key light of the sunrise from the upper left (keeps the carved texture)
      const keyA = 0.24 * stoneOut * smooth(T_GOLD + 0.5, T_GOLD + 0.9, t) * (1 - exitHeat(t));
      if (keyA > 0.01) {
        HG.reset(sl); sl.clearRect(0, 0, W, W); stoneImage(sl, A.gold);
        sl.globalCompositeOperation = 'destination-in';
        const kl = sl.createRadialGradient(CX - 150, CY - 170, 30, CX - 150, CY - 170, 470);
        kl.addColorStop(0, 'rgba(0,0,0,1)'); kl.addColorStop(0.55, 'rgba(0,0,0,0.35)'); kl.addColorStop(1, 'rgba(0,0,0,0)');
        sl.fillStyle = kl; sl.fillRect(0, 0, W, W); HG.reset(sl); burn(sl, t);
        HG.drawLayer(ctx, LS, { alpha: keyA, op: 'lighter' });
      }
      // a band of dawn light sweeps across the carving
      const sw = (t - 6.65) / 1.3;
      if (sw > 0 && sw < 1) {
        HG.reset(sl); sl.clearRect(0, 0, W, W); stoneImage(sl, A.gold);
        sl.globalCompositeOperation = 'destination-in';
        const bx = lerp(CX - 300, CX + 380, ease.inOut3(sw));
        const sg = sl.createLinearGradient(bx - 120, CY - 120, bx + 120, CY + 120);
        sg.addColorStop(0, 'rgba(0,0,0,0)'); sg.addColorStop(0.5, 'rgba(0,0,0,1)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
        sl.fillStyle = sg; sl.fillRect(0, 0, W, W); HG.reset(sl);
        HG.drawLayer(ctx, LS, { alpha: 0.5 * Math.sin(Math.PI * sw) * stoneOut, op: 'lighter' });
      }
    }

    // molten gold: the head's silhouette and the collar's petals as bright gold light, which the
    // carved texture resolves out of (the gold recedes outward behind the resolving front)
    const silA = smooth(T_GOLD - 0.04, T_GOLD + 0.1, t);
    const gc = LG.ctx; HG.reset(gc); gc.clearRect(0, 0, W, W);
    let any = false;
    const ex = exitHeat(t);
    if (ex > 0.003) { gc.globalAlpha = 0.4 * ex; stoneImage(gc, A.sil); HG.reset(gc); any = true; }
    else if (silA > 0.003 && front < 430 + FEA) {
      gc.globalAlpha = silA; stoneImage(gc, A.sil); HG.reset(gc);
      if (front > 1) {
        gc.globalCompositeOperation = 'destination-out';
        const g = gc.createRadialGradient(EYE[0], EYE[1], 0, EYE[0], EYE[1], front);
        g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(Math.max(0, 1 - (FEA * 0.6) / front), 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        gc.fillStyle = g; gc.fillRect(0, 0, W, W); HG.reset(gc);
      }
      any = true;
    }
    gc.translate(CX, CY); gc.scale(stoneSc, stoneSc); gc.translate(-CX, -CY);
    drawPetalsFlat(gc, t, 'fill', P => (1 - P.carve) * smooth(0, 0.25, P.p) * (0.95 - 0.4 * ex));
    HG.reset(gc); burn(gc, t);
    if (any || t < T_GOLD + 1.4 || ex > 0.003) {
      tint(gc, [255, 210, 120], [250, 150, 46], EYE[0], EYE[1], 330);
      bloom(ctx, LG, 24, 0.42 * stoneOut);
      HG.drawLayer(ctx, LG, { alpha: stoneOut });
      bloom(ctx, LG, 7, 0.3 * stoneOut);
      // the burning edge: the gold just outside the front flares
      const rb = burnR(t);
      if (rb > 0.5 && stoneOut > 0.001) {
        HG.reset(gc); gc.globalCompositeOperation = 'destination-in';
        const g = gc.createRadialGradient(CX, CY, Math.max(0, rb - 20), CX, CY, rb + 60);
        g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.3, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        gc.fillStyle = g; gc.fillRect(0, 0, W, W); HG.reset(gc);
        tint(gc, GOLD, [255, 150, 50]);
        bloom(ctx, LG, 14, 0.45 * stoneOut);
        HG.drawLayer(ctx, LG, { alpha: 0.28 * stoneOut, op: 'lighter' });
      }
    }

    // the exit: a gold flare along the head's outline and the petals' edges, then gone
    const fe = Math.exp(-Math.pow((t - (T_OUT - 0.02)) / 0.12, 2)) * stoneOut;
    if (fe > 0.01) {
      HG.reset(gc); gc.clearRect(0, 0, W, W);
      stoneImage(gc, A.edge); HG.reset(gc);
      tint(gc, WARM, GOLD);
      bloom(ctx, LG, 14, 0.6 * fe);
      HG.drawLayer(ctx, LG, { alpha: 0.45 * fe, op: 'lighter' });
    }
  }

  // the obsidian eye glints, and the great fang catches the light
  for (const [tg, amp] of [[6.45, 1], [7.6, 0.75]]) {
    const g = Math.exp(-Math.pow((t - tg) / 0.16, 2)) * amp * stoneOut * smooth(T_GOLD + 0.5, T_GOLD + 0.7, t);
    if (g < 0.01) continue;
    for (const [e, s, dt] of [[EYE, 1, 0], [FANG, 0.55, 0.12]]) {
      const gg0 = Math.exp(-Math.pow((t - tg - dt) / 0.16, 2)) * amp * stoneOut;
      if (gg0 < 0.01) continue;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(e[0], e[1]); ctx.rotate(0.3 + (t - tg) * 0.6);
      for (const [rx, ry] of [[64 * s, 4.5 * s], [4.5 * s, 64 * s]]) {
        const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
        gg.addColorStop(0, rgba(WARM, gg0)); gg.addColorStop(1, rgba(GOLD, 0));
        ctx.save(); ctx.scale(rx, ry); ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill(); ctx.restore();
      }
      ctx.restore();
      HG.dot(ctx, WARM, e[0], e[1], 30 * s, gg0 * 0.85);
    }
  }

  // the head of light: travelling, then (after the stone) the spirit lifting off
  const crest = 1 - 0.6 * smooth(0, 0.8, -H[2]) * smooth(560, 700, H[1]) * (ylim < 1000 ? 1 : 0);
  if (t < T_GOLD + 0.3) {
    const hc = LH.ctx; HG.reset(hc); hc.clearRect(0, 0, W, W);
    drawHead(hc, H[0], H[1], H[2], H[3], lightK, headA, t, crest);
    HG.reset(hc);
    bloom(ctx, LH, 9, 0.7 + 0.25 * smooth(T_ARR - 0.4, T_GOLD, t));
    HG.drawLayer(ctx, LH);
  }

  // gold sparks: the coil dissolving tail first, the collar's petals, the head's trail
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const R2 = HG.rng(57);
  for (let u = 6; u < BODY_L - 2; u += ROW) {
    const td = dissolveT(u);
    for (let m = 0; m < 3; m++) {
      const dt0 = R2() * 0.12, oy = R2(), om = R2(), jit = R2(), sz = R2(), cc = R2(), tw = R2() * 6.28;
      const tb = td + dt0;
      if (t < tb) continue;
      const F = frame(tb, u, headS(tb)), h = halfW(u), off = (oy - 0.4) * h * 2.2;
      const col = cc < 0.5 ? GOLD : cc < 0.8 ? WARM : cc < 0.93 ? PEACH : AQUA;
      spark(t, tb, F.x + F.nx * off, F.y + F.ny * off, -0.25 + om * 1.45, (jit - 0.5) * 30, 10 + sz * 9, col, tw);
    }
  }
  const R3 = HG.rng(77);
  for (let i = 0; i < NP; i++) {
    for (let m = 0; m < 3; m++) {
      const P = petalPose(i, T_OUT), f = 0.55 + R3() * 0.5, om = (R3() - 0.3) * 1.2, jit = (R3() - 0.5) * 40, sz = R3(), tw = R3() * 6.28;
      const r = P_R0 + (P_R1 - P_R0) * f, a = P.ang + (R3() - 0.5) * 0.25, dl = R3() * 0.04;
      spark(t, burnT(r) + dl, CX + Math.cos(a) * r, CY + Math.sin(a) * r, om, jit, 8 + sz * 7, R3() < 0.6 ? GOLD : WARM, tw, 0.9);
    }
  }
  // a faint band of light along the ring of sparks, so it reads as one wheel of light
  const ringA = smooth(9.35, 10.0, t) * endFade(t);
  if (ringA > 0.003) { const [rcx, rcy, rr] = ringC(t); HG.ring(ctx, rcx, rcy, rr, GOLD, { width: 10, blur: 14, alpha: 0.22 * ringA }); }
  // the rising head sheds a few sparks of its own
  const R4 = HG.rng(31);
  for (let j = 0; j < 40; j++) {
    const tb = T_GO + 0.15 + j * 0.022, p = at(headS(tb) - 30 - R4() * 50), om = (R4() - 0.4) * 1.2, jit = (R4() - 0.5) * 40, sz = R4(), tw = R4() * 6.28;
    spark(t, tb, p[0] + (R4() - 0.5) * 30, p[1] + (R4() - 0.5) * 30, om, jit, 8 + sz * 7, R4() < 0.5 ? GOLD : AQUA, tw, 1.1);
  }
  ctx.restore();

  // the opening: quetzal feathers and gold motes drifting up in the centre as the portal opens
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const RF = HG.rng(23);
  for (let i = 0; i < 12; i++) {
    const t0 = -0.6 + RF() * 1.2, life = 2.0 + RF() * 0.8, x0 = 380 + RF() * 330, y0 = 560 + RF() * 160, sp = 110 + RF() * 90,
      ph = RF() * TAU, rot = (RF() - 0.5) * 2.4, sz = 44 + RF() * 30, gold = RF() < 0.45;
    const a = t - t0; if (a < 0 || a > life) continue;
    const env = smooth(0, 0.4, a) * (1 - smooth(life * 0.55, life, a)) * smooth(0.15, 0.6, t);
    if (env <= 0.003) continue;
    const x = x0 + Math.sin(a * 2.0 + ph) * 40, y = y0 - sp * a;
    const ang = ph + rot * a + 0.5 * Math.sin(a * 3 + ph);
    // all additive: a fading feather dims as light instead of turning into a dark smudge
    ctx.filter = HG.blur(5);
    feather(ctx, gold ? SPR.shineGold : SPR.shine, x, y, Math.cos(ang), Math.sin(ang), sz, sz * 0.36, env * 0.65);
    ctx.filter = 'none';
    feather(ctx, gold ? SPR.gold : SPR.body, x, y, Math.cos(ang), Math.sin(ang), sz, sz * 0.36, Math.pow(env, 2.2));
  }
  const RM = HG.rng(41);
  for (let i = 0; i < 70; i++) {
    const a0 = RM() * TAU, r0 = 40 + Math.sqrt(RM()) * 300, sp = 0.15 + RM() * 0.25, up = 20 + RM() * 40, s = 5 + RM() * 7, tw = RM() * 6.28, col = RM() < 0.7 ? GOLD : WARM;
    const env = smooth(0.1, 0.6, t) * (1 - smooth(1.8, 2.8, t));
    if (env <= 0.003) break;
    const ang = a0 + sp * t, x = 540 + Math.cos(ang) * r0, y = 540 + Math.sin(ang) * r0 * 0.9 - up * t;
    HG.dot(ctx, col, x, y, s, env * 0.7 * (0.5 + 0.5 * Math.sin(t * 5 + tw)));
  }
  // motes of dawn light while the stone is lit (kept out of the title band)
  const dA = smooth(5.7, 7.0, t) * (1 - smooth(8.7, 9.6, t));
  if (dA > 0.003) {
    const RD = HG.rng(5);
    for (let i = 0; i < 46; i++) {
      const x0 = 120 + RD() * 840, sp = 14 + RD() * 26, ph = RD() * 1000, s = 5 + RD() * 5, col = [GOLD, PEACH, ROSE][Math.floor(RD() * 3)];
      const y = 760 - ((ph + sp * t) % 700), x = x0 + Math.sin(t * 0.7 + ph) * 20;
      if (Math.hypot(x - CX, y - CY) < 236 || Math.hypot(x - C, y - C) > 480) continue;
      HG.dot(ctx, col, x, y, s, dA * 0.5 * (0.5 + 0.5 * Math.sin(t * 3 + ph)) * smooth(60, 160, y));
    }
  }
  ctx.restore();

  if (DEBUG) {
    HG.reset(ctx); ctx.strokeStyle = 'rgba(255,0,0,0.8)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < PATH.N; i += 4) i ? ctx.lineTo(PATH.X[i], PATH.Y[i]) : ctx.moveTo(PATH.X[i], PATH.Y[i]); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(C, C, 540, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(C, C, 470, 0, TAU); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,0,255,0.6)'; ctx.beginPath(); ctx.moveTo(0, Y_CALM); ctx.lineTo(W, Y_CALM); ctx.stroke();
    ctx.fillStyle = '#f0f'; for (const p of [EYE, FANG, REST]) { ctx.beginPath(); ctx.arc(p[0], p[1], 5, 0, TAU); ctx.fill(); }
  }
}

HG.start({
  duration: 12,
  assets: {
    gold: '../assets/02-quetzalcoatl-stone_gold.png',
    sil: '../assets/02-quetzalcoatl-stone_sil.png',
    edge: '../assets/02-quetzalcoatl-stone_edge.png',
  },
  render,
});
</script></body></html>
