<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Las Posadas: a candle-lit procession on a dark plaza, seen in perspective (a real 3D ground plane:
// every lantern is placed in the world and projected through a slowly craning, orbiting camera).
// In the dark a first candle is lit and the flame passes hand to hand down the line, revealing
// a procession of paper-cup candles (papel china in posada colours) walking in from the rim along
// a curving path, bobbing with the walkers' steps, each pooling its light on the ground. The line
// curls into a circle and closes. Then every candle sends a spark of its light to the centre: the
// sparks gather into a bud that rises from the ground and unfurls into a nochebuena (cuetlaxochitl),
// its red bracts unwinding from a twist around the small yellow flowers; a wreath of smaller
// nochebuenas blooms on the ground in a wave inside the ring of candles, and golden sparks drift up.
// At the end each flame leaves its lantern and rises, shrinking into a star, while the camera tilts
// up to the night sky; the stars twinkle and fade.
// Assets: prepare.py on out-show2/images/vela-1.png and nochebuena-1/-2.png, then derive.py
// (scratchpad/work/14-posadas): flame painted out of the lantern (drawn live here), paper lit from
// inside and re-dyed, bracts graded for the LEDs.
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const TAU = Math.PI * 2;
const bump = (t, a, b, c, d) => smooth(a, b, t) * (1 - smooth(c, d, t));
const mix = (a, b, k) => [0, 1, 2].map(i => Math.round(lerp(a[i], b[i], k)));
const GOLD = [255, 196, 90], FLAME = [255, 170, 60], NIGHT = [16, 26, 86];

// ---------- the procession: seven pairs walk down a winding path from the hill, split at the back
// of the plaza and walk round both sides of a circle until the leading pair meets at the front
const NP = 10, N = 2 * NP, R = 370, DEL = TAU / N, SPC = DEL * R;   // pairs, lanterns, ring radius, spacing
const ZS = 490, OFF = 38;                          // where the pairs split (behind the ring); half the pair's width
const H = 96, LS = 98;                             // lantern height above the ground while walking, lantern size (world)
const PAPER = ['pink', 'yellow', 'turq', 'orange', 'purple', 'red', 'green'];
const PAPER_RGB = { pink: [255, 70, 150], yellow: [255, 220, 60], turq: [60, 230, 220], orange: [255, 140, 40], purple: [180, 90, 255], red: [255, 60, 60], green: [70, 230, 110] };
const LCOL = ['pink', 'yellow', 'orange', 'turq', 'red', 'purple', 'yellow', 'pink', 'green', 'orange', 'purple', 'red', 'turq', 'yellow', 'pink', 'orange', 'red', 'green', 'yellow', 'purple'];
const T_LIGHT = 0.3, DT_LIGHT = 0.05;              // the leading candle is lit, then the flame passes back, zig-zag
const VMAX = 200, VB = 4.9;                         // walking speed; the ring closes at VB       // walking speed: steady, then slows as the ring closes
// they stand still while the candles are lit, set off, and slow to a stop as the circle closes
const speed = t => VMAX * smooth(0.25, 1.75, t) * (1 - smooth(3.1, VB, t));
const travel = t => {                                // distance walked by time t (Simpson; a pure function of t)
  const T = clamp(t, 0, VB), n = 96, h = T / n; let a = speed(0) + speed(T);
  for (let i = 1; i < n; i++) a += (i & 1 ? 4 : 2) * speed(i * h);
  return a * h / 3 + 0;
};
const TRAVEL = travel(VB);
const S0 = (NP - 1) * SPC - TRAVEL;                 // the last pair reaches the ring exactly at VB
const lead = t => S0 + travel(t);
// side b = -1 (left, -X) or +1 (right): ring entry, and the branch from the split point onto the ring
const thE = b => Math.PI / 2 - b * DEL / 2;
const BR = [-1, 1].map(b => {
  const th = thE(b), E = [R * Math.cos(th), R * Math.sin(th)], tg = [b * Math.sin(th), -b * Math.cos(th)];
  const P = [[b * OFF, ZS], [b * OFF, ZS - 75], [E[0] - tg[0] * 50, E[1] - tg[1] * 50], E];
  const pts = [], n = 80; let len = 0;
  for (let i = 0; i <= n; i++) {
    const u = i / n, q = 1 - u, w = [q * q * q, 3 * q * q * u, 3 * q * u * u, u * u * u];
    const x = w.reduce((s, k, j) => s + k * P[j][0], 0), z = w.reduce((s, k, j) => s + k * P[j][1], 0);
    if (i) len += Math.hypot(x - pts[i - 1][0], z - pts[i - 1][1]);
    pts.push([x, z, len]);
  }
  return { pts, len };
});
// the hill path behind the split: a steep winding way up into the dark (tabulated by arc length)
const HILL = (() => {
  const pts = [], n = 500; let len = 0, prev = null;
  for (let i = 0; i <= n; i++) {
    const u = 1.8 * i / n;
    const p = [150 * Math.sin(u * TAU * 0.95) * smooth(0, 0.25, u), 430 * Math.pow(u, 1.45), ZS + 320 * u];
    if (prev) len += Math.hypot(p[0] - prev[0], p[1] - prev[1], p[2] - prev[2]);
    pts.push([...p, len]); prev = p;
  }
  return pts;
})();
function hill(h) {                                   // point at arc length h along the hill path
  const p = HILL; let lo = 0, hi = p.length - 1;
  if (h >= p[hi][3]) return p[hi].slice(0, 3);
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (p[mid][3] < h) lo = mid; else hi = mid; }
  const k = (h - p[lo][3]) / Math.max(1e-6, p[hi][3] - p[lo][3]);
  return [0, 1, 2].map(i => lerp(p[lo][i], p[hi][i], k));
}
function pathXYZ(s, b) {
  if (s >= 0) { const th = thE(b) - b * s / R; return [R * Math.cos(th), 0, R * Math.sin(th)]; }
  const br = BR[b < 0 ? 0 : 1], d = br.len + s;
  if (d >= 0) {
    const p = br.pts; let i = 1; while (i < p.length - 1 && p[i][2] < d) i++;
    const k = (d - p[i - 1][2]) / Math.max(1e-6, p[i][2] - p[i - 1][2]);
    return [lerp(p[i - 1][0], p[i][0], k), 0, lerp(p[i - 1][1], p[i][1], k)];
  }
  const w = -d, [x, y, z] = hill(w + w * w / 800);    // further up the hill they walk a little faster
  return [x + b * OFF, y, z];
}

// ---------- camera: a pinhole looking at the plaza centre; cranes up a little, orbits slowly, tilts to the sky at the end
const F = 1500;
function camera(t) {
  const up = ease.inOut3((t - 9.1) / 2.7);
  const ph = (lerp(15, 25, ease.inOut3(t / 7.5)) - 9 * up) * Math.PI / 180;
  const ps = -0.06 + 0.34 * ease.inOut3((t - 3) / 9);
  const D = lerp(1420, 1560, ease.inOut3(t / 8));
  const down = 1 - ease.inOut3((t - 0.2) / 3.4);      // opening: looking up the hill, tilting down with the procession
  return { sp: Math.sin(ph), cp: Math.cos(ph), sy: Math.sin(ps), cy: Math.cos(ps), D, yT: 545 + 290 * down + 380 * up };
}
function proj(K, X, Y, Z) {
  const dx = X + K.sy * K.cp * K.D, dy = Y - K.sp * K.D, dz = Z + K.cy * K.cp * K.D;
  const xc = dx * K.cy - dz * K.sy;
  const yc = dx * K.sy * K.sp + dy * K.cp + dz * K.sp * K.cy;
  const zc = dx * K.sy * K.cp - dy * K.sp + dz * K.cy * K.cp;
  const s = F / zc;
  return { x: C + xc * s, y: K.yT - yc * s, s, z: zc };
}

// ---------- drawing helpers (local to this piece)
const M = HG.layer(), FL = HG.layer();
let poolSprite = null;
function pool() {                                   // soft warm disc used for light on the ground
  if (poolSprite) return poolSprite;
  const s = document.createElement('canvas'); s.width = s.height = 256; const g = s.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.35, 'rgba(255,255,255,0.4)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return (poolSprite = s);
}
const tintCache = new Map();
function tinted(col) {                              // the pool sprite in a colour
  const k = col.join(',');
  if (tintCache.has(k)) return tintCache.get(k);
  const p = pool(), s = document.createElement('canvas'); s.width = s.height = 256; const g = s.getContext('2d');
  g.drawImage(p, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = rgba(col, 1); g.fillRect(0, 0, 256, 256);
  tintCache.set(k, s); return s;
}
// a candle flame: white-hot core, yellow body, orange rim, leaning by `lean`, height h (screen px)
function flame(g, x, y, h, lean, a) {
  if (a <= 0.003 || h <= 0.5) return;
  const w = h * 0.36;
  g.save(); g.translate(x, y); g.rotate(lean); g.globalCompositeOperation = 'lighter';
  const body = () => { g.beginPath(); g.moveTo(0, -h); g.bezierCurveTo(w * 0.35, -h * 0.62, w * 0.62, -h * 0.28, w * 0.5, -h * 0.08);
    g.bezierCurveTo(w * 0.4, h * 0.1, -w * 0.4, h * 0.1, -w * 0.5, -h * 0.08); g.bezierCurveTo(-w * 0.62, -h * 0.28, -w * 0.35, -h * 0.62, 0, -h); };
  const gr = g.createRadialGradient(0, -h * 0.22, 0, 0, -h * 0.35, h * 0.75);
  gr.addColorStop(0, 'rgba(255,255,245,1)'); gr.addColorStop(0.3, 'rgba(255,236,160,0.95)'); gr.addColorStop(0.7, 'rgba(255,160,50,0.75)'); gr.addColorStop(1, 'rgba(255,90,20,0.2)');
  g.globalAlpha = a; g.fillStyle = gr; body(); g.fill();
  g.restore();
}
// bloom a layer onto c: pixel-aligned like HG.drawLayer, with a resolution-scaled blur
function bloom(c, L, px, alpha) {
  if (alpha <= 0.003) return;
  c.save(); HG.reset(c); c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(1, alpha); c.filter = HG.blur(px);
  c.drawImage(L.cv, 0, 0, W, W); c.restore();
}
// four-point glint
function glint(g, x, y, s, a, rot = 0, col = GOLD) {
  if (a <= 0.003 || s <= 0) return;
  const sp = HG.sprite(col);
  g.save(); g.globalCompositeOperation = 'lighter'; g.translate(x, y); g.rotate(rot); g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, -s / 2, -s * 0.05, s, s * 0.1); g.drawImage(sp, -s * 0.05, -s / 2, s * 0.1, s);
  g.drawImage(sp, -s * 0.15, -s * 0.15, s * 0.3, s * 0.3);
  g.restore();
}
// flicker of candle j at time t (smooth, deterministic)
const flick = (t, j) => 1 + 0.07 * Math.sin(t * 11.3 + j * 1.7) + 0.05 * Math.sin(t * 17.9 + j * 2.3) + 0.04 * Math.sin(t * 6.1 + j * 0.9);

// the nochebuena drawn as concentric bands that unwind from a twist while the bloom opens from the centre
const NB = 56;
function bloomFlower(g, img, cx0, cy0, x, y, Rpx, b, rot, { twist = 1.5, alpha = 1 } = {}) {
  if (alpha <= 0.003 || b <= 0) return;
  const Rs = 520;                                   // source radius covered
  const eb = ease.inOut3(b), sc = lerp(0.18, 1, ease.out3(b)), gam = lerp(0.62, 1, eb);
  const rho = x_ => Rpx * sc * Math.pow(x_, gam);
  for (let i = NB - 1; i >= 0; i--) {
    const xa = i / NB, xb = (i + 1) / NB, xm = (i + 0.5) / NB;
    const a = alpha * smooth(xm - 0.18, xm + 0.04, b * 1.22);
    if (a <= 0.003) continue;
    const ra = rho(xa), rb = rho(xb), k = rho(xm) / (xm * Rs);
    g.save();
    g.beginPath(); g.arc(x, y, rb + 0.7, 0, TAU); if (ra > 0.7) g.arc(x, y, ra - 0.7, 0, TAU, true); g.clip();
    g.globalAlpha = a; g.translate(x, y); g.rotate(rot + twist * (1 - eb) * Math.pow(xm, 1.1)); g.scale(k, k);
    g.drawImage(img, -cx0, -cy0);
    g.restore();
  }
}

HG.start({
  duration: 12,
  assets: Object.assign({
    flor: '../assets/14-posadas-flor1_glow.png', florS: '../assets/14-posadas-flor2_small.png', florS1: '../assets/14-posadas-flor1_small.png',
  }, Object.fromEntries(PAPER.map(p => ['v_' + p, `../assets/14-posadas-vela_${p}.png`]))),
  render(t, A) {
    const K = camera(t);
    const end = 1 - smooth(11.15, 11.9, t);
    const g = M.ctx; HG.reset(g); g.clearRect(0, 0, W, W);

    // ---------- night: a deep blue sky haze behind the plaza
    const sky = smooth(0.2, 2.5, t) * (1 - smooth(10.4, 11.9, t));
    if (sky > 0) {
      const hy = 400 + 0.5 * (K.yT - 545);
      const hg = ctx.createRadialGradient(C, hy, 30, C, hy, 560);
      hg.addColorStop(0, rgba(NIGHT, 0.4 * sky)); hg.addColorStop(0.55, rgba([10, 16, 60], 0.2 * sky)); hg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = hg; ctx.fillRect(0, 0, W, W);
    }

    // ---------- lanterns: where everyone is
    const s0 = lead(t), sP = lead(t - 0.08), walk = clamp(speed(t) / 150);
    const L = [];
    for (let k = 0; k < N; k++) {
      const m = k >> 1, b = k & 1 ? 1 : -1, s = s0 - m * SPC;
      const [X, Y, Z] = pathXYZ(s, b);
      const ph = k * 2.1 + (b > 0 ? 1.4 : 0);
      const bob = 6 * walk * (0.5 - 0.5 * Math.cos(TAU * 1.6 * t + ph));
      const down = ease.inOut3((t - (VB - 0.15 + 0.07 * m)) / 0.8);          // the candles are set down on the ground
      const hh = lerp(H, LS * 0.47, down);
      const sway = 0.06 * walk * Math.sin(Math.PI * 1.6 * t + ph);
      const tl = T_LIGHT + k * DT_LIGHT;
      const lit = smooth(tl, tl + 0.3, t);
      const ord = (k * 5) % N;                                   // order in which the flames leave (end)
      const lift = smooth(9.2 + 0.055 * ord, 9.2 + 0.055 * ord + 1.7, t);
      const P = proj(K, X, Y + hh + bob, Z), G = proj(K, X, Y, Z);
      const [X2, Y2, Z2] = pathXYZ(sP - m * SPC, b), P2 = proj(K, X2, Y2 + hh, Z2);
      L.push({ j: k, k, m, b, X, Y, Z, P, G, tl, lit, lift, ord, sway, hh, vx: (P.x - P2.x) / 0.08, col: LCOL[k] });
    }

    window.__L = L.map(l => [l.m, l.b, Math.round(l.P.x), Math.round(l.P.y), +l.P.s.toFixed(2), +l.lit.toFixed(2)]);
    // ---------- light on the ground
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const l of L) {
      const a = l.lit * (1 - smooth(0, 0.45, l.lift)) * end;
      if (a <= 0.003) continue;
      const rx = (40 + 0.55 * l.hh) * l.G.s, ry = rx * K.sp * 1.15;
      g.globalAlpha = (0.2 + 0.3 * (1 - l.hh / H)) * a * flick(t, l.j);
      g.drawImage(tinted(mix(FLAME, PAPER_RGB[l.col], 0.35)), l.G.x - rx, l.G.y - ry, 2 * rx, 2 * ry);
    }
    g.restore();
    // the plaza glows warm inside the ring once it is complete
    const plaza = smooth(4.6, 6.5, t) * (1 - smooth(9.3, 10.6, t));
    if (plaza > 0) {
      const O = proj(K, 0, 0, 0), rx = R * 1.1 * O.s, ry = rx * K.sp * 1.1;
      g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.2 * plaza;
      g.drawImage(tinted([255, 120, 60]), O.x - rx, O.y - ry, 2 * rx, 2 * ry); g.restore();
    }

    // ---------- the nochebuena's place: a bud of gathered light rises from the plaza and unfurls
    const HB = smooth(5.75, 7.9, t) * (1 - ease.inOut3((t - 9.25) / 1.45));       // folds shut into its heart at the end
    const Hh = lerp(40, 215, ease.inOut3((t - 5.5) / 2.3));
    const HP = proj(K, 0, Hh, 0);

    // ---------- depth-sorted scene: wreath flowers on the ground, lanterns, the hero
    const items = [];
    const NW = N, RW = R - 6;
    for (let i = 0; i < NW; i++) {
      const th0 = i * DEL + Math.PI / 2;                     // between the candles
      const X = RW * Math.cos(th0), Z = RW * Math.sin(th0);
      // bloom wave: starts at the back (behind the nochebuena), runs down both sides to the front
      const back = Math.abs(Math.atan2(Math.sin(th0 - Math.PI / 2), Math.cos(th0 - Math.PI / 2))) / Math.PI;
      const u = (t - (6.9 + 1.1 * back)) / 0.9;
      const G = proj(K, X, 0, Z);
      items.push({ kind: 'w', z: G.z, i, G, u });
    }
    for (const l of L) items.push({ kind: 'l', z: l.P.z, l });
    items.push({ kind: 'h', z: HP.z - 1 });
    items.sort((p, q) => q.z - p.z);

    for (const it of items) {
      if (it.kind === 'w') {
        const { G, u, i } = it;
        if (u <= 0) continue;
        const e = ease.outBack(u), a = smooth(0, 0.35, u) * (1 - smooth(9.5, 10.5, t)) * end;
        if (a <= 0.003) continue;
        const sz = 132 * G.s * e * (1 + 0.03 * Math.sin(t * 1.3 + i));
        g.save(); g.translate(G.x, G.y); g.scale(1, K.sp * 1.4); g.rotate(i * 1.3 - 1.4 * (1 - ease.out3(u)) + 0.04 * t);
        g.globalAlpha = a;
        g.drawImage(i % 2 ? A.florS : A.florS1, -sz / 2, -sz / 2, sz, sz);
        g.restore();
      } else if (it.kind === 'l') {
        const l = it.l, P = l.P;
        const a = l.lit * end * (1 - smooth(0.05, 0.5, l.lift));
        if (a <= 0.003) continue;
        const hp = LS * P.s;
        const glowK = flick(t, l.j);
        g.save(); g.translate(P.x, P.y + hp * 0.5); g.rotate(l.sway); g.translate(0, -hp * 0.5);
        // paper lit from inside: brightness follows the candle
        g.globalAlpha = a * clamp(0.3 + 0.7 * glowK);
        g.drawImage(A['v_' + l.col], -hp / 2, -hp / 2, hp, hp);
        // candlelight on the inner paper
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = 0.45 * a * glowK;
        const gs = hp * 0.95;
        g.drawImage(HG.sprite(mix(FLAME, PAPER_RGB[l.col], 0.5)), -gs / 2, -hp * 0.2 - gs / 2, gs, gs);
        g.restore();
        // the flame (stays on the wick until it lifts away at the end)
        if (l.lift <= 0) {
          const wx = P.x + Math.sin(l.sway) * hp * 0.72, wy = P.y - hp * 0.21;
          const ig = ease.outBack(clamp((t - l.tl) / 0.35));
          const t0 = 5.0 + 0.03 * l.ord, give = bump(t, t0 - 0.2, t0, t0 + 0.1, t0 + 0.6);
          const fh = hp * 0.22 * ig * flick(t, l.j) * (1 + 0.4 * give);
          const lean = -0.0009 * l.vx + 0.07 * Math.sin(t * 3.1 + l.j) + 0.04 * Math.sin(t * 8.3 + 2 * l.j) + l.sway;
          g.save(); g.globalCompositeOperation = 'lighter';
          HG.dot(g, FLAME, wx, wy - fh * 0.4, hp * 1.05, 0.32 * a * flick(t, l.j) * (1 + 0.5 * give));
          HG.dot(g, [255, 220, 150], wx, wy - fh * 0.35, hp * 0.32, 0.55 * a);
          g.restore();
          flame(g, wx, wy, fh, lean, a);
          // ignition flash
          const fl = bump(t, l.tl - 0.02, l.tl + 0.06, l.tl + 0.1, l.tl + 0.45);
          if (fl > 0) { g.save(); g.globalCompositeOperation = 'lighter'; HG.dot(g, [255, 210, 140], wx, wy - fh * 0.4, hp * 1.6, 0.5 * fl); g.restore(); }
        }
      } else {
        const fade = 1;
        if (HB > 0 && fade * end > 0.003) {
          const fg = FL.ctx; HG.reset(fg); fg.clearRect(0, 0, W, W);
          const Rpx = 250 * HP.s * (1 + 0.015 * Math.sin(t * 1.4));
          const rot = 0.05 * t - 0.3;
          bloomFlower(fg, A.flor, 495, 469, HP.x, HP.y, Rpx, HB, rot, { twist: 1.6, alpha: 1 });
          HG.reset(fg);
          HG.drawLayer(g, FL, { alpha: fade * end });
          bloom(g, FL, 22, 0.34 * fade * end * smooth(0.1, 0.6, HB));
        }
        // the bud of light (sparks arriving) before the bracts open
        const bud = bump(t, 5.45, 5.85, 5.95, 6.8);
        if (bud > 0) {
          g.save(); g.globalCompositeOperation = 'lighter';
          HG.dot(g, [255, 110, 60], HP.x, HP.y, 240 * HP.s * (0.6 + 0.4 * bud), 0.5 * bud);
          HG.dot(g, [255, 225, 170], HP.x, HP.y, 70 * HP.s, 0.85 * bud);
          g.restore();
        }
      }
    }

    // ---------- composite the scene with a soft bloom
    bloom(ctx, M, 16, 0.3);
    HG.drawLayer(ctx, M);

    // ---------- every candle sends a spark of its light to the centre
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const l of L) {
      const t0 = 5.0 + 0.03 * l.ord, u = (t - t0) / 0.8;
      if (u <= 0 || u >= 1.2) continue;
      const P = l.P, hp = LS * P.s;
      const x0 = P.x, y0 = P.y - hp * 0.3;
      // arc that swirls in (all the same way round), rising above the plaza first
      const dx = HP.x - x0, dy = HP.y - y0;
      const cx = x0 + dx * 0.5 - dy * 0.45, cy = y0 + dy * 0.5 + dx * 0.25 - 140;
      for (let q = 0; q < 9; q++) {
        const uu = clamp(ease.inOut3(clamp(u)) - q * 0.03);
        const w = 1 - uu, x = w * w * x0 + 2 * w * uu * cx + uu * uu * HP.x, y = w * w * y0 + 2 * w * uu * cy + uu * uu * HP.y;
        const a = (1 - q / 9) * smooth(0, 0.08, u) * (1 - smooth(0.92, 1.15, u));
        HG.dot(ctx, q ? GOLD : [255, 240, 200], x, y, (q ? 20 : 30) * (1 - q / 11), 0.9 * a);
      }
    }
    ctx.restore();

    // ---------- golden sparks drifting up from the ring
    const dustA = smooth(6.0, 7.4, t) * (1 - smooth(9.2, 10.2, t));
    if (dustA > 0) {
      const Rr = HG.rng(41);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 46; i++) {
        const th = Rr() * TAU, rr = 120 + Rr() * 280, per = 2.6 + Rr() * 1.6, ph = Rr(), sz = 7 + Rr() * 8, sw = Rr() * 6;
        const u = ((t / per + ph) % 1);
        const G = proj(K, rr * Math.cos(th + 0.06 * t), 30 + u * 420, rr * Math.sin(th + 0.06 * t));
        const x = G.x + Math.sin(t * 1.3 + sw) * 10;
        if (G.y > 760) continue;
        HG.dot(ctx, GOLD, x, G.y, sz * G.s, dustA * Math.sin(Math.PI * u) * (0.55 + 0.45 * Math.sin(t * 5 + sw)));
      }
      ctx.restore();
    }

    // ---------- glints on the bracts once it has opened
    for (const [t0, n, off] of [[8.1, 5, 0.1], [8.7, 5, 0.6]]) {
      const u = (t - t0) / 0.8; if (u <= 0 || u >= 1) continue;
      const rot = 0.05 * t - 0.3;
      for (let i = 0; i < n; i++) {
        const th = rot + (i + off) * TAU / n - Math.PI / 2, rr = 200 * HP.s;
        glint(ctx, HP.x + Math.cos(th) * rr, HP.y + Math.sin(th) * rr, 80 * Math.sin(Math.PI * u), 0.75 * Math.sin(Math.PI * u), u * 0.5);
      }
    }

    // ---------- the flames rise and become stars; the nochebuena's golden heart becomes the brightest
    const Rs = HG.rng(77);
    const fadeS = 1 - smooth(11.05, 11.85, t);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const l of L) {
      const jx = (Rs() - 0.5) * 150, up = 300 + Rs() * 260, tw = Rs() * 6;
      if (l.lift <= 0) continue;
      const u = l.lift, e = ease.inOut3(u);
      const hp = LS * l.P.s, wx = l.P.x + Math.sin(l.sway) * hp * 0.72, wy = l.P.y - hp * 0.21;
      // star position: risen well above where the candle stood, spread a little wider, inside the circle
      let tx = C + (wx - C) * 1.08 + jx, ty = Math.max(110, wy - up - 380 * smooth(9.2, 11.6, t));
      const dd = Math.hypot(tx - C, ty - C); if (dd > 450) { tx = C + (tx - C) * 450 / dd; ty = C + (ty - C) * 450 / dd; }
      const x = lerp(wx, tx, e) + Math.sin(u * 5 + l.j) * 16 * Math.sin(Math.PI * u), y = lerp(wy, ty, e);
      const fh = hp * 0.22 * flick(t, l.j) * (1 - smooth(0.05, 0.55, u));
      flame(ctx, x, y + fh * 0.25, fh, 0.12 * Math.sin(u * 7 + l.j), fadeS);
      const star = smooth(0.25, 0.85, u) * fadeS * (0.75 + 0.25 * Math.sin(t * 6 + tw));
      HG.dot(ctx, [255, 220, 160], x, y, lerp(hp * 0.9, 34, smooth(0, 0.8, u)), 0.55 * fadeS);
      HG.dot(ctx, [255, 245, 225], x, y, lerp(hp * 0.3, 12, smooth(0, 0.8, u)), 0.9 * fadeS);
      glint(ctx, x, y, 64 * star, 0.75 * star, 0.25 * Math.sin(t * 0.8 + tw), [255, 230, 190]);
    }
    // the heart of the nochebuena
    const hu = ease.inOut3((t - 9.5) / 1.6);
    if (hu > 0 && fadeS > 0) {
      const x = lerp(HP.x, C, hu), y = lerp(HP.y, 165, hu);
      const st = smooth(0.3, 1, hu) * fadeS;
      HG.dot(ctx, [255, 200, 90], x, y, lerp(110, 60, hu), 0.7 * fadeS * smooth(0, 0.2, hu));
      HG.dot(ctx, [255, 245, 220], x, y, 22, 0.95 * fadeS * smooth(0, 0.2, hu));
      glint(ctx, x, y, 150 * st * (0.9 + 0.1 * Math.sin(t * 5)), 0.85 * st, 0.15 * Math.sin(t * 0.7), [255, 225, 160]);
    }
    // a sky of fainter stars joins them
    const sk = smooth(9.9, 10.9, t) * fadeS;
    if (sk > 0) {
      const Rb = HG.rng(5);
      for (let i = 0; i < 40; i++) {
        const a = Rb() * TAU, r = Math.sqrt(Rb()) * 450, x = C + Math.cos(a) * r, y = C - 70 + Math.sin(a) * r * 0.8, tw = Rb() * 6, sz = 9 + Rb() * 9, d = Rb();
        if (y > 690) continue;
        HG.dot(ctx, [200, 210, 255], x, y, sz, 0.6 * smooth(d * 0.5, d * 0.5 + 0.5, sk) * (0.5 + 0.5 * Math.sin(t * 4 + tw)));
      }
    }
    ctx.restore();
  },
});
