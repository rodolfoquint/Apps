<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// El cenote (morning). A sacred cenote of Yucatán, the Maya door to the underworld and source of life.
// We begin deep in its clear turquoise water: a web of caustic light dances on the floor, shafts of
// light slant down, bubbles rise. The serpent's turquoise drops plunge in from above and each one
// bursts into a little star of silver fish, which gather into a school; the school sweeps and loops,
// flashing silver in a wave as it turns. Meanwhile the camera rises: the floor slips away, the
// bright skin of the surface comes down through the circle and we break through it into the cave:
// a round opening of morning light in the dome, gold shafts falling through it to the water, long
// curtains of roots hanging from the rim (as at Ik Kil and Samula) lit where the shafts cross them,
// dust motes in the light. A drop gathers on a root tip, falls and rings the water with ripples.
// At the end the shafts converge into one and fade, and the roots dissolve, tip first, into green
// fireflies that rise out of the opening toward the jungle.
// Signature motion: the continuous crane up from the depths through the water surface into the light.
// Everything is procedural and a pure function of t.
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const TAU = Math.PI * 2;
const DEBUG = new URLSearchParams(location.search).has('debug');

// ---------- palette (morning: turquoise, emerald, shafts of gold sunlight)
const DEEP = [10, 70, 95], TEAL = [20, 160, 170], TURQ = [40, 220, 230], AQUA = [130, 255, 235], FOAM = [225, 255, 248],
  ROOTD = [24, 120, 70], ROOTC = [70, 210, 120], LEAF = [80, 230, 120], LEAFD = [8, 60, 34],
  GOLD = [255, 196, 90], WARM = [255, 228, 170], SUN = [255, 214, 140], STONE = [225, 195, 140],
  ROOTD2 = [30, 150, 84], ROOTC2 = [96, 236, 140],
  SILVER = [225, 242, 255], FIRE = [190, 255, 100], FIRE2 = [250, 240, 120],
  BEAM = [255, 190, 80], PALE = [255, 236, 196], LIP = [244, 230, 200], ROCK = [16, 44, 48], BACKLIT = [236, 226, 150];
const mix = (a, b, k) => [lerp(a[0], b[0], k) | 0, lerp(a[1], b[1], k) | 0, lerp(a[2], b[2], k) | 0];

// ---------- the camera: a slow crane up from the depths, through the surface, into the cave
const RISE0 = 3.0, RISE1 = 8.4;
const riseK = t => { const x = clamp((t - RISE0) / (RISE1 - RISE0)); return (1 - Math.cos(Math.PI * x)) / 2; };
const off = t => lerp(-70, 860, riseK(t)) + 10 * (t - 6);    // + a slow drift so nothing is ever still
const yW = t => off(t);                                       // the water surface on screen
const yO = t => -600 + 0.86 * off(t);                         // the opening in the dome (farther: less parallax)
const hToY = (h, t) => lerp(yW(t), yO(t), h);                 // height above the water: 0 water .. 1 opening
const chord = y => Math.sqrt(Math.max(0, 540 * 540 - (y - C) * (y - C)));

// ---------- the opening and the dome (the dome follows the fan's circle: the circle is the cenote)
const OPX = 520, OPRX = 236, OPRY = 62;
// an irregular, rocky outline: broad lobes, a few bites out of the rock and small sharp facets
const BITES = [[4.2, 0.2, -0.1], [5.3, 0.15, 0.08], [1.85, 0.22, -0.08], [0.5, 0.14, 0.07], [2.8, 0.12, 0.06], [3.3, 0.1, -0.06]];
const rimR = th => {
  let r = 1.02 + 0.05 * Math.sin(2 * th + 0.9) + 0.035 * Math.sin(3 * th + 0.7) + 0.022 * Math.sin(5 * th + 2.1) + 0.012 * Math.sin(9 * th + 0.3)
    - 0.03 * Math.abs(Math.sin(7 * th + 0.4)) - 0.014 * Math.abs(Math.sin(13 * th + 1.9));
  for (const [c, wd, amp] of BITES) { let d = th - c; d -= TAU * Math.round(d / TAU); r += amp * Math.exp(-(d / wd) * (d / wd)); }
  return r;
};
const rimPt = (th, t) => { const r = rimR(th); return [OPX + Math.cos(th) * OPRX * r, yO(t) + Math.sin(th) * OPRY * (1 + (r - 1) * 1.6)]; };
const YW_F = 883, YO_F = -600 + 0.86 * 883;            // where the water and the opening settle
const circleTop = x => C - Math.sqrt(Math.max(0, 540 * 540 - (x - C) * (x - C)));
const smax = (a, b, k) => { const h = clamp(0.5 + 0.5 * (b - a) / k); return lerp(a, b, h) + k * h * (1 - h); };
const lipN = x => 16 * Math.sin(0.021 * x + 0.6) + 10 * Math.sin(0.057 * x + 2.2) + 6 * Math.sin(0.13 * x + 1.1);
const domeH = x => (YW_F - smax(YO_F + 8, circleTop(x) + 92 + lipN(x) * smooth(OPRX, OPRX + 90, Math.abs(x - OPX)), 40)) / (YW_F - YO_F);
function anchorY(x, t) {
  const u = (x - OPX) / OPRX;
  if (Math.abs(u) < 0.97) { const th = Math.acos(clamp(u, -1, 1)), r = rimR(th); return yO(t) + OPRY * (1 + (r - 1) * 1.6) * Math.sqrt(1 - u * u) * 0.92; }
  return hToY(domeH(x), t);
}

// ---------- ending
const END0 = 9.3;                                  // the roots start to turn into fireflies
const gEnd = t => 1 - smooth(10.3, 11.2, t);         // global fade to black

// ---------- light shafts
// air shafts: from the opening down to the water; [x at the opening, x where it meets the water, w top, w bottom, strength, phase]
const SHAFTS = [
  [372, 560, 34, 66, 0.8, 0.0],
  [462, 672, 50, 92, 1.0, 1.3],
  [556, 772, 24, 48, 0.68, 2.1],
  [630, 862, 36, 62, 0.72, 3.4],
];
const conv = t => ease.inOut3((t - END0) / 1.3);     // the shafts converge into one
function airShafts(t) {
  const k = conv(t), a0 = yO(t) + OPRY * 0.2, a1 = yW(t);
  const fade = smooth(5.3, 6.5, t) * (1 - smooth(10.35, 10.85, t)), close = 1 - 0.8 * ease.inOut3((t - 10.0) / 0.8);
  return SHAFTS.map(([xt, xh, wt, wb, s, ph], i) => {
    const sway = 6 * Math.sin(0.5 * t + ph);
    const flick = (0.78 + 0.22 * Math.sin(0.9 * t + ph)) * (0.9 + 0.1 * Math.sin(2.3 * t + ph * 1.7));
    const lead = i === 1;                       // the shaft the others gather into
    return {
      x0: lerp(xt, 470, k) + sway * 0.4, y0: a0, x1: lerp(xh, 690, k) + sway, y1: a1,
      w0: wt * lerp(1, lead ? 1.25 : 0.5, k) * close, w1: wb * lerp(1, lead ? 1.1 : 0.4, k) * close,
      a: s * flick * fade * (lead ? 1 + 0.35 * Math.sin(Math.PI * k) : 1 - k),
    };
  });
}
// underwater shafts: the same light refracted steeper below the surface, turquoise, shimmering.
// Deep down they sit further left (the sun is at the upper left); one more shaft crosses the centre-left
// while we are under water and fades as the surface comes into view.
const W_EXTRA = [0, 372, 0, 84, 0.85, 4.4];   // same fields as SHAFTS (no air part)
function waterShafts(t) {
  const y0 = yW(t), fade = smooth(0.25, 1.5, t) * (1 - smooth(9.6, 10.6, t)), lean = 110 * (1 - riseK(t));
  return [...SHAFTS, W_EXTRA].map(([xt, xh, wt, wb, s, ph], i) => {
    const x0 = xh - lean + 10 * Math.sin(0.7 * t + ph);
    const sh = 0.62 + 0.38 * (0.5 + 0.5 * Math.sin(2.6 * t + ph * 2.3)) * (0.7 + 0.3 * Math.sin(1.3 * t + ph));
    const extra = i === SHAFTS.length ? 1 - smooth(4.2, 5.4, t) : 1;
    return { x0, y0, x1: x0 + 0.14 * 900 + 30 * Math.sin(0.45 * t + ph), y1: y0 + 900, w0: wb * 0.95, w1: wb * 1.9, a: s * sh * fade * extra };
  });
}
// how much a shaft lights the point (x, y): 0..1
function lightAt(shafts, x, y) {
  let v = 0;
  for (const b of shafts) {
    if (b.a <= 0.01) continue;
    const dx = b.x1 - b.x0, dy = b.y1 - b.y0, L2 = dx * dx + dy * dy;
    const u = ((x - b.x0) * dx + (y - b.y0) * dy) / L2;
    if (u < -0.05 || u > 1.05) continue;
    const L = Math.sqrt(L2), d = Math.abs((x - b.x0) * dy - (y - b.y0) * dx) / L, hw = lerp(b.w0, b.w1, clamp(u)) / 2;
    v += b.a * Math.exp(-1.6 * (d / hw) * (d / hw)) * smooth(-0.05, 0.08, u) * (1 - smooth(0.92, 1.05, u));
  }
  return Math.min(1, v);
}
function drawShaft(g, b, col, aTop, aBot, core = 0.45, coreA = 0.9) {
  if (b.a <= 0.01) return;
  const dx = b.x1 - b.x0, dy = b.y1 - b.y0, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  for (const [wk, ak] of [[1, 1], [core, coreA]]) {
    const gr = g.createLinearGradient(b.x0, b.y0, b.x1, b.y1);
    gr.addColorStop(0, rgba(col, 0)); gr.addColorStop(0.06, rgba(col, aTop * b.a * ak));
    gr.addColorStop(0.55, rgba(col, lerp(aTop, aBot, 0.6) * b.a * ak)); gr.addColorStop(1, rgba(col, aBot * b.a * ak));
    g.fillStyle = gr; g.beginPath();
    g.moveTo(b.x0 + nx * b.w0 * wk / 2, b.y0 + ny * b.w0 * wk / 2); g.lineTo(b.x1 + nx * b.w1 * wk / 2, b.y1 + ny * b.w1 * wk / 2);
    g.lineTo(b.x1 - nx * b.w1 * wk / 2, b.y1 - ny * b.w1 * wk / 2); g.lineTo(b.x0 - nx * b.w0 * wk / 2, b.y0 - ny * b.w0 * wk / 2);
    g.closePath(); g.fill();
  }
}
// the pale, near-sharp core of a sunbeam (drawn on its own layer and only lightly blurred)
function drawCore(g, b, col, wk) {
  if (b.a <= 0.01) return;
  const dx = b.x1 - b.x0, dy = b.y1 - b.y0, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;
  const gr = g.createLinearGradient(b.x0, b.y0, b.x1, b.y1);
  gr.addColorStop(0, rgba(col, 0)); gr.addColorStop(0.07, rgba(col, 0.9 * b.a)); gr.addColorStop(0.5, rgba(col, 0.7 * b.a));
  gr.addColorStop(0.93, rgba(col, 0.95 * b.a)); gr.addColorStop(1, rgba(col, 0.6 * b.a));
  g.fillStyle = gr; g.beginPath();
  g.moveTo(b.x0 + nx * b.w0 * wk / 2, b.y0 + ny * b.w0 * wk / 2); g.lineTo(b.x1 + nx * b.w1 * wk / 2, b.y1 + ny * b.w1 * wk / 2);
  g.lineTo(b.x1 - nx * b.w1 * wk / 2, b.y1 - ny * b.w1 * wk / 2); g.lineTo(b.x0 - nx * b.w0 * wk / 2, b.y0 - ny * b.w0 * wk / 2);
  g.closePath(); g.fill();
}
// where a sunbeam lands on the water: a bright pool of glitter (as in the photos of Samula)
function drawPools(t, airB, alpha) {
  if (alpha <= 0.01) return;
  const y0 = yW(t);
  if (y0 < -40 || y0 > 1120) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  airB.forEach((b, i) => {
    const a = Math.min(1.2, b.a) * alpha; if (a <= 0.02) return;
    const w = b.w1 * 1.5 + 36, cx = b.x1 + 8;
    ctx.save(); ctx.translate(cx, y0 + 7); ctx.scale(1, 0.2);
    const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
    pg.addColorStop(0, rgba(PALE, 0.8 * a)); pg.addColorStop(0.35, rgba(BEAM, 0.5 * a)); pg.addColorStop(1, rgba(BEAM, 0));
    ctx.fillStyle = pg; ctx.fillRect(-w, -w, 2 * w, 2 * w);
    ctx.restore();
    const R = HG.rng(700 + i);
    for (let k = 0; k < 30; k++) {
      const gx = (R() + R() + R() - 1.5) / 1.5, gy = R() - 0.35, ph = R() * TAU, f = 3 + R() * 5, s = 12 + R() * 16, v = (R() - 0.5) * 30;
      const x = cx + gx * w * 0.9 + v * Math.sin(0.3 * t + ph), y = y0 + 2 + gy * 26 * (1 - Math.abs(gx) * 0.5);
      const tw = Math.pow(0.5 + 0.5 * Math.sin(f * t + ph), 4) * (1 - 0.55 * Math.abs(gx));
      HG.dot(ctx, k % 3 ? PALE : WARM, x, y, s, a * tw);
    }
  });
  ctx.restore();
}

// ---------- layers
const LB = HG.layer(), LR = HG.layer(), LF = HG.layer(), LC = HG.layer(), LK = HG.layer();
function bloom(c, L, px, alpha) {
  if (alpha <= 0) return;
  HG.reset(c); c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(1, alpha); c.filter = HG.blur(px);
  c.drawImage(L.cv, 0, 0, W, W); HG.reset(c);
}
function clearL(L) { HG.reset(L.ctx); L.ctx.clearRect(0, 0, W, W); return L.ctx; }

// ---------- caustics on the cenote floor (a living Voronoi web, cut out of light)
const FLOOR_D = 1000, FSQ = 0.3;
// the floor plane in perspective: far side (v < 0) smaller and higher
const fz = v => 1 + 0.32 * (-v / 340);
const fmap = (u, v, fy) => { const k = 1 / fz(v); return [C + u * k * 1.15, fy + v * FSQ * k]; };
const CSEEDS = (() => {
  const R = HG.rng(5), out = [];
  for (let j = 0; j < 10; j++) for (let i = 0; i < 19; i++) {
    out.push({ x: -650 + i * 72 + (j % 2) * 36 + (R() - 0.5) * 52, y: -350 + j * 76 + (R() - 0.5) * 52,
      a1: R() * TAU, a2: R() * TAU, f1: 0.8 + R() * 0.6, f2: 1.2 + R() * 0.8, r1: 16 + R() * 12, r2: 8 + R() * 7 });
  }
  return out;
})();
function clipHalf(poly, px, py, nx, ny, c) {           // keep the part where n.p <= c
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = a[0] * nx + a[1] * ny - c, db = b[0] * nx + b[1] * ny - c;
    if (da <= 0) out.push(a);
    if ((da < 0) !== (db < 0)) { const k = da / (da - db); out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]); }
  }
  return out;
}
function drawCaustics(t, alpha) {
  if (alpha <= 0.01) return;
  const fy = FLOOR_D + off(t);
  if (fy - 360 * FSQ > 1080) return;
  const P = CSEEDS.map(s => [s.x + s.r1 * Math.cos(s.f1 * t + s.a1) + s.r2 * Math.cos(s.f2 * t * 1.3 + s.a2),
    s.y + s.r1 * Math.sin(s.f1 * t * 0.9 + s.a1) + s.r2 * Math.sin(s.f2 * t + s.a2)]);
  const g = clearL(LC);
  // light on the floor: a soft pool, brightest where the shafts land
  g.globalCompositeOperation = 'lighter';
  g.save(); g.translate(C, fy + 30); g.scale(1, 0.34);
  const base = g.createRadialGradient(0, 0, 0, 0, 0, 640);
  base.addColorStop(0, rgba(AQUA, 0.85)); base.addColorStop(0.5, rgba(TURQ, 0.6)); base.addColorStop(1, rgba(TEAL, 0));
  g.fillStyle = base; g.fillRect(-700, -700, 1400, 1400);
  g.restore();
  for (const b of waterShafts(t)) {
    const u = (fy - b.y0) / (b.y1 - b.y0), x = lerp(b.x0, b.x1, clamp(u));
    g.save(); g.translate(x, fy + 10); g.scale(1, 0.4);
    const sp = g.createRadialGradient(0, 0, 0, 0, 0, 220);
    sp.addColorStop(0, rgba(FOAM, 0.8 * b.a)); sp.addColorStop(0.4, rgba(AQUA, 0.5 * b.a)); sp.addColorStop(1, rgba(AQUA, 0));
    g.fillStyle = sp; g.fillRect(-230, -230, 460, 460); g.restore();
  }
  // cut out the cells, but not completely (they keep a faint teal fill), rounded so the web keeps
  // bright knots where three cells meet; the far rows are cut less and less (no fine web = no moire)
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < P.length; i++) {
    const [px, py] = P[i];
    if (Math.abs(px) > 640 || Math.abs(py) > 340) continue;
    g.fillStyle = rgba([0, 0, 0], 0.8 * smooth(-330, -170, py));
    let poly = [[px - 140, py - 140], [px + 140, py - 140], [px + 140, py + 140], [px - 140, py + 140]];
    for (let j = 0; j < P.length && poly.length > 2; j++) {
      if (j === i) continue;
      const [qx, qy] = P[j], dx = qx - px, dy = qy - py;
      if (dx * dx + dy * dy > 220 * 220) continue;
      poly = clipHalf(poly, px, py, dx, dy, (qx * qx + qy * qy - px * px - py * py) / 2);
    }
    if (poly.length < 3) continue;
    let cx = 0, cy = 0; for (const p of poly) { cx += p[0]; cy += p[1]; } cx /= poly.length; cy /= poly.length;
    const sh = poly.map(([x, y]) => { const d = Math.hypot(x - cx, y - cy) || 1, k = Math.max(0, 1 - 6 / d); return fmap(cx + (x - cx) * k, cy + (y - cy) * k, fy); });
    const n = sh.length, mid = k => [(sh[k][0] + sh[(k + 1) % n][0]) / 2, (sh[k][1] + sh[(k + 1) % n][1]) / 2];
    g.beginPath(); let m = mid(n - 1); g.moveTo(m[0], m[1]);
    for (let k = 0; k < n; k++) { m = mid(k); g.quadraticCurveTo(sh[k][0], sh[k][1], m[0], m[1]); }
    g.closePath(); g.fill();
  }
  HG.reset(g);
  bloom(ctx, LC, 9, alpha * 0.9);
  bloom(ctx, LC, 1.2, alpha * 1.0);
}

// ---------- roots hanging from the rim: a few braided bundles of varied thickness, some thin strands and
// two leafy vines. Clear gaps are left around the central sunbeam (x ~450..700) and behind the toh (x ~770..960).
const ROOTS = (() => {
  const R = HG.rng(31), out = [];
  const BUNDLES = [   // x, strands, width min..max, reach (tip height above the water), braid turns, braid half-width
    [150, 4, 5.5, 8.5, -0.06, 2.2, 8], [236, 4, 5.5, 9, -0.05, 2.6, 9], [322, 3, 5, 7, 0.24, 1.8, 7],
    [405, 2, 5, 6.5, 0.34, 1.5, 6], [716, 3, 5, 8, 0.2, 2.0, 7],
  ];
  BUNDLES.forEach(([x, n, w0, w1, reach, turns, spread]) => {
    const amp = 6 + R() * 6, ph = R() * TAU, ph2 = R() * TAU, dis = END0 + R() * 0.45 + (x < 540 ? 0.15 : 0);
    for (let k = 0; k < n; k++) {
      const w = lerp(w1, w0, k / Math.max(1, n - 1)) * (0.92 + R() * 0.16);
      out.push({ x, off0: (k - (n - 1) / 2) * 7, hEnd: reach + (k ? 0.03 + R() * 0.09 : 0), w, ph, ph2, amp, br: 0.9 + R() * 0.1,
        dis: dis + R() * 0.25, vine: false, spread, turns, braid: k * TAU / n + R() * 0.4 });
    }
  });
  for (const [x, hEnd] of [[118, 0.18], [190, -0.05], [284, 0.46], [366, 0.56], [612, 0.78], [996, 0.64], [1018, 0.7], [1040, 0.34]]) {
    out.push({ x, off0: 0, hEnd, w: 2.6 + R() * 1.0, ph: R() * TAU, ph2: R() * TAU, amp: 5 + R() * 8, br: 0.8 + R() * 0.2,
      dis: END0 + R() * 0.7, vine: false, spread: 0, turns: 0, braid: 0 });
  }
  for (const [x, hEnd] of [[262, 0.32], [688, 0.46]]) {
    out.push({ x, off0: 0, hEnd, w: 3.4, ph: R() * TAU, ph2: R() * TAU, amp: 9, br: 1, dis: END0 + 0.2 + R() * 0.5, vine: true, spread: 0, turns: 0, braid: 0 });
  }
  return out;
})();
const NS = 24;
function rootPt(r, s, t) {
  const yA = anchorY(r.x + r.off0, t), yE = hToY(r.hEnd, t);
  const sw = r.amp * Math.pow(s, 1.5) * Math.sin(0.75 * t + r.ph - 1.5 * s) + 0.3 * r.amp * s * Math.sin(1.6 * t + r.ph2);
  const br = r.spread * (1 - 0.35 * s) * Math.sin(TAU * r.turns * s + r.braid) * smooth(0, 0.12, s);
  return [r.x + r.off0 * (1 - smooth(0, 0.16, s)) + sw + br, lerp(yA, yE, s)];
}
const rootDepth = (r, s) => r.spread ? Math.cos(TAU * r.turns * s + r.braid) : 1;
// how much of a root is left while it dissolves into fireflies (1 = whole, from the anchor)
const rootLeft = (r, t) => 1 - ease.inOut3((t - r.dis) / 1.1);

function drawRoots(g, t, airB, alpha) {
  if (alpha <= 0.01) return;
  const ys = yW(t), UW = mix(TEAL, ROOTC, 0.25);
  g.lineJoin = 'round'; g.globalAlpha = 1;
  for (const r of ROOTS) {
    const left = rootLeft(r, t);
    if (left <= 0.005) continue;
    const segs = Math.ceil(NS * left), pts = [];
    for (let k = 0; k <= segs; k++) { const s = Math.min(left, k / NS); pts.push([...rootPt(r, s, t), s]); }
    const w = r.w * (r.vine ? 1.05 : 0.9), a = alpha * r.br, top = pts[0], tip = pts[segs];
    const path = (dx = 0) => { g.beginPath(); pts.forEach((p, j) => { const x = p[0] + dx + (p[1] > ys + 2 ? 4 : 0); j ? g.lineTo(x, p[1]) : g.moveTo(x, p[1]); }); };
    // a dark outline, so the strands of a bundle read separately where they cross
    g.lineCap = 'round';
    path(); g.strokeStyle = rgba([2, 14, 8], 0.85 * alpha); g.lineWidth = w + 2.6; g.stroke();
    // the body: one continuous stroke, brighter toward the tip; turquoise and dimmer under water
    const shade = r.spread ? 0.78 + 0.22 * Math.cos(r.braid) : 1;
    const c0 = mix([0, 0, 0], ROOTD2, shade), c1 = mix([0, 0, 0], ROOTC2, shade);

        HG.dot(ctx, i % 3 ? AQUA : WARM, x, y, 10 * D.size, (1 - dt / life));
      }
      HG.dot(ctx, WARM, D.x, y0, 120 * D.size, 0.4 * (1 - smooth(0, 0.5, dt)));
    }
  }
  ctx.restore();
}


// ---------- the toh (turquoise-browed motmot): bird of the cenotes, guardian of the Maya underworld.
// Perched on a thick aerial root at the right, it swings its racket tail like a pendulum ("pájaro reloj").
// Colours from photos of Eumomota superciliosa: olive/ochre-green breast with rufous only on the lower belly,
// a rufous mantle patch on the back, turquoise brow over a black mask, a straight black throat stripe edged in
// pale turquoise, a heavy slightly decurved black bill, turquoise-blue tail with bare shafts and black-tipped rackets.
const TOH_X = 872, TOH_H = 0.5, TOH_K = 1.3;
const OCHRE = [170, 168, 92], RUFOUS = [226, 112, 50], OLIVE = [118, 166, 90], TQB = [36, 180, 222], TQ = [80, 228, 240], TQP = [160, 238, 236];
// the bird fades in only once its head is inside the circle (otherwise its long tail would arrive alone)
const TOH_IN = (() => { for (let t = 4; t < 9; t += 0.01) if (hToY(TOH_H, t) - 112 * TOH_K > circleTop(TOH_X - 20) + 4) return t; return 6.5; })();
const tohSwing = t => 0.5 * Math.sin(TAU * (t - TOH_IN - 0.3) / 1.55) * smooth(TOH_IN + 0.3, TOH_IN + 1.0, t);
function perchPts(t) {
  const y = hToY(TOH_H, t), sw = 4 * Math.sin(0.7 * t + 1.2);
  return { y, pts: [[1080, y - 34], [1016, y - 12], [954, y + 1], [894, y + 5], [844, y + 3], [812, y + 14], [798, y + 46], [801, y + 94], [794 + sw * 0.5, y + 152], [790 + sw, y + 220]],
    wid: [24, 22, 20, 18, 16, 14, 12, 10, 8, 6] };
}
function smoothLine(g, P) {
  g.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length - 1; i++) g.quadraticCurveTo(P[i][0], P[i][1], (P[i][0] + P[i + 1][0]) / 2, (P[i][1] + P[i + 1][1]) / 2);
  g.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
}
function drawPerch(g, t, alpha) {
  if (alpha <= 0.01) return;
  const { y, pts, wid } = perchPts(t);
  g.save(); g.globalAlpha = Math.min(1, alpha); g.lineCap = 'round'; g.lineJoin = 'round';
  // thin rootlets hanging from it (behind)
  for (const [x, len, ph] of [[1020, 120, 0.3], [978, 70, 1.7], [934, 160, 2.9], [860, 54, 4.1]]) {
    const yy = y + (x > 950 ? -4 : 4), s2 = 5 * Math.sin(0.8 * t + ph);
    g.beginPath(); g.moveTo(x, yy); g.quadraticCurveTo(x + s2 * 0.3, yy + len * 0.5, x + s2, yy + len);
    g.strokeStyle = rgba(mix(ROOTD, ROOTC, 0.55), 0.85); g.lineWidth = 3; g.stroke();
  }
  // the tapered body of the root (offset outlines along the normals)
  const A = [], B = [];
  pts.forEach((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
    A.push([p[0] - ty * wid[i] / 2, p[1] + tx * wid[i] / 2]); B.push([p[0] + ty * wid[i] / 2, p[1] - tx * wid[i] / 2]);
  });
  g.beginPath(); smoothLine(g, A); const Br = B.slice().reverse(); g.lineTo(Br[0][0], Br[0][1]);
  for (let i = 1; i < Br.length - 1; i++) g.quadraticCurveTo(Br[i][0], Br[i][1], (Br[i][0] + Br[i + 1][0]) / 2, (Br[i][1] + Br[i + 1][1]) / 2);
  g.lineTo(Br[Br.length - 1][0], Br[Br.length - 1][1]); g.closePath();
  g.fillStyle = rgba([34, 58, 48], 1); g.fill();
  // rounded shading: a lighter band along the middle, lit top edge (sun), turquoise bounce light underneath
  g.beginPath(); smoothLine(g, pts.map((p, i) => [p[0] + (A[i][0] - p[0]) * 0.25, p[1] + (A[i][1] - p[1]) * 0.25]));
  g.strokeStyle = rgba([84, 120, 92], 1); g.lineWidth = 7; g.stroke();
  g.beginPath(); smoothLine(g, A); g.strokeStyle = rgba([255, 228, 172], 0.95); g.lineWidth = 3.2; g.stroke();
  g.beginPath(); smoothLine(g, B); g.strokeStyle = rgba([70, 205, 210], 0.75); g.lineWidth = 2.4; g.stroke();
  // bark rings
  g.strokeStyle = rgba([14, 28, 22], 0.9); g.lineWidth = 2.2;
  for (const i of [1, 2, 3, 4, 6, 7]) {
    const m = [(A[i][0] + A[i + 1][0]) / 2, (A[i][1] + A[i + 1][1]) / 2], n = [(B[i][0] + B[i + 1][0]) / 2, (B[i][1] + B[i + 1][1]) / 2];
    g.beginPath(); g.moveTo(lerp(n[0], m[0], 0.18), lerp(n[1], m[1], 0.18)); g.quadraticCurveTo((m[0] + n[0]) / 2 + 3, (m[1] + n[1]) / 2, lerp(n[0], m[0], 0.82), lerp(n[1], m[1], 0.82)); g.stroke();
  }
  g.restore();
}
function drawToh(g, t, alpha) {
  if (alpha <= 0.01) return;
  const y0 = hToY(TOH_H, t) - 4;
  g.save(); g.globalAlpha = Math.min(1, alpha); g.lineCap = 'round'; g.lineJoin = 'round';
  g.translate(TOH_X, y0); g.scale(TOH_K, TOH_K); g.rotate(-0.035 * tohSwing(t - 0.2));
  const look = 0.07 * Math.sin(1.3 * t + 0.4) + 0.22 * Math.sin(Math.PI * clamp((t - 8.1) / 1.4)) * (t > 8.1 ? 1 : 0);
  const breathe = 1 + 0.012 * Math.sin(3.1 * t);
  // tail: pivots at the vent; the rackets follow a little behind the swing
  const th = tohSwing(t), th2 = tohSwing(t - 0.13);
  const P = [17, -8];
  g.save(); g.translate(P[0], P[1]);
  for (const sd of [-1, 1]) {       // the shorter outer tail feathers
    g.save(); g.rotate(th * 0.9 + sd * 0.07);
    g.beginPath(); g.moveTo(-4, 0); g.quadraticCurveTo(-6, 34, -1, 66); g.quadraticCurveTo(3, 70, 5, 64); g.quadraticCurveTo(7, 32, 4, 0); g.closePath();
    g.fillStyle = rgba([22, 118, 160], 1); g.fill(); g.strokeStyle = rgba(TQB, 1); g.lineWidth = 1.6; g.stroke();
    g.restore();
  }
  for (const sd of [-1, 1]) {       // the long central feathers: turquoise-blue vane, bare shaft, racket with a black tip
    const a1 = th + sd * 0.025, a2 = th2 + sd * 0.05;
    const p1 = [-Math.sin(a1) * 70, Math.cos(a1) * 70], p2 = [p1[0] - Math.sin(a2) * 86, p1[1] + Math.cos(a2) * 86];
    g.beginPath(); g.moveTo(0, 0); g.lineTo(p1[0], p1[1]); g.strokeStyle = rgba([30, 162, 206], 1); g.lineWidth = 8; g.stroke();
    g.beginPath(); g.moveTo(p1[0], p1[1]); g.quadraticCurveTo(p1[0] - Math.sin(a1) * 40, p1[1] + Math.cos(a1) * 40, p2[0], p2[1]);
    g.strokeStyle = rgba([86, 140, 160], 1); g.lineWidth = 2.2; g.stroke();
    g.save(); g.translate(p2[0], p2[1]); g.rotate(a2);
    g.beginPath(); g.moveTo(0, -4); g.bezierCurveTo(-11, 4, -9, 22, 0, 30); g.bezierCurveTo(9, 22, 11, 4, 0, -4); g.closePath();
    g.fillStyle = rgba(TQB, 1); g.fill(); g.strokeStyle = rgba(TQ, 1); g.lineWidth = 2; g.stroke();
    g.beginPath(); g.moveTo(-7, 20); g.bezierCurveTo(-5, 26, -2, 29, 0, 30); g.bezierCurveTo(2, 29, 5, 26, 7, 20); g.closePath();
    g.fillStyle = rgba([10, 16, 24], 1); g.fill();
    g.restore();
  }
  g.restore();
  // body: olive/ochre-green breast, rufous only on the lower belly
  g.save(); g.scale(breathe, breathe);
  g.beginPath(); g.moveTo(-14, -74); g.bezierCurveTo(-24, -54, -20, -26, -6, -12); g.bezierCurveTo(2, -4, 14, -4, 22, -8);
  g.bezierCurveTo(30, -26, 30, -56, 14, -80); g.closePath();
  const bg = g.createLinearGradient(0, -78, 0, -6);
  bg.addColorStop(0, rgba(OCHRE, 1)); bg.addColorStop(0.5, rgba(mix(OCHRE, [196, 160, 84], 0.6), 1));
  bg.addColorStop(0.7, rgba(mix(OCHRE, RUFOUS, 0.6), 1)); bg.addColorStop(1, rgba(RUFOUS, 1));
  g.fillStyle = bg; g.fill(); g.strokeStyle = rgba(WARM, 0.8); g.lineWidth = 1.8; g.stroke();
  // rufous mantle patch on the back, above the wing
  g.beginPath(); g.moveTo(4, -82); g.bezierCurveTo(16, -84, 26, -74, 26, -58); g.bezierCurveTo(20, -60, 12, -64, 7, -70); g.closePath();
  g.fillStyle = rgba(RUFOUS, 1); g.fill(); g.strokeStyle = rgba([255, 170, 110], 0.8); g.lineWidth = 1.4; g.stroke();
  // wing along the back: olive green with turquoise-blue flight feathers
  g.beginPath(); g.moveTo(9, -68); g.bezierCurveTo(30, -58, 34, -30, 28, 2); g.bezierCurveTo(22, -10, 8, -40, 9, -68); g.closePath();
  const wg = g.createLinearGradient(0, -68, 0, 2);
  wg.addColorStop(0, rgba(OLIVE, 1)); wg.addColorStop(0.5, rgba(mix(OLIVE, TQ, 0.6), 1)); wg.addColorStop(1, rgba(TQB, 1));
  g.fillStyle = wg; g.fill(); g.strokeStyle = rgba(TQ, 1); g.lineWidth = 1.8; g.stroke();
  g.strokeStyle = rgba([20, 70, 110], 0.8); g.lineWidth = 1.4;
  for (const k of [0.45, 0.62, 0.8]) { g.beginPath(); g.moveTo(14 + k * 8, -70 + k * 68); g.lineTo(24 + k * 4, -58 + k * 60); g.stroke(); }
  // feet on the root
  g.strokeStyle = rgba([90, 90, 100], 1); g.lineWidth = 3;
  for (const fx of [-2, 8]) { g.beginPath(); g.moveTo(fx, -10); g.lineTo(fx - 4, 1); g.lineTo(fx - 10, 2); g.stroke(); }
  g.restore();
  // head (turns slightly; looks down at the falling drop)
  g.save(); g.translate(0, -74); g.rotate(look); g.translate(0, 74);
  g.beginPath(); g.arc(-3, -90, 19, 0, TAU);
  const hg = g.createLinearGradient(0, -110, 0, -72);
  hg.addColorStop(0, rgba([138, 150, 96], 1)); hg.addColorStop(1, rgba(OCHRE, 1));
  g.fillStyle = hg; g.fill(); g.strokeStyle = rgba(WARM, 0.7); g.lineWidth = 1.6; g.stroke();
  // rufous patch behind the eye
  g.fillStyle = rgba(RUFOUS, 1); g.beginPath(); g.ellipse(9, -91, 6, 5, 0.3, 0, TAU); g.fill();
  // heavy black bill, about as long as the head, slightly decurved
  g.beginPath(); g.moveTo(-16, -98); g.quadraticCurveTo(-37, -99.5, -51, -88); g.quadraticCurveTo(-36, -86.5, -16, -83); g.closePath();
  g.fillStyle = rgba([24, 26, 30], 1); g.fill(); g.strokeStyle = rgba([150, 160, 170], 0.9); g.lineWidth = 1.6; g.stroke();
  // black mask through the eye, the bright turquoise brow above it
  g.beginPath(); g.moveTo(-19, -95); g.quadraticCurveTo(-4, -98, 6, -92); g.lineTo(6, -86); g.quadraticCurveTo(-6, -84, -19, -85); g.closePath();
  g.fillStyle = rgba([8, 10, 12], 1); g.fill();
  g.beginPath(); g.moveTo(-17, -99); g.quadraticCurveTo(-4, -104, 10, -96);
  g.strokeStyle = rgba(TQ, 1); g.lineWidth = 4.2; g.stroke();
  g.fillStyle = rgba([255, 255, 255], 1); g.beginPath(); g.arc(-6, -91, 1.9, 0, TAU); g.fill();
  // the throat: a straight vertical black stripe edged in pale turquoise, under the chin
  g.lineCap = 'butt';
  g.beginPath(); g.moveTo(-12, -80); g.lineTo(-12, -63);
  g.strokeStyle = rgba(TQP, 1); g.lineWidth = 7.5; g.stroke();
  g.strokeStyle = rgba([6, 8, 10], 1); g.lineWidth = 3.4; g.stroke();
  g.restore();
  g.restore();
}

// ---------- fireflies: the roots dissolve into them and they rise toward the opening
const FLIES = (() => {
  const R = HG.rng(1234), out = [];
  ROOTS.forEach(r => {
    const n = Math.round(2 + r.w * 0.5);
    for (let j = 1; j <= n; j++) {
      if (R() < 0.25) continue;
      const s = (j - 0.2 - R() * 0.6) / n;
      out.push({ r, s, vy: 70 + R() * 70, sway: 16 + R() * 26, ph: R() * TAU, f: 0.9 + R() * 0.9, sz: 15 + R() * 11, col: R() < 0.6 ? FIRE : FIRE2, pull: 0.25 + R() * 0.3 });
    }
  });
  return out;
})();
function drawFireflies(t) {
  if (t < END0) return;
  const env = 1 - smooth(10.8, 11.3, t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const F of FLIES) {
    // released when the dissolving front passes it
    const trel = releaseTime(F.r, F.s);
    const dt = t - trel; if (dt < 0) continue;
    const p0 = rootPt(F.r, F.s, trel);
    const x = p0[0] + F.sway * Math.sin(F.f * dt + F.ph) - F.sway * Math.sin(F.ph) + (OPX - p0[0]) * F.pull * smooth(0, 1.8, dt);
    const y = p0[1] - F.vy * dt - 40 * dt * dt + (hToY(0, t) - hToY(0, trel)) * 0.9;
    const blink = 0.5 + 0.5 * Math.pow(0.5 + 0.5 * Math.sin(4.2 * dt + F.ph * 3), 2);
    const a = smooth(0, 0.2, dt) * blink * env * (1 - smooth(yO(t) + 40, yO(t) - 120, y) * 0.85);
    HG.dot(ctx, F.col, x, y, F.sz * 3, a * 0.38);
    HG.dot(ctx, F.col, x, y, F.sz, Math.min(1, a * 1.15));
  }
  ctx.restore();
}
// the dissolving front reaches fraction s of a root at:
function releaseTime(r, s) {
  // rootLeft(r, t) = 1 - inOut3((t - dis)/1.1) == s  =>  inOut3(x) = 1 - s
  const y = 1 - s;
  const x = y < 0.5 ? Math.cbrt(y / 4) : 1 - Math.cbrt(2 * (1 - y)) / 2;
  return r.dis + 1.1 * x;
}

// ---------- render
HG.start({
  duration: 12,
  render(t) {
    const airB = airShafts(t), watB = waterShafts(t);
    const env = gEnd(t);

    // the floor and its web of caustics (seen at the start, slipping away as we rise)
    drawCaustics(t, smooth(0.2, 1.4, t) * env);

    // shafts of light: in the air (gold) and refracted below the surface (turquoise)
    const g = clearL(LB);
    g.globalCompositeOperation = 'lighter';
    for (const b of watB) drawShaft(g, b, TURQ, 0.42, 0);
    for (const b of airB) drawShaft(g, b, BEAM, 0.6, 0.42, 0.4, 0.4);
    HG.reset(g);
    bloom(ctx, LB, 20, 0.6 * env);
    bloom(ctx, LB, 5, 0.6 * env);
    // the pale core of each sunbeam, almost sharp, over the bloom
    const kc = clearL(LK);
    kc.globalCompositeOperation = 'lighter';
    for (const b of airB) drawCore(kc, b, [255, 240, 212], 0.28);
    HG.reset(kc);
    bloom(ctx, LK, 2.5, 0.45 * env);

    drawMotes(t, airB, watB);
    drawSurface(t, airB, smooth(-60, 40, yW(t)) * env);
    drawPools(t, airB, smooth(-60, 40, yW(t)) * env);
    drawBreak(t);
    drawBubbles(t);
    drawDrops(t);
    drawSchool(t);

    // the cave: the opening of light, its jungle rim, the dome, and the roots
    const caveA = smooth(5.0, 6.6, t) * (1 - smooth(10.0, 11.1, t));
    const rg = clearL(LR);
    drawOpening(t, caveA, airB);
    drawRoots(rg, t, airB, smooth(5.0, 6.4, t) * env);
    const tohA = smooth(TOH_IN, TOH_IN + 0.6, t) * (1 - smooth(10.0, 10.9, t));
    drawPerch(rg, t, tohA);
    drawToh(rg, t, tohA);
    HG.reset(rg);
    bloom(ctx, LR, 7, 0.75);
    HG.drawLayer(ctx, LR);
    drawDrips(t);
    drawFireflies(t);

    if (DEBUG) { HG.reset(ctx); ctx.strokeStyle = 'rgba(255,0,0,0.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(C, C, 470, 0, TAU); ctx.stroke(); }
  },
});
