<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Los Voladores de Papantla at sunset (Totonac ritual, Veracruz; UNESCO intangible heritage).
// A line of light shoots up into a tall pole; at its tip a spark swells into a huge setting sun.
// The square frame opens at the top: the caporal stands on the tip playing flute and drum and the
// four flyers sit on the frame's corners, backlit. Three drum beats ring out (the caporal leans
// into each one, the flyers flash), then the four tip over backwards together. Hanging head down
// by the waist, arms open, they spiral down round the pole in widening circles while the camera
// pulls back and tilts down with them: a real 3D scene (perspective camera, flyers in front larger
// and brighter, those behind dimmer and hidden by the pole). The ribbons of their hats leave
// rainbow bands that wind into a four-fold helix (the newest coil striped, older coils melting
// into one soft hue-graded band); petals fly off the hats and out into the evening air.
// The sun sinks as they descend; as the ropes run out each flyer melts into a glint of light on
// the ground with a ring and a puff of petals, the sky turns violet, the light runs down the
// spirals into the ground and the pole burns away from the ground up like a fuse.
// The lower band of the circle (y > ~780) is kept calm from ~2.2 s to ~9.8 s: the show's title
// overlay sits there.
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const TAU = Math.PI * 2;

// ---------- world (stylised proportions: the flyers are drawn larger than life, like a poster)
const HP = 20;          // pole tip (the "manzana" the caporal stands on)
const HF = 18.9;        // the turning square frame
const RF = 0.95;        // frame half-diagonal: the ropes hang from its corners
const R1 = 6.5;         // radius of the last circle
const YEND = 2.05;      // waist height when the ropes run out (the hat then touches the ground)
const TURNS = 4;        // turns shown (the ritual makes 13 per flyer; here the descent is condensed)
const T0 = 1.95, T1 = 9.6;    // descent: backward fall .. touch-down
const SW = 4.1;         // flyer sprite width in world units
const PS = 0.6;         // perched flyers are drawn smaller and grow as they swing out
const KNOT = [474, 219], HAT = [585, 700];   // in the 1024 flyer asset: rope knot (waist) and hat
const HL = Math.hypot(HAT[0] - KNOT[0], HAT[1] - KNOT[1]) / 1024 * SW;   // waist -> hat, world units
const PH0 = 0.55;       // starting angle of flyer 0
const TY_END = 6.7, F_END = 1170;   // end of the camera move: the ground sits above the title band

// sunset palette
const SUN_HI = [255, 196, 92], SUN_LO = [255, 84, 120], MAGENTA = [235, 50, 150], VIOLET = [140, 70, 235];
const ROPE = [255, 214, 150], RIM = [255, 170, 90], GOLD = [255, 196, 90], WARM = [255, 214, 160];
const RIBBONS = [[255, 52, 78], [255, 148, 30], [255, 226, 50], [50, 222, 112], [45, 150, 255], [176, 82, 255]];
const PETALS = [[255, 70, 120], [255, 210, 60], [255, 140, 40], [255, 245, 220], [190, 90, 255], [255, 60, 60]];
const BEATS = [1.2, 1.5, 1.8];

// how strongly the title band (y > ~780) must be kept calm at time t
const titleWin = t => smooth(1.9, 2.6, t) * (1 - smooth(9.5, 10.1, t));
const bandFade = (t, y) => 1 - 0.85 * titleWin(t) * smooth(730, 800, y);

// ---------- descent progress: angular speed ramps up after the fall, cruises, slows a little at the end
const NPROG = 2048, PROG = new Float32Array(NPROG + 1);
(() => {
  const speed = u => smooth(0, 0.14, u) * (1 - 0.42 * smooth(0.78, 1, u)) + 0.04;
  let acc = 0; PROG[0] = 0;
  for (let i = 1; i <= NPROG; i++) { const u = (i - 0.5) / NPROG; acc += speed(u) / NPROG; PROG[i] = acc; }
  for (let i = 0; i <= NPROG; i++) PROG[i] /= acc;
})();
function prog(u) {
  if (u <= 0) return 0; if (u >= 1) return 1;
  const x = u * NPROG, i = Math.floor(x), f = x - i;
  return PROG[i] + (PROG[i + 1] - PROG[i]) * f;
}
const frameScale = s => lerp(0.2, 1, ease.outBack(smooth(0.95, 1.45, s)));

// state of flyer i at time s: waist position, rope attach point, body axis (waist -> head), hat, scale
function flyer(i, s) {
  const u = (s - T0) / (T1 - T0), P = prog(u);
  const fa = clamp((s - T0) / 0.8);                         // the backward fall off the frame
  const tip = ease.inOut3(fa);                              // body rotation: upright -> head down
  const kd = ease.inOut3((s - T0 - 0.06) / 0.8);            // the drop as the rope pays out
  const thF = PH0 + i * TAU / 4 + TURNS * TAU * P;          // frame corner angle
  const th = thF - 0.16 * smooth(0, 0.25, u);               // the flyer trails its rope's corner a little
  const r = RF * frameScale(s) + 0.6 * kd + (R1 - RF - 0.6) * Math.pow(P, 0.5);
  const y = HF + 0.28 - 1.8 * kd - (HF + 0.28 - 1.8 - YEND) * P;
  const x = r * Math.cos(th), z = -r * Math.sin(th);
  const ax = RF * Math.cos(thF), ay = HF, az = -RF * Math.sin(thF);
  // the body tips over backwards: the head swings outward (away from the pole) and down ...
  const ox = Math.cos(th), oz = -Math.sin(th), ph = Math.PI * tip;
  let bx = Math.sin(ph) * ox, by = Math.cos(ph), bz = Math.sin(ph) * oz;
  // ... until the rope takes over: then the body hangs along the rope, head first
  let rx = x - ax, ry = y - ay, rz = z - az; const rl = Math.hypot(rx, ry, rz) || 1;
  const kr = smooth(0.45, 1, fa);
  bx = lerp(bx, rx / rl, kr); by = lerp(by, ry / rl, kr); bz = lerp(bz, rz / rl, kr);
  const bl = Math.hypot(bx, by, bz) || 1; bx /= bl; by /= bl; bz /= bl;
  const sc = lerp(PS, 1, ease.inOut3(fa));
  return {
    th, r, x, y, z, ax, ay, az, bx, by, bz, sc, fa, u,
    hat: [x + bx * HL * sc, y + by * HL * sc, z + bz * HL * sc],
  };
}

// ---------- camera: close on the top of the pole, pulls back and tilts down with the descent, keeps circling
function camera(t) {
  const k = ease.inOut3((t - 1.7) / 8.3);
  const yaw = -0.32 + 0.62 * (t / 12) + 0.08 * ease.inOut3((t - 2) / 8);
  const D = 40, E = 2.2;
  const Ty = lerp(15.6, TY_END, k);
  const f = lerp(2150, F_END, k) * (1 - 0.035 * smooth(9.5, 12, t));
  const cam = [Math.sin(yaw) * D, E, Math.cos(yaw) * D];
  let fw = [-cam[0], Ty - E, -cam[2]]; const fl = Math.hypot(...fw); fw = fw.map(v => v / fl);
  let rt = [-fw[2], 0, fw[0]]; const rl = Math.hypot(...rt); rt = rt.map(v => v / rl);   // fw x worldUp
  const up = [rt[1] * fw[2] - rt[2] * fw[1], rt[2] * fw[0] - rt[0] * fw[2], rt[0] * fw[1] - rt[1] * fw[0]];
  return { cam, fw, rt, up, f, yaw, dir: [Math.sin(yaw), Math.cos(yaw)], E };
}
function proj(cm, x, y, z) {
  const vx = x - cm.cam[0], vy = y - cm.cam[1], vz = z - cm.cam[2];
  const zc = vx * cm.fw[0] + vy * cm.fw[1] + vz * cm.fw[2];
  const xc = vx * cm.rt[0] + vy * cm.rt[1] + vz * cm.rt[2];
  const yc = vx * cm.up[0] + vy * cm.up[1] + vz * cm.up[2];
  const s = cm.f / zc;
  return { x: C + xc * s, y: C - yc * s, s, d: zc };
}
// > 0 in front of the pole (towards the camera), < 0 behind it
const side = (cm, x, z) => x * cm.dir[0] + z * cm.dir[1];

// ---------- layers
const LB = HG.layer(), LF = HG.layer(), LS = HG.layer(), LK = HG.layer(), LP = HG.layer(), LOB = HG.layer(), LOF = HG.layer(), LXB = HG.layer(), LXF = HG.layer();
for (const l of [LB, LF, LS, LK, LP, LOB, LOF, LXB, LXF]) l.ctx.imageSmoothingQuality = 'high';
ctx.imageSmoothingQuality = 'high';
function clearL(L) { HG.reset(L.ctx); L.ctx.clearRect(0, 0, W, W); }
// composite a layer with a blurred bloom copy.
// The bloom pass uses a raw drawImage instead of HG.drawLayer on purpose: drawLayer always forces
// filter='none', and here the layer must be drawn through HG.blur(). It stays resolution-independent
// because HG.reset leaves the engine's scale transform S on ctx and the layer (SIZE px) is drawn onto
// the 0..W (1080) user space, i.e. exactly pixel-aligned at any ?size (checked at 2160).
function bloomLayer(L, { blur = 10, bloom = 0.8, alpha = 1 } = {}) {
  ctx.save(); HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
  if (bloom > 0) { ctx.globalAlpha = bloom * alpha; ctx.filter = HG.blur(blur); ctx.drawImage(L.cv, 0, 0, W, W); ctx.filter = 'none'; }
  ctx.restore();
  HG.drawLayer(ctx, L, { alpha, op: 'lighter' });
  HG.reset(ctx);
}
const mul = (c, b) => `rgb(${Math.round(c[0] * b)},${Math.round(c[1] * b)},${Math.round(c[2] * b)})`;
// the same light as mul() when added, but with alpha = brightness, so the sun knock-out under the
// ribbons is only as strong as the ribbon is bright (dim old trails never cut dark marks in the sun)
const mulA = (c, b) => rgba(c, clamp(b).toFixed(3));
const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
// a colour flowing round the ribbon palette (cyclic, smooth)
function hue(v) {
  v = ((v % 1) + 1) % 1 * RIBBONS.length; const i = Math.floor(v), f = v - i;
  return mix(RIBBONS[i], RIBBONS[(i + 1) % RIBBONS.length], f * f * (3 - 2 * f));
}
// warm silhouettes of the sprites (the backlit rim / beat flashes), made once from the loaded images
const tintCache = new Map();
function tinted(img, col) {
  const key = img.src + col.join(',');
  if (!tintCache.has(key)) {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const g = c.getContext('2d'); g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = rgba(col, 1); g.fillRect(0, 0, c.width, c.height);
    tintCache.set(key, c);
  }
  return tintCache.get(key);
}

// at the end the pole burns away from the ground up like a fuse, shedding embers (the opening in reverse)
const fuseAt = t => HP * ease.inOut3((t - 10.0) / 1.1);
const EMBERS = [];
{ const R = HG.rng(808); for (let n = 0; n < 70; n++) EMBERS.push({ tb: 10.0 + 1.1 * (n + R()) / 70, a: R() * TAU, v: 1.4 + R() * 2.2, o: 0.4 + R() * 1.2, l: 0.6 + R() * 0.5, c: R() }); }
function embers(t, cm) {
  if (t < 10.0 || t > 12) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const e of EMBERS) {
    const age = t - e.tb; if (age < 0 || age > e.l) continue;
    const y0 = fuseAt(e.tb), k = age / e.l;
    const r = 0.35 + e.o * ease.out3(k), y = y0 + e.v * age - 0.6 * age * age;
    const p = proj(cm, r * Math.cos(e.a + age), y, r * Math.sin(e.a + age));
    const col = e.c < 0.45 ? [255, 190, 90] : e.c < 0.75 ? [255, 110, 150] : [180, 110, 255];
    HG.dot(ctx, col, p.x, p.y, 0.42 * p.s * (1 - 0.5 * k), 0.95 * Math.sin(Math.PI * Math.min(1, k * 1.6 + 0.1)) * (1 - k));
  }
  // the burning front itself
  const f = fuseAt(t);
  if (f > 0.05 && f < HP - 0.1) { const p = proj(cm, 0, f, 0); HG.dot(ctx, [255, 200, 130], p.x, p.y, 1.6 * p.s, 0.75); HG.dot(ctx, [255, 120, 160], p.x, p.y, 3.2 * p.s, 0.3); }
  ctx.restore();
}

// ---------- the sun: swells out of the pole-tip spark, then sinks behind the horizon
function sky(t, cm) {
  const hz = proj(cm, cm.cam[0] - cm.dir[0] * 1e5, cm.E, cm.cam[2] - cm.dir[1] * 1e5).y;   // horizon on screen
  const sink = Math.pow(clamp((t - 0.6) / 9.3), 1.4);
  const R = lerp(178, 160, sink);
  let sx = C + 70 - 40 * sink, sy = lerp(300, hz + 1.1 * R, sink);
  // while the title is up the disc stays above its band (it sets once the horizon has risen above it)
  sy = Math.min(sy, 772 - R + 6 * Math.max(0, 745 - hz));
  // birth: a small, bright, saturated core born at the pole tip swells to the full disc
  const born = ease.out3((t - 0.72) / 1.15);
  const tipP = proj(cm, 0, HP * ease.out3((t - 0.18) / 0.95), 0);
  const glide = ease.inOut3((t - 0.72) / 1.0);
  const cx = lerp(tipP.x, sx, glide), cy = lerp(tipP.y, sy, glide);
  const r0 = R * lerp(0.05, 1, born);
  const red = smooth(4, 10, t);                              // the sun reddens as it sinks
  const g = LS.ctx; clearL(LS);
  const aSun = smooth(0.7, 0.8, t) * (1 - smooth(9.8, 10.9, t));
  if (aSun > 0.003) {
    // halo (grows with the disc)
    const hg = g.createRadialGradient(cx, cy, r0 * 0.7, cx, cy, r0 * 2.3);
    hg.addColorStop(0, rgba(mix(MAGENTA, [255, 110, 60], 0.5 - 0.4 * red), 0.32 * smooth(0.2, 0.8, born)));
    hg.addColorStop(0.45, rgba(MAGENTA, 0.12 * smooth(0.2, 0.8, born))); hg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hg; g.fillRect(0, 0, W, W);
    // disc: gold at the top melting into rose at the bottom
    const dg = g.createLinearGradient(0, cy - r0, 0, cy + r0);
    dg.addColorStop(0, rgba(mix(SUN_HI, [255, 140, 70], red), 1));
    dg.addColorStop(0.55, rgba(mix([255, 140, 80], [255, 90, 90], red), 1));
    dg.addColorStop(1, rgba(mix(SUN_LO, [220, 50, 150], red), 1));
    g.fillStyle = dg; g.beginPath(); g.arc(cx, cy, r0, 0, TAU); g.fill();
    // while it is small it burns as a hot saturated gold core
    const hot = 1 - smooth(0.25, 0.85, born);
    if (hot > 0.003) {
      const cg = g.createRadialGradient(cx, cy, 0, cx, cy, r0 * 1.05);
      cg.addColorStop(0, rgba([255, 236, 180], hot)); cg.addColorStop(0.45, rgba([255, 186, 70], hot)); cg.addColorStop(1, rgba([255, 130, 40], hot));
      g.fillStyle = cg; g.beginPath(); g.arc(cx, cy, r0, 0, TAU); g.fill();
    }
    // soft inner glow edge
    const eg = g.createRadialGradient(cx, cy, r0 * 0.82, cx, cy, r0 * 1.06);
    eg.addColorStop(0, 'rgba(0,0,0,0)'); eg.addColorStop(0.75, rgba([255, 200, 160], 0.18)); eg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = eg; g.fillRect(cx - r0 * 1.2, cy - r0 * 1.2, r0 * 2.4, r0 * 2.4);
    // two thin cloud bands drifting across the lower disc: cut clean, clipped to the disc, each with a
    // rose-lit underside (they read as clouds lit from below, never as grey smears)
    const wa = smooth(0.55, 0.95, born);
    if (wa > 0.003) {
      const W2 = [[0.64, 1.05, 0.022, 2.1, 1], [0.8, 0.72, 0.026, 4.2, -1]].map(([p, len, th, ph, dir]) =>
        ({ y: cy - r0 + 2 * r0 * p, x: cx + r0 * (0.2 * Math.sin(ph) + 0.05 * t * dir), rx: r0 * len / 2, ry: r0 * th }));
      g.save(); g.beginPath(); g.arc(cx, cy, r0 * 0.995, 0, TAU); g.clip();
      g.globalCompositeOperation = 'lighter'; g.filter = HG.blur(2.5);
      for (const w of W2) { g.globalAlpha = 0.55 * wa; g.fillStyle = 'rgb(255,120,170)'; g.beginPath(); g.ellipse(w.x, w.y + w.ry * 1.6, w.rx * 0.92, w.ry * 0.9, 0, 0, TAU); g.fill(); }
      g.globalCompositeOperation = 'destination-out'; g.filter = HG.blur(1.4); g.fillStyle = '#000';
      for (const w of W2) { g.globalAlpha = 0.95 * wa; g.beginPath(); g.ellipse(w.x, w.y, w.rx, w.ry, 0, 0, TAU); g.fill(); }
      g.restore();
    }
  }
  // the afterglow along the horizon: magenta turning violet once the sun has set
  const ag = smooth(5, 9, t) * (1 - smooth(10.2, 11.15, t)) * (1 - smooth(745, 800, hz));
  if (ag > 0.003) {
    const col = mix(MAGENTA, VIOLET, smooth(8.5, 10.8, t));
    g.save(); g.translate(sx, hz - 10); g.scale(2.6, 0.75);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, 230);
    rg.addColorStop(0, rgba(col, 0.42 * ag)); rg.addColorStop(0.5, rgba(col, 0.14 * ag)); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.fillRect(-240, -240, 480, 480);
    g.restore();
  }
  // below the horizon there is only ground: cut the sky there
  g.globalCompositeOperation = 'destination-out';
  const cg = g.createLinearGradient(0, hz - 14, 0, hz + 30);
  cg.addColorStop(0, 'rgba(0,0,0,0)'); cg.addColorStop(0.35, 'rgba(0,0,0,0.92)'); cg.addColorStop(1, 'rgba(0,0,0,1)');
  g.fillStyle = cg; g.fillRect(0, hz - 14, W, W);
  HG.reset(g);
  // the ribbons pass in front of the sun: knock the sun back under them so they keep their colours
  HG.drawLayer(g, LB, { alpha: 0.8, op: 'destination-out' });
  HG.drawLayer(g, LF, { alpha: 0.95, op: 'destination-out' });
  HG.drawLayer(ctx, LS, { alpha: 0.95 });
  return { hz, sx, sy, R };
}

// ---------- sprites
// draw img anchored at asset point (au, av) at screen (x, y): width w, rotation rot, scales (sx, sy)
function sprite(img, x, y, w, rot, sx, sy, au, av, alpha, { bloom = 0.35, blur = 10, g = ctx, op = 'source-over', main = true } = {}) {
  if (alpha <= 0.003) return;
  const k = w / img.width;
  const draw = () => { g.save(); g.translate(x, y); g.rotate(rot); g.scale(sx, sy); g.drawImage(img, -au * k, -av * k, img.width * k, img.height * k); g.restore(); };
  g.save();
  if (bloom > 0) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = Math.min(1, alpha * bloom); g.filter = HG.blur(blur); draw(); g.filter = 'none'; }
  if (main) { g.globalCompositeOperation = op; g.globalAlpha = Math.min(1, alpha); draw(); }
  g.restore();
}

// a glowing line (two passes)
function glowLine(pts, col, width, alpha, blur = 6, g = ctx) {
  if (alpha <= 0.003) return;
  g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = rgba(col, 1); g.lineCap = 'round'; g.lineJoin = 'round';
  const path = () => { g.beginPath(); g.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y); };
  g.globalAlpha = Math.min(1, alpha * 0.55); g.lineWidth = width * 2.6; g.filter = HG.blur(blur); path(); g.stroke();
  g.filter = 'none'; g.globalAlpha = Math.min(1, alpha); g.lineWidth = width; path(); g.stroke();
  g.restore();
}

// ---------- ribbon trails: the path of each hat. The newest coil is a rainbow band twisting like a
// ribbon (stripes >= 2.7 px); older coils melt into one wide, blurred, dim band whose hue flows down
// the spiral (a soft veil of colour, no stack of thin lines), and coils older than ~2 turns fade out
// so the newest ones carry the colour.
const DT = 1 / 48, BW = 0.62, NS = RIBBONS.length, TS = T0 + 0.45, SMIN = 2.7;
function trails(t, cm, flyers, fade, unwind) {
  const gB = LB.ctx, gF = LF.ctx, oB = LOB.ctx, oF = LOF.ctx, xB = LXB.ctx, xF = LXF.ctx;
  for (const L of [LB, LF, LOB, LOF, LXB, LXF]) clearL(L);
  const sH = Math.min(t, T1);                    // the head stops where the hat touches down
  if (sH <= TS + DT) return;
  const M = Math.floor((sH - TS) / DT);
  // sample every flyer's hat path once (newest first), with the screen offset that ties the head to the drawn hat
  const paths = flyers.map(F => {
    const pts = [];
    for (let j = 0; j <= M; j++) {
      const s = sH - j * DT, S = flyer(F.i, s), h = S.hat;
      const p = proj(cm, h[0], h[1], h[2]);
      const age = t - s, aH = sH - s, tie = Math.exp(-aH / 0.3);
      p.x += F.hatOff[0] * tie; p.y += F.hatOff[1] * tie;
      p.age = age; p.aH = aH; p.sd = side(cm, h[0], h[2]);
      // stripe spacing: the band twists as it flies and narrows along the tail (never below SMIN px)
      const tw = 0.5 + 0.5 * Math.cos(age * 2.4 + F.i * 1.7);
      p.step = Math.max(SMIN, BW / NS * p.s * S.sc * (0.42 + 0.58 * tw) * (0.62 + 0.38 * Math.exp(-age / 1.1)));
      p.bw = Math.max(4, BW * 0.5 * p.s * S.sc); p.vw = BW * 0.9 * p.s * S.sc;
      pts.push(p);
    }
    // stripe offset direction per sample
    for (let j = 0; j <= M; j++) {
      const p = pts[j], q0 = pts[Math.max(0, j - 1)], q1 = pts[Math.min(M, j + 1)];
      const dx = q0.x - q1.x, dy = q0.y - q1.y, dl = Math.hypot(dx, dy) || 1;
      const steep = smooth(0.55, 0.95, Math.abs(dy) / dl);
      const out = clamp((p.x - F.poleX) / 40, -1, 1);
      let ox = out * steep, oy = 1 - steep; const ol = Math.hypot(ox, oy) || 1;
      const coll = 1 - ol;                                  // what is left of the collapse (near the pole)
      p.ox = ox / ol; p.oy = oy / ol; p.dim = 1 - 0.5 * clamp(coll * 1.4);
    }
    return pts;
  });
  for (const g of [gB, gF, oB, oF]) { g.lineCap = 'butt'; g.globalCompositeOperation = 'lighter'; }
  for (const g of [xB, xF]) { g.lineCap = 'round'; g.lineJoin = 'round'; }
  // oldest first so the bright heads lie on top
  for (let j = M - 1; j >= 0; j--) {
    for (let i = 0; i < paths.length; i++) {
      const a = paths[i][j + 1], b = paths[i][j];
      const age = (a.age + b.age) / 2, aH = (a.aH + b.aH) / 2, sMid = t - age;
      const uw = smooth(unwind - 0.05, unwind + 0.35, sMid);
      if (uw <= 0.003) continue;
      const front = a.sd + b.sd > 0, g = front ? gF : gB, o = front ? oF : oB, x = front ? xF : xB;
      const taper = smooth(0, 0.15, aH);                       // the newest end tapers to a point
      const k0 = uw * (front ? 1 : 0.6) * fade * lerp(0.15, 1, taper);
      const flash = 2 * (1 - uw) * uw;                         // the light running down at the end
      const wS = 1 - smooth(0.9, 1.9, age);                    // striped ribbon -> single soft band
      const old = 1 - 0.94 * smooth(2.0, 4.0, age);
      // stripes
      const brS = (0.12 + 0.8 * Math.exp(-age / 1.1)) * wS * k0 * (a.dim + b.dim) / 2;
      if (brS > 0.01) {
        const wf = lerp(0.3, 1, taper);
        g.lineWidth = (a.step + b.step) / 2 * 1.02 * wf;
        for (let k = 0; k < NS; k++) {
          const c = k - (NS - 1) / 2;
          g.strokeStyle = mulA(RIBBONS[k], brS * (k === 2 ? 0.9 : 1));
          g.beginPath(); g.moveTo(a.x + c * a.step * wf * a.ox, a.y + c * a.step * wf * a.oy); g.lineTo(b.x + c * b.step * wf * b.ox, b.y + c * b.step * wf * b.oy); g.stroke();
        }
      }
      // the soft veil (old coils), hue flowing down the spiral
      const col = hue(sMid * 0.42 + i * 0.06);
      const brV = 0.3 * Math.exp(-Math.max(0, age - 1) / 2.6) * old * (1 - wS) * k0 * smooth(T0 + 1.0, T0 + 1.7, sMid);
      if (brV > 0.01) {
        o.lineWidth = (a.vw + b.vw) / 2; o.strokeStyle = mulA(col, brV);
        o.beginPath(); o.moveTo(a.x, a.y); o.lineTo(b.x, b.y); o.stroke();
      }
      // the light running down the spirals at the end: a smooth bright band (own layer, round joins)
      const brF = 1.6 * flash * k0 / uw;
      if (brF > 0.01) {
        x.lineWidth = (a.bw + b.bw) / 2 * 1.3; x.strokeStyle = mul(col, Math.min(1, brF));
        x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke();
      }
    }
  }
  // melt the veil into the trail layers through a blur; add the light band (with its own glow)
  // (raw drawImage on purpose, to draw through a blur filter: same mapping as bloomLayer)
  for (const [g, L, X] of [[gB, LOB, LXB], [gF, LOF, LXF]]) {
    HG.reset(g); g.globalCompositeOperation = 'lighter'; g.filter = HG.blur(7);
    g.drawImage(L.cv, 0, 0, W, W);
    if (unwind > TS) { g.filter = HG.blur(4); g.globalAlpha = 0.8; g.drawImage(X.cv, 0, 0, W, W); }
    HG.reset(g);
    if (unwind > TS) HG.drawLayer(g, X, { op: 'lighter' });
  }
}

// ---------- petals shed from the hats (stateless: each petal is born at a fixed time and drifts)
function petals(t, cm, which) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // small petals falling off the hats
  {
    const EVERY = 0.075, LIFE = 1.7;
    const n0 = Math.max(0, Math.floor((t - LIFE - T0 - 0.4) / EVERY)), n1 = Math.floor((Math.min(t, T1 - 0.15) - T0 - 0.4) / EVERY);
    for (let i = 0; i < 4; i++) {
      for (let n = n0; n <= n1; n++) {
        const tb = T0 + 0.4 + n * EVERY, age = t - tb;
        if (age < 0 || age > LIFE) continue;
        const R = HG.rng(1000 + i * 977 + n * 31);
        const h = flyer(i, tb).hat;
        const vx = (R() - 0.5) * 1.6, vz = (R() - 0.5) * 1.6, vy = 0.2 + R() * 0.8;
        const x = h[0] + vx * age, z = h[2] + vz * age, y = Math.max(0.05, h[1] + vy * age - 0.9 * age * age);
        const fr = side(cm, x, z) > 0;
        if (fr !== which) continue;
        const p = proj(cm, x, y, z);
        const col = PETALS[Math.floor(R() * PETALS.length)];
        const tw = 0.65 + 0.35 * Math.sin(t * 9 + n);
        const a = (1 - smooth(LIFE * 0.45, LIFE, age)) * smooth(0, 0.15, age) * tw * (fr ? 1 : 0.6) * bandFade(t, p.y);
        HG.dot(ctx, col, p.x, p.y, (0.32 + 0.2 * R()) * p.s, a);
      }
    }
  }
  // bigger petals flung out by the spin, drifting far out into the evening air
  {
    const EVERY = 0.15, LIFE = 2.9, TB0 = T0 + 0.55;
    const n0 = Math.max(0, Math.floor((t - LIFE - TB0) / EVERY)), n1 = Math.floor((Math.min(t, T1 - 0.7) - TB0) / EVERY);
    for (let i = 0; i < 4; i++) {
      for (let n = n0; n <= n1; n++) {
        const tb = TB0 + n * EVERY, age = t - tb;
        if (age < 0 || age > LIFE) continue;
        const R = HG.rng(3000 + i * 1013 + n * 37);
        const F = flyer(i, tb), h = F.hat;
        const tx = -Math.sin(F.th), tz = -Math.cos(F.th), ox = Math.cos(F.th), oz = -Math.sin(F.th);
        const vt = 1.6 + R() * 2.2, vo = 1.4 + R() * 2.2, ph = R() * TAU;
        const dr = (1 - Math.exp(-1.1 * age)) / 1.1;               // air drag
        const x = h[0] + (tx * vt + ox * vo) * dr + 0.25 * Math.sin(age * 4 + ph);
        const z = h[2] + (tz * vt + oz * vo) * dr + 0.25 * Math.cos(age * 3.3 + ph);
        const y = Math.max(0.05, h[1] + 0.9 * dr - 0.75 * age);     // they float down slowly
        const fr = side(cm, x, z) > 0;
        if (fr !== which) continue;
        const p = proj(cm, x, y, z);
        const col = PETALS[Math.floor(R() * PETALS.length)];
        const tw = 0.6 + 0.4 * Math.sin(age * 7 + ph);                // they turn over as they flutter
        const a = 0.85 * (1 - smooth(LIFE * 0.55, LIFE, age)) * smooth(0, 0.2, age) * tw * (fr ? 1 : 0.55) * bandFade(t, p.y);
        HG.dot(ctx, col, p.x, p.y, (0.42 + 0.22 * R()) * p.s, a);
      }
    }
  }
  ctx.restore();
}

// ---------- the pole: a tapered trunk, dark against the sun, rim-lit, with one rope wound round it
// in a slow spiral (the climbing rope). Drawn in its own layer so its foot can melt into the dusk
// while the title is up.
function pole(t, cm, grow, alpha, from = 0) {
  const g = LP.ctx; clearL(LP);
  if (grow <= 0 || alpha <= 0.003 || from >= HP - 0.05) return;
  const top = HP * grow;
  const rtp = lerp(0.5, 0.3, grow), rAt = y => lerp(0.5, rtp, y / top), rb = rAt(from);
  const b = proj(cm, 0, from, 0), tp = proj(cm, 0, top, 0);
  const wb = rb * b.s, wt = rtp * tp.s;
  // body (occludes the sun and everything behind)
  g.beginPath(); g.moveTo(b.x - wb, b.y); g.lineTo(tp.x - wt, tp.y); g.lineTo(tp.x + wt, tp.y); g.lineTo(b.x + wb, b.y); g.closePath();
  const bg = g.createLinearGradient(b.x - wb, 0, b.x + wb, 0);
  bg.addColorStop(0, 'rgb(150,78,44)'); bg.addColorStop(0.18, 'rgb(84,40,28)'); bg.addColorStop(0.55, 'rgb(48,22,24)'); bg.addColorStop(0.85, 'rgb(62,26,40)'); bg.addColorStop(1, 'rgb(130,56,80)');
  g.fillStyle = bg; g.fill();
  // rim light on both edges (the sun is behind)
  glowLine([{ x: b.x - wb, y: b.y }, { x: tp.x - wt, y: tp.y }], RIM, 2.6, 0.85, 6, g);
  glowLine([{ x: b.x + wb, y: b.y }, { x: tp.x + wt, y: tp.y }], [255, 120, 150], 2.2, 0.68, 6, g);
  // the spiral rope: only the half facing the camera is seen; it slides round as the camera circles
  g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round'; g.lineJoin = 'round';
  const PITCH = 1.3, y0 = Math.max(from + 0.1, 0.3), y1 = top - 0.6;
  let run = [];
  const flush = () => {
    if (run.length > 1) {
      const w = Math.max(2.6, 0.1 * run[run.length >> 1].s);
      g.strokeStyle = rgba(ROPE, 0.34); g.lineWidth = w;
      g.beginPath(); g.moveTo(run[0].x, run[0].y); for (const p of run) g.lineTo(p.x, p.y); g.stroke();
    }
    run = [];
  };
  for (let y = y0; y <= y1; y += PITCH / 28) {
    const a = y / PITCH * TAU, rr = rAt(y) * 1.06;
    const X = rr * Math.cos(a), Z = rr * Math.sin(a);
    if (side(cm, X, Z) > 0.12 * rr) run.push(proj(cm, X, y, Z)); else flush();
  }
  flush();
  g.restore();
  // growing tip spark (it flares as the sun is born from it)
  if (grow < 1 || t < 1.4) {
    const fl = smooth(0.55, 0.85, t) * (1 - smooth(0.95, 1.45, t));
    g.save(); g.globalCompositeOperation = 'lighter';
    HG.dot(g, [255, 220, 150], tp.x, tp.y, 80 + 60 * fl, 0.9 * (1 - smooth(0.9, 1.4, t)));
    g.restore();
  }
  HG.reset(g);
  // the foot of the pole melts into the dusk while the title band must stay calm
  const tw = titleWin(t);
  if (tw > 0.003) {
    g.globalCompositeOperation = 'destination-out';
    const fg = g.createLinearGradient(0, 760, 0, 900);
    fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(1, `rgba(0,0,0,${0.9 * tw})`);
    g.fillStyle = fg; g.fillRect(0, 760, W, W - 760);
    HG.reset(g);
  }
  HG.drawLayer(ctx, LP, { alpha });
}

// ---------- the turning square frame at the top and the small capstan above it
function frame(t, cm, open, thF, part) {
  if (open <= 0.003) return;
  const s = lerp(0.2, 1, ease.outBack(open));
  const P = [];
  for (let k = 0; k < 4; k++) { const a = thF + k * TAU / 4; P.push({ x: RF * s * Math.cos(a), z: -RF * s * Math.sin(a) }); }
  for (let k = 0; k < 4; k++) {
    const p = P[k], q = P[(k + 1) % 4];
    const mid = side(cm, (p.x + q.x) / 2, (p.z + q.z) / 2) > 0;
    if (mid !== (part === 'front')) continue;
    const a = proj(cm, p.x, HF, p.z), b = proj(cm, q.x, HF, q.z);
    glowLine([a, b], GOLD, 0.12 * a.s, open * (mid ? 0.85 : 0.55), 5);
  }
  if (part === 'front') {
    // the capstan ("manzana") at the tip
    const a = proj(cm, 0, HP - 0.05, 0), b = proj(cm, 0, HF + 0.05, 0);
    glowLine([a, b], [255, 160, 100], 0.36 * a.s, open * 0.45, 4);
  }
}

// ---------- ground rings where the flyers touch down (bold, warm, long bloom)
function groundRing(cm, x, z, r, col, alpha) {
  if (alpha <= 0.003) return;
  const pts = [];
  for (let k = 0; k <= 48; k++) { const a = k / 48 * TAU; pts.push(proj(cm, x + r * Math.cos(a), 0.02, z + r * Math.sin(a))); }
  glowLine(pts, col, 10, alpha * 0.35, 14);
  glowLine(pts, col, 4.2, alpha, 7);
}

// ---------- the flyers on screen
// sprite pose from the 3D body axis: in-plane rotation from its projection, foreshortening from its length
function screenFlyer(F, cm, t) {
  const w = proj(cm, F.x, F.y, F.z);
  const e = proj(cm, F.x + F.bx, F.y + F.by, F.z + F.bz);
  const vx = e.x - w.x, vy = e.y - w.y, vl = Math.hypot(vx, vy);
  const rot = Math.atan2(-vx, vy) + 0.04 * Math.sin(t * 2.3 + F.i * 1.9) * smooth(T0 + 0.6, T0 + 1.2, t);
  const ys = lerp(1, clamp(vl / w.s, 0.35, 1), 0.85);
  const ph = F.th + cm.yaw;
  const mir = (F.i % 2 ? -1 : 1) * (0.72 + 0.28 * Math.pow(Math.cos(ph), 2));
  return { w, rot, ys, mir, wd: SW * F.sc * w.s };
}
// where the sprite draws the hat (screen), for a given pose
function drawnHat(P) {
  const k = P.wd / 1024, hx = (HAT[0] - KNOT[0]) * k * P.mir, hy = (HAT[1] - KNOT[1]) * k * P.ys;
  const cr = Math.cos(P.rot), sr = Math.sin(P.rot);
  return [P.w.x + hx * cr - hy * sr, P.w.y + hx * sr + hy * cr];
}
const TLAND = T1 - 0.3;   // the dissolve into the ground starts here
function drawFlyer(F, A, g, back) {
  if (F.alpha <= 0.003) return;
  const P = F.P;
  // the dissolve scales the figure down into its hat point (where the glint is)
  const ds = 1 - 0.6 * F.dis, hx = F.dh[0], hy = F.dh[1];
  const x = hx + (P.w.x - hx) * ds, y = hy + (P.w.y - hy) * ds, wd = P.wd * ds;
  const pk = smooth(0.2, 0.65, F.fa);                       // perched figure (no hanging ribbons) -> full figure
  const opt = back ? { bloom: 0, g } : { bloom: 0.3, blur: 10, g };
  if (pk < 1) {
    // backlit by the sun: a warm rim, flashing on the drum beats
    if (!back) sprite(tinted(A.perch, [255, 180, 110]), x, y, wd, P.rot, P.mir, P.ys, KNOT[0], KNOT[1], F.alpha * (1 - pk) * (0.6 + 0.5 * F.beat), { bloom: 1, blur: 3.5, g, main: false });
    sprite(A.perch, x, y, wd, P.rot, P.mir, P.ys, KNOT[0], KNOT[1], F.alpha * (1 - pk), opt);
    if (!back && F.beat > 0.01) sprite(tinted(A.perch, [255, 170, 90]), x, y, wd, P.rot, P.mir, P.ys, KNOT[0], KNOT[1], 0.22 * F.beat * (1 - pk), { bloom: 0.9, blur: 5, g, op: 'lighter' });
  }
  if (pk > 0) sprite(A.flyer, x, y, wd, P.rot, P.mir, P.ys, KNOT[0], KNOT[1], F.alpha * pk, opt);
}

// ---------- the caporal: flute and drum on the tip, backlit by the sun
const TURN_T = [3.1, 5.3, 7.5];     // he turns to face the other directions while they fly
function caporal(t, cm, A, capA) {
  if (capA <= 0.003) return;
  const tip = proj(cm, 0, HP, 0);
  const lift = 0.45 * (1 - ease.out3((t - 0.98) / 0.5));           // he steps up onto the capstan
  // a lean into each drum beat, a bow as the flyers go, then an easy sway
  let rot = 0.03 * Math.sin(t * 3.1) * smooth(2.4, 3, t);
  BEATS.forEach((b, n) => { const u = (t - b + 0.05) / 0.32; if (u > 0 && u < 1) rot += (n % 2 ? 1 : -1) * 0.13 * Math.sin(Math.PI * u) * (1 - 0.3 * u); });
  const bow = Math.sin(Math.PI * clamp((t - T0 + 0.05) / 0.9));
  let ys = (1 + 0.012 * Math.sin(t * 6.2)) * (1 - 0.1 * bow);
  rot += 0.06 * bow;
  // slow turns: he narrows to profile and comes back facing the other way
  let face = 1, mag = 1;
  for (const tt of TURN_T) {
    const p = smooth(tt, tt + 0.9, t); if (p <= 0) break;
    if (p >= 1) { face = -face; continue; }
    const c = Math.cos(Math.PI * p); mag = 0.32 + 0.68 * Math.abs(c); if (c < 0) face = -face; break;
  }
  const cw = 2.5 * tip.s, x = tip.x, y = tip.y + 2 + lift * tip.s;
  // backlit rim: a warm glow hugging his outline, so he reads as standing against the sun
  sprite(tinted(A.cap, [255, 180, 110]), x, y, cw, rot, face * mag, ys, 262, 500, capA, { bloom: 0.75, blur: 3.5, main: false });
  sprite(A.cap, x, y, cw, rot, face * mag, ys, 262, 500, capA, { bloom: 0.3, blur: 8 });
  // flute notes: small warm sparks drifting from the flute
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let n = 0; n < 9; n++) {
    const age = ((t * 0.9 + n / 9) % 1), R = HG.rng(77 + n);
    const fx = tip.x + face * (-0.45 - age * 1.5 + (R() - 0.5) * 0.3) * tip.s, fy = tip.y - (1.95 + age * 1.1 + Math.sin(age * 6 + n) * 0.15) * tip.s;
    HG.dot(ctx, [255, 215, 140], fx, fy, 0.3 * tip.s, capA * 0.75 * Math.sin(Math.PI * age) * smooth(1.25, 1.5, t));
  }
  ctx.restore();
}

HG.start({
  duration: 12,
  assets: { flyer: '../assets/09-voladores-flyer.png', perch: '../assets/09-voladores-flyer-perch.png', cap: '../assets/09-voladores-caporal.png' },
  render(t, A) {
    const cm = camera(t);
    const end = smooth(10.85, 11.22, t);                   // frame and caporal go out as the fuse reaches the top
    const fuse = fuseAt(t);
    const grow = ease.out3((t - 0.18) / 0.95);
    const open = smooth(0.95, 1.45, t);
    const thF = PH0 + TURNS * TAU * prog((t - T0) / (T1 - T0));
    const beat = Math.max(...BEATS.map(b => Math.exp(-Math.pow((t - b - 0.03) / 0.08, 2))));

    // ---- flyers' current state, screen pose, and the hat offset that ties the trail to the drawn hat
    const flyers = [];
    for (let i = 0; i < 4; i++) {
      const F = flyer(i, t); F.i = i;
      F.P = screenFlyer(F, cm, t);
      F.front = side(cm, F.x, F.z) > 0;
      F.at = proj(cm, F.ax, F.ay, F.az);
      F.dis = smooth(TLAND, T1 + 0.12, t);                  // melting into the ground
      F.alpha = smooth(0.95, 1.25, t) * (1 - smooth(T1 - 0.12, T1 + 0.14, t));
      F.beat = beat * (1 - smooth(1.9, 2.05, t));
      F.dh = drawnHat(F.P); F.poleX = proj(cm, 0, F.y, 0).x;
      // tie offset, frozen once the landing starts
      const Fz = t > TLAND ? Object.assign(flyer(i, TLAND), { i }) : F;
      const Pz = t > TLAND ? screenFlyer(Fz, cm, TLAND) : F.P;
      const dz = drawnHat(Pz), hz = proj(cm, ...Fz.hat);
      F.hatOff = [dz[0] - hz.x, dz[1] - hz.y];
      flyers.push(F);
    }

    // ---- trails (back / front layers); after touch-down the spirals unwind from the top, the light
    // running down them into the ground
    const unwind = T0 - 0.6 + (T1 + 0.8 - T0 + 0.6) * smooth(9.4, 10.75, t);
    trails(t, cm, flyers, 1 - smooth(10.55, 11.0, t), unwind);
    sky(t, cm);
    bloomLayer(LB, { blur: 9, bloom: 0.75 });

    // ---- behind the pole
    const rope = (F) => {
      const a = (1 - smooth(T1 - 0.3, T1 + 0.2, t)) * smooth(T0, T0 + 0.3, t) * (F.front ? 0.75 : 0.45);
      glowLine([F.at, F.P.w], ROPE, 1.8, a, 4);
    };
    for (const F of flyers) if (!F.front) rope(F);
    petals(t, cm, false);
    // flyers behind the pole: solid figures, dimmed and tinted towards the dusk (depth), in their own layer
    if (flyers.some(F => !F.front && F.alpha > 0.003)) {
      const g = LK.ctx; clearL(LK);
      for (const F of flyers) if (!F.front) drawFlyer(F, A, g, true);
      g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(40,10,60,0.42)'; g.fillRect(0, 0, W, W); HG.reset(g);
      HG.drawLayer(ctx, LK);
    }
    frame(t, cm, open * (1 - end), thF, 'back');

    // ---- pole, frame, caporal
    pole(t, cm, grow, 1 - smooth(11.0, 11.25, t), fuse);
    embers(t, cm);
    frame(t, cm, open * (1 - end), thF, 'front');
    const capA = smooth(1.0, 1.3, t) * (1 - end);
    caporal(t, cm, A, capA);
    {
      // the caporal goes out in a last soft glint
      const tip = proj(cm, 0, HP, 0), gl = smooth(10.75, 10.95, t) * (1 - smooth(10.95, 11.35, t));
      if (gl > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; HG.dot(ctx, [255, 200, 140], tip.x, tip.y - 1.2 * tip.s, 2.4 * tip.s, 0.55 * gl); ctx.restore(); }
    }
    // three drum beats ring out from the top before the flyers jump
    for (const tb of BEATS) {
      const u = (t - tb) / 0.9; if (u <= 0 || u >= 1) continue;
      const pts = [], rr = lerp(0.6, 3.6, ease.out3(u));
      for (let k = 0; k <= 48; k++) { const a = k / 48 * TAU; pts.push(proj(cm, rr * Math.cos(a), HF + 0.3, rr * Math.sin(a))); }
      glowLine(pts, GOLD, 3, 0.7 * (1 - u), 6);
    }

    // ---- in front of the pole
    bloomLayer(LF, { blur: 9, bloom: 0.75 });
    for (const F of flyers) if (F.front) rope(F);
    petals(t, cm, true);
    for (const F of flyers) if (F.front) drawFlyer(F, A, ctx, false);
    // the beat twinkles on the flyers' hats
    if (beat > 0.01 && t < 2.05) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (const F of flyers) { const h = F.dh; HG.dot(ctx, [255, 220, 150], h[0], h[1], 0.8 * F.P.w.s, 0.6 * beat * (F.front ? 1 : 0.55) * F.alpha); }
      ctx.restore();
    }

    // ---- touch-down: each flyer melts into a glint, a ring of light on the ground and a puff of petals
    for (const F of flyers) {
      const fk = F.front ? 1 : 0.65;
      const gu = (t - (T1 - 0.2)) / 0.75;
      if (gu > 0 && gu < 1) {
        const h = F.dh, s = F.P.w.s, bell = Math.sin(Math.PI * Math.pow(gu, 0.6));
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        HG.dot(ctx, [255, 220, 170], h[0], h[1], 1.5 * s, 0.8 * bell * fk);
        HG.dot(ctx, [255, 150, 110], h[0], h[1], 4.2 * s, 0.3 * bell * fk);
        ctx.restore();
      }
      const u = (t - (T1 - 0.08)) / 1.7; if (u <= 0 || u >= 1) continue;
      const lx = F.hat[0], lz = F.hat[2];
      groundRing(cm, lx, lz, lerp(0.3, 2.9, ease.out3(u)), mix([255, 186, 110], [255, 110, 160], u), 0.95 * Math.pow(1 - u, 1.3) * fk);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const R = HG.rng(500 + F.i);
      for (let n = 0; n < 22; n++) {
        const a = R() * TAU, v = 1.2 + R() * 2.2, up = 1.5 + R() * 2.5, col = PETALS[Math.floor(R() * PETALS.length)];
        const e = ease.out3(u);
        const p = proj(cm, lx + Math.cos(a) * v * e, Math.max(0.05, 0.4 + up * e - 2.2 * u * u), lz + Math.sin(a) * v * e);
        HG.dot(ctx, col, p.x, p.y, 0.42 * p.s, (1 - smooth(0.4, 1, u)) * 0.9 * fk);
      }
      ctx.restore();
    }
  },
});
