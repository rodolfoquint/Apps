// Arbol de la Vida (Metepec, Estado de Mexico), at midday. A golden seed of light falls and lands at the
// foot of the circle; from it the tree GROWS: a trunk of light climbs and the branches unfurl along the real
// branches of the painted clay tree, the outer arches rising like the arms of a candelabra, little leaves of
// light sprouting along them and scrolls curling open at their tips. The painted clay floods in behind the
// light, following the same branches; the big clay flowers wait as glowing drawings and pop open one after
// another, root to crown, each with a sparkle. The crown flower opens last and the midday sun blooms behind
// it; four doves of light lift off from the clay doves and circle the tree in two mirrored orbits, passing in
// front of it and behind it; petals and colour sparks drift down; a sheen crosses the glaze. Ending: the
// colour recedes from the crown back down the branches, each flower releasing its petals into a swirl as the
// edge passes it, the branches of light fold back into the seed, and the seed goes out.
// Midday: when the crown flower opens, a gold Metepec-style sun (a ring of straight and flame rays, the

        ctx.strokeStyle = rgba(GOLD, 1); ctx.globalAlpha = 0.7 * (1 - u) * (r ? 0.6 : 1);
        ctx.lineWidth = 10; ctx.filter = HG.blur(5); ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.stroke();
        ctx.filter = 'none'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.stroke();
        ctx.restore();
      }
      const R = HG.rng(9);
      for (let j = 0; j < 12; j++) {
        const a = -Math.PI / 2 + (R() - 0.5) * 2.2, v = 120 + 160 * R(), u = lu / 0.9;
        if (u >= 1) continue;
        HG.dot(ctx, j % 2 ? GOLD : WARM, ROOT[0] + Math.cos(a) * v * u, ROOT[1] + Math.sin(a) * v * u + 160 * u * u, 13, 0.9 * (1 - u));
      }
    }
    const seedGlow = smooth(0.95, 1.15, t) * (1 - smooth(1.9, 2.8, t)) + bump(t, 10.4, 10.72, 10.82, 11.2);
    if (seedGlow > 0.003) {
      HG.dot(ctx, GOLD, ROOT[0], ROOT[1], 150, 0.45 * seedGlow);
      HG.dot(ctx, WARM, ROOT[0], ROOT[1], 34, 0.95 * seedGlow);
      star(ctx, ROOT[0], ROOT[1], 90, 0.7 * seedGlow, t);
    }
    ctx.restore();
  },
});
