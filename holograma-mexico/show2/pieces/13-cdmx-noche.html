// ---------- smooth keyframe curves (monotone cubic: no overshoot, continuous speed)
function curve(keys) {
  const n = keys.length, T = keys.map(k => k[0]), V = keys.map(k => k[1]), d = [], m = [0];
  for (let i = 0; i < n - 1; i++) d.push((V[i + 1] - V[i]) / (T[i + 1] - T[i]));
  for (let i = 1; i < n - 1; i++) {
    const h0 = T[i] - T[i - 1], h1 = T[i + 1] - T[i], w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
    m.push(d[i - 1] * d[i] <= 0 ? 0 : (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]));
  }
  m.push(0);
  return t => {
    if (t <= T[0]) return V[0]; if (t >= T[n - 1]) return V[n - 1];
    let i = 0; while (t > T[i + 1]) i++;
    const h = T[i + 1] - T[i], s = (t - T[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * V[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * V[i + 1] + (s3 - s2) * h * m[i + 1];
  };
}

  ctx.fillStyle = v; ctx.fillRect(0, 0, W, W);
  ctx.restore();
}

function drawBokeh(t, cam, f0, f1, a) {
  if (a <= 0) return;
  const h = 1 / 60, cp = camAt(t + h), cm = camAt(t - h), tOn = titleOn(t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    if (b.f < f0 || b.f > f1) continue;
    const lift = t > LIFT0 ? (Math.pow(t - LIFT0, 1.6) * 60 * b.up) : 0;
    const [x, y, z] = toS(cam, b.x, b.y - lift / Math.pow(cam.z, b.f), b.f);
    const size = b.s * Math.pow(z, 0.8);
    if (x < -size || x > W + size || y < -size || y > W + size) continue;
    const vx = (toS(cp, b.x, b.y, b.f)[0] - toS(cm, b.x, b.y, b.f)[0]) / (2 * h);
    const st = Math.min(2.2, 1 + Math.abs(vx) * 0.0016 * Math.sqrt(size / 20));
    let al = b.a * a * (0.72 + 0.28 * Math.sin(t * b.w + b.ph));
    al *= 1 - 0.55 * tOn * smooth(730, 850, y);
    al *= 1 - smooth(LIFT0 + 0.8, LIFT0 + 2.2, t + 0.3 * b.up);
    if (al <= 0.004) continue;
    ctx.globalAlpha = Math.min(1, al);
    ctx.drawImage(bokeh(b.col), x - size * st / 2, y - size / 2, size * st, size);
  }
  ctx.restore();
}

// long-exposure light trails around the Angel's roundabout; part = 'back' | 'front'
function trails(t, cam, part, a) {
  if (a <= 0) return;
  const [cx, cy] = aw(AO, 1488);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const car of CARS) {
    const ln = LANES[car.k], grow = smooth(0.15 + car.d * 0.5, 1.0 + car.d * 0.9, t);
    if (grow <= 0) continue;
    const rx = ln.r, ry = ln.r * 0.15, head = car.th - car.w * t, len = car.len * grow;
    const z = cam.z, steps = Math.ceil(len * rx * z / 3.2);
    for (let j = 0; j <= steps; j++) {
      const u = j / steps, th = head + u * len, sn = Math.sin(th);
      if ((part === 'front') !== (sn > 0)) continue;
      const [x, y] = toS(cam, cx + Math.cos(th) * rx, cy + sn * ry);
      if (y > W + 20 || y < -20) continue;
      const fall = Math.pow(1 - u, 1.6), size = (6 + 6 * fall) * Math.sqrt(z);
      HG.dot(ctx, ln.col, x, y, size, a * (0.15 + 0.75 * fall) * (sn > 0 ? 1 : 0.6));
    }
  }
  ctx.restore();
}

// the ring of light: lifts off the roundabout, contracts around the column and climbs it.
// part 'back' (the far half, drawn before the stone) or 'front'
const ringRx = yy => lerp((yy < 1000 ? halfAt(yy) : 40) + 16, 540, smooth(1000, 1488, yy));
function ring(t, cam, part, G) {
  const fy = frontY(t), beam = smooth(FY0, FY0 + 0.3, t);
  if (beam <= 0 || fy < 330) return;
  const ra = beam * (1 - smooth(470, 330, fy)) * G, lift = smooth(1000, 1488, fy);
  const c = ctx; angelSpace(c, cam); c.globalCompositeOperation = 'lighter'; c.strokeStyle = rgba(WARMW, 1); c.lineCap = 'round';
  const a0 = part === 'back' ? Math.PI : 0;
  for (const [dy, sc, aa] of [[0, 1, 1], [46, 0.92, 0.45], [96, 0.86, 0.2]]) {
    const yy = fy + dy * (1 - lift), hh = ringRx(yy) * sc, rr = hh * lerp(0.27, 0.15, smooth(1000, 1488, yy));
    for (const [w, bl, al] of [[30, 20, 0.6], [9, 0, 1]]) {
      c.lineWidth = w * sc; c.filter = bl ? HG.blur(bl * cam.z * SA) : 'none';
      c.globalAlpha = al * ra * aa * (part === 'back' ? 0.55 : 1);
      c.beginPath(); c.ellipse(AO, yy, hh, rr, 0, a0, a0 + Math.PI); c.stroke();
    }
  }
  c.filter = 'none'; HG.reset(c);
  if (part === 'front') {
    const [hx, hy, hz] = toS(cam, ...aw(AO, fy)), k = 1 - lift;
    HG.dot(ctx, GOLD, hx, hy, 60 * SA * hz * 6, 0.32 * ra * k); HG.dot(ctx, WARMW, hx, hy, 60 * SA * hz * 2.2, 0.4 * ra * k);
  }
}

function angel(t, cam, A, G) {
  // visible?
  const [axs] = toS(cam, 0, 0); if (axs < -500 * cam.z) return;
  const fy = frontY(t), beam = smooth(FY0, FY0 + 0.25, t);
  // moonlit stone, with a hint of floodlight
  const c = ctx;
  ring(t, cam, 'back', G);
  angelSpace(c, cam); c.globalAlpha = G; c.drawImage(A.night, 0, 0);
  c.globalAlpha = 0.07 * G; c.drawImage(A.lit, 0, 0);
  // floodlit below the climbing front (and a soft bloom)
  if (beam > 0) {
    clearL(L1); const l = L1.ctx; angelSpace(l, cam);
    l.drawImage(A.lit, 0, 0);
    l.globalCompositeOperation = 'lighter'; l.globalAlpha = 0.12; l.filter = HG.blur(9 * cam.z); l.drawImage(A.lit, 0, 0); l.filter = 'none';
    l.globalCompositeOperation = 'destination-in'; l.globalAlpha = 1;
    const g = l.createLinearGradient(0, fy - 50, 0, fy + 26);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
    l.fillStyle = g; l.fillRect(0, 0, 1536, 1536);
    baseDim(l);
    HG.drawLayer(ctx, L1, { alpha: 0.8 * G });
    // the band of light washing over the stone at the front
    const bandA = beam * (1 - smooth(FY1 - 0.35, FY1 + 0.1, t));
    if (bandA > 0) {
      clearL(L2); const m = L2.ctx; angelSpace(m, cam);
      m.drawImage(A.lit, 0, 0); m.globalCompositeOperation = 'source-in';
      const b = m.createLinearGradient(0, fy - 60, 0, fy + 90);
      b.addColorStop(0, 'rgba(255,240,215,0)'); b.addColorStop(0.4, 'rgba(255,246,228,1)');
      b.addColorStop(0.55, 'rgba(255,215,150,0.55)'); b.addColorStop(1, 'rgba(255,190,110,0)');
      m.fillStyle = b; m.fillRect(0, 0, 1536, 1536);
      baseDim(m);
      HG.drawLayer(ctx, L2, { alpha: bandA * G, op: 'lighter' });
    }
  }
  // the gilded Victory: ignites as the front passes, then flares
  const ign = smooth(320, 40, fy) * beam;
  const fl = bump(t, FLARE - 0.05, FLARE + 0.2, FLARE + 0.35, FLARE + 1.7);
  const glow = (0.3 * ign + 0.5 * fl + 0.15 * smooth(FLARE + 1, FLARE + 2.2, t)) * G;
  if (glow > 0) {
    angelSpace(c, cam); c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.34 * glow; c.filter = HG.blur(10 * cam.z * SA); c.drawImage(A.gold, 0, 0);
    c.globalAlpha = 0.2 * glow; c.filter = HG.blur(30 * cam.z * SA); c.drawImage(A.gold, 0, 0);
    c.filter = 'none'; c.globalAlpha = 0.1 * fl * G; c.drawImage(A.gold, 0, 0);
    HG.reset(c);
  }
  // wing echoes: the gilded silhouette pulses outward
  const E1 = echoSprite(A);
  for (const [t0, amp] of [[FLARE + 0.02, 1], [FLARE + 0.36, 0.75], [FLARE + 0.72, 0.5]]) {
    const k = (t - t0) / 1.1; if (k <= 0 || k >= 1) continue;
    const s = 1 + 0.75 * ease.out3(k), al = amp * 0.9 * Math.pow(1 - k, 1.3) * smooth(0, 0.08, k) * G;
    angelSpace(c, cam); c.translate(ECHO_C[0], ECHO_C[1]); c.scale(s, s); c.translate(-ECHO_C[0], -ECHO_C[1]);
    c.globalCompositeOperation = 'lighter'; c.globalAlpha = al; c.filter = HG.blur((1 + 5 * k) * cam.z * SA * s);
    c.drawImage(E1, SX0, SY0); c.filter = 'none';
  }
  HG.reset(c);
  // specular sheen sweeping diagonally across the gold
  const sk = (t - (FLARE + 0.15)) / 1.1;
  if (sk > 0 && sk < 1) {
    const s = scratch('spec', SW, SH), g = s.g;
    g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, SW, SH);
    const p = lerp(-160, SW + 160, ease.inOut3(sk));
    const lg = g.createLinearGradient(p - 70, -40, p + 70, 40);
    lg.addColorStop(0, 'rgba(255,250,235,0)'); lg.addColorStop(0.5, 'rgba(255,250,235,1)'); lg.addColorStop(1, 'rgba(255,250,235,0)');
    g.fillStyle = lg; g.fillRect(0, 0, SW, SH);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(A.gold, SX0, SY0, SW, SH, 0, 0, SW, SH);
    angelSpace(c, cam); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.7 * G * Math.sin(Math.PI * sk);
    c.drawImage(s.cv, SX0, SY0); HG.reset(c);
  }

  for (const s of RING_SPARKS) {
    const dt = t - s.te; if (dt < 0 || dt > 1.2) continue;
    const fye = frontY(s.te); if (fye > 1480 || fye < 330) continue;
    const hw = ringRx(fye);
    const ax = AO + Math.cos(s.a) * (hw + s.v * dt), ay = fye + Math.sin(s.a) * hw * 0.22 + 30 * dt + 70 * dt * dt;
    if (Math.sin(s.a) < -0.2 && hw < 120) continue;   // far side hidden by the column
    const [x, y, z] = toS(cam, ...aw(ax, ay));
    HG.dot(ctx, s.col, x, y, s.s * Math.sqrt(z), 0.85 * (1 - dt / 1.2) * (0.6 + 0.4 * Math.sin(dt * 18 + s.a)) * G);
  }

  for (const m of MOTES) {

    const ax = m.ax + m.vx * dt + Math.sin(dt * 2 + m.ph) * 6, ay = m.ay + m.vy * dt + 4 * dt * dt;
    const [x, y, z] = toS(cam, ...aw(ax, ay));
    const tw = 0.55 + 0.45 * Math.sin(dt * 7 + m.ph);
    HG.dot(ctx, m.col, x, y, m.s * Math.sqrt(z), 0.9 * tw * smooth(0, 0.2, dt) * (1 - smooth(1.4, 2.6, dt)) * G);
  }
  ctx.restore();
  // the laurel wreath sparkles, then lets go of the spark
  const wa = bump(t, FLARE + 0.3, FLARE + 0.7, SPARK0 - 0.1, SPARK0 + 0.25) * G;
  if (wa > 0) { const [x, y, z] = toS(cam, ...aw(...WREATH)); star(x, y, 70 * Math.sqrt(z) * (0.85 + 0.15 * Math.sin(t * 5)), wa, 0.4 * t); }
}

// a four-point star glint (two long rays, two short diagonals)
function star(x, y, r, a, rot = 0, col = GOLD_HI) {
  if (a <= 0.003) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x, y); ctx.rotate(rot);
  for (const [ang, len, th] of [[0, 1, 0.06], [Math.PI / 2, 1, 0.06], [Math.PI / 4, 0.48, 0.07], [-Math.PI / 4, 0.48, 0.07]]) {
    ctx.save(); ctx.rotate(ang); ctx.scale(1, th);
    const rr = r * len, g = ctx.createRadialGradient(0, 0, 0, 0, 0, rr);
    g.addColorStop(0, rgba(WHITE, a)); g.addColorStop(0.2, rgba(col, 0.7 * a)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.fill(); ctx.restore();
  }
  ctx.restore();
  HG.dot(ctx, col, x, y, r * 0.5, 0.7 * a); ctx.globalAlpha = 1;
}

// the spark's path: wreath -> over the city -> the eagle on the dome
function sparkAt(k) {
  const p0 = aw(...WREATH), p2 = bw(...EAGLE), p1 = [(p0[0] + p2[0]) / 2 - 40, (p0[1] + p2[1]) / 2 - 40];
  const u = 1 - k; return [u * u * p0[0] + 2 * u * k * p1[0] + k * k * p2[0], u * u * p0[1] + 2 * u * k * p1[1] + k * k * p2[1]];
}
const sparkK = t => ease.inOut3((t - SPARK0) / (SPARK1 - SPARK0));
function spark(t, cam, G) {
  if (t < SPARK0 - 0.05 || t > SPARK1 + 1.2) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // glitter left along the path
  const R = HG.rng(612);
  for (let i = 0; i < 70; i++) {
    const te = SPARK0 + 0.1 + (SPARK1 - SPARK0 - 0.15) * (i + R()) / 70, dt = t - te, ph = R() * TAU, s = 5 + 6 * R();
    if (dt < 0 || dt > 1.3) continue;
    const [wx, wy] = sparkAt(sparkK(te));
    const [x, y, z] = toS(cam, wx + Math.sin(ph) * 10 * dt, wy + 22 * dt + 30 * dt * dt);
    HG.dot(ctx, R() < 0.6 ? GOLD_HI : WARMW, x, y, s * 1.5, 0.8 * (1 - dt / 1.3) * (0.55 + 0.45 * Math.sin(dt * 16 + ph)) * G);
  }
  if (t <= SPARK1) {
    const k = sparkK(t);
    for (let j = 24; j >= 0; j--) {
      const kk = sparkK(t - j * 0.02); if (kk <= 0 && j > 0) continue;
      const [x, y, z] = toS(cam, ...sparkAt(Math.max(0, kk)));
      const f = 1 - j / 25;
      HG.dot(ctx, GOLD, x, y, (j ? 34 * f : 52), (j ? 0.6 * f : 1) * G);
    }
    const [x, y] = toS(cam, ...sparkAt(k));
    HG.dot(ctx, GOLD, x, y, 190, 0.3 * G);
    star(x, y, 110, 0.85 * G, t * 1.6);
  }
  ctx.restore();
}

function bellas(t, cam, A, G) {
  const [bxs] = toS(cam, BX, BY); if (bxs > W + 420 * cam.z) return;
  if (G <= 0) return;
  clearL(LB); const b = LB.ctx;
  // moonlit stone with faintly lit windows
  bellasSpace(b, cam); b.drawImage(A.bnight, 0, 0); b.globalAlpha = 0.06; b.drawImage(A.blit, 0, 0); b.globalAlpha = 1;
  // facade floods with warm light from the street up
  const fk = E(t, FACADE0, FACADE0 + 1.0), fyB = lerp(1000, -40, fk);
  if (fk > 0) {
    clearL(L1); const l = L1.ctx; bellasSpace(l, cam);
    l.drawImage(A.blit, 0, 0);
    l.globalCompositeOperation = 'lighter'; l.globalAlpha = 0.18; l.filter = HG.blur(8 * cam.z); l.drawImage(A.blit, 0, 0); l.filter = 'none';
    l.globalCompositeOperation = 'destination-in'; l.globalAlpha = 1;
    const g = l.createLinearGradient(0, fyB - 120, 0, fyB + 40); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
    l.fillStyle = g; l.fillRect(0, 0, 1024, 1024);
    HG.drawLayer(b, L1, { alpha: 0.9 });
  }
  // the dome fills with light from its crowning eagle down
  const dk = E(t, DOME0, DOME0 + 0.75), dy = lerp(40, 480, dk);
  if (dk > 0) {
    clearL(L2); const m = L2.ctx; bellasSpace(m, cam);
    m.drawImage(A.dome, 0, 0);
    m.globalCompositeOperation = 'lighter'; m.globalAlpha = 0.6; m.filter = HG.blur(10 * cam.z); m.drawImage(A.dome, 0, 0); m.filter = 'none';
    m.globalCompositeOperation = 'destination-in'; m.globalAlpha = 1;
    const g = m.createLinearGradient(0, dy - 60, 0, dy + 10); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    m.fillStyle = g; m.fillRect(0, 0, 1024, 1024);
    HG.drawLayer(b, L2, { op: 'lighter', alpha: 0.75 });
    // the light front glows as it pours down the ribs
    if (dk < 1) {
      clearL(L2); bellasSpace(m, cam); m.drawImage(A.dome, 0, 0); m.globalCompositeOperation = 'source-in';
      const h = m.createLinearGradient(0, dy - 50, 0, dy + 10); h.addColorStop(0, 'rgba(255,240,200,0)'); h.addColorStop(0.75, 'rgba(255,245,215,1)'); h.addColorStop(1, 'rgba(255,245,215,0)');
      m.fillStyle = h; m.fillRect(0, 0, 1024, 1024);
      HG.drawLayer(b, L2, { op: 'lighter', alpha: 0.8 * Math.sin(Math.PI * dk) });
    }
  }
  // a sheen runs across the dome's ribs
  const sk = (t - 8.75) / 1.2;
  if (sk > 0 && sk < 1) {
    const x0 = 140, y0 = 50, w = 760, h = 420, s = scratch('dome', w, h), g = s.g;
    g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, w, h);
    const p = lerp(-100, w + 100, ease.inOut3(sk));
    const lg = g.createLinearGradient(p - 60, 0, p + 60, 0);
    lg.addColorStop(0, 'rgba(255,248,225,0)'); lg.addColorStop(0.5, 'rgba(255,248,225,1)'); lg.addColorStop(1, 'rgba(255,248,225,0)');
    g.fillStyle = lg; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(A.dome, x0, y0, w, h, 0, 0, w, h);
    bellasSpace(b, cam); b.globalCompositeOperation = 'lighter'; b.globalAlpha = 0.65 * Math.sin(Math.PI * sk);
    b.drawImage(s.cv, x0, y0); HG.reset(b);
  }
  // the palace dissolves upward as its lights rise away
  const dis = E(t, DIS0, DIS1);
  if (dis > 0) {
    const yy = disY(t);
    // the stone turns to light at the dissolving edge
    bellasSpace(b, cam); b.globalCompositeOperation = 'source-atop';
    const hb = b.createLinearGradient(0, yy - 30, 0, yy + 190);
    hb.addColorStop(0, 'rgba(255,200,110,0)'); hb.addColorStop(0.45, 'rgba(255,215,140,0.75)'); hb.addColorStop(1, 'rgba(255,200,110,0)');
    b.fillStyle = hb; b.fillRect(-200, -200, 1424, 1424);
    b.globalCompositeOperation = 'destination-in';
    const g = b.createLinearGradient(0, yy - 40, 0, yy + 200);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = g; b.fillRect(-200, -200, 1424, 1424); HG.reset(b);
  }
  HG.drawLayer(ctx, LB, { alpha: G });
  // warm street glow at the palace's feet
  const [gx, gy, gz] = toS(cam, ...bw(560, 930));
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(gx, gy); ctx.scale(1, 0.16);
  const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, 420 * gz);
  const sa = 0.3 * G * (0.4 + 0.6 * smooth(FACADE0 - 0.2, FACADE0 + 0.6, t)) * (1 - dis);
  sg.addColorStop(0, rgba(AMBER, sa)); sg.addColorStop(0.5, rgba(GOLD, sa * 0.4)); sg.addColorStop(1, rgba(GOLD, 0));
  ctx.fillStyle = sg; ctx.fillRect(-420 * gz, -420 * gz, 840 * gz, 840 * gz); ctx.restore();
  // landing: a soft bloom and a ripple of light around the eagle
  const lk = (t - SPARK1) / 0.9;
  if (lk > 0 && lk < 1) {
    const [x, y, z] = toS(cam, ...bw(...EAGLE));
    HG.dot(ctx, GOLD, x, y, (60 + 120 * ease.out3(lk)) * z, 0.5 * (1 - lk) * G);
    star(x, y, 90 * z * (1 - 0.4 * lk), (1 - lk) * G, 0.3);
    const R = HG.rng(321);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 30; i++) {
      const a = -Math.PI * (0.05 + 0.9 * R()), v = (90 + 140 * R()) * z, dd = (1 - Math.exp(-3 * lk)) / 3;
      HG.dot(ctx, R() < 0.5 ? GOLD_HI : DOME, x + Math.cos(a) * v * dd * 1.6, y + Math.sin(a) * v * dd * 0.9 + 60 * lk * lk, 12, 0.8 * (1 - smooth(0.4, 1, lk)) * G);
    }
    ctx.restore();
  }
}

function fireflies(t, cam, G) {
  if (t < 8.9) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const f of FLIES) {
    const dt = t - f.te;
    const pre = smooth(-0.4, 0, dt);     // the light swells before lifting off
    if (dt < 0 && f.ph < 2.2) {          // meanwhile some windows twinkle softly
      const [x, y] = toS(cam, ...bw(f.bx, f.by));
      HG.dot(ctx, f.col, x, y, f.s * 0.9, 0.35 * smooth(8.9, 9.5, t) * Math.pow(0.5 + 0.5 * Math.sin(t * f.bl * 0.9 + f.ph * 3), 3) * (1 - pre) * G);
    }
    const d = Math.max(0, dt);
    const [wx, wy] = bw(f.bx, f.by);
    const x0 = wx + Math.sin(d * 1.3 + f.ph) * f.sw * smooth(0, 1, d), y0 = wy - f.v * d - f.acc * d * d;
    const [x, y, z] = toS(cam, x0, y0);
    const blink = 0.5 + 0.5 * Math.pow(0.5 + 0.5 * Math.sin(d * f.bl + f.ph), 2);
    const a = (dt < 0 ? 0.7 * pre : blink) * (1 - smooth(1.1, 2.1, d)) * G;
    HG.dot(ctx, f.col, x, y, f.s * Math.sqrt(z), a);
    HG.dot(ctx, f.col, x, y, f.s * 3.6 * Math.sqrt(z), 0.22 * a);
  }
  ctx.restore();
}

HG.start({

  assets: {
    lit: '../assets/13-cdmx-noche-angel.png', night: '../assets/13-cdmx-noche-angel_night.png', gold: '../assets/13-cdmx-noche-angel_gold.png', edge: '../assets/13-cdmx-noche-angel_edge.png',

  render(t, A) {

    sky(t, cam, smooth(0.15, 1.3, t) * (1 - smooth(10.4, 11.8, t)));
    drawBokeh(t, cam, 0, 0.7, smooth(0.2, 1.4, t));
    const ta = smooth(0.2, 0.8, t) * (1 - 0.6 * titleOn(t)) * (1 - smooth(6.2, 7.2, t));
    const stages = [
      () => trails(t, cam, 'back', ta),
      () => angel(t, cam, A, smooth(0.25, 1.2, t) * (1 - smooth(7.0, 8.0, t))),
      () => trails(t, cam, 'front', ta),
      () => bellas(t, cam, A, smooth(5.9, 7.0, t)),
      () => spark(t, cam, 1),
      () => fireflies(t, cam, 1),
      () => drawBokeh(t, cam, 1, 2, smooth(0.6, 1.8, t)),
    ];
    for (const f of stages) { HG.reset(ctx); f(); }
    // keep the lower band soft while the title is shown
    const tb = titleOn(t);
    if (tb > 0) {
      HG.reset(ctx); const g = ctx.createLinearGradient(0, 730, 0, 1060);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${0.5 * tb})`);
      ctx.fillStyle = g; ctx.fillRect(0, 730, W, 350);
    }
    // master fade (start from black, end in black)
    HG.reset(ctx); const k = fin * fout;
    if (k < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - k})`; ctx.fillRect(0, 0, W, W); }
  },
});
</script></body></html>
