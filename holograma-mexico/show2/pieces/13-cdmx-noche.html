// One golden light travels through the night city. The city wakes in a deep-blue night: bokeh
// lights twinkle, long-exposure car trails circle the Angel's roundabout on Reforma, and the
// monument stands in moonlit blue. A ring of light climbs the slender white column, floodlighting
// the marble as it rises while the camera cranes up with it; it reaches the gilded Victory, who
// ignites: her wings flare (clean golden echoes of both wings ripple outward from her shoulders
// over a soft gold aura, a specular sheen sweeps the gold, the laurel wreath sparkles). While the
// camera pulls back a spark leaves the wreath and arcs across the night sky; the monument sinks
// into the night from the ground up and the camera sweeps with the spark through a warm haze of
// city lights to the Palacio de Bellas Artes, still in moonlit blue, standing in a bed of street
// lamps and traffic. The spark lands on the dome's crowning eagle: the orange-and-gold tiled dome
// fills with light from the top, the marble facade floods with warm light from the street, the
// lamps of the esplanade switch on, a sheen runs across the dome while the camera pushes in.
// Finally the city's lights lift off as fireflies while the palace dissolves upward; the eagle
// is the last light to rise, with a small glint.

// ---------- smooth keyframe curves (monotone cubic: no overshoot, continuous speed)
function curve(keys) {
  const n = keys.length, T = keys.map(k => k[0]), V = keys.map(k => k[1]), d = [], m = [0];
  for (let i = 0; i < n - 1; i++) d.push((V[i + 1] - V[i]) / (T[i + 1] - T[i]));
  for (let i = 1; i < n - 1; i++) {
    const h0 = T[i] - T[i - 1], h1 = T[i + 1] - T[i], w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
    m.push(d[i - 1] * d[i] <= 0 ? 0 : (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]));
  }
  m.push(0);
  return t => {
    if (t <= T[0]) return V[0]; if (t >= T[n - 1]) return V[n - 1];
    let i = 0; while (t > T[i + 1]) i++;
    const h = T[i + 1] - T[i], s = (t - T[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * V[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * V[i + 1] + (s3 - s2) * h * m[i + 1];

}

const SPR_K = Math.max(1, HG.S);
const bokehCache = new Map();
function bokeh(col) {

  const g = s.getContext('2d'), h = n / 2, grd = g.createRadialGradient(h, h, 0, h, h, h);

  grd.addColorStop(0.84, rgba(mix(col, WHITE, 0.2), 0.82)); grd.addColorStop(0.93, rgba(col, 0.3)); grd.addColorStop(1, rgba(col, 0));

}
// a soft glow dot without the white-hot core: overlapping ones read as one continuous streak

    const g = s.getContext('2d'), h = n / 2, grd = g.createRadialGradient(h, h, 0, h, h, h);

// scratch canvases for sheens clipped to an image region (fully redrawn every frame), at the

const SCR = {}, SQ = Math.max(1, Math.ceil(HG.S));

function sky(t, cam, a) {

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(C, hz, 0, C, hz, 820);

  g.addColorStop(0.62, rgba([12, 24, 92], 0.32 * a)); g.addColorStop(1, rgba([4, 8, 40], 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);

function haze(t, cam, a) {
  if (a <= 0) return;
  const tOn = titleOn(t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const h of HAZE) {
    const [x, y, z] = toS(cam, h.x, h.y, 0.5);
    const rx = h.rx * z, ry = h.ry * z;
    if (x < -rx || x > W + rx) continue;
    const al = h.a * a * (0.85 + 0.15 * Math.sin(t * 0.9 + h.ph)) * (1 - 0.75 * tOn * smooth(700, 820, y));
    if (al <= 0.003) continue;
    ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0, rgba(h.col, al)); g.addColorStop(0.45, rgba(h.col, al * 0.45)); g.addColorStop(1, rgba(h.col, 0));
    ctx.fillStyle = g; ctx.fillRect(-rx, -rx, 2 * rx, 2 * rx); ctx.restore();

function drawBokeh(t, cam, f0, f1, a) {
  if (a <= 0) return;
  const h = 1 / 60, cp = camAt(t + h), cm = camAt(t - h), tOn = titleOn(t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    if (b.f < f0 || b.f > f1) continue;
    const lift = t > LIFT0 ? (Math.pow(t - LIFT0, 1.6) * 60 * b.up) : 0;
    const [x, y, z] = toS(cam, b.x, b.y - lift / Math.pow(cam.z, b.f), b.f);
    const size = b.s * Math.pow(z, 0.8);
    if (x < -size || x > W + size || y < -size || y > W + size) continue;
    const vx = (toS(cp, b.x, b.y, b.f)[0] - toS(cm, b.x, b.y, b.f)[0]) / (2 * h);
    const st = Math.min(2.2, 1 + Math.abs(vx) * 0.0016 * Math.sqrt(size / 20));
    let al = b.a * a * (0.72 + 0.28 * Math.sin(t * b.w + b.ph));

    al *= 1 - smooth(LIFT0 + 0.8, LIFT0 + 2.2, t + 0.3 * b.up);
    if (al <= 0.004) continue;
    ctx.globalAlpha = Math.min(1, al);
    ctx.drawImage(bokeh(b.col), x - size * st / 2, y - size / 2, size * st, size);

// long-exposure light trails around the Angel's roundabout; part = 'back' | 'front'
function trails(t, cam, part, a) {
  if (a <= 0) return;
  const [cx, cy] = aw(AO, 1488);
  X.save(); X.globalCompositeOperation = 'lighter';
  for (const car of CARS) {
    const ln = LANES[car.k], grow = smooth(0.15 + car.d * 0.5, 1.0 + car.d * 0.9, t);
    if (grow <= 0) continue;
    const rx = ln.r, ry = ln.r * 0.15, head = car.th - car.w * t, len = car.len * grow;
    const z = cam.z, steps = Math.ceil(len * rx * z / 2.2);

      const [x, y] = toS(cam, cx + Math.cos(th) * rx, cy + sn * ry);

// a smooth path through the points (quadratic curves through the midpoints)
function smoothPath(c, P, closed) {
  const n = P.length / 2, px = i => P[2 * (i % n)], py = i => P[2 * (i % n) + 1];
  c.beginPath();
  if (closed) {
    c.moveTo((px(0) + px(1)) / 2, (py(0) + py(1)) / 2);
    for (let i = 1; i <= n; i++) c.quadraticCurveTo(px(i), py(i), (px(i) + px(i + 1)) / 2, (py(i) + py(i + 1)) / 2);
    c.closePath(); return;
  }
  c.moveTo(px(0), py(0));
  for (let i = 1; i < n - 1; i++) c.quadraticCurveTo(px(i), py(i), (px(i) + px(i + 1)) / 2, (py(i) + py(i + 1)) / 2);
  c.lineTo(px(n - 1), py(n - 1));
}

function angel(t, cam, A) {
  // visible?

  c.globalAlpha = 0.07; c.drawImage(A.lit, 0, 0); c.globalAlpha = 1;
  // floodlit below the climbing front (and a soft bloom)

    clearL(L1); const l = L1.ctx; angelSpace(l, cam);
    l.drawImage(A.lit, 0, 0);
    l.globalCompositeOperation = 'lighter'; l.globalAlpha = 0.12; l.filter = HG.blur(9 * cam.z); l.drawImage(A.lit, 0, 0); l.filter = 'none';
    l.globalCompositeOperation = 'destination-in'; l.globalAlpha = 1;

      b.addColorStop(0.55, 'rgba(255,215,150,0.55)'); b.addColorStop(1, 'rgba(255,190,110,0)');
      m.fillStyle = b; m.fillRect(0, 0, 1536, 1536);

    }
  }

  const ign = smooth(320, 40, fy) * beam;
  const fl = bump(t, FLARE - 0.05, FLARE + 0.2, FLARE + 0.35, FLARE + 1.7);
  const glow = 0.3 * ign + 0.5 * fl + 0.15 * smooth(FLARE + 1, FLARE + 2.2, t);
  if (glow > 0) {
    angelSpace(c, cam); c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.34 * glow; c.filter = HG.blur(10 * cam.z * SA); c.drawImage(A.gold, 0, 0);
    c.globalAlpha = 0.2 * glow; c.filter = HG.blur(30 * cam.z * SA); c.drawImage(A.gold, 0, 0);
    c.filter = 'none'; c.globalAlpha = 0.1 * fl; c.drawImage(A.gold, 0, 0);
    HG.reset(c);
  }

    lg.addColorStop(0, 'rgba(255,226,160,0)'); lg.addColorStop(0.5, 'rgba(255,236,186,1)'); lg.addColorStop(1, 'rgba(255,226,160,0)');
    g.fillStyle = lg; g.fillRect(0, 0, SW, SH);

    if (Math.sin(s.a) < -0.2 && hw < 120) continue;   // far side hidden by the column
    const [x, y, z] = toS(cam, ...aw(ax, ay));

    const [x, y, z] = toS(cam, ...aw(ax, ay));

    HG.dot(X, m.col, x, y, m.s * Math.sqrt(z), 0.9 * tw * smooth(0, 0.2, dt) * (1 - smooth(1.4, 2.6, dt)));

}

// the Angel's whole stage on its own layer: the stone sinks into the night under the title band

function angelStage(t, cam, A, GA) {

    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, `rgba(0,0,0,${0.55 * tb})`); g.addColorStop(1, `rgba(0,0,0,${0.93 * tb})`);
    l.fillStyle = g; l.fillRect(0, 700, W, 400);

// a four-point star glint (two long rays, two short diagonals)
function star(c, x, y, r, a, rot = 0, col = GOLD_HI) {
  if (a <= 0.003) return;
  c.save(); c.globalCompositeOperation = 'lighter'; c.translate(x, y); c.rotate(rot);
  for (const [ang, len, th] of [[0, 1, 0.06], [Math.PI / 2, 1, 0.06], [Math.PI / 4, 0.48, 0.07], [-Math.PI / 4, 0.48, 0.07]]) {
    c.save(); c.rotate(ang); c.scale(1, th);
    const rr = r * len, g = c.createRadialGradient(0, 0, 0, 0, 0, rr);
    g.addColorStop(0, rgba(WHITE, a)); g.addColorStop(0.2, rgba(col, 0.7 * a)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, rr, 0, TAU); c.fill(); c.restore();
  }
  c.restore();
  c.save(); c.globalCompositeOperation = 'lighter'; HG.dot(c, col, x, y, r * 0.5, 0.7 * a); c.restore();
}

// the spark's path: wreath -> over the city -> the eagle on the dome
function sparkAt(k) {
  const p0 = aw(...WREATH), p2 = bw(...EAGLE), p1 = [(p0[0] + p2[0]) / 2 - 40, (p0[1] + p2[1]) / 2 - 40];
  const u = 1 - k; return [u * u * p0[0] + 2 * u * k * p1[0] + k * k * p2[0], u * u * p0[1] + 2 * u * k * p1[1] + k * k * p2[1]];
}
const sparkK = t => ease.inOut3((t - SPARK0) / (SPARK1 - SPARK0));
function spark(t, cam) {
  if (t < SPARK0 - 0.05 || t > SPARK1 + 1.8) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // glitter left along the path
  for (const g of GLITTER) {
    const dt = t - g.te; if (dt < 0 || dt > g.life) continue;
    const k = sparkK(g.te), [wx, wy] = sparkAt(k), [ux, uy] = sparkAt(Math.min(1, k + 0.01));
    let nx = -(uy - wy), ny = ux - wx; const nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
    const [x, y, z] = toS(cam, wx + nx * g.off + g.vx * dt + Math.sin(g.ph + dt * 3) * 5, wy + ny * g.off + g.vy * dt + 28 * dt * dt);
    const tw = 0.5 + 0.5 * Math.sin(dt * g.tw + g.ph);
    HG.dot(ctx, g.col, x, y, g.s * 1.5, 0.85 * Math.pow(1 - dt / g.life, 1.2) * smooth(0, 0.08, dt) * (0.35 + 0.65 * tw));
  }
  if (t <= SPARK1) {
    const k = sparkK(t);
    // comet tail: one continuous tapered streak (soft dots packed closer than their size, with
    // alpha scaled by the spacing so the density is even at any speed: no bead chain)
    const TR = 0.48, P = [];
    for (let j = 0; j <= 48; j++) { const tt = t - TR * j / 48; if (tt < SPARK0) break; P.push([...toS(cam, ...sparkAt(sparkK(tt))), 1 - j / 48]); }
    for (let i = P.length - 1; i > 0; i--) {
      const [x0, y0, , f0] = P[i], [x1, y1, , f1] = P[i - 1], len = Math.hypot(x1 - x0, y1 - y0);
      const n = Math.max(1, Math.ceil(len / 2));
      for (let q = 0; q < n; q++) {
        const u = q / n, f = lerp(f0, f1, u), size = 8 + 30 * Math.pow(f, 1.3), step = len / n;
        softDot(ctx, f > 0.6 ? GOLD_HI : GOLD, lerp(x0, x1, u), lerp(y0, y1, u), size, Math.min(0.5, 1.9 * Math.pow(f, 1.6) * Math.max(step, 0.6) / size));
      }
    }
    const [x, y] = toS(cam, ...sparkAt(k));
    HG.dot(ctx, GOLD, x, y, 52, 1);
    HG.dot(ctx, GOLD, x, y, 190, 0.3);
    star(ctx, x, y, 110, 0.85, t * 1.6);
  }
  ctx.restore();
}

// the bed of city lights the palace stands in: a level ground glow, esplanade lamps, street lamps
// and out-of-focus lights, and traffic streaks on the avenue in front
function cityBed(t, cam, G, dis) {
  if (G <= 0) return;
  const on = smooth(FACADE0 - 0.3, FACADE0 + 0.9, t), fade = 1 - smooth(DIS0, DIS0 + 0.7, t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // ground glow (level, wide) and a fainter haze filling the space below the palace
  for (const [sy, rx, ry, a0, a1, col] of [[700, 600, 150, 0.12, 0.22, AMBER], [714, 470, 62, 0.34, 0.62, AMBER], [722, 300, 34, 0.25, 0.45, GOLD_HI]]) {
    const [gx, gy, gz] = toS(cam, ...bedW(540, sy));
    const al = G * lerp(a0, a1, on) * fade;
    ctx.save(); ctx.translate(gx, gy); ctx.scale(1, ry / rx);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx * gz);
    g.addColorStop(0, rgba(col, al)); g.addColorStop(0.5, rgba(col, al * 0.45)); g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g; ctx.fillRect(-rx * gz, -rx * gz, 2 * rx * gz, 2 * rx * gz); ctx.restore();
  }
  // lamps: dim before, switching on in a wave, then lifting off as fireflies
  for (const p of LAMPS) {
    const sw = smooth(p.on, p.on + 0.35, t), dt = t - p.lift;
    const pre = 0.28 + 0.72 * sw + 0.5 * bump(t, p.on, p.on + 0.12, p.on + 0.15, p.on + 0.6);
    const d = Math.max(0, dt);
    const [wx, wy] = bedW(p.sx, p.sy);
    const [x, y, z] = toS(cam, wx + Math.sin(d * 1.3 + p.ph) * p.sw * smooth(0, 1, d), wy - p.v * d - p.acc * d * d);
    const blink = dt > 0 ? 0.55 + 0.45 * Math.pow(0.5 + 0.5 * Math.sin(d * p.bl + p.ph), 2) : 0.85 + 0.15 * Math.sin(t * p.bl + p.ph);
    const shrink = dt > 0 ? lerp(1, 0.45, smooth(0, 0.5, d)) : 1;
    const a = G * p.a * pre * blink * (1 - smooth(1.0, 2.0, d));
    if (a <= 0.004) continue;
    if (p.s > 30) {   // out-of-focus foreground lights simply go out
      const [bx, by, bz] = toS(cam, wx, wy), s = p.s * bz, ab = G * p.a * pre * (1 - smooth(p.lift - 0.2, p.lift + 0.5, t));
      if (ab > 0.004) { ctx.globalAlpha = Math.min(1, ab); ctx.drawImage(bokeh(p.col), bx - s / 2, by - s / 2, s, s); }
      continue;
    }
    { HG.dot(ctx, p.col, x, y, p.s * shrink * Math.sqrt(z) * 1.5, a); HG.dot(ctx, p.col, x, y, p.s * shrink * Math.sqrt(z) * 4, 0.18 * a); }
  }
  // traffic streaks: continuous gradient strokes (tail fades out), soft glow underneath
  const edge = sx => smooth(110, 230, sx) * (1 - smooth(850, 970, sx));
  ctx.lineCap = 'round';
  for (const c of TRAFFIC) {
    const span = 1300, xh = -100 + ((c.x0 + c.dir * c.v * t) % span + span) % span, xt = xh - c.dir * c.len;
    const [hx, hy, z] = toS(cam, ...bedW(xh, c.y)), [tx, ty] = toS(cam, ...bedW(xt, c.y));
    // softer where they near the title (the push-in carries the avenue toward the band)
    const A = G * on * fade * 0.6 * (1 - 0.65 * titleOn(t) * smooth(740, 810, hy));
    if (A <= 0.004 || edge(xh) + edge(xt) + edge((xh + xt) / 2) <= 0.004) continue;
    const g = ctx.createLinearGradient(hx, hy, tx, ty);
    for (let k = 0; k <= 8; k++) { const u = k / 8; g.addColorStop(u, rgba(c.col, A * edge(xh - c.dir * u * c.len) * (0.06 + 0.94 * Math.pow(1 - u, 1.6)))); }
    ctx.strokeStyle = g;
    ctx.globalAlpha = 0.7; ctx.lineWidth = 13 * Math.sqrt(z); ctx.filter = HG.blur(5);
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.lineWidth = 4 * Math.sqrt(z);
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
    HG.dot(ctx, c.dir < 0 ? WARMW : TAIL, hx, hy, 16 * Math.sqrt(z), 0.55 * A * edge(xh));
  }
  ctx.restore();
}

function bellas(t, cam, A, G) {
  const [bxs] = toS(cam, BX, BY); if (bxs > W + 420 * cam.z) return;
  if (G <= 0) return;
  clearL(LB); const b = LB.ctx;
  // moonlit stone with faintly lit windows
  bellasSpace(b, cam); b.drawImage(A.bnight, 0, 0); b.globalAlpha = 0.06; b.drawImage(A.blit, 0, 0); b.globalAlpha = 1;
  // facade floods with warm light from the street up

  if (fk > 0) {
    clearL(L1); const l = L1.ctx; bellasSpace(l, cam);
    l.drawImage(A.blit, 0, 0);

    l.globalCompositeOperation = 'destination-in'; l.globalAlpha = 1;
    const g = l.createLinearGradient(0, fyB - 120, 0, fyB + 40); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');

    m.drawImage(A.dome, 0, 0);
    m.globalCompositeOperation = 'lighter'; m.globalAlpha = 0.4; m.filter = HG.blur(10 * cam.z); m.drawImage(A.dome, 0, 0); m.filter = 'none';
    m.globalCompositeOperation = 'destination-in'; m.globalAlpha = 1;
    const g = m.createLinearGradient(0, dy - 60, 0, dy + 10); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');

      const h = m.createLinearGradient(0, dy - 50, 0, dy + 10); h.addColorStop(0, 'rgba(255,240,200,0)'); h.addColorStop(0.75, 'rgba(255,245,215,1)'); h.addColorStop(1, 'rgba(255,245,215,0)');

    const p = lerp(-200, w + 200, ease.inOut3(sk));
    const lg = g.createLinearGradient(p - 130, -60, p + 130, 60);
    lg.addColorStop(0, 'rgba(255,246,220,0)'); lg.addColorStop(0.35, 'rgba(255,236,190,0.55)'); lg.addColorStop(0.5, 'rgba(255,250,232,1)');
    lg.addColorStop(0.65, 'rgba(255,236,190,0.55)'); lg.addColorStop(1, 'rgba(255,246,220,0)');
    g.fillStyle = lg; g.fillRect(0, 0, w, h);
    g.globalCompositeOperation = 'destination-in'; g.drawImage(A.dome, x0, y0, w, h, 0, 0, w, h);
    bellasSpace(b, cam); b.globalCompositeOperation = 'lighter'; b.globalAlpha = 0.9 * Math.sin(Math.PI * sk);
    b.drawImage(s.cv, x0, y0, w, h); HG.reset(b);

    const hb = b.createLinearGradient(0, yy - 30, 0, yy + 190);
    hb.addColorStop(0, 'rgba(255,190,90,0)'); hb.addColorStop(0.45, 'rgba(255,196,96,0.8)'); hb.addColorStop(1, 'rgba(255,186,84,0)');
    b.fillStyle = hb; b.fillRect(-200, -200, 1424, 1424);
    b.globalCompositeOperation = 'destination-in';
    const g = b.createLinearGradient(0, yy - 40, 0, yy + 200);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    b.fillStyle = g; b.fillRect(-200, -200, 1424, 1424); HG.reset(b);
  }
  // a level ground line: the palace's feet sink softly into the city lights
  bellasSpace(b, cam); b.globalCompositeOperation = 'destination-out';
  const gl = b.createLinearGradient(0, 728, 0, 880);
  gl.addColorStop(0, 'rgba(0,0,0,0)'); gl.addColorStop(0.3, 'rgba(0,0,0,0.12)'); gl.addColorStop(0.6, 'rgba(0,0,0,0.6)'); gl.addColorStop(1, 'rgba(0,0,0,1)');
  b.fillStyle = gl; b.fillRect(-300, 728, 1624, 700); HG.reset(b);
  // the dome's crown and lantern go with the last of the dome (no grey stub left behind) while
  // the eagle swells into the last firefly
  HG.drawLayer(ctx, LB, { alpha: G * (1 - smooth(EAGLE_T - 0.16, EAGLE_T + 0.08, t)) });
  cityBed(t, cam, G, dis);
  // landing: a soft bloom and a ripple of light around the eagle
  const lk = (t - SPARK1) / 0.9;
  if (lk > 0 && lk < 1) {
    const [x, y, z] = toS(cam, ...bw(...EAGLE));
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    HG.dot(ctx, GOLD, x, y, (60 + 120 * ease.out3(lk)) * z, 0.5 * (1 - lk) * G);
    ctx.restore();
    star(ctx, x, y, 90 * z * (1 - 0.4 * lk), (1 - lk) * G, 0.3);
    const R = HG.rng(321);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 30; i++) {
      const a = -Math.PI * (0.05 + 0.9 * R()), v = (90 + 140 * R()) * z, dd = (1 - Math.exp(-3 * lk)) / 3;
      HG.dot(ctx, R() < 0.5 ? GOLD_HI : DOME, x + Math.cos(a) * v * dd * 1.6, y + Math.sin(a) * v * dd * 0.9 + 60 * lk * lk, 12, 0.8 * (1 - smooth(0.4, 1, lk)) * G);
    }
    ctx.restore();
  }
}

function fireflies(t, cam) {
  if (t < 8.9) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const f of FLIES) {
    const dt = t - f.te;
    const pre = smooth(-0.4, 0, dt);     // the light swells before lifting off
    if (dt < 0 && f.ph < 2.2) {          // meanwhile some windows twinkle softly
      const [x, y] = toS(cam, ...bw(f.bx, f.by));
      HG.dot(ctx, f.col, x, y, f.s * 0.9, 0.35 * smooth(8.9, 9.5, t) * Math.pow(0.5 + 0.5 * Math.sin(t * f.bl * 0.9 + f.ph * 3), 3) * (1 - pre));
    }
    const d = Math.max(0, dt);
    const [wx, wy] = bw(f.bx, f.by);
    const x0 = wx + Math.sin(d * 1.3 + f.ph) * f.sw * smooth(0, 1, d), y0 = wy - f.v * d - f.acc * d * d;
    const [x, y, z] = toS(cam, x0, y0);
    const blink = 0.5 + 0.5 * Math.pow(0.5 + 0.5 * Math.sin(d * f.bl + f.ph), 2);
    const a = (dt < 0 ? 0.7 * pre : blink) * (1 - smooth(1.1, 2.1, d));
    HG.dot(ctx, f.col, x, y, f.s * Math.sqrt(z), a);
    HG.dot(ctx, f.col, x, y, f.s * 3.6 * Math.sqrt(z), 0.22 * a);
  }
  // the eagle is the last light: it swells, lifts off brightest of all with a small glint
  const d = t - EAGLE_T;
  if (d > -0.45 && d < 1.5) {
    const dd = Math.max(0, d), [wx, wy] = bw(...EAGLE);
    const [x, y, z] = toS(cam, wx + Math.sin(dd * 1.6) * 10 * dd, wy - 6 - 70 * dd - 50 * dd * dd);
    const a = smooth(-0.45, 0, d) * (1 - smooth(0.7, 1.5, d));
    HG.dot(ctx, GOLD, x, y, 46 * Math.sqrt(z), 0.9 * a);
    HG.dot(ctx, GOLD, x, y, 150 * Math.sqrt(z), 0.22 * a);
    ctx.restore();
    star(ctx, x, y, 62 * Math.sqrt(z) * (0.6 + 0.4 * bump(d, -0.2, 0.15, 0.3, 0.9)), 0.8 * a * bump(d, -0.3, 0.1, 0.5, 1.3), 0.5 + 0.8 * dd);
    return;
  }
  ctx.restore();
}

HG.start({
  duration: 12,
  assets: {
    lit: '../assets/13-cdmx-noche-angel.png', night: '../assets/13-cdmx-noche-angel_night.png', gold: '../assets/13-cdmx-noche-angel_gold.png',
    blit: '../assets/13-cdmx-noche-bellas_gilt.png', bnight: '../assets/13-cdmx-noche-bellas_nightf.png', dome: '../assets/13-cdmx-noche-bellas_dome2.png',
  },
  render(t, A) {
    const cam = camAt(t);
    const fin = Math.sin(Math.PI / 2 * clamp(t / 1.0)), fout = 1 - smooth(11.0, 11.8, t);
    sky(t, cam, smooth(-0.4, 1.1, t) * (1 - smooth(10.4, 11.8, t)));
    haze(t, cam, (0.3 * smooth(0.0, 1.6, t) + 0.85 * bump(t, 5.6, 6.6, 7.7, 8.8)) * (1 - smooth(10.0, 11.4, t)));
    drawBokeh(t, cam, 0, 0.7, smooth(-0.3, 1.1, t));
    const stages = [
      () => angelStage(t, cam, A, smooth(0.0, 1.0, t) * (1 - smooth(6.35, 6.85, t))),
      () => bellas(t, cam, A, 0.85 * smooth(6.85, 7.75, t) + 0.15 * smooth(7.6, 8.3, t)),
      () => spark(t, cam),
      () => fireflies(t, cam),
      () => drawBokeh(t, cam, 1, 2, smooth(0.6, 1.8, t)),
    ];
    for (const f of stages) { HG.reset(ctx); f(); }
    // keep the lower band soft while the title is shown
    const tb = titleOn(t);
    if (tb > 0) {
      HG.reset(ctx); const g = ctx.createLinearGradient(0, 760, 0, 1060);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${0.5 * tb})`);
      ctx.fillStyle = g; ctx.fillRect(0, 760, W, 320);
    }
    // master fade (start from black, end in black)
    HG.reset(ctx); const k = fin * fout;
    if (k < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - k})`; ctx.fillRect(0, 0, W, W); }
  },
});
</script></body></html>
