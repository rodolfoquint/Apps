// Mariachi at sunset. A big soft sun sinks behind the band, turning from orange to rose to magenta.
// A silver flower opens at the foot of the circle and two needles of light stitch a charro seam up both
// sides: rows of silver botonadura (round conchos with a rosette, in pairs) between embroidered scrolls.
// The instruments arrive one per beat (violin, trumpet, vihuela, guitar) and on the first downbeat the
// guitarron, the band's big bass, booms in behind them in warm line-light. Then the son jalisciense: the
// whole band rocks from side to side over each two-bar phrase and hops on every downbeat, the guitarron
// pumps and sends a wave out of its sound hole, and two glints run up the silver seam to meet at the top.
// The trumpet calls (it glides to the centre, big, its bell blazing a double fan of gold rays, while the
// others step back into the dusk), the violin answers (it takes the centre, the bow flying, rosin
// glittering), then the band turns: everyone crosses to the other side, flipping like dancers changing
// places, and swings on in the mirrored formation. On the closing "tan" they all freeze in a stab pose;
// on "tan!" they flash and a clockwise sweep turns everything into silver sparkles that swirl outward,
// the same way the Jarabe Tapatio's skirt twirls open next.

      const p = at(f), q = at(f + 0.002), tang = Math.atan2(q[1] - p[1], q[0] - p[0]);

    }
    { const k = smooth(SW0 + 0.35, SW0 + 0.8, t); if (k > 0) {     // whatever is left (fading rings) goes with them
      HG.reset(b); b.globalCompositeOperation = 'destination-out'; b.globalAlpha = k; b.fillStyle = '#000'; b.fillRect(0, 0, W, W); HG.reset(b); } }
    { const age = t - HIT2; if (age > 0 && age < 1.2) {            // the last hit: one silver ring from the guitarron
      const q = age / 1.2; b.save(); b.globalCompositeOperation = 'lighter';
      ringStroke(b, ...groupPt(G, ghx, ghy), 70 + 380 * ease.out3(q), SIL, 0.55 * Math.pow(1 - q, 1.3), 6 * (1 - q) + 2); b.restore(); } }
    bloomLayer(FXB, 9, 0.75, 1);

    // ---------- soloist halo: the trumpets call, the violins answer
    for (const [k, col] of [['trompeta', GOLD], ['violin', ROSE]]) {
      const h = P[k].solo; if (h <= 0.003 || out >= 1) continue;
      const [x, y] = groupPt(G, P[k].x, P[k].y), r = 300 * (1 + 0.08 * Math.min(1, P[k].e));
      softGlow(ctx, x, y, r, col, 0.2 * h * (1 - out));
    }

    // ---------- the band, back to front (the soloist and whoever crosses in front come last)
    const hit = t0 => { const d = t - t0; return d < -0.05 ? 0 : smooth(-0.05, 0, d) * Math.exp(-Math.max(0, d) / 0.28); };
    const hits = 0.4 * hit(HIT1) + 0.6 * hit(HIT2);
    const g = clearL(BAND);
    g.save(); applyGroup(g, G); g.imageSmoothingQuality = 'high'; g.lineCap = 'round';
    const bowAlpha = smooth(INST.violin.entry, INST.violin.entry + 0.25, t);
    const turnLit = bump(t, SWAP0, SWAP0 + 0.25, SWAP1 - 0.25, SWAP1);
    for (const k of ORDER.slice().sort((a, c) => P[a].zz - P[c].zz)) {
      const Pk = P[k], I = INST[k];
      if (Pk.a <= 0.003 || sw >= 1) continue;
      const fa = Pk.a, br = Pk.bright;
      g.save(); g.translate(Pk.x, Pk.y); g.rotate(Pk.rot); g.scale(Pk.s * Pk.fx, Pk.s * Pk.sy);
      g.globalAlpha = fa;
      if (br < 0.995) g.filter = `brightness(${br.toFixed(3)})`;
      g.drawImage(T[k], -I.w / 2, -I.w / 2, I.w, I.w);
      g.filter = 'none';
      // silver rim light: brighter on the accents, on arrival, for a solo, while turning and on the closing hits
      const enter = Pk.p > 0 ? Math.exp(-Pk.p * 2.2) : 0;
      const rim = (0.12 + 0.3 * Math.min(1, Pk.e) + 0.9 * enter + 0.8 * hits + 0.25 * Pk.solo + 0.7 * turnLit * (1 - Math.abs(Pk.fx))) * fa * br;
      g.globalCompositeOperation = 'lighter';
      if (rim > 0.003) { g.globalAlpha = Math.min(1, rim); g.drawImage(A[k + 'L'], -I.w / 2, -I.w / 2, I.w, I.w); }
      if (STR[k]) {
        // strings blur into vibrating spindles on each strum; the sound hole glows
        const S = STR[k], es = env(t, I.strum, 0.22, 0.03), sc = I.w / 1024;
        g.save(); g.scale(sc, sc); g.translate(-512, -512);
        S.xb.forEach((xb, i) => {
          const xn = S.xn[i], amp = (1 + 5 * Math.min(1.3, es)) * (1 + 0.12 * i), pts = [];
          for (let j = 0; j <= 16; j++) { const k2 = j / 16; pts.push([lerp(xb, xn, k2), lerp(S.yb, S.yn, k2), Math.sin(Math.PI * (0.08 + 0.84 * k2)) * amp]); }
          g.beginPath();
          pts.forEach(([x, y, a], j) => j ? g.lineTo(x + a, y) : g.moveTo(x + a, y));
          for (let j = pts.length - 1; j >= 0; j--) g.lineTo(pts[j][0] - pts[j][2], pts[j][1]);
          g.closePath(); g.globalAlpha = fa * br * 0.13 * Math.min(1, es); g.fillStyle = rgba(HOT, 1); g.fill();
          g.globalAlpha = fa * br * (0.05 + 0.3 * Math.min(1, es)); g.strokeStyle = rgba(HOT, 1); g.lineWidth = 1.3 / (Pk.s * sc);
          g.beginPath(); g.moveTo(xb, S.yb); g.lineTo(xn, S.yn); g.stroke();
        });
        const [hx, hy, hr] = HOLE[k], eh = env(t, I.acc, 0.35);
        const hgr = g.createRadialGradient(hx, hy, 0, hx, hy, hr * 1.05);
        const hc = k === 'vihuela' ? [255, 90, 170] : [255, 150, 60];
        hgr.addColorStop(0, rgba([255, 190, 140], 0.7)); hgr.addColorStop(0.55, rgba(hc, 0.55)); hgr.addColorStop(1, rgba(hc, 0));
        g.globalAlpha = fa * br * (0.15 + 0.6 * Math.min(1, eh)); g.fillStyle = hgr;
        g.beginPath(); g.arc(hx, hy, hr * 1.05, 0, TAU); g.fill();
        g.restore();
      }
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
      if (k === 'violin') {
        g.translate(0, (BOWY - 512) * I.w / 1024); g.rotate(bowAng(tp));
        if (br < 0.995) g.filter = `brightness(${br.toFixed(3)})`;
        drawBow(g, I.w * 0.98, bowU(tp), bowAlpha);
        g.filter = 'none';
      }
      g.restore();
    }
    g.restore();
    const hitF = t0 => { const d = t - t0; return d < -0.04 ? 0 : smooth(-0.04, 0, d) * Math.exp(-Math.max(0, d) / 0.2); };
    const flash = 0.07 * hitF(HIT1) + 0.12 * hitF(HIT2);
    if (CR) {
      HG.reset(g); g.globalCompositeOperation = 'source-atop';      // each point flares silver just before it goes
      for (const c of CR) { const d = t - c.ts; if (d > -0.06 && d < 0.02) HG.dot(g, SIL, c.x, c.y, c.rad * 1.4, 0.16 * smooth(-0.06, -0.01, d)); }
      g.globalCompositeOperation = 'destination-out'; g.globalAlpha = 1;
      const E = eraser();
      for (const c of CR) { const d = t - c.ts; if (d > 0) { const r = c.rad * 1.35 * ease.out3(d / 0.09); g.drawImage(E, c.x - r, c.y - r, 2 * r, 2 * r); } }
      HG.reset(g);
    }
    sweepMask(g, t, 0.05, 0.1);
    bloomLayer(BAND, 16, 0.28 + 0.5 * flash, 1, 'source-over');
    if (flash > 0.01) HG.drawLayer(ctx, BAND, { alpha: flash, op: 'lighter' });

    // ---------- in front: trumpet rays and rosin dust
    const f = clearL(FXF);
    f.globalCompositeOperation = 'lighter'; f.lineCap = 'round'; f.lineJoin = 'round';
    f.save(); applyGroup(f, G);
    {
      const Pt = P.trompeta, k = 'trompeta';
      if (Pt.a > 0.01 && out < 1) {
        const [bx, by] = apt(k, Pt, BELL[0], BELL[1]), [ax2, ay2] = apt(k, Pt, BELL[0] + Math.cos(BELL_AXIS) * 100, BELL[1] + Math.sin(BELL_AXIS) * 100);
        const ax = Math.atan2(ay2 - by, ax2 - bx), solo = Pt.solo, edge = Math.abs(Pt.fx);
        const e = (Math.min(1.5, Pt.e) + 0.7 * (Pt.p > 0 ? Math.exp(-Pt.p * 2.5) : 0)) * Pt.bright * edge;
        const R = HG.rng(5), fa = Pt.a * (1 - out), n = 11 + Math.round(10 * solo), spread = 1.2 + 0.35 * solo;
        for (let i = 0; i < 21; i++) {
          const a = ax + (i / Math.max(1, n - 1) - 0.5) * spread + (R() - 0.5) * 0.07, L0 = 150 + 150 * R(), wv = 8 + 7 * R(), tw = R();
          if (i >= n) continue;
          const L = L0 * (0.3 + 0.7 * Math.min(1.4, e)) * (1 + 0.7 * solo);
          const al = (0.08 + 0.62 * Math.min(1, e)) * fa * (1 + 0.45 * solo) * (0.65 + 0.35 * Math.sin(t * 6 + i * 2.1 + tw));
          if (al < 0.01) continue;
          const r0 = 34 * Pt.s, sx = bx + Math.cos(a) * r0, sy = by + Math.sin(a) * r0;
          let Lr = L;                                            // keep the rays inside the circle
          for (let j = 0; j < 8; j++) { const [gx, gy] = groupPt(G, sx + Math.cos(a) * Lr, sy + Math.sin(a) * Lr); if (Math.hypot(gx - C, gy - C) < 400) break; Lr *= 0.86; }
          const ex = sx + Math.cos(a) * Lr, ey = sy + Math.sin(a) * Lr, nx = -Math.sin(a), ny = Math.cos(a), w1 = wv * Lr / L0;
          const gr = f.createLinearGradient(sx, sy, ex, ey), am = Math.min(0.75, al);
          gr.addColorStop(0, rgba(GOLD, 0)); gr.addColorStop(0.18, rgba(GOLD, am)); gr.addColorStop(0.45, rgba(GOLD, am * 0.6));
          gr.addColorStop(0.78, rgba(ORA, am * 0.25)); gr.addColorStop(1, rgba(ORA, 0));
          f.fillStyle = gr; f.globalAlpha = 1;
          f.beginPath(); f.moveTo(sx + nx * 1.5, sy + ny * 1.5); f.lineTo(ex + nx * w1, ey + ny * w1); f.lineTo(ex - nx * w1, ey - ny * w1); f.lineTo(sx - nx * 1.5, sy - ny * 1.5); f.closePath(); f.fill();
        }
        // the bell's flare and a soft gold glow (no white core)
        f.save(); f.translate(bx, by); f.rotate(ax + Math.PI / 2);
        const s = INST.trompeta.w * Pt.s / 1024;
        f.globalAlpha = Math.min(1, 0.25 + 0.5 * e) * fa * edge; f.strokeStyle = rgba(GOLD, 1); f.lineWidth = 4.5;
        f.beginPath(); f.ellipse(0, 0, 150 * s, 48 * s * edge, 0, 0, TAU); f.stroke();
        f.restore();
        softGlow(f, bx, by, 70 + 50 * Math.min(1.3, e), GOLD, (0.08 + 0.22 * Math.min(1, e)) * fa);
        for (const a of INST.trompeta.acc) {                      // a sound ring leaving the bell on each accent
          const age = t - a.t; if (age < 0 || age > 0.7 || a.t > HIT2 - 0.01) continue;
          const q = age / 0.7, d = 24 + 80 * ease.out3(q) * (1 + 0.5 * solo), rx = bx + Math.cos(ax) * d, ry = by + Math.sin(ax) * d;
          const [gx, gy] = groupPt(G, rx, ry), keep = 1 - smooth(330, 405, Math.hypot(gx - C, gy - C));
          f.save(); f.translate(rx, ry); f.rotate(ax + Math.PI / 2);
          f.globalAlpha = 0.6 * Math.pow(1 - q, 1.5) * fa * Pt.bright * edge * keep; f.strokeStyle = rgba(GOLD, 1); f.lineWidth = 3.5;
          f.beginPath(); f.ellipse(0, 0, (150 + 90 * q) * s, (48 + 30 * q) * s * edge, 0, 0, TAU); f.stroke(); f.restore();
        }
      }
    }
    // violin: rosin dust glitters off the bow hair as it strokes (twice as much in its solo)
    if (P.violin.a > 0.01) {
      const DT = 1 / 60;
      for (let j = Math.floor((t - 1.1) / DT); j <= Math.floor(t / DT); j++) {
        const te = j * DT, age = t - te;
        if (te < INST.violin.entry + 0.05 || age < 0 || te > HIT2 + 0.05) continue;
        const R = HG.rng(j * 7919 + 13); R();
        const B = bowState(te), sp = Math.abs(B.v), so = B.P.solo;
        const reps = so > 0.3 ? 2 : 1;
        for (let r = 0; r < reps; r++) {
          if (R() > clamp(sp * 1.4) * 0.95 * B.P.bright) { R(); R(); R(); R(); R(); R(); R(); continue; }
          const along = (R() - 0.5) * 170 * B.P.s, dirv = Math.sign(B.v) || 1;
          const x0 = B.x + Math.cos(B.a) * along, y0 = B.y + Math.sin(B.a) * along;
          const vx = Math.cos(B.a) * dirv * (90 + 150 * R()) + (R() - 0.5) * 80, vy = -140 - 170 * R() * (1 + 0.4 * so);
          const k = (1 - Math.exp(-2.2 * age)) / 2.2;
          const x = x0 + vx * k, y = y0 + vy * k - 12 * age * age;
          const a = Math.pow(1 - age / 1.1, 1.4) * smooth(0, 0.06, age) * (0.6 + 0.4 * Math.sin(t * 17 + j + r));
          const col = R() < 0.25 ? ROSE : (R() < 0.35 ? GOLD : SIL);
          HG.dot(f, col, x, y, 13 + 10 * R(), Math.min(1, 1.3 * a) * (1 - out));
        }
      }
    }
    f.restore();
    bloomLayer(FXF, 8, 0.6, 1);

    // ---------- entrance glints (the guitarron lands with a wider one)
    for (const k of ORDER) {
      const I = INST[k], d = t - I.entry;
      if (d < -0.25 || d > 0.6) continue;
      const [x, y] = groupPt(G, I.x, I.y), u = (d + 0.25) / 0.85;
      star(ctx, x, y, 220 * Math.sin(Math.PI * Math.pow(u, 0.7)), 0.7 * Math.sin(Math.PI * u), u);
    }

    // ---------- finale: as the sweep passes, every point of the band leaves as a comet swirling clockwise
    if (t > SW0 - 0.02 && SAMPLES) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const GB = G, SWIRL = [SIL, SIL, HOT, ROSE, GOLD, RGOLD];
      const comet = (x0, y0, ts, v, swl, life, sz, col, tw) => {
        const dt0 = t - ts; if (dt0 < 0 || dt0 > life) return;
        const r0 = Math.hypot(x0 - SWC[0], y0 - SWC[1]), a0 = Math.atan2(y0 - SWC[1], x0 - SWC[0]);
        const fade = (1 - smooth(life * 0.4, life, dt0)) * smooth(0, 0.05, dt0) * (0.7 + 0.3 * Math.sin(t * 11 + tw)) * fadeAll;
        for (let j = 0; j < 5; j++) {
          const dt = Math.max(0, dt0 - j * 0.035);
          const rr = r0 + v * (1 - Math.exp(-2.4 * dt)) / 2.4, aa = a0 + swl * (1 - Math.exp(-1.5 * dt)) / 1.5;
          const x = SWC[0] + Math.cos(aa) * rr, y = SWC[1] + Math.sin(aa) * rr;
          const edge = 1 - smooth(470, 525, Math.hypot(x - C, y - C));
          HG.dot(ctx, j === 0 ? col : SIL, x, y, sz * (1 - j * 0.15), fade * edge * (j ? 0.45 * (1 - j / 5) : 1));
        }
      };
      if (CR) CR.forEach((c, i) => {
        if (!c.emit) return;
        const R = HG.rng(i * 613 + 5), r0 = Math.hypot(c.x - SWC[0], c.y - SWC[1]);
        const col = R() < 0.4 ? c.col : SWIRL[Math.floor(R() * SWIRL.length)];
        comet(c.x, c.y, c.ts - 0.01, (90 + 220 * R()) * (0.7 + r0 / 500), 1.0 + 0.7 * R(), 0.9 + 0.6 * R(), 13 + 9 * R(), col, R() * TAU);
      });
      if (FCR) FCR.forEach((c, i) => {                            // the seam and the guitarron go too
        if (!c.emit) return;
        const R = HG.rng(i * 389 + 11), r0 = Math.hypot(c.x - SWC[0], c.y - SWC[1]), vine = r0 > 400;
        comet(c.x, c.y, c.ts - 0.01, vine ? 25 + 45 * R() : 50 + 90 * R(), vine ? 0.45 + 0.25 * R() : 0.7 + 0.3 * R(), 0.6 + 0.5 * R(), 12 + 6 * R(), c.col, R() * TAU);
      });
      ctx.restore();
    }
  },
});
