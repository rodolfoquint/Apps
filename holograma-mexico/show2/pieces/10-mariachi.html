// Mariachi at sunset. A silver flower blooms at the foot of the circle and a vine of silver thread,
// like the embroidery on a charro suit, is stitched up both sides around the band while the
// instruments arrive one per beat (violin, trumpet, vihuela, guitar), each popping in with a ring of
// sound. Then they play together in the sesquialtera of the son jalisciense (a 6/8 bar answered by a
// 3/4 bar): everything hops and sways in sync, the violin's bow strokes back and forth shedding
// glittering rosin, the trumpet's bell blazes gold rays, the vihuela and guitar strum (strings
// vibrate, sound holes glow and ring out waves of sunset light), and each big wave makes the silver
// vine shimmer as it passes. Trumpets call and violins answer, the band swells, and on the closing
// "tan-tan!" every instrument flashes and bursts into silver sparkles that swirl away like a
// twirling skirt (the Jarabe Tapatio comes next).

HG.start({

      if (meet > 0 && meet < 1) star(b, C, C - VR, 170 * Math.sin(Math.PI * Math.pow(meet, 0.6)), 0.9 * Math.sin(Math.PI * meet), meet * 0.8);
    }
    bloomLayer(FXB, 9, 0.85, 1);

    // ---------- soloist halo: the trumpets call, the violins answer
    for (const [k, bar, col] of [['trompeta', CALL, GOLD], ['violin', ANSWER, ROSE]]) {
      const h = smooth(bar[0] - 0.25, bar[0] + 0.2, t) * (1 - smooth(bar[1] - 0.3, bar[1] + 0.15, t));
      if (h <= 0.003) continue;
      const [x, y] = groupPt(G, P[k].x, P[k].y), r = 270 * (1 + 0.08 * Math.min(1, P[k].e));
      const hg = ctx.createRadialGradient(x, y, 0, x, y, r);
      hg.addColorStop(0, rgba(col, 0.32 * h)); hg.addColorStop(0.5, rgba(col, 0.12 * h)); hg.addColorStop(1, rgba(col, 0));
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = hg; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
    }

    // ---------- the band, back to front; each instrument carries its own rim light, strings and sound hole
    // (drawn in the same layer, so an instrument in front hides them)
    const hit = t0 => { const d = t - t0; return d < -0.05 ? 0 : smooth(-0.05, 0, d) * Math.exp(-Math.max(0, d) / 0.28); };
    const hits = 0.6 * hit(HIT1) + 1.0 * hit(HIT2);
    const g = clearL(BAND);
    g.save(); applyGroup(g, G); g.imageSmoothingQuality = 'high'; g.lineCap = 'round';
    const bowAlpha = smooth(INST.violin.entry, INST.violin.entry + 0.25, t) * (1 - out);
    for (const k of ORDER) {
      const Pk = P[k], I = INST[k];
      if (Pk.a <= 0.003 || out >= 1) continue;
      const fa = Pk.a * (1 - out);
      g.save(); g.translate(Pk.x, Pk.y); g.rotate(Pk.rot); g.scale(Pk.s, Pk.s);
      g.globalAlpha = fa;
      g.drawImage(T[k], -I.w / 2, -I.w / 2, I.w, I.w);
      // silver rim light: brighter on the accents, on arrival, for a solo and on the closing hits
      const enter = Pk.p > 0 ? Math.exp(-Pk.p * 2.2) : 0;
      const rim = (0.12 + 0.3 * Math.min(1, Pk.e) + 0.9 * enter + 0.8 * hits + 0.25 * Pk.solo) * fa * fadeAll;
      g.globalCompositeOperation = 'lighter';
      if (rim > 0.003) { g.globalAlpha = Math.min(1, rim); g.drawImage(A[k + 'L'], -I.w / 2, -I.w / 2, I.w, I.w); }
      if (STR[k]) {
        // strings blur into vibrating spindles on each strum; the sound hole glows
        const S = STR[k], es = env(t, I.strum, 0.22, 0.03), sc = I.w / 1024;
        g.save(); g.scale(sc, sc); g.translate(-512, -512);
        S.xb.forEach((xb, i) => {
          const xn = S.xn[i], amp = (1 + 5 * Math.min(1.3, es)) * (1 + 0.12 * i), pts = [];
          for (let j = 0; j <= 16; j++) { const k2 = j / 16; pts.push([lerp(xb, xn, k2), lerp(S.yb, S.yn, k2), Math.sin(Math.PI * (0.08 + 0.84 * k2)) * amp]); }
          g.beginPath();
          pts.forEach(([x, y, a], j) => j ? g.lineTo(x + a, y) : g.moveTo(x + a, y));
          for (let j = pts.length - 1; j >= 0; j--) g.lineTo(pts[j][0] - pts[j][2], pts[j][1]);
          g.closePath(); g.globalAlpha = fa * 0.13 * Math.min(1, es); g.fillStyle = rgba(HOT, 1); g.fill();
          g.globalAlpha = fa * (0.05 + 0.3 * Math.min(1, es)); g.strokeStyle = rgba(HOT, 1); g.lineWidth = 1.3 / (Pk.s * sc);
          g.beginPath(); g.moveTo(xb, S.yb); g.lineTo(xn, S.yn); g.stroke();
        });
        const [hx, hy, hr] = HOLE[k], eh = env(t, I.acc, 0.35);
        const hgr = g.createRadialGradient(hx, hy, 0, hx, hy, hr * 1.05);
        const hc = k === 'vihuela' ? [255, 90, 170] : [255, 150, 60];
        hgr.addColorStop(0, rgba([255, 200, 150], 0.75)); hgr.addColorStop(0.55, rgba(hc, 0.6)); hgr.addColorStop(1, rgba(hc, 0));
        g.globalAlpha = fa * (0.15 + 0.6 * Math.min(1, eh)); g.fillStyle = hgr;
        g.beginPath(); g.arc(hx, hy, hr * 1.05, 0, TAU); g.fill();
        g.restore();
      }
      g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
      if (k === 'violin') {
        g.translate(0, (BOWY - 512) * I.w / 1024); g.rotate(bowAng(t));
        drawBow(g, I.w * 0.98, bowU(t), bowAlpha);
      }
      g.restore();
    }
    g.restore();
    const hitF = t0 => { const d = t - t0; return d < -0.04 ? 0 : smooth(-0.04, 0, d) * Math.exp(-Math.max(0, d) / 0.2); };
    const flash = 0.18 * hitF(HIT1) + 0.32 * hitF(HIT2);
    bloomLayer(BAND, 16, 0.3 + 0.5 * flash, 1, 'source-over');
    if (flash > 0.01) HG.drawLayer(ctx, BAND, { alpha: flash, op: 'lighter' });

    // ---------- in front: trumpet rays and rosin dust
    const f = clearL(FXF);
    f.globalCompositeOperation = 'lighter'; f.lineCap = 'round'; f.lineJoin = 'round';
    f.save(); applyGroup(f, G);
    // trumpet: gold rays from the bell on its accents
    {
      const Pt = P.trompeta, k = 'trompeta';
      if (Pt.a > 0.01 && out < 1) {
        const [bx, by] = apt(k, Pt, BELL[0], BELL[1]), ax = BELL_AXIS + Pt.rot;
        const call = inBar(t, CALL) ? 1.3 : (inBar(t, ANSWER) ? 0.55 : 1);
        const e = Math.min(1.5, Pt.e) * call + 0.7 * (Pt.p > 0 ? Math.exp(-Pt.p * 2.5) : 0);
        const R = HG.rng(5), fa = Pt.a * (1 - out);
        for (let i = 0; i < 11; i++) {
          const a = ax + (i / 10 - 0.5) * 1.2 + (R() - 0.5) * 0.07, L = (150 + 150 * R()) * (0.3 + 0.7 * Math.min(1.4, e)), wv = 9 + 7 * R();
          const al = (0.1 + 0.8 * Math.min(1, e)) * fa * (0.65 + 0.35 * Math.sin(t * 6 + i * 2.1));
          if (al < 0.01) continue;
          const sx = bx + Math.cos(a) * 22, sy = by + Math.sin(a) * 22;
          let ex = sx + Math.cos(a) * L, ey = sy + Math.sin(a) * L;
          const [gx, gy] = groupPt(G, ex, ey), er = Math.hypot(gx - C, gy - C);
          if (er > 515) { const k2 = Math.max(0.2, 1 - (er - 515) / L); ex = sx + Math.cos(a) * L * k2; ey = sy + Math.sin(a) * L * k2; }
          const nx = -Math.sin(a) * wv, ny = Math.cos(a) * wv;
          const gr = f.createLinearGradient(sx, sy, ex, ey);
          gr.addColorStop(0, rgba(GOLD, al)); gr.addColorStop(0.3, rgba(GOLD, al * 0.75)); gr.addColorStop(0.7, rgba(ORA, al * 0.35)); gr.addColorStop(1, rgba(ORA, 0));
          f.fillStyle = gr; f.globalAlpha = 1;
          f.beginPath(); f.moveTo(sx + nx, sy + ny); f.lineTo(ex, ey); f.lineTo(sx - nx, sy - ny); f.closePath(); f.fill();
        }
        f.save(); f.translate(bx, by); f.rotate(ax + Math.PI / 2);
        const s = INST.trompeta.w * Pt.s / 1024;
        f.globalAlpha = Math.min(1, 0.3 + 0.6 * e) * fa; f.strokeStyle = rgba(GOLD, 1); f.lineWidth = 5;
        f.beginPath(); f.ellipse(0, 0, 150 * s, 48 * s, 0, 0, TAU); f.stroke();
        f.restore();
        HG.dot(f, GOLD, bx, by, 70 + 60 * Math.min(1.3, e), 0.3 * Math.min(1, e) * fa);
      }
    }
    // violin: rosin dust glitters off the bow hair as it strokes
    if (P.violin.a > 0.01) {
      const DT = 1 / 60;
      for (let j = Math.floor((t - 1.1) / DT); j <= Math.floor(t / DT); j++) {
        const te = j * DT, age = t - te;
        if (te < INST.violin.entry + 0.05 || age < 0 || te > HIT2 + 0.05) continue;
        const R = HG.rng(j * 7919 + 13); R();
        const B = bowState(te), sp = Math.abs(B.v);
        if (R() > clamp(sp * 1.4) * 0.95) continue;
        const along = (R() - 0.5) * 160, dirv = Math.sign(B.v) || 1;
        const x0 = B.x + Math.cos(B.a) * along, y0 = B.y + Math.sin(B.a) * along;
        const vx = Math.cos(B.a) * dirv * (90 + 150 * R()) + (R() - 0.5) * 80, vy = -140 - 170 * R();
        const k = (1 - Math.exp(-2.2 * age)) / 2.2;
        const x = x0 + vx * k, y = y0 + vy * k - 12 * age * age;
        const a = Math.pow(1 - age / 1.1, 1.4) * smooth(0, 0.06, age) * (0.6 + 0.4 * Math.sin(t * 17 + j));
        const col = R() < 0.25 ? ROSE : (R() < 0.35 ? GOLD : SIL);
        HG.dot(f, col, x, y, 13 + 10 * R(), Math.min(1, 1.4 * a) * (1 - out));
      }
    }
    f.restore();
    bloomLayer(FXF, 8, 0.85, 1);

    // ---------- entrance glints
    for (const k of ORDER) {
      const I = INST[k], d = t - I.entry;
      if (d < -0.25 || d > 0.6) continue;
      const [x, y] = groupPt(G, I.x, I.y), u = (d + 0.25) / 0.85;
      star(ctx, x, y, 260 * Math.sin(Math.PI * Math.pow(u, 0.7)), 0.8 * Math.sin(Math.PI * u), u);
    }

    // ---------- finale: every instrument bursts into comet sparkles that swirl away like a twirling skirt
    const bt = t - HIT2;
    if (bt > -0.02 && SAMPLES) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const GB = group(HIT2), SWIRL = [SIL, SIL, HOT, ROSE, GOLD, LAV];
      const comet = (x0, y0, r0, a0, v, sw, life, sz, col, tw, delay) => {
        const dt0 = bt - delay; if (dt0 < 0 || dt0 > life) return;
        const fade = (1 - smooth(life * 0.4, life, dt0)) * smooth(0, 0.06, dt0) * (0.7 + 0.3 * Math.sin(t * 11 + tw));
        for (let j = 0; j < 5; j++) {
          const dt = Math.max(0, dt0 - j * 0.035);
          const rr = r0 + v * (1 - Math.exp(-2.4 * dt)) / 2.4, aa = a0 + sw * (1 - Math.exp(-1.5 * dt)) / 1.5;
          const x = PIV[0] + Math.cos(aa) * rr, y = PIV[1] + Math.sin(aa) * rr;
          const edge = 1 - smooth(480, 530, Math.hypot(x - C, y - C));
          HG.dot(ctx, j === 0 ? col : SIL, x, y, sz * (1 - j * 0.15), fade * edge * (j ? 0.45 * (1 - j / 5) : 1));
        }
      };
      for (const k of ORDER) {
        const Pb = pose(k, HIT2), d = SAMPLES[k], R = HG.rng(k.length * 31 + 7);
        for (let i = 0; i < d.length; i += 15) {                  // every third sample
          const [x0, y0] = groupPt(GB, ...apt(k, Pb, d[i] * 2 + 1, d[i + 1] * 2 + 1));
          const r0 = Math.hypot(x0 - PIV[0], y0 - PIV[1]), a0 = Math.atan2(y0 - PIV[1], x0 - PIV[0]);
          const own = [d[i + 2], d[i + 3], d[i + 4]], pick = SWIRL[Math.floor(R() * SWIRL.length)];
          const col = R() < 0.4 ? own : pick;
          comet(x0, y0, r0, a0, (90 + 230 * R()) * (0.7 + r0 / 500), 1.0 + 0.7 * R(), 1.0 + 0.75 * R(), 13 + 9 * R(), col, R() * TAU, R() * 0.12);
        }
      }
      const R = HG.rng(99);                                       // the vine unravels into sparkles too
      for (const H of VINE) for (let i = 6; i < H.stem.length; i += 24) {
        const p = H.stem[i], a0 = Math.atan2(p[1] - PIV[1], p[0] - PIV[0]), r0 = Math.hypot(p[0] - PIV[0], p[1] - PIV[1]);
        comet(p[0], p[1], r0, a0, 25 + 35 * R(), 0.45 + 0.2 * R(), 0.6 + 0.4 * R(), 12 + 5 * R(), R() < 0.4 ? LAV : SIL, R() * TAU, 0.04 + R() * 0.12);
      }
      ctx.restore();
      const gk = clamp(bt / 0.7);
      star(ctx, ...groupPt(GB, PIV[0], PIV[1] - 40), 420 * Math.sin(Math.PI * gk), 0.75 * Math.sin(Math.PI * gk), 0.3 + bt * 0.5);
    }
  },
});
</script></body></html>
