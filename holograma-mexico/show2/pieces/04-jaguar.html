// El jaguar (morning, Selva Lacandona). The cenote's fireflies drift into a wall of jungle leaves
// (monstera, platanillo and palm leaves, heliconia flowers: plants native to the selva of Chiapas)
// whose veins wake with light. Two golden eyes open in the dark gap and blink. Then the jungle
// opens like an eye and, from the eyes, the jaguar is drawn as a constellation: ears, brows, nose,
// mouth and whiskers, the outline, the paws with their toes, the ringed curl of the tail, and its
// rosettes as stars (in Mesoamerica the jaguar's spotted pelt was likened to the starry night sky).
// A pulse of light runs through the finished figure from the eyes to the tail. The jaguar condenses
// out of its stars as warm gold light and then takes its own colours, while the morning sun breaks
// through the canopy in gold shafts. It walks slowly toward us (an eased dolly), a ring of light
// runs over its coat and its rosettes glint. At the end it melts back into its constellation, tail
// first, the stars rise away as sparks, the jungle closes like an eye and the eyes go out last.
// The figure is drawn on purpose (scratchpad figure2.py): the stars are [u, v, type, f, fe, size] in
// the 1024-unit asset space; f is the distance from the eyes along the figure (growth order), fe the
// straight distance from the face (the pulse and the ripple). Types: 0 rosette, 1 solid spot,
// 2 figure star, 3 eye, 4 nose, 5 toe, 6 small star, 7 hidden joint. LINKS = [i, j, class]:
// 0 outline, 1 face line, 2 whisker, 3 tail ring.
// Asset: prepare.py on out-show2/images/jaguar-1.png -> 04-jaguar-cat; derived from it: -cat_solid
// (cut-out with the see-through spots filled), -cat_sil (silhouette), -cat_rim (sun rim light).
// Leaves and heliconias are vector, built once. Everything is a pure function of t.
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const bump = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));

// ---------- timeline

const T_BLINK = 1.58;                    // one unhurried blink: close 0.1 s, hold 0.05 s, open 0.13 s
const T_IRIS = 1.95, D_IRIS = 1.8;       // the jungle opens like an eye
const T_STAR = 2.05, D_STAR = 2.15;      // the constellation is drawn from the eyes
const T_PULSE = 4.1, D_PULSE = 0.55;     // a pulse of light runs from the eyes to the tail
const T_PH = 4.48, D_PH = 0.8, D_BLOOM = 0.8;   // gold light condenses out of the stars, face first
const T_FLOOR = 5.95;                    // the photo is fully in

const T_DOLLY = 4.8, D_DOLLY = 5.3;      // the slow approach
const T_WAVE = 7.1, D_WAVE = 1.5;        // a ring of light runs from its face over the coat
const T_REC = 8.7, D_REC = 1.0;          // the jaguar melts back into stars, tail first
const T_LIFT = 9.5, D_LIFTS = 0.85;      // the stars rise away
const T_CLOSE = 9.45, D_CLOSE = 1.45;    // the jungle closes
const T_OUT = 10.55;                     // the eyes go out

// ---------- the jaguar: the 1024-unit asset, anchored between the eyes. It approaches the camera
// at its own eye level, so the eyes hold their height while the body grows down and outward.
const AX0 = 697, AY0 = 260;
const EYE_A = [[617, 260], [777, 260]];
const dollyK = t => ease.inOut3((t - T_DOLLY) / D_DOLLY);
function jag(t) {
  const k = dollyK(t), creep = smooth(1.0, 4.8, t);
  return { s: 0.685 + 0.015 * creep + 0.235 * k, r: 0, x: 640 - 10 * k, y: 300 + 28 * k };
}
function P(J, u, v) { return [J.x + (u - AX0) * J.s, J.y + (v - AY0) * J.s]; }
const toJag = (c, J) => { c.translate(J.x, J.y); c.scale(J.s, J.s); c.translate(-AX0, -AY0); };

  pts.forEach(([x, y], i) => { const p = B(x, y, bend, L); i ? shape.lineTo(p[0], p[1]) : shape.moveTo(p[0], p[1]); });
  shape.closePath();
  for (const [H, ang, rx, ry] of holes) {
    const p = B(H[0], H[1], bend, L);
    shape.moveTo(p[0] + Math.cos(ang) * rx, p[1] + Math.sin(ang) * rx);
    shape.ellipse(p[0], p[1], rx, ry, ang, 0, TAU);

  return { shape, veins, mid, L, midW: 4.5, w: 0.45 };
}
// platanillo: the long, wind-torn paddle leaf of the heliconia plant (native; it looks like a banana leaf)
function makePlatanillo(L, seed, bend) {
  const R = HG.rng(seed);
  const hw = u => 0.155 * L * Math.pow(Math.sin(Math.PI * Math.pow(clamp(u), 0.8)), 0.55) * (1 - 0.1 * u);
  const edge = (u, sd) => [u * L, sd * hw(u)];

  for (const sd of [1, -1]) {
    const k = 4 + Math.floor(R() * 4), sl = [];
    for (let j = 0; j < k; j++) sl.push({ u: 0.14 + 0.74 * (j + 0.5 + (R() - 0.5) * 0.7) / k, depth: 0.6 + R() * 0.38, half: 0.007 + R() * 0.008 });

      const u = i / N, q = sl.find(s => Math.abs(u - s.u) < s.half);
      if (q) {
        if (!q.done) { q.done = true; const M = edge(q.u, sd); side.push(...slitPoints(edge(q.u - q.half, sd), edge(q.u + q.half, sd), M, [M[0] - 0.05 * L, 0], q.depth, L)); }
        continue;

      side.push(edge(u, sd));
    }
    outline.push(sd > 0 ? side : side.reverse());
    for (let u = 0.1 + R() * 0.03; u < 0.95; u += 0.075 + R() * 0.02) {
      const o = B(u * L - 0.045 * L, sd * 0.012 * L, bend, L), m = B(u * L, sd * hw(u) * 0.95, bend, L);
      veins.moveTo(o[0], o[1]); veins.lineTo(m[0], m[1]);
    }
  }
  [...outline[0], ...outline[1]].forEach(([x, y], i) => { const p = B(x, y, bend, L); i ? shape.lineTo(p[0], p[1]) : shape.moveTo(p[0], p[1]); });
  shape.closePath();
  const mid = new Path2D(); for (let i = 0; i <= 24; i++) { const p = B(0.98 * L * i / 24, 0, bend, L); i ? mid.lineTo(p[0], p[1]) : mid.moveTo(p[0], p[1]); }
  return { shape, veins, mid, L, midW: 6, w: 0.16 };
}
function makePalm(L, seed, bend) {
  const R = HG.rng(seed);
  const rach = u => [u * L, bend * L * u * u];
  const tang = u => { const x = L, y = 2 * bend * L * u, l = Math.hypot(x, y); return [x / l, y / l]; };
  const shape = new Path2D(), veins = new Path2D();
  const n = 14;
  for (const sd of [1, -1]) for (let j = 0; j < n; j++) {
    const u = 0.1 + 0.86 * (j + 0.3 + 0.4 * R()) / n;
    const len = 0.36 * L * Math.pow(Math.sin(Math.PI * (0.2 + 0.78 * u)), 0.75);
    const ang = sd * (40 + 10 * R()) * DEG, T = tang(u);
    const D = [T[0] * Math.cos(ang) - T[1] * Math.sin(ang), T[0] * Math.sin(ang) + T[1] * Math.cos(ang)];
    const P0 = rach(u), curv = 0.22;
    const m = v => [P0[0] + D[0] * len * v + T[0] * len * curv * v * v, P0[1] + D[1] * len * v + T[1] * len * curv * v * v + 0.06 * len * v * v * sd];
    const wv = v => 0.024 * L * Math.sin(Math.PI * Math.pow(v, 0.65));
    const left = [], right = [], M = 12;
    for (let i = 0; i <= M; i++) {
      const v = i / M, a = m(Math.max(0, v - 0.02)), b = m(Math.min(1, v + 0.02));
      let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      const p = m(v), w = wv(v);
      left.push([p[0] - ty * w, p[1] + tx * w]); right.push([p[0] + ty * w, p[1] - tx * w]);
    }
    const pts = [...left, ...right.reverse()];
    pts.forEach(([x, y], i) => i ? shape.lineTo(x, y) : shape.moveTo(x, y));
    shape.closePath();
    for (let i = 0; i <= 8; i++) { const p = m(i / 8 * 0.92); i ? veins.lineTo(p[0], p[1]) : veins.moveTo(p[0], p[1]); }
  }
  const mid = new Path2D(); for (let i = 0; i <= 24; i++) { const p = rach(i / 24); i ? mid.lineTo(p[0], p[1]) : mid.moveTo(p[0], p[1]); }
  return { shape, veins, mid, L, midW: 5, w: 0.3 };
}
// heliconia (H. latispatha / bihai): a zigzag stem of narrow, cupped, boat-shaped bracts that open
// upward toward the tip of the stem, red-orange with a yellow lip
function makeHeliconia(L, seed, bend) {
  const R = HG.rng(seed);
  const shape = new Path2D(), veins = new Path2D(), mid = new Path2D(), inner = new Path2D();
  const n = 6, nodes = [];
  for (let j = 0; j < n; j++) { const u = 0.36 + 0.105 * j, sd = j % 2 ? 1 : -1; nodes.push([u * L, sd * 0.03 * L + bend * L * u * u, sd]); }
  mid.moveTo(0, 0); mid.lineTo(nodes[0][0] - 0.05 * L, 0);
  nodes.forEach(([x, y]) => mid.lineTo(x, y));
  mid.lineTo(nodes[n - 1][0] + 0.05 * L, nodes[n - 1][1]);
  nodes.forEach(([x, y, sd], j) => {
    const lb = 0.3 * L * (1 - 0.09 * j), ang = sd * (56 + 6 * R()) * DEG;
    const D = [Math.cos(ang), Math.sin(ang)], N = [-D[1] * sd, D[0] * sd];   // N points toward the stem's tip
    // the keel curves out and the tip turns up toward the stem's tip: a boat
    const m = v => [x + D[0] * lb * v + N[0] * lb * 0.22 * v * v, y + D[1] * lb * v + N[1] * lb * 0.22 * v * v];
    const wv = v => 0.044 * L * Math.sin(Math.PI * Math.pow(v, 0.7)) * (1 - 0.35 * v);
    const lip = [], keel = [], cup = [];
    for (let i = 0; i <= 18; i++) {
      const v = i / 18, q = m(v), w = wv(v);
      lip.push([q[0] + N[0] * w * 0.35, q[1] + N[1] * w * 0.35]);
      keel.push([q[0] - N[0] * w, q[1] - N[1] * w]);
      if (v > 0.12 && v < 0.9) cup.push([q[0] - N[0] * w * 0.3, q[1] - N[1] * w * 0.3]);
    }
    [...lip, ...keel.reverse()].forEach(([a, b], i) => i ? shape.lineTo(a, b) : shape.moveTo(a, b));
    shape.closePath();
    lip.forEach(([a, b], i) => i ? veins.lineTo(a, b) : veins.moveTo(a, b));
    cup.forEach(([a, b], i) => i ? inner.lineTo(a, b) : inner.moveTo(a, b));

}
const MAKE = { monstera: makeMonstera, platanillo: makePlatanillo, palm: makePalm, heliconia: makeHeliconia };

// the leaves form an iris around the jaguar's eyes; opening swings each one about its base
function leafSet(defs, Rb, hole, layer, slide, aim = [C, C]) {
  return defs.map(([kind, angDeg, off, swing, lenK, bend, flip, seed], i) => {
    const a = angDeg * DEG, bx = C + Rb * Math.cos(a), by = C + Rb * Math.sin(a);
    const L = (Math.hypot(aim[0] - bx, aim[1] - by) - hole) * lenK;
    const th = Math.atan2(aim[1] - by, aim[0] - bx) + off * DEG;
    return { ...MAKE[kind](L, seed, bend), kind, bx, by, th, swing: swing * DEG, flip, i, seed, layer, slide };
  });
}
//                  kind        base°  aim° swing° len  bend  flip seed
const FRONT = leafSet([
  ['monstera',    -92,   0,  58, 0.78, 0.06, 1, 11],
  ['palm',        -46, -20,  58, 0.85, 0.10, 0, 12],
  ['heliconia',     2,   0,  36, 0.8,  -0.05, 0, 13],
  ['monstera',     44,   0,  58, 0.8,  0.05, 0, 14],
  ['palm',         90,   0,  56, 1.0,  -0.10, 1, 15],
  ['monstera',    136,   0,  58, 0.78, -0.05, 1, 17],
  ['heliconia',   204,   0, -34, 0.8,  0.05, 1, 16],
  ['palm',        226,   0,  58, 1.0,  0.10, 0, 18],
], 640, 225, 'front', 55);
// the nearest leaves close the jungle around the eyes at the start and swing right out of view
const NEAR = leafSet([
  ['monstera',    -68,   0, -78, 0.86, 0.06, 0, 51],
  ['platanillo',  -16,   0,  80, 1.0,  0.05, 1, 52],
  ['monstera',     36,   0, -78, 0.82, -0.05, 1, 53],
  ['palm',         88,   0,  80, 0.9,  0.10, 0, 54],
  ['platanillo',  140,   0, -80, 0.95, -0.05, 0, 55],
  ['monstera',    190,   0,  78, 0.86, 0.06, 1, 56],
  ['palm',        244,   0, -80, 1.0,  -0.10, 1, 57],
], 680, 160, 'near', 170, [640, 318]);
const BACK = leafSet([
  ['palm',        -69,  38,  20, 0.62, 0.10, 1, 31],
  ['platanillo',  -23,  40,  18, 0.85, -0.06, 0, 32],
  ['palm',         22,  38,  20, 0.85, 0.10, 0, 33],
  ['palm',        113,  38,  20, 0.9,  -0.10, 1, 35],
  ['platanillo',  158,  40,  18, 0.85, 0.06, 0, 36],
  ['monstera',    204,  40,  20, 0.6,  -0.05, 0, 37],
], 610, 260, 'back', 30);

const SUNDIR = (() => { const x = -0.62, y = -0.78, l = Math.hypot(x, y); return [x / l, y / l]; })();
// the fills are kept close to black so the leaves read by their glowing edges and veins
const STYLE = {
  front: { base: [1, 7, 5], mid: [2, 17, 12], tip: [4, 27, 18], fillA: 0.96, edge: LEAF, vein: VEIN, midrib: LEAF_HI },
  near: { base: [1, 7, 5], mid: [2, 18, 12], tip: [4, 29, 19], fillA: 0.96, edge: LEAF, vein: VEIN, midrib: LEAF_HI },
  back: { base: [1, 6, 7], mid: [2, 14, 16], tip: [3, 22, 24], fillA: 0.94, edge: [36, 175, 185], vein: [40, 150, 160], midrib: [120, 225, 225] },
};
// iris opening of leaf i: 0 closed, 1 open
function irisK(t, lf) {
  // the lowest leaves open first, so the title band clears early
  const open = ease.inOut3((t - T_IRIS - 0.42 * clamp((1080 - lf.by) / 1300)) / D_IRIS);
  const close = ease.inOut3((t - T_CLOSE - 0.05 * (8 - lf.i)) / D_CLOSE);
  return open - 0.82 * close;
}
// a band of light that runs along the leaf from the base to the tip
function pulseGrad(c, L, col, base, peak, k) {
  const g = c.createLinearGradient(0, 0, L, 0);
  if (k <= -0.25 || k >= 1.25) { g.addColorStop(0, rgba(col, base)); g.addColorStop(1, rgba(col, base)); return g; }
  const st = [[0, base], [k - 0.22, base], [k, peak], [k + 0.1, base], [1, base]];
  for (const [o, a] of st) if (o >= 0 && o <= 1) g.addColorStop(o, rgba(col, a));
  return g;
}
const HUES = [[46, 222, 138], [110, 232, 110], [40, 215, 175], [70, 230, 150]];
const FLOWER = { base: [150, 18, 26], mid: [235, 48, 38], tip: [255, 112, 38], fillA: 0.95, edge: [255, 112, 52], vein: [255, 222, 60], midrib: [110, 220, 100], cup: [150, 20, 24] };
function styleOf(lf) {
  if (lf.flower) return FLOWER;
  const S = STYLE[lf.layer];
  if (lf.layer === 'back') return S;
  const h = HUES[lf.seed % HUES.length];
  return { ...S, edge: h, vein: mix(h, VEIN, 0.5), midrib: mix(h, LEAF_HI, 0.6) };
}
function drawLeaf(c, lf, t, sunK) {
  const S = styleOf(lf), k = irisK(t, lf);
  const ang = Math.atan2(lf.by - C, lf.bx - C), gustT = 6.3 + 0.9 * (0.5 + 0.5 * Math.cos(ang - 2.3));
  const sway = (lf.layer === 'back' ? 2.2 : 1.6) * DEG * Math.sin(t * 0.9 + lf.seed * 1.7) + 0.8 * DEG * Math.sin(t * 1.7 + lf.seed)
    + 4.5 * DEG * Math.sin(TAU * (t - gustT) / 1.5) * bump(t, gustT + 0.5, 0.75) * (lf.layer === 'back' ? 0.6 : 1);
  const drift = (1 - smooth(0, 1.6, t)) * 6 * DEG;   // they settle into place as they appear
  const th = lf.th - lf.swing * k + sway - drift * (lf.i % 2 ? 1 : -1);
  const back = lf.slide * k;                                // slide a little out toward the rim as they open
  const ox = lf.bx - Math.cos(lf.th) * back, oy = lf.by - Math.sin(lf.th) * back;
  c.save();
  c.translate(ox, oy); c.rotate(th); if (lf.flip) c.scale(1, -1);
  const L = lf.L;
  const g = c.createLinearGradient(0, 0, L, 0);
  g.addColorStop(0, rgba(S.base, S.fillA)); g.addColorStop(0.55, rgba(S.mid, S.fillA)); g.addColorStop(1, rgba(S.tip, S.fillA));
  c.fillStyle = g; c.fill(lf.shape, 'evenodd');
  const vk = (t - 0.2 - 0.07 * lf.i) / 1.1;            // the veins wake with a band of light
  c.save(); c.clip(lf.shape, 'evenodd');
  c.lineCap = 'round';
  c.strokeStyle = rgba(S.edge, lf.flower ? 0.22 : 0.1); c.lineWidth = 16; c.stroke(lf.shape);
  if (lf.flower) { c.strokeStyle = rgba(S.cup, 0.9); c.lineWidth = 3; c.stroke(lf.inner); }
  else { c.strokeStyle = pulseGrad(c, L, S.vein, 0.4, 1, vk); c.lineWidth = 2.4; c.stroke(lf.veins); }
  c.restore();
  c.lineCap = 'round';
  c.strokeStyle = pulseGrad(c, L, S.midrib, 0.75, 1, vk); c.lineWidth = lf.midW; c.stroke(lf.mid);
  // outline: the side that faces the sun turns gold once the sun is up
  let ex = SUNDIR[0], ey = SUNDIR[1];
  const ca = Math.cos(-th), sa = Math.sin(-th);
  let lx = ex * ca - ey * sa, ly = ex * sa + ey * ca; if (lf.flip) ly = -ly;
  const R = 0.5 * L, cx = 0.5 * L;
  const og = c.createLinearGradient(cx - lx * R, -ly * R, cx + lx * R, ly * R);
  const sunEdge = lf.flower ? S.edge : mix(S.edge, GOLD, 0.85 * sunK);
  og.addColorStop(0, rgba(S.edge, 1)); og.addColorStop(0.4, rgba(S.edge, 1)); og.addColorStop(0.85, rgba(mix(S.edge, GOLD, 0.6 * sunK), 1)); og.addColorStop(1, rgba(sunEdge, 1));
  c.strokeStyle = og; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke(lf.shape);
  if (lf.flower) { c.strokeStyle = rgba(S.vein, 1); c.lineWidth = 3.2; c.stroke(lf.veins); }
  c.restore();
}
// as the camera moves in, the nearer leaves drift outward faster than the far ones (parallax)
function leafLayer(c, set, t, sunK, par) {
  c.save(); c.translate(C, C); c.scale(par, par); c.translate(-C, -C);
  for (const lf of set) drawLeaf(c, lf, t, sunK);
  c.restore();
}

// ---------- sun shafts through the canopy (from the upper left: the morning sun in the east).
// Four crisp shafts with defined edges; they fall behind the jaguar and the near leaves.
const SUN_SRC = [-160, -260];
const SHAFTS = [[38.5, 46, 1.0, 0.3], [44.5, 74, 0.8, 1.7], [50.5, 34, 0.95, 2.9], [56.5, 58, 0.75, 4.1]];
const shaftAng = (b, t) => (b[0] + 1.3 * Math.sin(t * 0.3 + b[3]) + 1.8 * smooth(T_SUN, 10, t)) * DEG;
const shaftK = (b, t) => b[2] * (0.8 + 0.2 * Math.sin(t * 0.9 + b[3] * 2.3));
// how bright the shafts are at (x, y): drives the pollen
function shaftAt(x, y, t) {
  let s = 0;
  for (const b of SHAFTS) {
    const a = shaftAng(b, t), dx = x - SUN_SRC[0], dy = y - SUN_SRC[1];
    const d = Math.abs(-Math.sin(a) * dx + Math.cos(a) * dy);
    s += shaftK(b, t) * smooth(b[1] * 0.62, b[1] * 0.38, d);
  }
  return s * (1 - smooth(560, 760, y));
}

// ---------- layers and helpers
const LB = HG.layer(), LJ = HG.layer(), LG = HG.layer(), LR = HG.layer(), LF = HG.layer(), LS = HG.layer(), LD = HG.layer();
for (const l of [LB, LJ, LG, LR, LF, LS, LD]) l.ctx.imageSmoothingQuality = 'high';
ctx.imageSmoothingQuality = 'high';
// blurred copy of a layer, added on top (the blurred draw needs the layer drawn at full size after
// HG.reset, which keeps the scale transform: drawLayer cannot take a filter)
function bloom(c, L, px, alpha) {
  if (alpha <= 0) return;
  HG.reset(c); c.globalCompositeOperation = 'lighter'; c.globalAlpha = Math.min(1, alpha); c.filter = HG.blur(px);
  c.drawImage(L.cv, 0, 0, W, W); HG.reset(c);
}
// soft white disc used to grow the light and then the photo out of each star
const BLOB = (() => {
  const n = Math.round(128 * Math.max(1, HG.S)), cv = document.createElement('canvas'); cv.width = cv.height = n;
  const g = cv.getContext('2d'), h = n / 2, grd = g.createRadialGradient(h, h, 0, h, h, h);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.55, 'rgba(255,255,255,0.9)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, n, n); return cv;
})();
// calm the lower band (y > ~780) while the title is on screen: the forest floor is in shade
const calmK = t => smooth(2.0, 2.9, t) * (1 - smooth(9.3, 9.95, t));
const calmAt = (y, t) => 1 - 0.5 * calmK(t) * smooth(700, 830, y);

// state of star i at time t (all analytic)
function starState(i, t) {
  const S = TREE[i];
  const ig = t - S.tIg;
  if (ig < 0) return null;
  const out = Math.max(ease.inOut3((t - S.tPh - 0.1) / 0.6), smooth(T_FLOOR - 0.45, T_FLOOR - 0.05, t));
  const rc = ease.inOut3((t - S.tRec) / 0.5);
  const a = lerp(1 - out, 1, rc);
  // rosette rings come back only once the photo around them has gone (no rings glued on the fur)
  const aR = lerp(1 - out, 1, ease.inOut3((t - S.tRec - 0.4) / 0.5));
  const wave = bump(t, T_PULSE + D_PULSE * S.fe, 0.075);
  const lf = (t - S.tLift) / S.dLift;
  return { ig, rc, a, aR, wave, lf, pop: ease.outBack(ig / 0.38), flash: Math.exp(-ig * 5) };
}
// path of a star rising away at the end: it lifts, accelerating, swaying, toward the midday sun
function liftOffset(i, lf) {
  const S = TREE[i], k = Math.max(0, lf);
  return [S.sway * 150 * k * k + 30 * Math.sin(k * 4 + S.ph) * k, -(520 * k * k + 110 * k) * S.rise];
}

<script>
HG.start({
  duration: 12,
  assets: { cat: '../assets/04-jaguar-cat_solid.png', sil: '../assets/04-jaguar-cat_sil.png', rim: '../assets/04-jaguar-cat_rim.png' },
  render(t, A) {
    const J = jag(t), dk = dollyK(t);
    const sunK = smooth(T_SUN, T_SUN + 1.6, t) * (1 - smooth(9.3, 10.8, t));
    const leafA = smooth(0.12, 0.95, t) * (1 - smooth(10.35, 11.25, t));
    const photo = smooth(T_PH, T_FLOOR, t) * (1 - smooth(T_REC, T_REC + D_REC + 0.4, t));

    // ---- back leaves (behind the jaguar, a little soft: depth)
    {
      const c = LB.ctx; HG.reset(c); c.clearRect(0, 0, W, W);
      leafLayer(c, BACK, t, sunK, 1 + 0.02 * dk);
      HG.reset(ctx); ctx.globalAlpha = 0.75 * leafA; ctx.filter = HG.blur(1.2); ctx.drawImage(LB.cv, 0, 0, W, W); HG.reset(ctx);
      bloom(ctx, LB, 8, 0.2 * leafA);
    }

    // ---- sun shafts behind the jaguar, and the pollen glinting in them
    if (sunK > 0) {
      const c = LS.ctx; HG.reset(c); c.clearRect(0, 0, W, W);
      c.globalCompositeOperation = 'lighter'; c.filter = HG.blur(1.5);
      for (const b of SHAFTS) {
        const a = shaftAng(b, t), k = shaftK(b, t), w = b[1];
        c.save(); c.translate(SUN_SRC[0], SUN_SRC[1]); c.rotate(a);
        const g = c.createLinearGradient(0, -w / 2, 0, w / 2);
        g.addColorStop(0, rgba(SHAFT, 0)); g.addColorStop(0.16, rgba(SHAFT, 0.8 * k)); g.addColorStop(0.5, rgba(SHAFT, k));
        g.addColorStop(0.84, rgba(SHAFT, 0.8 * k)); g.addColorStop(1, rgba(SHAFT, 0));
        c.fillStyle = g; c.fillRect(0, -w / 2, 2000, w);
        c.restore();
      }
      c.filter = 'none';
      // strongest where they break through the canopy; they fade before the forest floor
      c.globalCompositeOperation = 'destination-in';
      const fg = c.createRadialGradient(SUN_SRC[0], SUN_SRC[1], 250, SUN_SRC[0], SUN_SRC[1], 1350);
      fg.addColorStop(0, 'rgba(0,0,0,1)'); fg.addColorStop(0.5, 'rgba(0,0,0,0.8)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = fg; c.fillRect(0, 0, W, W);
      const vg = c.createLinearGradient(0, 520, 0, 780);
      vg.addColorStop(0, 'rgba(0,0,0,1)'); vg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = vg; c.fillRect(0, 0, W, W);
      HG.reset(c);
      HG.drawLayer(ctx, LS, { alpha: 0.62 * sunK, op: 'lighter' });
      // pollen motes, 8-14 px, sparkling where the light catches them
      const R = HG.rng(77);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 170; i++) {
        const x0 = R() * W, y0 = R() * W, sp = 8 + R() * 14, ph = R() * TAU, sz = 8 + R() * 6, tw = 1.6 + R() * 2.2;
        const x = ((x0 + sp * t * 0.6 + 18 * Math.sin(t * 0.5 + ph)) % W + W) % W, y = ((y0 + sp * t + 14 * Math.sin(t * 0.7 + ph * 2)) % W + W) % W;
        if (Math.hypot(x - C, y - C) > 520) continue;
        const k = Math.min(1, shaftAt(x, y, t)) * sunK; if (k < 0.02) continue;
        const sparkle = Math.pow(0.5 + 0.5 * Math.sin(t * tw + ph), 4);
        HG.dot(ctx, WARM, x, y, sz, k * (0.35 + 0.65 * sparkle));
        if (sparkle > 0.3) {
          const fl = (sparkle - 0.3) / 0.7 * k, l = sz * 1.3;
          ctx.globalAlpha = 0.7 * fl; ctx.strokeStyle = rgba(WARM, 1); ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(x - l, y); ctx.lineTo(x + l, y); ctx.moveTo(x, y - l); ctx.lineTo(x, y + l); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
      ctx.restore();
    }

    // ---- warm breath of light behind the jaguar
    if (photo > 0) {
      const br = 0.5 + 0.5 * Math.sin(TAU * (t - T_DOLLY) / 1.9);
      const p = P(J, 560, 470);
      const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], 460 * J.s / 0.8);
      g.addColorStop(0, rgba(SUN, 0.13 * photo * (0.7 + 0.3 * br))); g.addColorStop(0.6, rgba(GOLD, 0.045 * photo)); g.addColorStop(1, rgba(GOLD, 0));
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(0, 0, W, W); ctx.restore();
    }

    // ---- the jaguar: warm gold light condenses out of its stars, then its own colours come in
    {
      const goldK = smooth(T_PH - 0.1, T_PH + 0.25, t) * (1 - smooth(T_FLOOR - 0.3, T_FLOOR + 0.35, t))
        + smooth(T_REC + 0.1, T_REC + 0.5, t) * (1 - smooth(T_REC + D_REC + 0.75, T_REC + D_REC + 1.05, t));
      const blobs = (c, lag, recLag, gain = 1) => {
        let any = false;
        for (let i = 0; i < NN; i++) {
          const S = TREE[i];
          // patches grow out of the stars; at the end they shrink back into them (no murky fade)
          const kin = ease.inOut3((t - S.tPh - lag) / D_BLOOM), kout = 1 - ease.inOut3((t - S.tRec - recLag) / 0.7);
          const a = 0.3 * Math.min(1, gain * kin) * Math.min(1, 2.5 * kout);
          if (a <= 0.0012) continue;
          const r = 150 * (0.55 + 0.45 * kin) * (0.12 + 0.88 * kout);
          any = true; c.globalAlpha = a;
          c.drawImage(BLOB, STARS[i][0] - r, STARS[i][1] - r, 2 * r, 2 * r);
        }
        return any;
      };
      // gold light: the blob mask filled with a warm, luminous version of the coat, added as light
      if (goldK > 0.003) {
        const c = LG.ctx; HG.reset(c); c.clearRect(0, 0, W, W);
        toJag(c, J);
        if (blobs(c, 0, 0.3, 2.4)) {
          c.globalAlpha = 1; c.globalCompositeOperation = 'source-in';
          c.filter = 'sepia(1) saturate(2.6) hue-rotate(-8deg) contrast(0.85) brightness(1.15)';
          c.drawImage(A.cat, 0, 0, 1024, 1024); c.filter = 'none';
          HG.reset(c);
          HG.drawLayer(ctx, LG, { alpha: 0.8 * Math.min(1, goldK), op: 'lighter' });
          bloom(ctx, LG, 16, 0.3 * Math.min(1, goldK));
        }
      }
      // the photo, its true colours, over the light
      const c = LJ.ctx; HG.reset(c); c.clearRect(0, 0, W, W);
      toJag(c, J);
      const floor = smooth(T_FLOOR - 0.6, T_FLOOR, t) * (1 - smooth(T_REC - 0.35, T_REC + 0.05, t));
      if (floor > 0) { c.globalAlpha = floor; c.drawImage(A.sil, 0, 0, 1024, 1024); }
      const any = blobs(c, 0.45, 0) || floor > 0;
      if (any) {
        c.globalAlpha = 1; c.globalCompositeOperation = 'source-in';
        c.drawImage(A.cat, 0, 0, 1024, 1024);
        HG.reset(c);
        HG.drawLayer(ctx, LJ);
        bloom(ctx, LJ, 12, 0.18);
        // sun rim light on the back and head, breathing
        if (sunK > 0 && photo > 0) {
          const br = 0.5 + 0.5 * Math.sin(TAU * (t - T_DOLLY) / 1.9);
          ctx.save(); toJag(ctx, J); ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = sunK * photo * (0.55 + 0.3 * br);
          ctx.drawImage(A.rim, 0, 0, 1024, 1024);
          ctx.globalAlpha = sunK * photo * 0.35; ctx.filter = HG.blur(6); ctx.drawImage(A.rim, 0, 0, 1024, 1024);
          ctx.restore(); HG.reset(ctx);
        }
        // a narrow ring of warm light runs from the face over the coat (masked to the jaguar)
        const wr = (t - T_WAVE) / D_WAVE;
        if (wr > -0.05 && wr < 1.1 && photo > 0) {
          const d = LD.ctx; HG.reset(d); d.clearRect(0, 0, W, W);
          toJag(d, J);
          const bw = 80 / J.s, R0 = Math.max(bw, 780 * wr);
          const g = d.createRadialGradient(FACE[0], FACE[1], R0 - bw, FACE[0], FACE[1], R0);
          g.addColorStop(0, rgba(WARM, 0)); g.addColorStop(0.55, rgba(WARM, 1)); g.addColorStop(1, rgba(WARM, 0));
          d.fillStyle = g; d.fillRect(-200, -200, 1424, 1424);
          d.globalCompositeOperation = 'destination-in'; d.drawImage(A.sil, 0, 0, 1024, 1024);
          HG.reset(d);
          const a = 0.22 * smooth(-0.05, 0.08, wr) * (1 - smooth(0.8, 1.1, wr)) * photo;
          HG.drawLayer(ctx, LD, { alpha: a, op: 'lighter' });
        }
      }
    }

    // ---- the constellation: figure lines, rosettes and stars
    const ST = [];
    for (let i = 0; i < NN; i++) ST.push(starState(i, t));
    {
      const c = LR.ctx; HG.reset(c); c.clearRect(0, 0, W, W);
      c.lineCap = 'round'; c.lineJoin = 'round';
      // each line grows from its earlier star to the later one; it is bright as it is drawn, settles to
      // a steady glow, flares under the pulse, fades as the photo condenses, flashes back as the jaguar
      // melts into stars and vanishes as its stars rise away
      const CLS = [[0.95, 0.5, 3.3], [0.9, 0.5, 2.6], [0.75, 0.38, 1.7], [0.85, 0.45, 2.3]];
      for (const [i0, j0, cl] of LINKS) {
        let a = i0, b = j0; if (TREE[b].tIg < TREE[a].tIg) [a, b] = [b, a];
        const Ta = TREE[a], Tb = TREE[b], sa = ST[a]; if (!sa) continue;
        const [hiA, loA, wid] = CLS[cl];
        const grow = clamp((t - Ta.tIg) / Math.max(0.05, Tb.tIg - Ta.tIg));
        const wave = bump(t, T_PULSE + D_PULSE * 0.5 * (Ta.fe + Tb.fe), 0.075);
        const gone = Math.max(ease.inOut3((t - Tb.tPh - 0.05) / 0.55), smooth(T_FLOOR - 0.5, T_FLOOR - 0.1, t));
        let al = (lerp(hiA, loA, smooth(Tb.tIg + 0.25, Tb.tIg + 0.9, t)) + wave * (1 - loA)) * (1 - gone);
        const rec = smooth(Math.max(Ta.tRec, Tb.tRec) - 0.05, Math.max(Ta.tRec, Tb.tRec) + 0.35, t);
        al = Math.max(al, hiA * rec);
        const sb = ST[b], lf = Math.max(sa.lf, sb ? sb.lf : -1);
        al *= 1 - smooth(-0.15, 0.06, lf);
        if (al <= 0.01) continue;
        const p0 = P(J, STARS[a][0], STARS[a][1]), p1 = P(J, STARS[b][0], STARS[b][1]);
        const ym = Math.max(p0[1], p1[1]);
        c.strokeStyle = rgba(mix(GOLD, WARM, 0.55 + 0.45 * Math.max(wave, rec * 0.5)), Math.min(1, al * calmAt(ym, t)));
        c.lineWidth = wid + 1.5 * wave;
        c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(lerp(p0[0], p1[0], grow), lerp(p0[1], p1[1], grow)); c.stroke();
      }
      // rosettes: blotchy broken rings with a dot or two inside
      for (let i = 0; i < NN; i++) {
        const s = ST[i], ro = ROSETTE[i]; if (!s || !ro) continue;
        const life = s.lf > 0 ? 1 - smooth(0, 0.5, s.lf) : 1;
        let [x, y] = P(J, STARS[i][0], STARS[i][1]);
        const a = s.aR * life * calmAt(y, t); if (a <= 0.01) continue;
        if (s.lf > 0) { const q = liftOffset(i, s.lf); x += q[0]; y += q[1]; }
        const rr = (13 + 5 * STARS[i][5]) * J.s * (0.35 + 0.65 * s.pop) * (1 + 0.35 * s.wave) * (1 + 0.5 * Math.max(0, s.lf));
        c.strokeStyle = rgba(mix(GOLD, WARM, Math.max(s.flash, s.wave)), Math.min(1, a)); c.fillStyle = c.strokeStyle;
        // each mark is a thick, blotchy segment of a slightly polygonal ring, tapering at its ends
        for (const q of ro.arcs) {
          const x0 = x + Math.cos(q.a0) * rr * q.r0, y0 = y + Math.sin(q.a0) * rr * q.r0;
          const x1 = x + Math.cos(q.a1) * rr * q.r1, y1 = y + Math.sin(q.a1) * rr * q.r1;
          const am = (q.a0 + q.a1) / 2, ox = Math.cos(am), oy = Math.sin(am);
          let dx = x1 - x0, dy = y1 - y0; const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
          const outer = [], inner = [];
          for (let k = 0; k <= 8; k++) {
            const u = k / 8, bw = (q.bow - 0.95) * rr * 2.2 * Math.sin(Math.PI * u);
            const px = lerp(x0, x1, u) + ox * bw, py = lerp(y0, y1, u) + oy * bw;
            const hw = rr * q.w * 0.5 * Math.pow(Math.sin(Math.PI * (0.08 + 0.84 * u)), 0.6) * (1 + q.sk * (u - 0.5) * 1.6);
            outer.push([px - dy * hw, py + dx * hw]); inner.push([px + dy * hw, py - dx * hw]);
          }
          c.beginPath();
          [...outer, ...inner.reverse()].forEach(([px, py], k) => k ? c.lineTo(px, py) : c.moveTo(px, py));
          c.closePath(); c.fill();
        }
        for (const [dx, dy, dr] of ro.dots) { c.beginPath(); c.arc(x + dx * rr, y + dy * rr, Math.max(1.1, dr * rr), 0, TAU); c.fill(); }
      }
      HG.reset(c);
      bloom(ctx, LR, 5, 0.85);
      HG.drawLayer(ctx, LR, { op: 'lighter' });
    }
    // star cores, the pulse halo, and the sparks rising at the end
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    for (let i = 2; i < NN; i++) {
      const s = ST[i]; if (!s) continue;
      const typ = STARS[i][2], Si = TREE[i];
      if (typ === 7) continue;
      // only some of the outline stars rise as sparks; the rest go out where they are
      const riser = typ !== 2 || i % 3 === 0;
      if (!riser && s.lf > 0.3) continue;
      const life = s.lf > 0 ? (riser ? 1 - smooth(0.15, 1, s.lf) : 1 - smooth(0, 0.3, s.lf)) : 1;
      const tw = 0.75 + 0.25 * Math.sin(t * 4.2 + Si.ph);
      let [x, y] = P(J, STARS[i][0], STARS[i][1]);
      const calm = calmAt(y, t);
      const a = s.a * life * tw * calm; if (a <= 0.01) continue;
      if (s.lf > 0 && riser) { const q = liftOffset(i, s.lf); x += q[0]; y += q[1]; }
      const base = typ === 2 ? 15 : typ === 4 ? 20 : typ === 5 ? 17 : typ === 6 ? 9 : typ === 7 ? 9 : typ === 0 ? 11 : 9 + 5 * STARS[i][5];
      const sz = base * STARS[i][5] ** 0.5 * (0.4 + 0.6 * s.pop) * (1 + 0.8 * s.wave);
      const col = s.lf > 0 ? mix(GOLD, WARM, smooth(0, 0.6, s.lf)) : GOLD;
      HG.dot(ctx, col, x, y, sz * (1 + 1.4 * s.flash), Math.min(1, a));
      if (s.wave > 0.02) HG.dot(ctx, WARM, x, y, 38, 0.4 * s.wave * calm * s.a);
      if (s.flash > 0.05) HG.dot(ctx, WARM, x, y, 40 * s.flash, 0.45 * s.flash * calm);
      // a rising spark draws a continuous, tapering streak behind it
      if (s.lf > 0.02 && riser) {
        const b = P(J, STARS[i][0], STARS[i][1]);
        let px = x, py = y;
        for (let j = 1; j <= 4; j++) {
          const q = liftOffset(i, s.lf - j * 0.03), qx = b[0] + q[0], qy = b[1] + q[1];
          ctx.globalAlpha = Math.min(1, a) * 0.5 * (1 - j / 5);
          ctx.strokeStyle = rgba(col, 1); ctx.lineWidth = Math.max(0.6, sz * 0.24 * (1 - j / 5));
          ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke();
          px = qx; py = qy;
        }
        ctx.globalAlpha = 1;
      }
    }
    // the ring of light makes the coat's spots glint: soft warm stars with a short four-point flare
    if (photo > 0.05) {
      for (let i = 0; i < NN; i++) {
        const typ = STARS[i][2]; if (typ > 1) continue;
        const S = TREE[i];
        const g = bump(t, T_WAVE + D_WAVE * S.fe * 0.97, 0.11) * photo * (0.6 + 0.4 * STARS[i][5]);
        if (g < 0.02) continue;
        const [x, y] = P(J, STARS[i][0], STARS[i][1]);
        const k = g * calmAt(y, t); if (k < 0.02) continue;
        HG.dot(ctx, WARM, x, y, 16, 0.75 * k);
        const l = 13 * k + 4, r = S.rot * 0.15;
        ctx.globalAlpha = 0.6 * k; ctx.strokeStyle = rgba(WARM, 1); ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(x - l * Math.cos(r), y - l * Math.sin(r)); ctx.lineTo(x + l * Math.cos(r), y + l * Math.sin(r));
        ctx.moveTo(x + l * Math.sin(r), y - l * Math.cos(r)); ctx.lineTo(x - l * Math.sin(r), y + l * Math.cos(r));
        ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
    ctx.restore();

    // ---- eyes: large eyeshine in the dark, a quiet catchlight on the photo, last to go out
    {
      const blink = smooth(T_BLINK, T_BLINK + 0.1, t) * (1 - smooth(T_BLINK + 0.15, T_BLINK + 0.28, t));
      const open = smooth(T_EYES, T_EYES + 0.3, t) * (1 - 0.97 * blink) * (1 - smooth(T_OUT, T_OUT + 0.2, t));
      // eyeshine fades as the photo condenses; it returns only once the face has dissolved, smaller and warmer
      const late = smooth(T_REC + D_REC + 0.1, T_REC + D_REC + 0.5, t);
      const shine = 1 - smooth(T_PH, T_PH + 0.8, t) + 0.75 * late;
      const big = 1 - smooth(T_PH, T_PH + 0.8, t) + 0.3 * late;      // the almond shrinks to the real eye
      if (open > 0.01) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        EYE_A.forEach(([u, v], k) => {
          const [x, y] = P(J, u, v);
          const hw = (17 + 8 * big) * (J.s / 0.7), hh = 0.55 * hw;
          if (shine > 0.01) {
            HG.dot(ctx, late > 0 ? AMBER : GOLD, x, y, 5 * hw, 0.24 * open * shine);
            HG.dot(ctx, GOLD, x, y, 2.6 * hw, 0.32 * open * shine);
            ctx.save(); ctx.translate(x, y); ctx.rotate(k ? -0.1 : 0.1); ctx.scale(1, Math.max(0.02, open));
            const g = ctx.createRadialGradient(0, 0, 0, 0, 0, hw);
            // a round pupil (jaguars have round pupils, like all the big cats) in a gold iris
            g.addColorStop(0, rgba(AMBER, 0.35 * shine)); g.addColorStop(0.24, rgba(AMBER, 0.45 * shine));
            g.addColorStop(0.34, rgba(late > 0 ? GOLD : WARM, shine)); g.addColorStop(0.62, rgba(GOLD, shine)); g.addColorStop(1, rgba(AMBER, 0.55 * shine));
            ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-hw, 0); ctx.quadraticCurveTo(0, -hh * 1.9, hw, 0); ctx.quadraticCurveTo(0, hh * 1.9, -hw, 0); ctx.fill();
            ctx.restore();
          }
          HG.dot(ctx, WARM, x - 0.22 * hw, y - 0.22 * hw, 0.5 * hw, open * (0.3 + 0.5 * shine));
        });
        ctx.restore();
      }
    }

    // ---- front leaves (occlude the jaguar), then their glow
    {
      const c = LF.ctx; HG.reset(c); c.clearRect(0, 0, W, W);
      leafLayer(c, FRONT, t, sunK, 1 + 0.05 * dk);
      leafLayer(c, NEAR, t, sunK, 1 + 0.07 * dk);
      HG.drawLayer(ctx, LF, { alpha: leafA });
      bloom(ctx, LF, 9, 0.26 * leafA);
    }

    // ---- fireflies from the cenote, fading as the morning grows
    {
      const fa = smooth(0, 0.6, t) * (1 - smooth(4.4, 6.0, t));
      if (fa > 0) {
        const R = HG.rng(5);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 34; i++) {
          const ang = R() * TAU, rad = 120 + R() * 360, ph = R() * TAU, ph2 = R() * TAU, fr = 1.6 + R() * 1.6, sz = 12 + R() * 10;
          const x = C + Math.cos(ang) * rad + 46 * Math.sin(t * 0.45 + ph) + 22 * Math.sin(t * 1.15 + ph2);
          const y = C + Math.sin(ang) * rad + 34 * Math.sin(t * 0.55 + ph2) - 14 * t;
          const blink = Math.pow(0.5 + 0.5 * Math.sin(t * fr + ph), 3);
          HG.dot(ctx, FLY, x, y, sz * 2.4, 0.22 * blink * fa);
          HG.dot(ctx, FLY, x, y, sz, 0.85 * blink * fa);
        }
        ctx.restore();
      }
    }

    // ---- the forest floor lies in shade: keeps the title band calm while the title is up
    {
      const k = calmK(t);
      if (k > 0) {
        HG.reset(ctx);
        const g = ctx.createLinearGradient(0, 690, 0, 860);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${0.58 * k})`);
        ctx.fillStyle = g; ctx.fillRect(0, 690, W, W - 690);
      }
    }
  },
});
</script></body></html>
