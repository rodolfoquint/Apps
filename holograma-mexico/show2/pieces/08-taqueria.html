3,282.1,281.8,281.2,280.3,279,277.4,275.3,272.5,269.9,268.1,266.7,265.7,264.9,264,263,262.2,261.8,261.7,261.8,261.7,261.2,260.6,259.8,259,258.2,257.6,257.5,257.5,257.4,257.4,257.4,257.2,256.4,254.6,252.8,252.2,252.5,253.2,254,254.7,255.2,255.2,254.7,253.1,250.3,247.4,245.9,245.2,244.8,244.7,244.9,244.9,244.7,244.4,244.1,243.9,243.7,243.2,242.6,241.9,241.1,240.4,239.8,239.1,238.4,238,237.6,237.3,237.1,237.2,237.3,236.8,235.9,235.7,236.1,236.3,236,235.2,233.7,231.6,229.7,228.4,227.4,226.8,226.5,226.1,225.6,225.3,225.5,225.9,226.3,226.4,226,224.7,223.3,222.8,222.6,222.5,222.1,220.8,218.3,215.7,214.6,214.5,214.5,214.5,214.4,214.3,214.3,214.4,214.1,212.1,209.5,208.3,208,207.9,207.6,207.4,207.5,207.9,208.2,208.4,208.2,207.4,205.7,203.5,201.9,201.2,200.9,200.5,200.1,199.9,199.6,199.2,198.8,198.5,198.5,198.8,199.1,199.5,199.9,199.9,199.6,199.3,199.2,199.5,199.8,199.6,199,198.3,197.5,196.6,195.7,193.7,189,182.9,177.9,174.3,172.3,171.7,171.7,172,172.2,172.2,171.9,171.6,171.5,171.2,170.9,170.4,169.8,169.1,168.5,168,167.4,166.8,166.5,166.6,167.1,167.4,167.2,166.9,166.5,165.7,164.9,164.4,163.9,162.9,160.6,158,156.6,156,155.5,154.8,154.2,153.8,153.5,153.1,152.9,152.7,152.4,152.2,151.9,151.5,151,150.3,149.1,146.5,142.5,139.3,137.8,136.8,135.9,135.4,134.9,134.6,134.3,134,133.7,133.4,133.1,132.7,132.3,131.7,130.8,129.6,128.3,127.4,126.6,125.8,124.9,124.1,123.5,123.3,123.1,122.3,120.8,119.7,119.1,118.8,118.4,117.9,117.2,116.6,116,115.3,114.5,114.1,113.6,113,112.3,111.6,111,110.4,109.9,109.2,108.3,107.1,105.7,104,102,99.9,97.9,95.7,93.6,91.6,89.4,87.7,86.9,86.4,85.8,85,84.2,83.5,82.7,82,81.1,80.2,79.5,79.1,78.5,77.7,76.8,75.6,74.5,73.3,72.1,71.1,70.4,69.8,69.2,68.5,67.2,65.5,63.8,61.9,59.8,58.1];
const { W, C, S, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const TAU = Math.PI * 2;
const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const bump = (t, a, b, c, d) => smooth(a, b, t) * (1 - smooth(c, d, t));
const hash = (i, j = 0) => { const s = Math.sin(i * 127.1 + j * 311.7 + 0.37) * 43758.5453; return s - Math.floor(s); };
const vnoise = (x, s = 0) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i, s), hash(i + 1, s), u) * 2 - 1; };
const fbm = (x, s = 0) => 0.65 * vnoise(x, s) + 0.35 * vnoise(x * 2.3 + 5.1, s + 7);
const outBackS = (x, s = 0.8) => { x = clamp(x); return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };

// ---------- palette (afternoon: fire orange, achiote red, warm gold light, fresh greens)
const FIRE_Y = [255, 204, 96], FIRE_O = [255, 118, 24], FIRE_R = [226, 44, 12], EMBER = [255, 160, 52],
  SUN = [255, 186, 104], STEAM = [255, 212, 150], STEEL = [205, 222, 255], GOLD = [255, 200, 92], MOTE = [255, 222, 150],
  LIME = [160, 255, 90], WHITE = [255, 250, 240];

// ---------- trompo texture and silhouette
const TEX_W = 2048, TEX_H = 1283, NP = 373;           // texture: 2pi over TEX_W px (+128 repeated), pineapple rows 0..NP
const PXR = TEX_W / TAU;
const prof0 = v => { const x = clamp(v / 2, 0, PR.length - 1), i = Math.floor(x), f = x - i; return lerp(PR[i], PR[Math.min(i + 1, PR.length - 1)], f); };
// the pineapple's rows are rounded off into a whole peeled fruit, its crown cut off flat
const prof = v => v >= NP ? prof0(v) : Math.min(prof0(v), 152 * Math.pow(Math.max(0, 1 - Math.pow((v - 196) / 214, 2)), 0.42));
const MAXR = 296;
// the adobo graded toward achiote red-orange once (a cache of the asset, the same for every frame)
let GT = null;
function graded(A) {
  if (GT) return GT;
  GT = document.createElement('canvas'); GT.width = A.tex.width; GT.height = A.tex.height;
  const g = GT.getContext('2d'), h = GT.height - NP;
  g.drawImage(A.tex, 0, 0);
  g.clearRect(0, NP, GT.width, h);
  g.filter = 'saturate(1.32) hue-rotate(-8deg) contrast(1.05)';
  g.drawImage(A.tex, 0, NP, GT.width, h, 0, NP, GT.width, h);
  g.filter = 'none';
  return GT;
}

// ---------- timeline
const T_MOVE = 3.85, D_MOVE = 1.35;                   // camera glides: trompo to the left
const T_KIN = 4.72, T_CUT0 = 5.0, T_CUT1 = 5.5;       // knife comes in, shaves down the trompo
const T_FLICK = 5.8, T_KOUT = 6.35;                   // flicks the pineapple, leaves
const T_TACO = 5.15;                                  // tacos slide in
const T_PINE = 5.88, D_PINE = 0.96;                   // pineapple chunk in flight
const T_MOLC = 6.5;                                   // molcajete rises
const T_END = 9.9;                                    // the scene starts to evaporate
const T_FLARE = 3.0;                                  // the fire flares up (fat dripping on the burner)

// ---------- layout (still life after the camera move)
const HERO = { ax: 552, ty: 136 };
const STILL = { ax: 362, ty: 170, k: 0.365 };
const PLATE = { x: 622, y: 640, w: 505, sy: 0.82 };   // tacos frame (1024 asset px -> w)
const MOLC = { x: 832, y: 442, w: 224 };
const TACO_C = [[188, 476], [512, 490], [840, 470]];   // taco centres in asset px
const plateXY = (ax, ay) => [PLATE.x + (ax - 512) / 1024 * PLATE.w, PLATE.y + (ay - 512) / 1024 * PLATE.w * PLATE.sy];

function trompoPose(t) {
  const m = ease.inOut3((t - T_MOVE) / D_MOVE);
  const kh = 0.452 + 0.034 * ease.inOut3(t / 4.2);
  return { ax: lerp(HERO.ax, STILL.ax, m), ty: lerp(HERO.ty, STILL.ty, m), k: lerp(kh, STILL.k, m), m };
}
// slow push into the still life, about the middle of the group
const F = [560, 520];
const zoomAt = t => 1 + 0.065 * ease.inOut3((t - 6.5) / 4.6);
const cam = (z, x, y) => [F[0] + (x - F[0]) * z, F[1] + (y - F[1]) * z];

// ---------- the end: a front rises from the bottom and the solids evaporate into gold motes behind it
const T_F0 = 9.8, T_F1 = 11.12;
const frontBase = t => lerp(880, 20, smooth(T_F0, T_F1, t));
const wave = x => 20 * vnoise(x * 0.011 + 3.3, 41) + 9 * vnoise(x * 0.031, 42);
const frontY = (x, t) => frontBase(t) + wave(x);
// when the front reaches height y at column x (frontBase is monotonic: bisection)
function frontTime(x, y) {
  const yb = y - wave(x);
  if (yb >= frontBase(T_F0 + 1e-4)) return T_F0;
  let a = T_F0, b = T_F1;
  for (let i = 0; i < 22; i++) { const m = (a + b) / 2; if (frontBase(m) > yb) a = m; else b = m; }
  return (a + b) / 2;
}
// erase everything below the front (soft edge) and light the edge gold; g draws in page coordinates
function evaporate(g, t, x0, x1) {
  if (t <= T_F0) return;
  const step = 10, Y = x => frontY(x, t);
  g.save();
  g.globalCompositeOperation = 'destination-out'; g.filter = HG.blur(9); g.fillStyle = '#000';
  g.beginPath(); g.moveTo(x0 - 20, 1200);
  for (let x = x0 - 20; x <= x1 + 20; x += step) g.lineTo(x, Y(x) + 8);
  g.lineTo(x1 + 20, 1200); g.closePath(); g.fill();
  g.globalCompositeOperation = 'source-atop'; g.filter = HG.blur(10);
  g.beginPath();
  for (let x = x0 - 20; x <= x1 + 20; x += step) g.lineTo(x, Y(x) + 6);
  for (let x = x1 + 20; x >= x0 - 20; x -= step) g.lineTo(x, Y(x) - 52);
  g.closePath(); g.fillStyle = rgba([255, 196, 104], 0.62); g.fill();
  g.restore();
}

// ---------- canvases (NC and TC are private buffers in device pixels)
const NC = document.createElement('canvas'), nx = NC.getContext('2d');
const TC = document.createElement('canvas'), tx = TC.getContext('2d');
NC.width = Math.ceil(2 * MAXR * 0.5 * S) + 8; NC.height = Math.ceil(TEX_H * 0.5 * S) + 8;
TC.width = NC.width + 24; TC.height = NC.height + 8;
const FL = HG.layer(), FOOD = HG.layer(), STM = HG.layer();

// The trompo turning on its spit. Pass 1 builds the visible half of the cylinder in a normalised
// strip NC (columns u = sin(theta) from -1 to 1, the same for every row): each column strip takes the
// texture at angle theta + phi, so the meat slides round as phi turns, squeezing toward the rims.
// Light is fixed in this space (fire from the left, afternoon key from the front right, a glossy
// sheen), so the meat turns through it. Pass 2 stretches every device row of NC to the silhouette's
// width at that height, one pixel row at a time (TC), with a little heat shimmer.
const LIGHT = 0.5;
function drawTrompo(c, TEX, o) {
  const { ax, ty, k, phi, alpha } = o;
  if (alpha <= 0.003) return;
  const rows = Math.max(4, Math.round(TEX_H * k * S));
  const nw = Math.max(16, Math.round(2 * MAXR * k * S));
  const rp = Math.round(NP * k * S);
  // pass 1
  nx.globalCompositeOperation = 'source-over'; nx.globalAlpha = 1; nx.filter = 'none';
  nx.clearRect(0, 0, NC.width, NC.height);
  nx.imageSmoothingEnabled = true; nx.imageSmoothingQuality = 'high';
  let x = 0;
  while (x < nw) {
    const u0 = x / nw * 2 - 1;
    const x1 = Math.min(nw, x + (Math.abs(u0) > 0.9 ? 1 : 3)), u1 = x1 / nw * 2 - 1;
    const t0 = Math.asin(clamp(u0, -1, 1)), t1 = Math.asin(clamp(u1, -1, 1));
    let s0 = ((t0 + phi) * PXR) % TEX_W; if (s0 < 0) s0 += TEX_W;
    nx.drawImage(TEX, s0, 0, Math.max(0.01, (t1 - t0) * PXR), TEX_H, x, 0, x1 - x, rows);
    x = x1;
  }
  // light (source-atop keeps the meat's own alpha); the shadow side falls to a deep red, not grey
  nx.globalCompositeOperation = 'source-atop';
  const n = 32;
  const shade = nx.createLinearGradient(0, 0, nw, 0);
  for (let i = 0; i <= n; i++) {
    const u = i / n * 2 - 1, th = Math.asin(u);
    const I = o.amb + o.key * Math.pow(Math.max(0, Math.cos(th - LIGHT)), 0.85);
    shade.addColorStop(i / n, `rgba(34,4,0,${clamp(1 - I).toFixed(3)})`);
  }
  nx.fillStyle = shade; nx.fillRect(0, 0, nw, rows);
  const fire = nx.createLinearGradient(0, 0, nw, 0);
  for (let i = 0; i <= n; i++) {
    const u = i / n * 2 - 1;
    fire.addColorStop(i / n, rgba(FIRE_O, clamp(o.rim * Math.pow(Math.max(0, -u * 1.05), 2.2))));
  }
  nx.fillStyle = fire; nx.fillRect(0, rp, nw, rows - rp);
  nx.globalAlpha = 0.45; nx.fillRect(0, 0, nw, rp); nx.globalAlpha = 1;
  if (o.front < 1.2) {                   // still dark above the fire that is climbing the burner
    const yf = rows * (1 - o.front), band = rows * 0.28;
    const dk = nx.createLinearGradient(0, yf - band, 0, yf + band * 0.4);
    dk.addColorStop(0, `rgba(0,0,0,${o.dark.toFixed(3)})`); dk.addColorStop(1, 'rgba(0,0,0,0)');
    nx.fillStyle = dk; nx.fillRect(0, 0, nw, rows);
  }
  if (o.spec > 0.003) {
    const sp = nx.createLinearGradient(0, 0, nw, 0), us = Math.sin(0.28);
    sp.addColorStop(0, 'rgba(255,236,200,0)');
    sp.addColorStop(clamp((us + 1) / 2 - 0.09), 'rgba(255,236,200,0)');
    sp.addColorStop((us + 1) / 2, `rgba(255,236,200,${(0.16 * o.spec).toFixed(3)})`);
    sp.addColorStop(clamp((us + 1) / 2 + 0.09), 'rgba(255,236,200,0)');
    sp.addColorStop(1, 'rgba(255,236,200,0)');
    nx.fillStyle = sp; nx.fillRect(0, 0, nw, rows);
  }
  // soft rims
  nx.globalCompositeOperation = 'destination-out';
  const rim = nx.createLinearGradient(0, 0, nw, 0);
  rim.addColorStop(0, 'rgba(0,0,0,1)'); rim.addColorStop(1.6 / nw, 'rgba(0,0,0,0)');
  rim.addColorStop(1 - 1.6 / nw, 'rgba(0,0,0,0)'); rim.addColorStop(1, 'rgba(0,0,0,1)');
  nx.fillStyle = rim; nx.fillRect(0, 0, nw, rows);
  // pass 2
  tx.globalCompositeOperation = 'source-over'; tx.globalAlpha = 1; tx.filter = 'none';
  tx.clearRect(0, 0, TC.width, TC.height);
  tx.imageSmoothingEnabled = true; tx.imageSmoothingQuality = 'high';
  const cx = TC.width / 2, t = o.t;
  for (let ky = 0; ky < rows; ky++) {
    const v = (ky + 0.5) / rows * TEX_H, r = prof(v) * k * S;
    const yy = ky / S;
    const dx = o.heat * S * 0.9 * Math.sin(yy * 0.13 + t * 9.0) * (0.55 + 0.45 * Math.sin(yy * 0.037 - t * 2.6));
    tx.drawImage(NC, 0, ky, nw, 1, cx - r + dx, ky, 2 * r, 1);
  }
  const X0 = ax - cx / S, wC = TC.width / S, hC = TC.height / S;
  if (t > T_F0) {                         // the end: evaporates from the bottom up (TC in page units)
    tx.save(); tx.scale(S, S); tx.translate(-X0, -ty);
    evaporate(tx, t, X0, X0 + wC);
    tx.restore();
  }
  // composite with a warm bloom
  c.save();
  c.globalCompositeOperation = 'lighter'; c.globalAlpha = 0.3 * alpha; c.filter = HG.blur(16);
  c.drawImage(TC, X0, ty, wC, hC);
  c.filter = 'none'; c.globalCompositeOperation = 'source-over'; c.globalAlpha = alpha;
  c.drawImage(TC, X0, ty, wC, hC);
  c.restore();
}

// the steel spit through the trompo: a stub below the meat, and its pointed tip above the pineapple
function drawSpit(c, P, alpha, t, fireLit) {
  if (alpha <= 0.003) return;
  const { ax, ty, k } = P, sc = k / 0.5, w = 9 * sc;
  const rod = (y0, y1, a0, a1, tip) => {
    const fa = (y) => t > T_F0 ? clamp((frontY(ax, t) - y) / 30) : 1;
    const A0 = a0 * fa(y0), A1 = a1 * fa(y1);
    if (Math.max(A0, A1) <= 0.003) return;
    c.save();
    c.beginPath();
    if (tip) { c.moveTo(ax - w / 2, y1); c.lineTo(ax - w / 2, y0 + tip); c.lineTo(ax, y0); c.lineTo(ax + w / 2, y0 + tip); c.lineTo(ax + w / 2, y1); }
    else c.rect(ax - w / 2, y0, w, y1 - y0);
    c.closePath(); c.clip();
    const g = c.createLinearGradient(ax - w / 2, 0, ax + w / 2, 0);   // round rod: fire on the left, sky on the right
    g.addColorStop(0, rgba(mix([90, 70, 70], [255, 150, 70], fireLit), 1)); g.addColorStop(0.3, 'rgba(70,76,92,1)');
    g.addColorStop(0.62, 'rgba(225,232,248,1)'); g.addColorStop(0.8, 'rgba(150,160,182,1)'); g.addColorStop(1, 'rgba(50,54,66,1)');
    c.fillStyle = g; c.fillRect(ax - w, y0, 2 * w, y1 - y0);
    c.globalCompositeOperation = 'destination-in';
    const v = c.createLinearGradient(0, y0, 0, y1);
    v.addColorStop(0, `rgba(0,0,0,${A0})`); v.addColorStop(1, `rgba(0,0,0,${A1})`);
    c.fillStyle = v; c.fillRect(ax - w, y0, 2 * w, y1 - y0);
    c.restore();
  };
  const top = ty - 54 * sc;
  rod(top, ty + 40 * k, alpha, alpha, 12 * sc);                        // tip above the pineapple
  const bot = ty + TEX_H * k;
  rod(bot - 10 * k, bot + 24 * sc, alpha * 0.9, 0, 0);                   // stub below the meat
}

// ---------- fire: a vertical side burner (its ceramic face glowing) a little off the meat's left
// side, with distinct flickering tongues whose tips lick toward the meat
const BURN = { gap: 36, v0: NP + 34, v1: TEX_H - 64, NS: 7 };

      const r1 = hash(id * 53 + cyc, 63), r2 = hash(id * 53 + cyc, 64), r3 = hash(id * 53 + cyc, 65);

      const s0 = smooth(0.45, 1, a) * 0.8;                                  // and parts from the burner

const rotPt = (x, y, ang, lx, ly) => [x + lx * Math.cos(ang) - ly * Math.sin(ang), y + lx * Math.sin(ang) + ly * Math.cos(ang)];

// the knife's path (still-life coordinates, before the camera zoom)
const meatEdge = (P, y) => P.ax + prof((y - P.ty) / P.k) * P.k;
// the direction up along the meat's right side from height y (the blade lies along it)
const alongAng = (P, y) => { const d = 120; return clamp(Math.atan2(-d, meatEdge(P, y - d) - meatEdge(P, y)), -1.5, -1.08); };

function knifeAt(t) {
  const P = STILL;

  const yPine = P.ty + NP * 0.62 * P.k, pxP = P.ax + prof(NP * 0.62) * P.k + 6;
  const cutStart = { x: meatEdge(P, yA) + 3, y: yA, ang: alongAng(P, yA) };
  const cutEnd = { x: meatEdge(P, yB) + 3, y: yB, ang: alongAng(P, yB) };

    ang = lerp(-0.7, cutStart.ang, u); a = smooth(T_KIN, T_KIN + 0.16, t);

  } else if (t < T_FLICK) {               // swings out to the right and up, round to the pineapple
    const u = ease.inOut3((t - T_CUT1) / (T_FLICK - T_CUT1));
    x = qb(cutEnd.x, cutEnd.x + 250, flick0.x, u); y = qb(cutEnd.y, cutEnd.y - 330, flick0.y, u);
    ang = lerp(cutEnd.ang, flick0.ang + TAU * 0, ease.inOut3(u));

// steam: a plume of three soft filaments rising from (x0, y0), each a tapered ribbon: thin and bright
// at the foot, wider and fainter as it climbs. Smooth noise drifting upward with the steam bends them
// gently (the wisps visibly rise). lift: the plume's foot (rises at the end, so the steam lets go);
// topFade: the plume dissolves from the top down. Drawn into STM, blurred when composited.
function plume(g, x0, y0, t, seed, { H = 300, amp = 1, w0 = 5, w1 = 36, alpha = 0.2, speed = 1, lift = 0, topFade = 0, lean = 0, collapse = 0 } = {}) {
  const top = H - (H - lift) * clamp(topFade);
  if (top - lift < 8 || alpha <= 0.003) return;
  const rise = 55 * speed;
  // brightness by height above the source (not by the visible span), so a plume that lets go
  // keeps only its faint upper wisps, softly cut at both ends
  const lum = h => smooth(0, 16, h) * (0.28 + 0.72 * Math.exp(-h / 190)) * (lift > 0 ? smooth(lift, lift + 60, h) : 1)
    * (1 - smooth(top - Math.max(30, 0.4 * (top - lift)), top, h));
  for (let r = 0; r < 3; r++) {
    if (r !== 1 && collapse > 0.995) continue;          // once it lets go, a plume is a single soft wisp
    const N = 20, L = [], R = [];
    for (let j = 0; j <= N; j++) {
      const h = lerp(lift, top, j / N), q = (h - rise * t) * 0.0062;
      const A = amp * (5 + 0.15 * h);
      const x = x0 + A * fbm(q + seed * 3.1, 70) + lean * h + (r - 1) * (2 + 0.14 * h) * (1 - 0.8 * collapse)
        + 0.15 * A * (1 - collapse) * vnoise(q * 1.9 + r * 4.3 + seed, 71);     // small, so filaments never cross
      const hw = 0.5 * lerp(w0, w1, clamp(h / 420)) * (r === 1 ? 1 : 0.6);
      L.push([x - hw, y0 - h]); R.push([x + hw, y0 - h]);
    }
    const yA = y0 - lift, yB = y0 - top;
    const gr = g.createLinearGradient(0, yA, 0, yB);
    const al = alpha * (r === 1 ? 1 : 0.6 * (1 - collapse));
    for (let i = 0; i <= 10; i++) gr.addColorStop(i / 10, rgba(STEAM, al * lum(lerp(lift, top, i / 10))));
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(L[0][0], L[0][1]);
    for (let j = 1; j < N; j++) g.quadraticCurveTo(L[j][0], L[j][1], (L[j][0] + L[j + 1][0]) / 2, (L[j][1] + L[j + 1][1]) / 2);
    g.lineTo(L[N][0], L[N][1]); g.lineTo(R[N][0], R[N][1]);
    for (let j = N - 1; j > 0; j--) g.quadraticCurveTo(R[j][0], R[j][1], (R[j][0] + R[j - 1][0]) / 2, (R[j][1] + R[j - 1][1]) / 2);
    g.lineTo(R[0][0], R[0][1]); g.closePath(); g.fill();
  }
}

const MOTES = [];
{
  const R = HG.rng(5150), P = STILL;
  for (let i = 0; i < 150; i++) {
    const w = R();
    let x, y;
    if (w < 0.5) {                                          // the tacos
      const j = Math.floor(R() * 3), an = R() * TAU, rr = Math.sqrt(R());
      [x, y] = plateXY(TACO_C[j][0] + Math.cos(an) * rr * 150, TACO_C[j][1] + Math.sin(an) * rr * 250);
    } else if (w < 0.66) {                                  // the molcajete
      const an = R() * TAU, rr = Math.sqrt(R()) * MOLC.w * 0.36;
      x = MOLC.x + Math.cos(an) * rr; y = MOLC.y + 10 + Math.sin(an) * rr * 0.85;
    } else {                                                // the trompo
      const v = R() * (TEX_H - 30) + 10, u = R() * 2 - 1;
      x = P.ax + u * prof(v) * P.k * 0.9; y = P.ty + v * P.k;
    }
    MOTES.push({ x, y, vy: 70 + 110 * R(), dr: (R() - 0.5) * 40, life: 0.55 + 0.4 * R(), s: 6 + 8 * R(), ph: R() * TAU, col: R() < 0.7 ? GOLD : MOTE });
  }
}

HG.start({
  duration: 12,
  assets: {
    tex: '../assets/08-taqueria-trompo_tex.png',
    t1: '../assets/08-taqueria-taco1.png', t2: '../assets/08-taqueria-taco2.png', t3: '../assets/08-taqueria-taco3.png',
    molc: '../assets/08-taqueria-molcajete.png', molcL: '../assets/08-taqueria-molcajete_lines.png',
  },
  render(t, A) {
    const TEX = graded(A);
    const P0 = trompoPose(t);
    const Z = zoomAt(t);
    const [axZ, tyZ] = cam(Z, P0.ax, P0.ty);
    const P = { ax: axZ, ty: tyZ, k: P0.k * Z };
    const sc = P.k / 0.5;
    const ign = smooth(0.1, 1.25, t);                                // burner lights bottom to top
    const flareK = bump(t, T_FLARE - 0.02, T_FLARE + 0.08, T_FLARE + 0.42, T_FLARE + 0.75);
    const fireDie = 1 - smooth(T_END - 0.35, T_END + 0.45, t);       // the fire dies down first
    const fireP = (0.88 + 0.12 * fbm(t * 6.5, 21)) * smooth(0.05, 0.5, t) * fireDie;
    const xb = burnerX(P);
    const midY = P.ty + (BURN.v0 + BURN.v1) / 2 * P.k;

    // ---- afternoon light: a low shaft from the upper right, golden motes drifting in it
    const sunA = smooth(0.9, 2.8, t) * (1 - smooth(T_END - 0.3, T_END + 0.6, t));
    const shaftA = smooth(6.4, 7.8, t) * (1 - smooth(T_END - 0.2, T_END + 0.5, t));
    if (shaftA > 0.003) {
      const sw = 0.03 * Math.sin(t * 0.35);
      const ang = 2.18 + sw, dx = Math.cos(ang), dy = Math.sin(ang), nx_ = -dy, ny_ = dx;
      const ox = 990, oy = 90, len = 820, w0 = 120, w1 = 300;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.filter = HG.blur(36);
      const g = ctx.createLinearGradient(ox, oy, ox + dx * len, oy + dy * len);
      const br = shaftA * (0.85 + 0.15 * Math.sin(t * 0.9));
      g.addColorStop(0, rgba(SUN, 0)); g.addColorStop(0.14, rgba(SUN, 0.15 * br)); g.addColorStop(0.5, rgba(SUN, 0.1 * br)); g.addColorStop(0.85, rgba(SUN, 0.03 * br)); g.addColorStop(1, rgba(SUN, 0));
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(ox + nx_ * w0 / 2, oy + ny_ * w0 / 2); ctx.lineTo(ox + dx * len + nx_ * w1 / 2, oy + dy * len + ny_ * w1 / 2);
      ctx.lineTo(ox + dx * len - nx_ * w1 / 2, oy + dy * len - ny_ * w1 / 2); ctx.lineTo(ox - nx_ * w0 / 2, oy - ny_ * w0 / 2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    if (sunA > 0.003) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 30; i++) {
        const r1 = hash(i, 81), r2 = hash(i, 82), r3 = hash(i, 83);
        const along = 80 + 560 * r1, across = (r2 - 0.5) * (120 + 0.25 * along);
        const ang = 2.18;
        const x = 990 + Math.cos(ang) * along - Math.sin(ang) * across + 16 * Math.sin(t * 0.4 + i) + 7 * t;
        const y = 90 + Math.sin(ang) * along + Math.cos(ang) * across - 6 * t + 9 * Math.cos(t * 0.33 + i * 1.7);
        if (y > 700) continue;
        const a = sunA * (0.3 + 0.28 * Math.sin(t * (1.3 + r3) + i * 2.1)) * (1 - smooth(560, 700, y)) * (0.55 + 0.45 * shaftA);
        HG.dot(ctx, i % 4 ? GOLD : WHITE, x, y, 6 + 6 * r3, a);
      }
      ctx.restore();
    }

    // ---- fire glow round the burner (an eased falloff that melts into black)
    if (fireP > 0.003) {
      const gA = fireP * ign * (1 + 1.1 * flareK);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.translate(xb + 20 * sc, midY); ctx.scale(0.8, 1.25);
      const R = 330 * sc, g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
      for (let i = 0; i <= 8; i++) {
        const q = i / 8, e = Math.pow(1 - q, 2.2) * (1 - q * q);
        g.addColorStop(q, rgba(mix(FIRE_O, FIRE_R, q), 0.2 * gA * e));
      }
      ctx.fillStyle = g; ctx.fillRect(-R, -R, 2 * R, 2 * R);
      ctx.restore();
    }

    // ---- the burner, its flames (a soft glow pass behind the meat), the spark that lights it
    const show = smooth(0.2, 1.0, t);
    drawBurner(ctx, t, P, fireP, ign, smooth(0.15, 0.9, t) * (1 - smooth(T_END + 0.2, T_END + 0.8, t)));
    const hasFire = drawFlames(t, P, fireP, ign, flareK);
    if (hasFire) {
      HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.55; ctx.filter = HG.blur(16); ctx.drawImage(FL.cv, 0, 0, W, W);
      HG.reset(ctx);
    }
    {
      const u = (t - 0.12) / 1.05;
      if (u > 0 && u < 1.15) {
        const vv = lerp(BURN.v1, BURN.v0, clamp(u)), e = Math.sin(Math.PI * clamp(u / 1.15));
        const x = xb - 2 * sc, y = P.ty + vv * P.k;
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        HG.dot(ctx, FIRE_O, x, y, 90, 0.32 * e);
        ctx.restore();
        star(ctx, x, y, 66 * e, 0.8 * e, t * 2, FIRE_Y);
      }
    }

    // ---- the trompo, the spit through it, the flames licking at its side
    const key = 0.8 * smooth(0.75, 2.1, t), amb = 0.1 + 0.2 * smooth(0.5, 1.9, t);
    const phi = -0.5 * t + 0.6;
    drawSpit(ctx, P, show * (0.2 + 0.8 * key), t, 0.6 * fireP * ign);
    drawTrompo(ctx, TEX, { ...P, phi, alpha: show, amb, key, rim: (0.42 + 0.2 * fireP + 0.3 * flareK) * smooth(0.15, 0.8, t) * (0.35 + 0.65 * fireDie), spec: key,
      heat: fireP, t, front: ign * 1.15, dark: 0.85 * (1 - smooth(1.1, 1.9, t)) });
    if (hasFire) {
      HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.4; ctx.filter = HG.blur(6); ctx.drawImage(FL.cv, 0, 0, W, W);
      ctx.globalAlpha = 0.9; ctx.filter = HG.blur(2); ctx.drawImage(FL.cv, 0, 0, W, W);
      HG.reset(ctx);
    }
    // the spit's tip catches the afternoon light as it comes up
    {
      const u = (t - 1.75) / 0.8;
      if (u > 0 && u < 1) star(ctx, P.ax + 1, P.ty - 50 * sc, 70 * Math.sin(Math.PI * u), 0.75 * Math.sin(Math.PI * u), 0.2, STEEL);
    }

    // ---- embers flying up off the flames
    {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 36; i++) {
        const per = 1.2 + hash(i, 1) * 1.1, x_ = t / per + hash(i, 2), cyc = Math.floor(x_), age = x_ - cyc;
        const tb = t - age * per;
        if (tb < 0.3 || tb > T_END) continue;
        const r1 = hash(i * 7 + cyc, 3), r2 = hash(i * 7 + cyc, 4), r3 = hash(i * 7 + cyc, 5);
        if (smooth(0.1, 1.25, tb) < r1 * 0.85 + 0.1) continue;
        const Pb = trompoPose(tb), Zb = zoomAt(tb);
        const vv = lerp(BURN.v1, BURN.v0, r1);
        const Pz = { ax: cam(Zb, Pb.ax, 0)[0], k: Pb.k * Zb };
        const gx = lerp(burnerX(Pz), edgeL(Pz, vv), 0.5);
        const [, by] = cam(Zb, 0, Pb.ty + vv * Pb.k);
        const life = per * age;
        const x = gx + (r2 - 0.45) * 50 * life + 12 * Math.sin(life * 5 + r3 * 6);
        const y = by - (110 + 120 * r3) * life - 25 * life * life;
        const a = Math.sin(Math.PI * Math.pow(age, 0.7)) * (0.5 + 0.45 * Math.sin(t * 19 + i * 2.3)) * fireDie;
        HG.dot(ctx, r2 < 0.5 ? FIRE_Y : EMBER, x, y, 7 + 6 * r2, a);
      }
      ctx.restore();
    }
    // the flare: the tongues leap, and big embers with short trails burst up and out
    {
      const fa = t - T_FLARE - 0.05;
      if (fa > 0 && fa < 1.5) {
        for (let i = 0; i < 16; i++) {
          const d = hash(i, 101) * 0.16, a = fa - d, life = 1.0 + 0.45 * hash(i, 107); if (a <= 0 || a > life) continue;
          const vv = lerp(BURN.v1 - 120, BURN.v0 + 60, hash(i, 102));
          const bx = lerp(xb, edgeL(P, vv), 0.4), by = P.ty + vv * P.k;
          const an = -Math.PI / 2 - 0.6 + hash(i, 103) * 1.05, v = 380 + 320 * hash(i, 104);
          const pos = aa => { const dr = (1 - Math.exp(-1.6 * aa)) / 1.6; return [bx + Math.cos(an) * v * dr, by + Math.sin(an) * v * dr + 130 * aa * aa]; };
          const fade = Math.pow(1 - a / life, 1.2) * (0.8 + 0.2 * Math.sin(t * 23 + i));
          const tr = []; for (let j = 0; j <= 9; j++) tr.push(pos(Math.max(0, a - j * 0.03)));
          const col = hash(i, 105) < 0.5 ? FIRE_Y : EMBER;
          streak(ctx, tr, col, 5.5, 0.95 * fade);
          ctx.save(); ctx.globalCompositeOperation = 'lighter';
          HG.dot(ctx, FIRE_O, tr[0][0], tr[0][1], 70 + 26 * hash(i, 106), 0.4 * fade);     // a warm halo
          HG.dot(ctx, col, tr[0][0], tr[0][1], 30 + 12 * hash(i, 106), 0.95 * fade);      // the ember
          ctx.restore();
        }
      }
    }
    // sizzle: grease pops on the fire side of the meat
    for (let i = 0; i < 9; i++) {
      const per = 0.75 + hash(i, 31) * 0.5, x_ = t / per + hash(i, 32), cyc = Math.floor(x_), age = (x_ - cyc) * per;
      if (age > 0.28 || t < 1.3 || t > T_END) continue;
      const vv = NP + 50 + hash(i * 13 + cyc, 33) * (TEX_H - NP - 200);
      const u = -0.3 - 0.55 * hash(i * 13 + cyc, 34);
      const x = P.ax + u * prof(vv) * P.k, y = P.ty + vv * P.k, e = Math.sin(Math.PI * age / 0.28);
      star(ctx, x, y, 40 * e * sc, 0.8 * e * fireDie, hash(i, cyc), FIRE_Y);
    }
    // the pineapple glints
    for (const [tg, du] of [[2.5, 0.85], [8.6, 0.85]]) {
      const u = (t - tg) / du; if (u <= 0 || u >= 1) continue;
      const vv = NP * 0.3, x = P.ax + prof(vv) * P.k * 0.5, y = P.ty + vv * P.k, e = Math.sin(Math.PI * u);
      star(ctx, x, y, 160 * e * sc, e, u * 0.8, GOLD);
      HG.dot(ctx, GOLD, x, y, 110 * e * sc, 0.22 * e);
    }

    // ---- molcajete and tacos (FOOD layer, with bloom)
    const fg = FOOD.ctx; HG.reset(fg); fg.clearRect(0, 0, W, W);
    let food = false;
    const mU = (t - T_MOLC) / 0.95;
    if (mU > 0) {
      food = true;
      const [mx, my] = cam(Z, MOLC.x, MOLC.y + 50 * (1 - ease.out3(mU)));
      const mw = MOLC.w * Z * lerp(0.88, 1, outBackS(mU, 1.1));
      fg.save(); fg.globalAlpha = smooth(0, 0.4, mU);
      fg.drawImage(A.molc, mx - mw / 2, my - mw / 2, mw, mw);
      fg.globalCompositeOperation = 'lighter'; fg.globalAlpha = 0.45 * smooth(0, 0.4, mU);
      fg.drawImage(A.molcL, mx - mw / 2, my - mw / 2, mw, mw);
      fg.restore();
    }
    const tacoImgs = [A.t1, A.t2, A.t3];
    const pw = PLATE.w * Z, ph = PLATE.w * PLATE.sy * Z;
    const [plx, ply] = cam(Z, PLATE.x, PLATE.y);
    for (const i of [0, 2, 1]) {                     // the middle taco lies on its neighbours' rims
      const s = tacoSlide(t, i);
      if (s.a <= 0.003) continue;
      food = true;
      const [px, py] = cam(Z, ...plateXY(...TACO_C[i]));
      fg.save(); fg.globalAlpha = s.a;
      fg.translate(px + s.dx * Z, py); fg.rotate(s.rot); fg.translate(-px, -py);
      fg.drawImage(tacoImgs[i], plx - pw / 2, ply - ph / 2, pw, ph);
      fg.restore();
    }
    // the flicked pineapple chunk, settled on the middle taco
    const P1 = STILL, pin0 = [P1.ax + 150 * P1.k, P1.ty + NP * 0.55 * P1.k], pin1 = plateXY(498, 452);
    const landT = T_PINE + D_PINE;
    if (t >= landT) {
      const b = t - landT, bounce = 9 * Math.exp(-7 * b) * Math.abs(Math.sin(b * 14));
      const [X, Y] = cam(Z, pin1[0], pin1[1] - bounce);
      drawChunk(fg, TEX, X, Y, 34 * Z, 0.18, 1);
    }
    if (food) {
      // a sheen of light slides across the food
      const su = (t - 7.95) / 1.3;
      if (su > 0 && su < 1) {
        fg.save(); fg.globalCompositeOperation = 'source-atop';
        const sx = lerp(300, 1040, ease.inOut3(su));
        const gr = fg.createLinearGradient(sx - 110, 300, sx + 110, 460);
        gr.addColorStop(0, 'rgba(255,236,190,0)'); gr.addColorStop(0.5, `rgba(255,236,190,${0.42 * Math.sin(Math.PI * su)})`); gr.addColorStop(1, 'rgba(255,236,190,0)');
        fg.fillStyle = gr; fg.fillRect(0, 0, W, W); fg.restore();
      }
      evaporate(fg, t, 0, W);
      HG.reset(ctx); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.26; ctx.filter = HG.blur(14); ctx.drawImage(FOOD.cv, 0, 0, W, W);
      HG.reset(ctx); ctx.drawImage(FOOD.cv, 0, 0, W, W); HG.reset(ctx);
    }

    // ---- the knife (with a smear of ghosts when it moves fast)
    if (t > T_KIN && t < T_KOUT) {
      const K = knifeAt(t);
      if (t > T_CUT0 && t < T_CUT1 + 0.15) {           // a faint slash of light along the shaved surface
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.filter = HG.blur(4);
        const N = 10;
        for (let j = 0; j < N; j++) {
          const ta = t - j * 0.025, tb = t - (j + 1) * 0.025;
          if (tb < T_CUT0) break;
          if (ta > T_CUT1) continue;
          const Ka = knifeAt(ta), Kb = knifeAt(tb);
          ctx.strokeStyle = rgba([255, 200, 150], (1 - j / N) * 0.3); ctx.lineWidth = 8 * (1 - j / N) + 2;
          ctx.beginPath(); ctx.moveTo(...cam(Z, Ka.x - 2, Ka.y)); ctx.lineTo(...cam(Z, Kb.x - 2, Kb.y)); ctx.stroke();
        }
        ctx.restore();
      }
      // motion smear: the area the blade swept over the last frame, a soft wedge of steel light
      const Kp = knifeAt(t - 1 / 30), speed = Math.hypot(K.x - Kp.x, K.y - Kp.y) + 90 * Math.abs(K.ang - Kp.ang);
      const smear = smooth(8, 36, speed) * K.a;
      if (smear > 0.01) {
        const M = 8, tips = [], ends = [];
        for (let j = 0; j <= M; j++) {
          const Kg = knifeAt(t - j * (1.4 / 30) / M), [gx, gy] = cam(Z, Kg.x, Kg.y), bl = KL * KS * Z;
          tips.push([gx, gy]); ends.push([gx + Math.cos(Kg.ang) * bl, gy + Math.sin(Kg.ang) * bl]);
        }
        // a few thin ghost edges, fading along each line and with age (motion blur, not a shape)
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.filter = HG.blur(1.5); ctx.lineCap = 'round';
        for (let j = 1; j <= M; j += 2) {
          const g = ctx.createLinearGradient(...tips[j], ...ends[j]), a = 0.16 * smear * (1 - j / (M + 1));
          g.addColorStop(0, rgba(STEEL, 0)); g.addColorStop(0.35, rgba(STEEL, a)); g.addColorStop(0.8, rgba(STEEL, a * 0.6)); g.addColorStop(1, rgba(STEEL, 0));
          ctx.strokeStyle = g; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(...tips[j]); ctx.lineTo(...ends[j]); ctx.stroke();
        }
        ctx.restore();
        for (let j = 2; j >= 1; j--) {
          const Kg = knifeAt(t - j * 0.012);
          const [gx, gy] = cam(Z, Kg.x, Kg.y);
          ctx.save(); ctx.translate(gx, gy); ctx.scale(KS * Z, KS * Z);
          drawKnife(ctx, 0, 0, Kg.ang, Kg.a * smear * 0.22 * (1 - j / 3));
          ctx.restore();
        }
      }
      const [kx, ky] = cam(Z, K.x, K.y);
      ctx.save(); ctx.translate(kx, ky); ctx.scale(KS * Z, KS * Z);
      drawKnife(ctx, 0, 0, K.ang, K.a);
      ctx.restore();
      const gl = (t - T_CUT0 - 0.04) / 0.42;
      if (gl > 0 && gl < 1) {                          // the glint runs down the edge
        const ga = Math.sin(Math.PI * gl), d = lerp(0.9, 0.08, ease.inOut3(gl)) * KL * KS * Z;
        const gx = kx + Math.cos(K.ang) * d, gy = ky + Math.sin(K.ang) * d;
        star(ctx, gx, gy, 66 * ga, 0.85 * ga, 0.3, STEEL);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; HG.dot(ctx, STEEL, gx, gy, 40 * ga, 0.35 * ga); ctx.restore();
      }
    }

    // ---- shavings: curls of meat with a warm glow, landing in the tacos
    {
      ctx.save();
      for (const s of SHAV) {
        const u = (t - s.ts) / s.dur;
        if (u <= 0 || u >= 1.2) continue;
        const K0 = knifeAt(s.ts), p0 = [K0.x + 8, K0.y - 4];
        const pos = q => {
          const e = q * (0.8 + 0.2 * q);
          const [x, y] = [lerp(p0[0], s.tgt[0], e), lerp(p0[1], s.tgt[1], e) - s.lift * 4 * q * (1 - q)];
          return cam(Z, x, y);
        };
        if (u < 1) {
          const tr = [];
          for (let j = 0; j <= 7; j++) tr.push(pos(Math.max(0, u - j * 0.022)));
          streak(ctx, tr, [200, 70, 20], 2, 0.22);
          const [x, y] = pos(u);
          drawCurl(ctx, TEX, s, x, y, s.spin * u + 0.4, 0.45 + 0.55 * Math.abs(Math.cos(s.flip * u)), smooth(0, 0.08, u) * (1 - smooth(0.86, 1, u)));
        } else {
          const q = (u - 1) / 0.2, [x, y] = cam(Z, ...s.tgt);
          ctx.globalCompositeOperation = 'lighter';
          HG.dot(ctx, FIRE_O, x, y, 50 * (1 - q * 0.5), 0.3 * (1 - q));
          for (let j = 0; j < 4; j++) {
            const an = -Math.PI / 2 + (j - 1.5) * 0.65;
            HG.dot(ctx, FIRE_Y, x + Math.cos(an) * 26 * q, y + Math.sin(an) * 26 * q, 10, 0.5 * (1 - q));
          }
          ctx.globalCompositeOperation = 'source-over';
        }
      }
      // free sparks thrown off the blade
      ctx.globalCompositeOperation = 'lighter';
      for (const sp of SPARK) {
        const a = t - sp.ts; if (a <= 0 || a >= sp.dur) continue;
        const K0 = knifeAt(sp.ts), u = a / sp.dur;
        const tr = [];
        for (let j = 0; j <= 4; j++) { const aa = Math.max(0, a - j * 0.018); tr.push(cam(Z, K0.x + sp.vx * aa, K0.y + sp.vy * aa + 420 * aa * aa)); }
        streak(ctx, tr, sp.col, 2, 0.8 * (1 - u));
        HG.dot(ctx, sp.col, tr[0][0], tr[0][1], sp.s, (1 - u) * 0.75);
      }
      ctx.restore();
    }

    // ---- the pineapple chunk: flicked off the side of the fruit, it sails over to the middle taco
    {
      const u = (t - T_PINE) / D_PINE;
      const at = q => cam(Z, lerp(pin0[0], pin1[0], q), lerp(pin0[1], pin1[1], q) - 230 * 4 * q * (1 - q));
      if (u > 0 && u < 1) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const ptr = [];
        for (let j = 0; j <= 10; j++) ptr.push(at(Math.max(0, u - j * 0.025)));
        streak(ctx, ptr, GOLD, 4, 0.5);
        for (let j = 1; j < 12; j++) {
          const q = u - j * 0.028; if (q <= 0) break;
          const [qx, qy] = at(q);
          HG.dot(ctx, GOLD, qx + 6 * Math.sin(j * 2.1 + t * 8), qy + 6 * Math.cos(j * 1.7 + t * 7), 20 - j * 1.3, 0.55 * (1 - j / 12));
        }
        const [X, Y] = at(u);
        HG.dot(ctx, GOLD, X, Y, 110, 0.36);
        ctx.restore();
        drawChunk(ctx, TEX, X, Y, 34 * Z, lerp(-2.6, 0.18, ease.out3(u)), smooth(0, 0.05, u));
      }
      // it lands: a golden star and a spray of sparkles
      const lu = (t - landT) / 0.75;
      if (lu > 0 && lu < 1) {
        const [X, Y] = cam(Z, ...pin1);
        star(ctx, X, Y, 180 * Math.sin(Math.PI * Math.pow(lu, 0.55)), 0.9 * Math.sin(Math.PI * Math.pow(lu, 0.7)), 0.4 + lu * 0.5, GOLD);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (let j = 0; j < 12; j++) {
          const an = -Math.PI / 2 + (hash(j, 71) - 0.5) * 2.6, v = 90 + 110 * hash(j, 72);
          HG.dot(ctx, j % 3 ? GOLD : WHITE, X + Math.cos(an) * v * lu, Y + Math.sin(an) * v * lu + 90 * lu * lu, 11, (1 - lu) * 0.8);
        }
        ctx.restore();
      }
    }

    // glints on the lime and the salsa
    {
      const [lx, ly] = cam(Z, ...plateXY(730, 752));
      const lu = (t - 7.15) / 0.9;
      if (lu > 0 && lu < 1) {
        const e = Math.sin(Math.PI * lu);
        star(ctx, lx, ly, 120 * e, 0.85 * e, lu, LIME);
        for (let j = 0; j < 7; j++) {
          const an = j / 7 * TAU + 0.4, rr = 30 + 40 * ease.out3(lu);
          HG.dot(ctx, LIME, lx + Math.cos(an) * rr, ly + Math.sin(an) * rr * 0.8, 11, 0.5 * (1 - lu));
        }
      }
      const su = (t - 7.7) / 0.9;
      if (su > 0 && su < 1) {
        const [sx, sy] = cam(Z, MOLC.x + 34, MOLC.y - 28), e = Math.sin(Math.PI * su);
        star(ctx, sx, sy, 120 * e, 0.85 * e, 0.2 + su, [255, 200, 160]);
      }
    }

    // ---- steam: soft plumes rise from the tacos; at the end they swell, let go and float away
    {
      const sg = STM.ctx; HG.reset(sg); sg.clearRect(0, 0, W, W);
      const fin = ease.inOut3((t - T_END + 0.5) / 1.4);              // 0..1 during the finale
      const letGo = ease.in3((t - T_END - 0.3) / 1.0);               // the foot lets go of the table
      const drift = 240 * ease.in3((t - T_END - 0.2) / 1.1);         // and the whole plume floats up
      const topFade = smooth(T_END + 0.2, T_END + 0.85, t);          // dissolving from the top down
      const collapse = smooth(T_END - 0.1, T_END + 0.35, t);         // the filaments merge into one wisp
      const wispA = 1 - smooth(T_END + 0.3, T_END + 0.8, t);         // and the wisps are gone by ~10.7 s
      const calm = 1 - 0.65 * fin;                                    // the swing settles as it rises
      let any = false;
      for (let i = 0; i < 3; i++) {
        const tb = T_TACO + 0.95 + 0.1 * i;
        const grow = ease.out3((t - tb) / 2.2);
        if (grow <= 0) continue;
        const [x0, y0] = cam(Z, ...plateXY(TACO_C[i][0] + [20, -10, -30][i], TACO_C[i][1] - 90));
        const breathe = 0.8 + 0.2 * Math.sin(t * 1.3 + i * 2.1);
        const H = lerp(40, 340, grow) + 170 * fin;
        plume(sg, x0, y0 - drift, t, i + 1, {
          H, amp: calm, w0: 5, w1: 36 + 30 * fin, alpha: 0.42 * breathe * wispA,
          speed: 1 + 0.3 * fin, lift: Math.min(H - 10, 420 * letGo), topFade, lean: (0.04 - 0.1 * i) * calm, collapse,
        });
        // what is left: a soft, featureless haze that drifts up and thins out
        const hz = Math.sin(Math.PI * clamp((t - T_END - 0.05) / 1.25)) * grow;
        if (hz > 0.003) {
          sg.save(); sg.globalCompositeOperation = 'lighter';
          for (let j = 0; j < 3; j++) {
            const hy = y0 - 120 - 70 * j - 160 * ease.out3(clamp((t - T_END) / 1.4)) - drift * 0.4;
            HG.dot(sg, STEAM, x0 + (j - 1) * 14 + 30 * (0.04 - 0.1 * i) * j, hy, 230 + 60 * j, 0.11 * hz * (1 - 0.25 * j));
          }
          sg.restore();
        }
        any = true;
      }
      // a last breath of steam off the trompo as it evaporates
      if (fin > 0) {
        const [x0, y0] = cam(Z, P0.ax + 10, P0.ty + 330);
        const H = 120 + 330 * fin;
        plume(sg, x0, y0 - drift, t, 4, { H, amp: 0.5 * calm, w0: 6, w1: 60, alpha: 0.3 * Math.sin(Math.PI * clamp(fin * 1.1)) * wispA, speed: 1.2, lift: Math.min(H - 10, 420 * letGo), topFade, lean: 0.03, collapse });
        any = true;
      }
      if (any) {
        HG.reset(ctx); ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.85; ctx.filter = HG.blur(9); ctx.drawImage(STM.cv, 0, 0, W, W);
        ctx.globalAlpha = 0.6; ctx.filter = HG.blur(2.2); ctx.drawImage(STM.cv, 0, 0, W, W);
        HG.reset(ctx);
      }
    }

    // ---- the end: gold motes rise from wherever the evaporating front passes
    if (t > T_F0) {
      const endF = 1 - smooth(10.95, 11.28, t);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < MOTES.length; i++) {
        const m = MOTES[i], [x0, y0] = cam(Z, m.x, m.y);
        const te = frontTime(x0, y0), a = t - te;
        if (a <= 0 || a >= m.life) continue;
        const q = a / m.life;
        const x = x0 + m.dr * a + 7 * Math.sin(a * 5 + m.ph), y = y0 - m.vy * a - 80 * a * a;
        const al = Math.sin(Math.PI * Math.pow(q, 0.45)) * 0.75 * endF * (0.75 + 0.25 * Math.sin(t * 17 + m.ph * 3));
        HG.dot(ctx, m.col, x, y, m.s * (1 - 0.4 * q), al);
      }
      ctx.restore();
    }
  },
});
