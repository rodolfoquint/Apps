<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1080"></canvas>
<script src="../engine.js"></script>
<script>
// Danza de la Pluma (Guelaguetza, Oaxaca), late afternoon. Between Jarabe Tapatio and the Voladores in
// "Gente y Lugares": the light is warm gold turning amber-rose, and the piece ends with a flight upward.
// The great round feather crown of a danzante is built in front of us while it slowly turns in depth
// (it is a solid object, slightly dished, seen in perspective): a glint becomes the embroidered centre
// with its round mirrors, then on every drum beat a new ring of dyed feathers rises closed behind it and
// flicks open like a peacock's display (turquoise, green, gold sun-rays, a wide red field, the green
// rim), each with a springy overshoot; on the next beat a white eight-point star springs out over the
// red field (as on the Teotitlan del Valle crowns), with a small mirror in each point, and plumes pop
// round the rim. Then the crown dances as if worn: four hops on the beat (about 50 px, with squash on
// each landing and stretch on take-off), the head turning about 30 degrees left and right in depth,
// rocking side to side, nodding on every landing, the feathers drooping and springing with the
// impact; the mirrors chase light round the star and the centre. The dancer crouches and leaps: the
// crown rises about 120 px, shrinks into the distance and spins a full turn (its plain back passes by
// darker), and lands with a shockwave of light through the feathers, all mirrors flashing and a spray
// of comets thrown up off the rim. On the last hop the feathers lift off from the rim inward and fly
// UP as comets in a fountain (the bottom ones swing up round the sides), the star's points first; the
// medallion folds into a gold spark that shoots up out of the top of the circle (the Voladores open
// with a line of light rising).
// Title band: the crown sits high (centre y 468, outer plumes to about y 830; it hops UP from there) and
// from 2.2 s to 9.9 s its part below y 780 is faded down to 40 % by y 900; the ripples and shockwave
// fade to 0 between y 730 and 830, the comets, glints and landing arc between y 740 and 840, and the
// sky glow is gone by y 800 (and by r 470 from the centre, so nothing lights the rim).
// Feathers are drawn procedurally (sprites built once from HG.rng seeds); the centre is the
// embroidered medallion of out-show2/images/penacho-pluma-1.png (prepare.py --circle).
const { W, C, ctx, clamp, lerp, smooth, ease, rgba } = HG;
const TAU = Math.PI * 2;
const mix = (a, b, k) => [0, 1, 2].map(i => Math.round(lerp(a[i], b[i], k)));
const WHITE = [255, 255, 255], BLACK = [0, 0, 0];
const MIRROR = [255, 248, 232], GOLD = [255, 196, 90];
const bump = (t, a, b, c, d) => smooth(a, b, t) * (1 - smooth(c, d, t));
const alphaFn = (s, w) => s <= 0 ? 0 : (s / w) * Math.exp(1 - s / w);           // 0 -> 1 at s = w -> 0, smooth start
const dsin = (s, w, k) => s <= 0 ? 0 : Math.sin(w * s) * Math.exp(-k * s);     // damped oscillation from rest
const wrapPi = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
function inOutBack(x) {
  x = clamp(x); const c2 = 1.2 * 1.525;
  return x < 0.5 ? (Math.pow(2 * x, 2) * ((c2 + 1) * 2 * x - c2)) / 2 : (Math.pow(2 * x - 2, 2) * ((c2 + 1) * (x * 2 - 2) + c2) + 2) / 2;
}
// a track of [time, value] keys, eased between neighbours (equal neighbours hold)
function track(keys, t, e = ease.inOut3) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) { const [a, va] = keys[i - 1], [b, vb] = keys[i]; return lerp(va, vb, e((t - a) / (b - a))); }
  return keys[keys.length - 1][1];
}

// ---------- crown geometry (design units, crown-local, centre 0,0; on screen scaled by CS at CX, CY)
const CX = 540, CY = 468;
const CS = 0.9;
const AY = 330;                                   // squash anchor: where the frame sits on the head
const RM = 124;                                   // medallion radius
const MED_W = RM * 2 * 512 / 491.6;               // the asset's rim sits at 491.6 of 512 px
// inner -> outer. Bands differ: short turquoise, green (as round the centre of the Teotitlan crowns),
// gold sun-rays (long/short zigzag), a wide red field (under the star) and a short spiky green rim.
const RINGS = [
  { col: [30, 168, 255], base: 104, tip: 164, n: 30, hw: 22, wk: 1.0, wisp: 0.8, dark: 0.5, pointy: 0, zig: 0, jit: 0.04, every: 2 },
  { col: [24, 176, 96], base: 124, tip: 202, n: 36, hw: 22, wk: 1.05, wisp: 2.2, dark: 0.5, pointy: 0.15, zig: 0, jit: 0.08, every: 2 },
  { col: [255, 190, 34], base: 150, tip: 266, n: 40, hw: 20, wk: 1.15, wisp: 0.5, dark: 0.45, pointy: 0.85, zig: 0.28, jit: 0.03, every: 2 },
  { col: [236, 34, 48], base: 176, tip: 348, n: 60, hw: 24, wk: 1.22, wisp: 1.5, dark: 0.55, pointy: 0, zig: 0, jit: 0.05, every: 2 },
  { col: [30, 186, 90], base: 316, tip: 378, n: 88, hw: 14, wk: 1.0, wisp: 0.9, dark: 0.45, pointy: 0.55, zig: 0, jit: 0.12, every: 3 },
];
const NR = RINGS.length;
const STAR = { ri: 238, rt: 342, w: 24, rm: 276, mr: 14 };     // eight-point star over the red field
const NT = 16, TUFT_R = 362, TUFT_L = 50;                       // plumes round the rim
const TUFT_TIPS = [[255, 120, 40], [30, 168, 255], [255, 190, 34], [255, 80, 170]];
// mirrors on the medallion (asset px, measured on penacho-pluma-1), clockwise from the top
const MIRRORS = [[512, 119], [777, 192], [917, 481], [711, 934], [512, 965], [322, 938], [109, 481], [249, 190]]
  .map(([u, v]) => [(u - 512) * RM / 491.6, (v - 512) * RM / 491.6]);
const MIRROR_C = [0, (548 - 512) * RM / 491.6];
const STAR_MIRRORS = [...Array(8)].map((_, k) => { const a = -Math.PI / 2 + k * Math.PI / 4; return [Math.cos(a) * STAR.rm, Math.sin(a) * STAR.rm]; });

// ---------- timeline
const RING_T0 = 1.3, RING_DT = 0.5, OPEN_D = 1.3;     // ring k flicks open on beat RING_T0 + k * RING_DT
const STAR_T = RING_T0 + RING_DT * NR;                 // 3.8: the star springs out
const TUFT_T0 = 4.25, DONE_T = 4.72;
// hops: take-off, air time, height (px). Index LEAP is the big leap with the pirouette.
const HOPS = [[4.98, 0.36, 48], [5.48, 0.36, 54], [5.98, 0.36, 48], [6.48, 0.36, 56], [7.05, 1.30, 118], [8.86, 0.33, 34]];
const LEAP = 4, LAND = HOPS[LEAP][0] + HOPS[LEAP][1];  // 8.35
const LANDS = HOPS.map(([t0, d, h]) => [t0 + d, Math.min(2, h / 50)]);
const LIFT0 = 9.3;                                     // feathers fly away
const OUT0 = 10.6, OUT1 = 11.2;                        // final dissolve
// yaw (turn in depth), roll and sideways step: the head turns about 30 degrees on alternate beats
const K_PHI = [[0, 0.62], [4.72, -0.42], [4.98, -0.42], [5.34, 0.55], [5.48, 0.55], [5.84, -0.55], [5.98, -0.55], [6.34, 0.55], [6.48, 0.55],
  [6.84, -0.55], [7.05, -0.55], [8.35, TAU + 0.45], [8.86, TAU + 0.45], [9.19, TAU - 0.3], [10.6, TAU + 0.05]];
const K_TILT = [[0, 0.05], [4.72, -0.06], [4.98, -0.06], [5.38, -0.18], [5.5, -0.18], [5.88, 0.18], [6.0, 0.18], [6.38, -0.18], [6.5, -0.18],
  [6.88, 0.18], [7.05, 0.18], [7.7, -0.12], [8.4, 0.02], [8.86, 0.02], [9.22, -0.1], [10.6, 0]];
const K_X = [[0, 0], [4.98, 0], [5.34, 34], [5.48, 34], [5.84, -34], [5.98, -34], [6.34, 34], [6.48, 34], [6.84, -34], [7.05, -34],
  [8.35, 8], [8.86, 8], [9.19, -10], [10.2, 0]];

// ---------- feather sprites (procedural, built once at a resolution that suits ?size)
const SPR_K = 1.6 * Math.max(1, HG.S);   // sprite canvas px per design px: already includes HG.S
// a dyed plume pointing up, base at (ox, oy): long silky barbs angled to the tip, a fine shaft, a soft
// fringe; colour deepens toward the base (where the next ring overlaps). pointy 0 = round tip, 1 = lance.
function featherSprite(col, seed, { L = 150, HW = 22, barbs = 120, tip = null, dark = 0.55, shadow = false, wisp = 1, pointy = 0 } = {}) {
  const R = HG.rng(seed), PAD = 14, sw = 2 * HW + 2 * PAD, sh = L + 2 * PAD;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(sw * SPR_K); cv.height = Math.ceil(sh * SPR_K);
  const g = cv.getContext('2d'); g.scale(SPR_K, SPR_K);
  const ox = sw / 2, oy = L + PAD;
  const wR = s => { const a = Math.pow(Math.min(1, s / 0.26), 0.55), q = (s - 0.56) / 0.44; return a * (s > 0.56 ? Math.pow(Math.max(0, 1 - q * q), 0.55) : 1); };
  const wP = s => { const a = Math.pow(Math.min(1, s / 0.22), 0.55); return a * (s > 0.38 ? Math.pow(Math.max(0, 1 - (s - 0.38) / 0.62), 0.85) : 1); };
  const w = s => { s = clamp(s); return HW * lerp(wR(s), wP(s), pointy); };
  const Y = s => oy - s * L;
  const outline = k => {
    g.beginPath(); g.moveTo(ox, oy);
    for (let i = 0; i <= 60; i++) { const s = i / 60; g.lineTo(ox + w(s) * k, Y(s)); }
    for (let i = 60; i >= 0; i--) { const s = i / 60; g.lineTo(ox - w(s) * k, Y(s)); }
    g.closePath();
  };
  if (shadow) {
    // raw blur string on purpose: this offscreen sprite canvas is sized in SPR_K px, which already
    // includes HG.S, so the blur scales with ?size like HG.blur would
    g.filter = `blur(${(6 * SPR_K).toFixed(1)}px)`; outline(1.05); g.fillStyle = 'rgba(0,0,0,0.9)'; g.fill(); g.filter = 'none';
    return { cv, sw, sh, ox, oy, L, HW };
  }
  const tipCol = tip || mix(col, WHITE, 0.14);
  const lg = g.createLinearGradient(0, oy, 0, oy - L);
  lg.addColorStop(0, rgba(mix(col, BLACK, dark), 0.95));
  lg.addColorStop(0.5, rgba(mix(col, BLACK, 0.12), 0.92));
  lg.addColorStop(0.85, rgba(mix(col, tipCol, 0.5), 0.9));
  lg.addColorStop(1, rgba(tipCol, 0.85));
  outline(0.86); g.fillStyle = lg; g.fill();
  // roundness: the vane darkens toward its edges
  const xg = g.createLinearGradient(ox - HW, 0, ox + HW, 0);
  xg.addColorStop(0, 'rgba(0,0,0,0.45)'); xg.addColorStop(0.35, 'rgba(0,0,0,0)'); xg.addColorStop(0.65, 'rgba(0,0,0,0)'); xg.addColorStop(1, 'rgba(0,0,0,0.45)');
  outline(0.86); g.fillStyle = xg; g.fill();
  // barbs: silky strands from the shaft toward the tip, ending in a soft uneven fringe
  g.lineCap = 'round';
  const tanA = Math.tan(0.36);
  for (const side of [-1, 1]) for (let i = 0; i < barbs; i++) {
    const s0 = 0.02 + 0.96 * (i + R()) / barbs;
    const se = Math.min(1, s0 + w(s0 + 0.06) / (tanA * L) * (0.85 + 0.3 * R()));
    const reach = (0.92 + 0.14 * R()) * (1 + 0.12 * wisp * R() * R());
    const x1 = ox + side * w(se) * reach, y1 = Y(Math.min(1.015, se + 0.01 * wisp * R()));
    const v = R(), base = mix(mix(col, BLACK, dark * (1 - smooth(0.05, 0.55, s0))), tipCol, smooth(0.6, 1, s0));
    const c = v < 0.5 ? mix(base, BLACK, 0.35 * (0.5 - v) / 0.5) : mix(base, mix(col, WHITE, 0.4), (v - 0.5) / 0.5 * 0.6);
    g.strokeStyle = rgba(c, 0.32 + 0.4 * R());
    g.lineWidth = 0.7 + 0.6 * R();
    g.beginPath(); g.moveTo(ox + side * 0.5, Y(s0));
    g.quadraticCurveTo(ox + side * w(s0) * 0.18, Y(s0 + (se - s0) * 0.62), x1, y1);
    g.stroke();
  }
  // shaft
  g.strokeStyle = rgba(mix(col, WHITE, 0.5), 0.75); g.lineWidth = 1.7;
  g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox, Y(0.5)); g.stroke();
  g.lineWidth = 0.9; g.beginPath(); g.moveTo(ox, Y(0.49)); g.quadraticCurveTo(ox + 0.6, Y(0.75), ox, Y(0.9)); g.stroke();
  return { cv, sw, sh, ox, oy, L, HW };
}
let SPR = null;
function sprites() {
  if (SPR) return SPR;
  SPR = { rings: [], shadow: featherSprite(BLACK, 1, { shadow: true }), tufts: [], star: [] };
  RINGS.forEach((rg, k) => {
    const v = [];
    for (let j = 0; j < 3; j++) {
      const jit = [1, 0.9, 1.06][j];
      const col = rg.col.map(x => Math.min(255, Math.round(x * jit)));
      v.push(featherSprite(col, 31 + k * 7 + j, { HW: rg.hw, dark: rg.dark, wisp: rg.wisp, pointy: rg.pointy }));
    }
    SPR.rings.push(v);
  });
  TUFT_TIPS.forEach((tc, j) => SPR.tufts.push(featherSprite([248, 240, 232], 90 + j, { L: 130, HW: 9, barbs: 70, tip: tc, dark: 0.25, wisp: 2 })));
  for (let j = 0; j < 2; j++) SPR.star.push(featherSprite([252, 248, 240], 140 + j, { HW: 20, barbs: 90, dark: 0.12, wisp: 2.4, tip: [255, 255, 252] }));
  return SPR;
}

// ---------- static per-feather data (deterministic)
const FEATHERS = RINGS.map((rg, k) => {
  const R = HG.rng(100 + k), sp = TAU / rg.n, off = (k % 2) * sp / 2, list = [];
  for (let i = 0; i < rg.n; i++) {
    let d = -Math.PI + (i + 0.5) * sp + off + (R() - 0.5) * 0.3 * sp;
    if (d > Math.PI) d -= TAU;
    const short = rg.zig > 0 && i % 2 === 1;
    list.push({ k, i, d, short, v: Math.floor(R() * 3), lj: (short ? 1 - rg.zig : 1) * (1 + (R() - 0.5) * 2 * rg.jit),
      ph: R() * TAU, spin: (R() - 0.5) * 5, r1: R(), r2: R(), comet: i % rg.every === 0 });
  }
  // short zigzag feathers lie under the long ones; otherwise the top feather lies on top
  list.sort((a, b) => (a.short === b.short ? Math.abs(b.d) - Math.abs(a.d) : (a.short ? -1 : 1)));
  return list;
});
const TUFTS = (() => {
  const R = HG.rng(77), list = [];
  for (let j = 0; j < NT; j++) {
    const d = -Math.PI + (j + 0.5) * TAU / NT;
    for (const s of [-1, 0, 1]) list.push({ d: d + s * 0.075, s, j, tip: j % TUFT_TIPS.length, ph: R() * TAU, r1: R(), r2: R(), spin: (R() - 0.5) * 5, comet: s === 0 });
  }
  list.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  return list;
})();

// ---------- motion
// damped spring 0 -> 1 with zero start velocity (~7 % overshoot)
const spring = u => u <= 0 ? 0 : u >= 1.6 ? 1 : 1 - Math.exp(-5 * u) * (Math.cos(6 * u) + (5 / 6) * Math.sin(6 * u));
function hopY(t) {
  let y = 0;
  HOPS.forEach(([t0, d, h], i) => { const u = (t - t0) / d; if (u > 0 && u < 1) y -= h * (i === LEAP ? Math.sin(Math.PI * u) : 4 * u * (1 - u)); });
  return y;
}
// squash (> 0) and stretch (< 0): crouch then stretch around each take-off, squash and rebound on landing
function squash(t) {
  let q = 0;
  HOPS.forEach(([t0, d, h], i) => {
    const hk = Math.min(1.5, h / 50), T = i === LEAP ? 0.4 : 0.28, A = (i === LEAP ? 0.1 : 0.075) * Math.min(1.2, hk), s = t - t0;
    if (Math.abs(s) < T / 2) q -= A * Math.sin(TAU * s / T);
    q += 0.2 * hk * dsin(t - t0 - d, 19.6, 6);
  });
  return 0.17 * Math.tanh(q / 0.17);                 // soft limit: never flatter than ~0.83
}
// feathers droop with inertia at each take-off and landing, then spring back
function droop(t) {
  let v = 0;
  HOPS.forEach(([t0, d, h]) => { const a = Math.min(2, h / 50); v += 0.5 * a * dsin(t - t0, 16, 5) + a * dsin(t - t0 - d, 16, 4.5); });
  return v;
}
function pose(t) {
  const phi = track(K_PHI, t);
  const spinV = Math.abs(track(K_PHI, t + 0.01) - track(K_PHI, t - 0.01)) / 0.02;
  const tilt = track(K_TILT, t, inOutBack);
  // nod: a slow drift while the crown is built, a forward nod on every landing, a small lift at take-off
  let psi = 0.1 * Math.sin(0.9 * t + 0.4) * smooth(0.6, 2.5, t) * (1 - smooth(4.6, 5.0, t));
  for (const [tl, a] of LANDS) { const s = t - tl; psi += 0.19 * Math.min(1.2, a) * (alphaFn(s, 0.09) - 0.35 * alphaFn(s - 0.2, 0.1)); }
  for (const [t0] of HOPS) psi -= 0.06 * alphaFn(t - t0, 0.08);
  const beat = (t > RING_T0 - 0.1 && t < STAR_T + 0.6) ? 0.008 * Math.exp(-6 * (((t - RING_T0) % RING_DT + RING_DT) % RING_DT)) : 0;
  const q = squash(t) - beat;
  const sc = CS * (1 - 0.15 * bump(t, 7.05, 7.6, 7.8, 8.35));                 // smaller up in the air
  const float = 5 * Math.sin(1.3 * t) * smooth(0.5, 2, t) * (1 - smooth(4.6, 5, t));
  let flex = 0.05 * clamp(spinV / 8);                                          // feathers fling out in the spin
  for (const [tl, a] of LANDS) flex += 0.05 * a * dsin(t - tl, 15, 5);
  return { x: CX + track(K_X, t), y: CY + hopY(t) + float, tilt, phi, psi, sc, sx: 1 + 0.55 * q, sy: 1 - q, droop: droop(t), flex };
}

// ---------- perspective projection of the (slightly dished) crown, turned by phi about its vertical
// axis and psi about its horizontal axis; projJ adds the local Jacobian so sprites can be placed affinely
const DIST = 1700, DISH = 80, RD = 380;
function proj(P, x, y) {
  const cf = Math.cos(P.phi), sf = Math.sin(P.phi), cp = Math.cos(P.psi), sp = Math.sin(P.psi);
  const z0 = DISH * (x * x + y * y) / (RD * RD);              // the rim curves back, away from us
  const x1 = x * cf - z0 * sf, z1 = x * sf + z0 * cf;
  const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp, k = DIST / (DIST + z2);
  return { x: x1 * k, y: y2 * k };
}
function projJ(P, x, y) {
  const p = proj(P, x, y), px = proj(P, x + 1, y), py = proj(P, x, y + 1);
  return { x: p.x, y: p.y, j11: px.x - p.x, j21: px.y - p.y, j12: py.x - p.x, j22: py.y - p.y };
}
// screen <- crown: squash/stretch anchored on the head, roll, scale
function crownSpace(g, P) { const ay = AY * P.sc; g.translate(P.x, P.y + ay); g.scale(P.sx, P.sy); g.translate(0, -ay); g.rotate(P.tilt); g.scale(P.sc, P.sc); }

// draw sprite spr with its base at (bx, by) pointing along ang, length len and width wid, in crown space
function placeSprite(g, spr, P, bx, by, ang, len, wid, alpha) {
  if (alpha <= 0.004 || len <= 0.5) return;
  const a = ang + Math.PI / 2, ca = Math.cos(a), sa = Math.sin(a);
  const sx = wid / (2 * spr.HW), sy = len / spr.L;
  const m11 = ca * sx, m12 = -sa * sy, m21 = sa * sx, m22 = ca * sy;
  const tx = bx - (m11 * spr.ox + m12 * spr.oy), ty = by - (m21 * spr.ox + m22 * spr.oy);
  const cxl = bx + Math.cos(ang) * len / 2, cyl = by + Math.sin(ang) * len / 2;
  const p = projJ(P, cxl, cyl);
  const A = p.j11 * m11 + p.j12 * m21, B = p.j21 * m11 + p.j22 * m21, Cc = p.j11 * m12 + p.j12 * m22, D = p.j21 * m12 + p.j22 * m22;
  const E = p.x + p.j11 * (tx - cxl) + p.j12 * (ty - cyl), F = p.y + p.j21 * (tx - cxl) + p.j22 * (ty - cyl);
  g.save(); g.transform(A, B, Cc, D, E, F); g.globalAlpha = Math.min(1, alpha);
  g.drawImage(spr.cv, 0, 0, spr.sw, spr.sh);
  g.restore();
}
// projected polygon (edges subdivided: the dish bends straight lines)
function polyPath(g, P, pts, sub = 5) {
  const n = pts.length;
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    for (let m = 0; m < sub; m++) {
      const q = proj(P, lerp(a[0], b[0], m / sub), lerp(a[1], b[1], m / sub));
      if (i === 0 && m === 0) g.moveTo(q.x, q.y); else g.lineTo(q.x, q.y);
    }
  }
  g.closePath();
}

// four-point glint with a short coloured halo
function glint(g, x, y, s, a, rot = 0, col = MIRROR, halo = null) {
  if (a <= 0.004 || s <= 0) return;
  g.save(); g.globalCompositeOperation = 'lighter'; g.translate(x, y);
  if (halo) { g.globalAlpha = Math.min(1, a * 0.6); g.drawImage(HG.sprite(halo), -s * 0.34, -s * 0.34, s * 0.68, s * 0.68); }
  const sp = HG.sprite(col);
  g.rotate(rot); g.globalAlpha = Math.min(1, a);
  g.drawImage(sp, -s / 2, -s * 0.045, s, s * 0.09); g.drawImage(sp, -s * 0.045, -s / 2, s * 0.09, s);
  g.globalAlpha = Math.min(1, a * 0.8); g.drawImage(sp, -s * 0.14, -s * 0.14, s * 0.28, s * 0.28);
  g.restore();
}
// comet: a curved, tapering tail along pts (head first) and a glowing head
function comet(g, pts, w0, col, a, head) {
  const n = pts.length; if (n < 2 || a <= 0.004) return;
  const Lp = [], Rp = [];
  for (let i = 0; i < n; i++) {
    const o = pts[Math.max(0, i - 1)], q = pts[Math.min(n - 1, i + 1)];
    let dx = o.x - q.x, dy = o.y - q.y; const d = Math.hypot(dx, dy);
    if (d < 1e-3) { dx = 1; dy = 0; } else { dx /= d; dy /= d; }
    const w = 0.5 * w0 * Math.pow(1 - i / (n - 1), 1.4);
    Lp.push([pts[i].x - dy * w, pts[i].y + dx * w]); Rp.push([pts[i].x + dy * w, pts[i].y - dx * w]);
  }
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = 1;
  if (Math.hypot(pts[0].x - pts[n - 1].x, pts[0].y - pts[n - 1].y) > 2) {
    const gr = g.createLinearGradient(pts[0].x, pts[0].y, pts[n - 1].x, pts[n - 1].y);
    gr.addColorStop(0, rgba(mix(col, WHITE, 0.3), a)); gr.addColorStop(0.35, rgba(col, 0.7 * a)); gr.addColorStop(1, rgba(col, 0));
    g.fillStyle = gr; g.beginPath(); g.moveTo(Lp[0][0], Lp[0][1]);
    for (const p of Lp) g.lineTo(p[0], p[1]);
    for (let i = n - 1; i >= 0; i--) g.lineTo(Rp[i][0], Rp[i][1]);
    g.closePath(); g.fill();
  }
  HG.dot(g, col, pts[0].x, pts[0].y, head, a);
  HG.dot(g, mix(col, WHITE, 0.6), pts[0].x, pts[0].y, head * 0.4, 0.8 * a);
}

// ---------- feather states
function featherState(f, t, P) {
  const rg = RINGS[f.k], tk = RING_T0 + RING_DT * f.k;
  const e = ease.out3((t - (tk - 0.32)) / 0.4);                        // rises closed from behind
  if (e <= 0) return null;
  const p = spring((t - tk) / OPEN_D);                                 // flicks open on the beat
  const cl = ease.inOut3((t - closeTime(f, f.k)) / CLOSE_D);           // ...and folds up at the end
  const ab = -Math.PI / 2 + f.d * (0.03 + 0.97 * p) * (1 - FOLD * cl);
  const wk = 0.4 + 0.6 * f.k / (NR - 1);                               // the outer rings move more
  let ang = ab + smooth(tk + 0.6, tk + 1.6, t) * 0.014 * wk * Math.sin(2.1 * t + f.ph);     // breathing flutter
  ang += 0.1 * P.droop * Math.cos(ang) * wk;                           // inertia bends them downward
  const fl = (1 + P.flex * wk) * (1 + 0.08 * P.droop * Math.sin(ang) * wk);
  const len = (rg.tip - rg.base) * f.lj * lerp(0.55, 1, e) * fl;
  const rb = rg.base - (1 - e) * 46;
  const sp = TAU * rg.tip / rg.n;
  return { ab, ang, lean: (f.k % 2 ? 0.06 : -0.06) * smooth(0.2, 1, p), len, rb, wid: 1.32 * sp * rg.wk * lerp(0.75, 1, Math.min(1, p * 1.5)), alpha: smooth(0, 0.45, e) };
}
// lift-off, the reverse of the opening: from the outer ring inward, each ring's feathers sweep up round
// the sides into a closed fan above the centre (like a peacock folding its tail), and shoot UP out of
// it as comets of their colour, the top ones first
const CLOSE_D = 0.45, FOLD = 0.8;
function closeTime(f, ring) { return LIFT0 + 0.15 * (NR - 1 - ring) + 0.05 * f.r1; }
function launchTime(f, ring) { return closeTime(f, ring) + CLOSE_D * (0.55 + 0.45 * Math.abs(f.d) / Math.PI) + 0.04 * f.r2; }
const FLY_END = 0.55, COMET0 = 0.25, COMET_END = 1.3, UP_G = 900;
function traj(st, f, tau, bend = 0.3) {          // centre of the flying feather, crown plane
  const x0 = Math.cos(st.ab) * st.rb + Math.cos(st.ang) * st.len * 0.5, y0 = Math.sin(st.ab) * st.rb + Math.sin(st.ang) * st.len * 0.5;
  const a2 = -Math.PI / 2 + wrapPi(st.ang + Math.PI / 2) * (1 - bend);   // bent further toward up
  const v0 = 320 + 120 * f.r2, kd = 1.5, d = v0 * (1 - Math.exp(-kd * tau)) / kd;
  const sw = 16 * Math.sin(6 * tau + f.ph) * tau, ux = Math.cos(a2), uy = Math.sin(a2);
  return { x: x0 + ux * d - uy * sw, y: y0 + uy * d + ux * sw - 0.5 * UP_G * tau * tau };
}
function flight(st, f, tau) {
  const q = traj(st, f, tau), k = 1 - 0.65 * smooth(0, FLY_END, tau), ang = st.ang + (st.lean || 0) + f.spin * 0.4 * tau;
  const len = st.len * k;
  return { bx: q.x - Math.cos(ang) * len / 2, by: q.y - Math.sin(ang) * len / 2, ang, len, wid: st.wid * k, alpha: st.alpha * (1 - smooth(0.32, FLY_END, tau)) };
}
function pushComet(list, st, f, tau, col, head = 30) {
  if (tau < COMET0 || tau > COMET_END) return;
  list.push({ st, f, tau, col, head, a: smooth(COMET0, COMET0 + 0.15, tau) * (1 - smooth(0.8, COMET_END, tau)) * (0.85 + 0.15 * Math.sin(tau * 19 + f.ph)) });
}

// ---------- the eight-point star: grow[k] in 0..1 per point (clockwise from the top)
function starPts(grow, ri, rt) {
  const pts = [];
  for (let j = 0; j < 16; j++) {
    const a = -Math.PI / 2 + j * Math.PI / 8, r = j % 2 === 0 ? lerp(ri * 1.02, rt, grow[j / 2]) : ri;
    pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return pts;
}
function insetPts(pts, w) {                       // inward miter offset (the polygon runs clockwise on screen)
  const n = pts.length, out = [];
  for (let i = 0; i < n; i++) {
    const p = pts[(i + n - 1) % n], c = pts[i], q = pts[(i + 1) % n];
    let ex = c[0] - p[0], ey = c[1] - p[1], l = Math.hypot(ex, ey) || 1; const n1 = [-ey / l, ex / l];
    ex = q[0] - c[0]; ey = q[1] - c[1]; l = Math.hypot(ex, ey) || 1; const n2 = [-ey / l, ex / l];
    const k = w / Math.max(0.2, 1 + n1[0] * n2[0] + n1[1] * n2[1]);
    out.push([c[0] + (n1[0] + n2[0]) * k, c[1] + (n1[1] + n2[1]) * k]);
  }
  return out;
}
const starGrow = t => [...Array(8)].map((_, k) => spring((t - (STAR_T + 0.05 * k)) / 0.9));
let POSE_LAND = null;                             // the pose at the landing (a pure function of LAND, cached)
const landPose = () => POSE_LAND || (POSE_LAND = pose(LAND));

const M = HG.layer(), SH = HG.layer(), FX = HG.layer(), SK = HG.layer();
M.ctx.imageSmoothingQuality = 'high';
const COMET_COLS = [RINGS[3].col, RINGS[2].col, [250, 244, 234], RINGS[0].col, RINGS[4].col, TUFT_TIPS[0], [255, 80, 170]];

// the title band: fades a layer below y0 down to `floor` at y1 (a soft ramp, not a cut)
function bandFade(L, y0, y1, floor) {
  if (floor >= 0.999) return;
  const g = L.ctx; HG.reset(g); g.globalCompositeOperation = 'destination-in';
  const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, `rgba(0,0,0,${floor})`);
  g.fillStyle = gr; g.fillRect(0, 0, W, W); HG.reset(g);
}
// draw a layer with an additive bloom. The blurred pass uses drawImage(L.cv, 0, 0, W, W) after
// HG.reset: the layer canvas is SIZE px and the context scale is HG.S, so it lands pixel-aligned at
// any ?size (HG.drawLayer cannot carry a blur filter).
function bloomLayer(L, bloomA, blurPx, alpha, op = 'source-over') {
  if (bloomA > 0.003) { ctx.save(); HG.reset(ctx); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, bloomA); ctx.filter = HG.blur(blurPx); ctx.drawImage(L.cv, 0, 0, W, W); ctx.restore(); }
  HG.drawLayer(ctx, L, { alpha, op });
}

HG.start({
  duration: 12,
  assets: { med: '../assets/12-danza-de-la-pluma-medallon.png' },
  render(t, A) {
    const SP = sprites();
    const P = pose(t);
    const G = 1 - smooth(OUT0, OUT1, t);                                 // final dissolve
    const cf = Math.cos(P.phi), cp = Math.cos(P.psi), front = cf * cp;   // < 0: we see the back
    const back = front < 0, face = Math.max(0, front);
    const lightK = 0.66 + 0.34 * Math.abs(front);                        // edge-on catches less light
    const band = smooth(1.6, 2.2, t) * (1 - smooth(9.9, 10.4, t));       // the title is up: keep the band calm

    // ---------- sky: late-afternoon backlight behind the crown, gold turning amber-rose; it fades
    // out well inside the rim (vignette, 0 by r 470) and above the title band
    {
      const a = smooth(0.2, 2.0, t) * (1 - smooth(10.0, 11.0, t));
      if (a > 0.003) {
        const g = SK.ctx; HG.reset(g); g.clearRect(0, 0, W, W);
        const k = smooth(2, 11, t), c1 = mix([255, 170, 50], [255, 130, 50], k), c2 = mix([255, 96, 90], [240, 60, 110], k);
        const gr = g.createRadialGradient(540, 440, 0, 540, 440, 470);
        gr.addColorStop(0, rgba(c1, 0.3 * a)); gr.addColorStop(0.5, rgba(c1, 0.2 * a)); gr.addColorStop(0.8, rgba(c2, 0.11 * a)); gr.addColorStop(1, rgba(c2, 0));
        g.fillStyle = gr; g.fillRect(0, 0, W, W);
        g.globalCompositeOperation = 'destination-in';
        const v = g.createRadialGradient(C, C, 290, C, C, 470); v.addColorStop(0, 'rgba(0,0,0,1)'); v.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = v; g.fillRect(0, 0, W, W);
        const b = g.createLinearGradient(0, 680, 0, 800); b.addColorStop(0, 'rgba(0,0,0,1)'); b.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = b; g.fillRect(0, 0, W, W);
        HG.reset(g); HG.drawLayer(ctx, SK);
      }
    }

    // ---------- build the crown into M
    const g = M.ctx; HG.reset(g); g.clearRect(0, 0, W, W);
    g.save(); crownSpace(g, P);
    const comets = [];
    const drawRing = (k, withShadow) => {
      const list = FEATHERS[k], sprs = SP.rings[k], states = [];
      for (const f of list) {
        const tl = launchTime(f, k), tau = t - tl;
        if (tau > 0) {                                                 // flying: its state frozen at launch
          const st = featherState(f, tl, pose(tl)); if (!st) { states.push(null); continue; }
          if (f.comet) pushComet(comets, st, f, tau, RINGS[k].col, 28 + 6 * f.r2);
          states.push(tau > FLY_END ? null : flight(st, f, tau)); continue;
        }
        const st = featherState(f, t, P); if (!st) { states.push(null); continue; }
        states.push({ bx: Math.cos(st.ab) * st.rb, by: Math.sin(st.ab) * st.rb, ang: st.ang + st.lean, len: st.len, wid: st.wid, alpha: st.alpha });
      }
      if (withShadow) states.forEach(s => s && placeSprite(g, SP.shadow, P, s.bx + Math.cos(s.ang) * 6, s.by + Math.sin(s.ang) * 6, s.ang, s.len * 1.04, s.wid * 1.05, s.alpha * 0.6));
      states.forEach((s, i) => s && placeSprite(g, sprs[list[i].v], P, s.bx, s.by, s.ang, s.len, s.wid, s.alpha));
    };
    const tuftState = (f, t, P) => {
      const t0 = TUFT_T0 + 0.45 * Math.abs(f.d) / Math.PI;
      if (t < t0) return null;
      const e = ease.outBack((t - t0) / 0.55), c0 = LIFT0 - 0.1 + 0.05 * f.r1, cl = ease.inOut3((t - c0) / CLOSE_D);
      const ab = -Math.PI / 2 + (f.d + f.s * 0.05 * (1 - smooth(t0, t0 + 0.5, t))) * (1 - FOLD * cl);
      let ang = ab + (0.05 + 0.03 * f.r1) * Math.sin(3.1 * t + f.ph + f.j * 0.9) * smooth(t0 + 0.3, t0 + 1, t);
      ang += 0.16 * P.droop * Math.cos(ang);
      const len = TUFT_L * (f.s ? 0.88 : 1) * (0.95 + 0.1 * f.r2) * Math.max(0, e) * (1 + 1.4 * P.flex) * (1 + 0.1 * P.droop * Math.sin(ang));
      return { ab, ang, rb: TUFT_R, len, wid: 20, alpha: smooth(t0, t0 + 0.2, t), c0 };
    };
    const drawTufts = () => {
      for (const f of TUFTS) {
        const tl = LIFT0 - 0.1 + 0.05 * f.r1 + CLOSE_D * (0.55 + 0.45 * Math.abs(f.d) / Math.PI) + 0.04 * f.r2, tau = t - tl;
        let s;
        if (tau > 0) {
          const st = tuftState(f, tl, pose(tl)); if (!st) continue;
          if (f.comet) pushComet(comets, st, f, tau, TUFT_TIPS[f.tip], 30);
          if (tau > FLY_END) continue;
          s = flight(st, f, tau);
        } else {
          const st = tuftState(f, t, P); if (!st) continue;
          s = { bx: Math.cos(st.ab) * st.rb, by: Math.sin(st.ab) * st.rb, ang: st.ang, len: st.len, wid: st.wid, alpha: st.alpha };
        }
        placeSprite(g, SP.tufts[f.tip], P, s.bx, s.by, s.ang, s.len, s.wid, s.alpha);
      }
    };
    drawTufts();
    for (let k = NR - 1; k >= 0; k--) drawRing(k, k < NR - 1);

    // the star: white feathers over the red field, sprung out point by point; a mirror in each point
    const grow = starGrow(t);
    const starA = smooth(STAR_T - 0.08, STAR_T + 0.2, t) * (1 - smooth(LIFT0 - 0.05, LIFT0 + 0.2, t));
    if (starA > 0.003 && !back) {
      const outer = starPts(grow, STAR.ri, STAR.rt), inner = insetPts(outer, STAR.w);
      g.save();
      g.globalAlpha = 0.55 * starA; g.filter = HG.blur(5); g.fillStyle = '#000';
      g.beginPath(); polyPath(g, P, insetPts(outer, -5)); polyPath(g, P, insetPts(outer, STAR.w + 5)); g.fill('evenodd');
      g.filter = 'none'; g.globalAlpha = 0.95 * starA; g.fillStyle = 'rgb(246,240,230)';
      g.beginPath(); polyPath(g, P, outer); polyPath(g, P, inner); g.fill('evenodd');
      g.restore();
      // feather texture along each edge, every plume pointing toward the star's tip
      for (let j = 0; j < 16; j++) {
        const a = outer[j], b = outer[(j + 1) % 16], ia = inner[j], ib = inner[(j + 1) % 16];
        const tipFirst = j % 2 === 0;                                    // even vertices are the tips
        const [p0, p1] = tipFirst ? [[(b[0] + ib[0]) / 2, (b[1] + ib[1]) / 2], [(a[0] + ia[0]) / 2, (a[1] + ia[1]) / 2]]
          : [[(a[0] + ia[0]) / 2, (a[1] + ia[1]) / 2], [(b[0] + ib[0]) / 2, (b[1] + ib[1]) / 2]];
        const ex = p1[0] - p0[0], ey = p1[1] - p0[1], el = Math.hypot(ex, ey), ang = Math.atan2(ey, ex);
        for (let m = 0; m < 4; m++) {
          const u = 0.02 + m * 0.24;
          placeSprite(g, SP.star[(j + m) % 2], P, p0[0] + ex * u, p0[1] + ey * u, ang, el * 0.4, STAR.w * 1.75, 0.8 * starA);
        }
      }
      // mirrors in the points
      for (let k = 0; k < 8; k++) {
        const ma = smooth(0.5, 0.9, grow[k]) * starA; if (ma <= 0.01) continue;
        const [mx, my] = STAR_MIRRORS[k], q = projJ(P, mx, my);
        g.save(); g.transform(q.j11, q.j21, q.j12, q.j22, q.x, q.y); g.globalAlpha = ma;
        const mg = g.createRadialGradient(-4, -5, 1, 0, 0, STAR.mr);
        mg.addColorStop(0, 'rgb(255,252,246)'); mg.addColorStop(0.45, 'rgb(196,196,214)'); mg.addColorStop(1, 'rgb(96,92,110)');
        g.fillStyle = mg; g.beginPath(); g.arc(0, 0, STAR.mr, 0, TAU); g.fill();
        g.strokeStyle = rgba(GOLD, 1); g.lineWidth = 3.5; g.stroke();
        g.restore();
      }
    }

    // medallion (front) or the plain back of the frame
    const medIn = ease.outBack((t - 0.4) / 1.1);
    const medOut = ease.in3((t - 10.05) / 0.4);
    const medS = Math.max(0, medIn) * (1 - medOut);
    const medRot = -1.5 * (1 - ease.out3((t - 0.35) / 1.4)) + 2.4 * medOut;
    const pc = projJ(P, 0, 0);
    if (medS > 0.002) {
      g.save(); g.transform(pc.j11, pc.j21, pc.j12, pc.j22, pc.x, pc.y);
      g.rotate(medRot); g.scale(medS, medS);
      const cg = g.createRadialGradient(0, 0, RM * 0.9, 0, 0, RM * 1.22);   // a soft dark collar
      cg.addColorStop(0, 'rgba(0,0,0,0.55)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = cg; g.beginPath(); g.arc(0, 0, RM * 1.22, 0, TAU); g.fill();
      g.beginPath(); g.arc(0, 0, RM - 0.5, 0, TAU); g.clip();
      if (!back) {
        g.globalAlpha = smooth(0.35, 0.75, t);
        g.drawImage(A.med, -MED_W / 2, -MED_W / 2, MED_W, MED_W);
        // sheen on the embroidery: a soft highlight that slides as the head turns, and a slow light sweep
        g.globalCompositeOperation = 'lighter';
        const hx = -RM * (0.25 + 0.5 * Math.sin(P.phi)), hl = g.createRadialGradient(hx, -RM * 0.4, 0, hx, -RM * 0.4, RM * 1.1);
        hl.addColorStop(0, 'rgba(255,236,200,0.26)'); hl.addColorStop(1, 'rgba(255,236,200,0)');
        g.globalAlpha = smooth(0.6, 1.4, t); g.fillStyle = hl; g.fillRect(-RM, -RM, 2 * RM, 2 * RM);
        const su = ((t - 1.4) / 2.6) % 1, sx0 = lerp(-1.8, 1.8, su) * RM;
        if (t > 1.4) {
          const sg = g.createLinearGradient(sx0 - RM * 0.5, -RM * 0.3, sx0 + RM * 0.5, RM * 0.3);
          sg.addColorStop(0, 'rgba(255,240,210,0)'); sg.addColorStop(0.5, 'rgba(255,240,210,0.32)'); sg.addColorStop(1, 'rgba(255,240,210,0)');
          g.fillStyle = sg; g.fillRect(-RM, -RM, 2 * RM, 2 * RM);
        }
      } else {
        const bg = g.createRadialGradient(0, -RM * 0.3, 0, 0, 0, RM);
        bg.addColorStop(0, 'rgb(96,74,58)'); bg.addColorStop(1, 'rgb(46,34,28)');
        g.fillStyle = bg; g.fillRect(-RM, -RM, 2 * RM, 2 * RM);
        g.strokeStyle = 'rgba(30,22,18,0.9)'; g.lineWidth = 16;
        g.beginPath(); g.moveTo(-RM, 0); g.lineTo(RM, 0); g.moveTo(0, -RM); g.lineTo(0, RM); g.stroke();
        g.strokeStyle = rgba(GOLD, 0.6); g.lineWidth = 6; g.beginPath(); g.arc(0, 0, RM - 4, 0, TAU); g.stroke();
      }
      g.restore();
    }
    g.restore();
    // depth shading: the far side is a little darker; the back of the crown is dark and plain
    {
      HG.reset(g); g.globalCompositeOperation = 'source-atop';
      const sf = Math.sin(P.phi) * cp;
      if (Math.abs(sf) > 0.02) {
        const dir = Math.sign(sf), gr = g.createLinearGradient(P.x - dir * 360, 0, P.x + dir * 360, 0);
        gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${0.45 * Math.abs(sf)})`);
        g.fillStyle = gr; g.fillRect(0, 0, W, W);
      }
      const backK = smooth(0.1, -0.1, front);
      if (backK > 0.003) { g.fillStyle = rgba([48, 38, 34], 0.7 * backK); g.fillRect(0, 0, W, W); }
      HG.reset(g);
    }
    bandFade(M, 780, 900, 1 - 0.6 * band);

    // ---------- composite the crown with a soft bloom
    const crownA = G * lightK;
    bloomLayer(M, 0.34 * crownA, 16, crownA);

    // sheens: light running through the feathers (masked by the crown, kept out of the title band)
    const sheen = (grad, a, tint = 0) => {
      if (a <= 0.004) return;
      const s = SH.ctx; HG.reset(s); s.clearRect(0, 0, W, W);
      HG.drawLayer(s, M); s.globalCompositeOperation = 'destination-in'; s.fillStyle = grad(s); s.fillRect(0, 0, W, W);
      if (tint > 0) { s.globalCompositeOperation = 'source-atop'; s.fillStyle = rgba([255, 240, 214], tint); s.fillRect(0, 0, W, W); }
      HG.reset(s); bandFade(SH, 730, 830, 1 - band);
      HG.drawLayer(ctx, SH, { alpha: Math.min(1, a) * G, op: 'lighter' });
    };
    const ringGrad = (r, w) => s => {
      const gr = s.createRadialGradient(P.x, P.y, Math.max(0, r - w), P.x, P.y, r + w * 0.3);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.72, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); return gr;
    };
    const wave = (t - DONE_T) / 0.9;                                         // the crown is complete
    if (wave > 0 && wave < 1) sheen(ringGrad(lerp(100, 480, ease.inOut3(wave)), 90), 0.4 * Math.sin(Math.PI * wave));
    for (const [tl, a] of LANDS) {                                           // the drum: each landing sends a ripple
      if (tl === LAND) continue;
      const u = (t - tl) / 0.5; if (u <= 0 || u >= 1) continue;
      sheen(ringGrad(lerp(110, 470, ease.out3(u)), 80), 0.45 * Math.min(1, a) * Math.sin(Math.PI * u), 0.12);
    }
    {                                                                        // the big landing: a shockwave
      const u = (t - LAND) / 0.85;
      if (u > 0 && u < 1) sheen(ringGrad(lerp(80, 470, 1 - Math.pow(1 - u, 2)), 120), 0.85 * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.3)), 0.7) * (1 - u * 0.3), 0.3);
    }
    const spinU = (t - 7.05) / 1.3;                                          // light sweeps across while it spins
    if (spinU > 0 && spinU < 1) sheen(s => {
      const x = lerp(-300, W + 300, spinU), gr = s.createLinearGradient(x - 160, 0, x + 160, 0);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); return gr;
    }, 0.45 * Math.sin(Math.PI * spinU));

    // ---------- effects layer: glints, sparkles, comets (bloomed once, kept out of the title band)
    const fx = FX.ctx; HG.reset(fx); fx.clearRect(0, 0, W, W);
    fx.save(); crownSpace(fx, P);
    const flashAt = (u, w = 0.3) => (u > 0 && u < w) ? Math.pow(Math.sin(Math.PI * u / w), 1.5) : 0;
    const mpos = ([mx, my], s = medS) => { const c = Math.cos(medRot), sn = Math.sin(medRot); return proj(P, (mx * c - my * sn) * s, (mx * sn + my * c) * s); };
    // medallion mirrors: as the rim draws, the crown complete, a counter-clockwise chase while the star
    // chases clockwise, all at the landing, the reverse chase after it, a farewell
    for (let i = 0; i < MIRRORS.length && !back; i++) {
      let f = flashAt(t - (0.62 + 0.85 * i / 8), 0.32);
      f = Math.max(f, 0.8 * flashAt(t - (DONE_T + 0.06 * i), 0.3));
      for (let m = 0; m < 2; m++) f = Math.max(f, 0.8 * flashAt(t - (5.0 + ((8 - i) % 8 + 8 * m) / 8 * 0.95), 0.28));
      f = Math.max(f, flashAt(t - LAND, 0.45));
      f = Math.max(f, 0.8 * flashAt(t - (8.55 + (i + 0) / 8 * 0.7), 0.28));
      f = Math.max(f, 0.9 * flashAt(t - (9.75 + 0.03 * i), 0.35));
      if (f <= 0.01) continue;
      const q = mpos(MIRRORS[i]);
      glint(fx, q.x, q.y, 100 * f * Math.max(0.3, medS), f * face * G, 0.3 + 0.2 * i + 0.4 * t, MIRROR, [255, 196, 120]);
    }
    for (let k = 0; k < 8 && !back; k++) {                                  // the star's mirrors
      const ma = smooth(0.5, 0.9, grow[k]) * starA; if (ma <= 0.01) continue;
      let f = 0.9 * flashAt(t - (STAR_T + 0.05 * k + 0.12), 0.3);
      f = Math.max(f, 0.7 * flashAt(t - (DONE_T + 0.12), 0.3));
      for (let m = 0; m < 2; m++) f = Math.max(f, flashAt(t - (5.0 + (k + 8 * m) / 8 * 0.95), 0.3));
      f = Math.max(f, flashAt(t - LAND, 0.5));
      f = Math.max(f, 0.9 * flashAt(t - (8.55 + ((8 - k) % 8) / 8 * 0.7), 0.3));
      if (f <= 0.01) continue;
      const q = proj(P, STAR_MIRRORS[k][0], STAR_MIRRORS[k][1]);
      glint(fx, q.x, q.y, 125 * f, f * face * G * ma, 0.2 * k + 0.5 * t, MIRROR, mix(RINGS[3].col, GOLD, 0.4));
    }
    // centre mirror: the opening glint, a pulse on every beat of the build, the landing
    {
      const q = mpos(MIRROR_C);
      let f = flashAt(t - 0.22, 0.75);
      for (let k = 0; k <= NR; k++) f = Math.max(f, 0.55 * flashAt(t - (RING_T0 + RING_DT * k), 0.3));
      f = Math.max(f, flashAt(t - LAND, 0.45));
      glint(fx, q.x, q.y, 120 * f, f * (t < 1 ? 1 : face) * G, 0.25 * t, MIRROR, t < 1 ? null : [255, 196, 120]);
      // the gold rim of the medallion draws round, then stays as a fine glowing edge
      const rimK = ease.inOut3((t - 0.6) / 0.85);
      if (rimK > 0 && medS > 0.01) {
        fx.save(); fx.transform(pc.j11, pc.j21, pc.j12, pc.j22, pc.x, pc.y); fx.rotate(medRot);
        fx.globalCompositeOperation = 'lighter'; fx.strokeStyle = rgba(GOLD, 1); fx.lineCap = 'round';
        const a0 = -Math.PI / 2, a1 = a0 + TAU * rimK, rr = (RM + 2) * medS;
        const ra = (rimK < 1 ? 1 : 0.55) * G * (t < 2 ? 1 : face);
        fx.globalAlpha = 0.6 * ra; fx.lineWidth = 9; fx.filter = HG.blur(8); fx.beginPath(); fx.arc(0, 0, rr, a0, a1); fx.stroke();
        fx.filter = 'none'; fx.globalAlpha = ra; fx.lineWidth = 2.5; fx.beginPath(); fx.arc(0, 0, rr, a0, a1); fx.stroke();
        if (rimK < 1) HG.dot(fx, GOLD, Math.cos(a1) * rr, Math.sin(a1) * rr, 40, 0.9);
        fx.restore();
      }
    }
    // a sparkle rides the leading feather on each side as a ring sweeps open; the star's tips flash out
    for (let k = 0; k < NR; k++) {
      const u = (t - (RING_T0 + RING_DT * k)) / OPEN_D; if (u <= 0 || u > 0.7) continue;
      const p = spring(u), a = 0.85 * smooth(0.0, 0.08, u) * (1 - smooth(0.5, 0.88, p)) * G;
      if (a <= 0.01) continue;
      const lead = Math.PI - Math.PI / RINGS[k].n, rr = RINGS[k].tip - 12;
      for (const side of [-1, 1]) {
        const ang = -Math.PI / 2 + side * lead * (0.03 + 0.97 * p);
        const q = proj(P, Math.cos(ang) * rr, Math.sin(ang) * rr);
        glint(fx, q.x, q.y, 70, a, ang, mix(RINGS[k].col, WHITE, 0.55));
        HG.dot(fx, RINGS[k].col, q.x, q.y, 36, 0.5 * a);
      }
    }
    for (let k = 0; k < 8 && !back; k++) {
      const u = t - (STAR_T + 0.05 * k); if (u <= 0 || u > 0.6) continue;
      const a = Math.sin(Math.PI * u / 0.6) * G, r = lerp(STAR.ri, STAR.rt, grow[k]), ang = -Math.PI / 2 + k * Math.PI / 4;
      const q = proj(P, Math.cos(ang) * r, Math.sin(ang) * r);
      glint(fx, q.x, q.y, 80, 0.8 * a, ang + 0.4, [255, 250, 240]);
    }
    // the landing: a ring of light leaves the rim
    {
      const u = (t - LAND) / 0.7;
      if (u > 0 && u < 1) {
        // an arc over the top (it fades out down the sides, never reaching the title band or the rim)
        const r = lerp(345, 455, ease.out3(u)), ra = Math.pow(1 - u, 1.4) * smooth(0, 0.06, u) * G;
        fx.save(); fx.globalCompositeOperation = 'lighter'; fx.lineCap = 'round';
        for (let i = 0; i < 60; i++) {
          const a0 = Math.PI * (0.75 + 1.5 * i / 60), a1 = Math.PI * (0.75 + 1.5 * (i + 1) / 60);
          const wgt = Math.pow(Math.sin(Math.PI * (i + 0.5) / 60), 1.6) * ra; if (wgt < 0.01) continue;
          const p0 = proj(P, Math.cos(a0) * r, Math.sin(a0) * r), p1 = proj(P, Math.cos(a1) * r, Math.sin(a1) * r);
          for (const [lw, la] of [[30, 0.12], [14, 0.3], [5, 1]]) {
            fx.globalAlpha = la * wgt; fx.lineWidth = lw; fx.strokeStyle = 'rgb(255,228,176)';
            fx.beginPath(); fx.moveTo(p0.x, p0.y); fx.lineTo(p1.x, p1.y); fx.stroke();
          }
        }
        fx.restore();
      }
    }
    // the feathers flying away: comets in their colours (the star's points go first, in white)
    for (const c of comets) {
      const pts = []; for (let m = 0; m <= 9; m++) { const q = traj(c.st, c.f, Math.max(COMET0 - 0.1, c.tau - 0.24 * m / 9)); pts.push(proj(P, q.x, q.y)); }
      comet(fx, pts, 16, c.col, c.a * G, c.head);
    }
    if (!back) for (let k = 0; k < 8; k++) {
      const tau = t - (LIFT0 - 0.04 + 0.03 * k); if (tau <= 0 || tau > 1.3) continue;
      const ang = -Math.PI / 2 + k * Math.PI / 4, st = { ab: ang, ang, rb: STAR.rt - 40, len: 60 }, f = { r2: 0.6, ph: k };
      const a = smooth(0, 0.12, tau) * (1 - smooth(0.85, 1.3, tau)) * G;
      const pts = []; for (let m = 0; m <= 9; m++) { const q = traj(st, f, Math.max(0, tau - 0.26 * m / 9), 0.5); pts.push(proj(P, q.x, q.y)); }
      comet(fx, pts, 22, [255, 250, 238], a, 40);
    }
    fx.restore();
    // landing comets thrown up off the upper rim (screen space)
    {
      const s = t - LAND;
      if (s > 0 && s < 1.15) {
        const PLd = landPose(), R = HG.rng(808);
        for (let i = 0; i < 28; i++) {
          const a = -Math.PI / 2 + (i / 27 - 0.5) * 2.6 + (R() - 0.5) * 0.12, v = 380 + 460 * R() * R() + 120 * R(), col = COMET_COLS[i % COMET_COLS.length];
          const head = 34 + 12 * R(), d0 = 0.15 * R() * R(), r0 = (280 + 60 * R()) * PLd.sc / CS, ss = s - d0;
          if (ss <= 0) continue;
          const x0 = PLd.x + Math.cos(a) * r0, y0 = PLd.y + Math.sin(a) * r0, kd = 2.0, gy = 380, sw = (R() - 0.5) * 2;
          const at = tau => { const d = v * (1 - Math.exp(-kd * tau)) / kd; return { x: x0 + Math.cos(a) * d - Math.sin(a) * sw * 40 * tau * tau, y: y0 + Math.sin(a) * d + Math.cos(a) * sw * 40 * tau * tau + 0.5 * gy * tau * tau }; };
          const pts = []; for (let m = 0; m <= 11; m++) pts.push(at(Math.max(0, ss - 0.3 * m / 11)));
          comet(fx, pts, 24, col, smooth(0, 0.09, ss) * (1 - smooth(0.55, 1.05, ss)) * G, head);
        }
      }
    }
    // the medallion folds into a gold spark that shoots up out of the top of the circle
    {
      const u = (t - 10.3) / 0.75;
      if (u > -0.3 && u < 1) {
        const yOf = uu => P.y - 640 * Math.pow(Math.max(0, uu), 2);
        const a = smooth(-0.3, 0.05, u) * (1 - smooth(0.85, 1, u));
        const pts = []; for (let m = 0; m <= 9; m++) pts.push({ x: P.x, y: yOf(u - 0.18 * m / 9) });
        if (u > 0) comet(fx, pts, 20, GOLD, a, 46);
        glint(fx, P.x, yOf(u), 150 * a, a, 0.5 * t, [255, 236, 190], GOLD);
      }
    }
    HG.reset(fx);
    bandFade(FX, 740, 840, 1 - band);
    bloomLayer(FX, 0.7, 9, 1, 'lighter');
  },
});
